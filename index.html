持其分紅保單之特性"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P043","chapter":"第四章 人身保險的構造"},{"subject":"保險實務","number":44,"page":6,"answer":2,"stem":"以往傳統型壽險保單皆屬強制分紅,主要是根據利差、死差做為分紅金額之計算基礎,在此基礎下其強制分紅之標準為何?","options":["只要出現利差損或死差損就必須分紅","僅出現死差益,即使有利差損也必須分紅","同時出現利差益及死差益才分紅","以上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P044","chapter":"第四章 人身保險的構造"},{"subject":"保險實務","number":45,"page":6,"answer":1,"stem":"分紅保單是保險公司每年經營與投資所產生的哪些項目分紅回饋給保戶?A 利差益;B 死差損;C 費差益;D 死差益","options":["ACD","ABCD","AB","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P045","chapter":"第四章 人身保險的構造"},{"subject":"保險實務","number":46,"page":6,"answer":3,"stem":"年金保險的預定附加費用率與相同繳費年期之養老保險的附加費用率比較會","options":["不一定","較高","較低","相同。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P046","chapter":"第四章 人身保險的構造"},{"subject":"保險實務","number":47,"page":6,"answer":1,"stem":"利率變動型年金保險費的計算基礎包括A預定危險發生率;B預定附加費用率;C\n宣告利率;D通貨膨脹率","options":["AB C","AB","ABD","BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P047","chapter":"第四章 人身保險的構造"},{"subject":"保險實務","number":48,"page":6,"answer":2,"stem":"人壽保險商品死亡給付對保單價值準備金(保單帳戶價值)之最低比率規範何者正確?A 比率依年齡級距分為六組; B 死亡給付對保價金之最低比率隨高齡遞增;C 保險業需於契約條款明訂不符合最低比率時之保費繳交限制;D 招攬時要妥為說明","options":["ABD","CD","BCD","ABCD。"],"explanation":"分為7 組,死亡給付對保價金之最低比率隨高齡遞減","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P048","chapter":"第四章 人身保險的構造"},{"subject":"保險實務","number":49,"page":7,"answer":1,"stem":"利率變動型年金之責任準備金於累積期間,以什麼基礎提存?","options":["年金保單價值準備金全額","所繳保險費總和","所繳純保費總和","平衡準備金制"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P049","chapter":"第四章 人身保險的構造"},{"subject":"保險實務","number":50,"page":7,"answer":2,"stem":"利率變動型年金在累積期間,保險公司依據要保人交付之保險費,減去附加費用後,依何種利率計算年金保單價值準備金?","options":["預定利率","宣告利率","定存利率","通貨膨脹率"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P050","chapter":"第四章 人身保險的構造"},{"subject":"保險實務","number":51,"page":7,"answer":1,"stem":"有關解約金的敘述,何者正確?A躉繳保單之解約金等於保單價值準備金;B分期繳費保單繳費期滿後之解約金等於保單價值準備金;C躉繳保單之解約金小於保單價值準備金;D分期繳費保單繳費期滿後之解約金小於保單價值準備金","options":["AB","CD","A","C"],"explanation":"記【等於等於】就對了","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P051","chapter":"第四章 人身保險的構造"},{"subject":"保險實務","number":52,"page":7,"answer":2,"stem":"依保險法第13條規定,人身保險包含 A傷害保險;B投資型保險;C健康保險;D年金保險","options":["BD","ACD","CD","ABCD"],"explanation":"人身保險四大類:人壽保險、健康保險、傷害保險、年金保險","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P052","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":53,"page":7,"answer":1,"stem":"某甲投保每年初複利增值3%之二十年期養老保險,保額20 萬元,某甲在投保後第二年死亡,則其可獲得的死亡保險金為","options":["212180 元","218000 元","200000 元","218545 元"],"explanation":"每年初增值第二年死亡,故增值2 次  20 萬*(1+3%)(1+3%)=212180(背答案即可)","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P053","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":54,"page":7,"answer":4,"stem":"年金保險契約之生存年金部分","options":["得有除外責任","不得有除外責任期間,但得有除外責任原因","不得有除外責任原因,但得有除外責任期間","不得有除外責任。"],"explanation":"年金保險目的是生存時給付年金,只要生存就會給付,所以不能有除外責任","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P054","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":55,"page":7,"answer":4,"stem":"現行年金保險主要銷售型態來自於A人壽保險單示範條款;B利率變動型年金保險單示範條款;C個人即期年金保險單示範條款;D個人遞延年金保險單示範條款","options":["ABCD","ABD","ACD","BCD"],"explanation":"選年金保險就對了","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P055","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":56,"page":7,"answer":3,"stem":"年金保險的保險費一次繳清後,保險公司開始給付年金者稱為","options":["遞延年金","付清年金","即期年金","躉繳年金"],"explanation":"即期年金:年金保險契約訂立後,保險人即開始給付年金,通常為躉繳保費。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P056","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":57,"page":7,"answer":4,"stem":"年金保險中如被保險人身故,仍有未支領之年金餘額時,該餘額","options":["其半數應作為被保險人之遺產","應作為被保險人之遺產","應作為要保人之遺產","應給付給其他應得之人"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P057","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":58,"page":7,"answer":3,"stem":"利率變動型年金保險費率相關規範,何者為非?","options":["預定利率不得高於年金給付開始日當月之宣告利率","宣告利率不得超過宣告前中央銀行公布之最近一個月\n10年期中央政府公債次級市場殖利率","宣告利率下限無規定,且得為負值","預定附加費用率由公司自行訂定,並明訂於契約條款"],"explanation":"宣告利率不得為負值","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P058","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":59,"page":8,"answer":3,"stem":"利率變動型年金甲型在給付期間之責任準備金係以年金金額之預定利率與依『新契約責任準備金利率採自動調整精算公式』計算之利率","options":["最大值計算","平均值計算","最小值計算","以上皆可"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P059","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":60,"page":8,"answer":2,"stem":"有關傳統型年金保險費率計算可使用之預定附加費用率標準,何者正確?","options":["繳費期間未滿十年者,費用率不得超過總保費之10%","躉繳者,費用率不得超過總保費之5%","繳費期間滿十五年者,費用率不得超過總保費之15 %","繳費期間未滿十五年者,費用率不得超過總保費之15%"],"explanation":"傳統年金附加費用:躉繳5%,滿15 年11%","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P060","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":61,"page":8,"answer":3,"stem":"利率變動型年金躉繳者,附加費用率不得超過總保費之","options":["5%","8.5%","由公司自行訂定","10%。"],"explanation":"利率變動型年金:附加費用率由公司自行訂定利率固定型年金(傳統型)                            利率變動型年金保費:躉繳、非躉繳(定期定額)                 保費:躉繳、非躉繳(定期定額或不定期不定額)\n身故保障:退還已繳保費、解約金或保單價值準備金    身故保障:保單價值準備金全額年金給付:固定年金                                年金給付:固定年金與變動年金二種","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P061","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":62,"page":8,"answer":3,"stem":"利率變動型年金與利率固定型年金,下列何者為非?","options":["利率變動型年金及利率固定型年金保費繳納皆可躉繳、非躉繳,惟利率固定型的非躉繳為定期定額","利率變動型年金附加費用由公司自行訂定,利率固定型年金附加費用依繳費期間介於5%到11%之間","利率變動型年金身故保障為解約金,利率固定型身故保障為保單價值準備金","利率變動型年金給付有採固定或變動金額年金給付;利率固定型年金採固定金額年金給付"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P062","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":63,"page":8,"answer":4,"stem":"利率變動型年金甲型於給付期間,保戶可領取之年金金額與下列何者有關?A預定死亡率;B預定附加費用率;C預定利率;D宣告利率","options":["AD","AB","ABC","AC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P063","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":"補充-07","page":8,"answer":4,"stem":"利率變動型年金甲型在年金給付期間,以當時之哪些條件換算定額年金?","options":["預定利率","年齡","年金生命表","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P-補充-07","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":64,"page":8,"answer":2,"stem":"利率固定型年金保險商品的繳費方式有A躉繳;B非躉繳(定期定額);C非躉繳\n(不定期不定額)","options":["ABC","AB","AC","BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P064","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":65,"page":8,"answer":2,"stem":"有關生存保險之敘述,下列何者為是?A僅在被保險人於保險期滿後仍生存時給付保險金;B被保險人在保險期間內死亡,保險公司無給付保險金的責任,但退還所繳保費;C滿期保險金之來源,部分來自保險公司資本;D保險公司為準備被保險人保險期滿生存時給付保險金,需有責任準備金的提存","options":["ABCD","AD","ABD","AB"],"explanation":"B 不退還保費 C 滿期保險金來源:期間內死亡的被保險人所繳保費與自己本身所繳保費及累積生息","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P065","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":66,"page":8,"answer":4,"stem":"下列敘述何者正確?","options":["保險公司承保傷害保險時,需檢查被保險人的身體","定期保險通常以1年、5年、10年為期,亦有以要保人到達終身年齡為約定期限","外勤業務員的危險性與每天坐辦公室的行政人員危險性差不多","最後生存者年金之受領人有2人以上,只要其中1人仍生存,保險人就繼續依原定金額給付年金至最後1位受領人死亡為止"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P066","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":"補充-08","page":9,"answer":4,"stem":"下列敘述何者正確?","options":["最後生存者年金之受領人有2人以上,只要有 1 人死亡,保險人就不必再給付原約定之年金","定期保險通常以1年、5年、10年為期,亦有以要保人到達終身年齡為約定期限","賽車駕駛員的危險性與每天坐辦公室的辦事人員危險性差不多","保險公司承保傷害保險時,不必檢查被保險人的身體"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P-補充-08","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":67,"page":9,"answer":4,"stem":"有關傷害保險之敘述,何者正確? A被保險人失能程度屬第2級失能,保險公司按失能保險金之90%給付 ;B職業類別第二類之保險費率是第一類的1.5 倍;C個人傷害保險意外失能發生率為意外死亡發生率之40%;D個人傷害保險重大事故特別準備金提存率為2%","options":["ABCD","ABC","BD","AC"],"explanation":"B 第二類保費為1.25 倍 D 提存率為1%","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P067","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":68,"page":9,"answer":4,"stem":"個人傷害保險短期費率一個月期為年繳保費","options":["百分之十二","百分之二十","十二分之一","百分之十五"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P068","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":69,"page":9,"answer":1,"stem":"下列那些保險中途解約時,其已交付未到期之保險費應返還之","options":["一年定期壽險、健康保險、傷害保險","終身壽 險、傷害保險、年金保險、團體健康保險","養老保險、一年定期壽險、傷害保險、健康保險","以上皆是。"],"explanation":"一年期商品未到期會退還未到期保費","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P069","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":70,"page":9,"answer":3,"stem":"有關旅行平安險何者正確?A醫療費用之給付包含日額型及實支實付型;B發生意外傷害醫療時給付最高以保險金額1/10 為限;C為國際性保險,承保對象以實際從事旅遊的國內、國外旅客為限;D保險期間原則上最長以180 天為限,旅客如有需要經保險公司同意可延長","options":["BC","ABD","BCD","ACD"],"explanation":"旅行平安險醫療費用僅有實支實付型一種","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P070","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":71,"page":9,"answer":3,"stem":"廣義的風險管理,除彌補經濟損失外,尚包含儲蓄投資以備未來所需,此部份之需求就可以利用年金保險、長期壽險等具有下列哪些功能,使個人及家庭的經濟生活更能獲得保障?A儲蓄性質保單;B保單借款;C保單復效;D身故保險金","options":["BC","AD","AB","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P071","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":72,"page":9,"answer":3,"stem":"工業化的結果,各種意外事故劇增,促使人民重視保障,各公司在保險商品設計上亦以提高保障機能為主,其商品種類以下列何種保險之業務成長迅速","options":["生死合險","儲蓄保險","定期保險及終身保險","生存保險"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P072","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":73,"page":9,"answer":3,"stem":"所謂健康保險是指為彌補因A傷害;B疾病;C酗酒;D健康檢查,造成人們失去工作能力或就醫,而導致經濟上的損失所設計出來的保險","options":["BD","ABD","AB","AC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P073","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":74,"page":9,"answer":4,"stem":"有關年金保險之敘述何者錯誤?","options":["社會年金保險的種類依保險事故別分為老年、失能及遺屬三種年金","年金給付以被保險人生存為條件者即具有保險功能","年金給付不以個人或被保險人的生存為條件者,稱為確定年金","連生共存年金中多名年金受領人,若僅其中1人生存,保險人仍應依約給付年金"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P074","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":75,"page":10,"answer":3,"stem":"有關年金保險之敘述,何者正確?A可分為社會性年金保險及商業性年金保險;B\n年金保險契約必須記載給付方法;C 未滿15歲之未成年人不得投保年金保險;\nD受益人不得為被保險人本人","options":["A","BC","AB","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P075","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":76,"page":10,"answer":3,"stem":"以下何者為是?","options":["人身保險四種類型中包含責任保險","人壽保險中包括生存保險、死亡保險及健康保險","將保險區分財產保險及人身保險兩類,是依據我國保險法第十三條規定","人身保險包括責任保險及人壽保險。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P076","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":77,"page":10,"answer":2,"stem":"有關郵政簡易人壽保險,下列何者正確?A 商品類別有生存保險、死亡保險及生死合險,並得以附約經營健康保險 及傷害保險; B 保險費繳納方式有躉繳、月繳、\n季繳、半年繳、年繳5 種; C 適用簡易人壽保險法規定;D 被保險人限中華民國國民且投保時免健康檢查","options":["ABC","ABCD","BCD","BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P077","chapter":"第三章 我國人身保險事業的基本認識"},{"subject":"保險實務","number":78,"page":10,"answer":3,"stem":"台灣地區人口年齡結構因醫藥科學發達,死亡率降低而使得平均壽命延長,近幾年來更因結婚率降低與生育率降低,高齡化人口所佔比例逐漸增加,請問當生育率降低與高齡化人口增加會帶來什麼樣的影響?","options":["就業人口經濟負擔減輕","經濟成長率上升","延後退休","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P078","chapter":"第三章 我國人身保險事業的基本認識"},{"subject":"保險實務","number":79,"page":10,"answer":1,"stem":"依據國家發展委員會對於我國高齡化估計之說明,何者有誤?","options":["仰賴人口係僅指0至14歲的人","我國已邁入高齡社會","我國將進入超高齡社會","青壯年人口係指15至64歲的工作年齡人口"],"explanation":"仰賴人口指0-14 歲及65 歲以上人口","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P079","chapter":"第三章 我國人身保險事業的基本認識"},{"subject":"保險實務","number":80,"page":10,"answer":1,"stem":"台灣地區目前正面臨老年問題發生,所以下列哪些商品成為老年人口的重要需求?\nA長年期的健康保險;B長期照顧保險;C年金保險;D定期壽險","options":["ABC","BC","AB","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P080","chapter":"第三章 我國人身保險事業的基本認識"},{"subject":"保險實務","number":81,"page":10,"answer":4,"stem":"長年期看護保險未來將成為老年人口的重要需求,其可能的原因包含下列何者:A\n人類壽命普遍延長;B家庭制度的改變;C社會福利的不足;D對通貨膨脹的恐懼","options":["ABC","ABD","AC","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P081","chapter":"第三章 我國人身保險事業的基本認識"},{"subject":"保險實務","number":82,"page":10,"answer":2,"stem":"長期照顧保險之被保險人經專科醫師診斷後判定符合長期照顧狀態者給予保險給付,而長期照顧狀態係指被保險人符 合?","options":["持續6個月以上失智且依臨床失智量表評估達中度以上者","依巴氏量表判定3個月內有移位、如廁及沐浴等 3 項障礙","依臨床專業評量表診斷判定5個月內有進食及移位等2項障礙者","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P082","chapter":"第三章 我國人身保險事業的基本認識"},{"subject":"保險實務","number":83,"page":11,"answer":3,"stem":"有關政府推動的長期照顧保險,何者錯誤?","options":["由政府、雇主及民眾共同負擔保險費","屬於一種福利政策且為基本保障,可考慮加保一般商業長期照顧保險商品","屬於強制性社會保險,保險人為衛生福利部","目前提供的服務皆屬實物給付"],"explanation":"保險人為中央健保署有關全民健康保險之內容何者正確?A保險事故包含疾病、傷害、生育;B以強制投保為原則;C 主管機關為中央健康保險署;D保險人為衛生福利部(1)B\n(2)ABCD(3)AB(4)ABC 【解析】主管機關為衛生福利部","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P083","chapter":"第三章 我國人身保險事業的基本認識"},{"subject":"保險實務","number":84,"page":11,"answer":2,"stem":"下列敘述何者錯誤?","options":["長期照顧保險給付可分為一筆或分期給予固定金額二種","被保險人經專科醫師診斷判定認知功能障礙為終身無法治癒者,仍須符合契約條款約定之期間限制才可符合認知功能障礙","若契約條款明定免責期間,被保險人的生理功能障礙或認知功能障礙狀態須超過免責期,保險公司才會給付長期照顧保險金","外溢效果的保險可以達到事前預防風險的效益"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P084","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":85,"page":11,"answer":3,"stem":"實支實付醫療保險副本理賠之控管措施,不適用何種保險A 傷害保險 B 微型保險 C\n旅行平安保險 D 學生團體保險","options":["ABC","BD","BCD","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P085","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":86,"page":11,"answer":3,"stem":"有關實支實付醫療保險控管何者正確?","options":["適用於由要保單位負擔保費之旅平險,微型保險所含之實支實付型傷害醫療保險","每一被保險人向同一保險人投保實支實付保險張數上限為 3 張","整體保險業於醫療保險及傷害醫療保險投保 \n1 張銜接原給付限額具自負額商品,該張可不列入張數計算","以上皆是。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P086","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":87,"page":11,"answer":4,"stem":"有關外溢效果保單的特色,何者錯誤?","options":["保險公司為掌握保戶生活習慣及取得相關醫療數據,需精進大數據分析","商品設計有實物給付型與非實物給付型","保險公司須強化資訊安全之風險控管,以免保戶個資外洩","保險費計算係採總體考量,保費更公平合理,且能引導保戶規避風險,降低整體社會需求"],"explanation":"保險費計算係採【個體考量】","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P087","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":88,"page":11,"answer":2,"stem":"外溢效果的保險,在人身保險現行商品之設計有哪些方式?A保戶自主健康管理;\nB保險公司提供抵減保險費;C保戶依保險公司要求使用穿戴型裝置即可領得健康促進獎勵金;D目前僅有實物給付型商品","options":["BC","AB","ABCD","ABC"],"explanation":"C 須達一定保準才可領得健康促進獎勵金 D 有實務與非實務給付型","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P088","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":89,"page":11,"answer":2,"stem":"保險業結合科技設計外溢效果的保險商品,可以為客戶達到下列哪些效果?A改變被保險人生活作息;B提升民眾健 康;C透過穿戴裝置了解個人健康狀況;D輔助保險決策","options":["ACD","ABCD","BC","AC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P089","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":90,"page":11,"answer":4,"stem":"下列何者非團體保險之保險金額決定基礎?","options":["薪資等級","團體定額","職位或年資","員工的工作性質"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P090","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":91,"page":11,"answer":4,"stem":"目前學生團體保險之保險給付項目有 A失能及身故保險金;B燒燙傷及須重建手術保險金;C集體中毒保險金;D生活補助金","options":["ACD","ABC","B\nCD","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P091","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":92,"page":12,"answer":3,"stem":"有關學生團體保險之敘述何者錯誤?","options":["被保險人為學生,身故保險金受益人為被保險人之法定繼承人","辦理本保險如有不足,由專戶填補,保險人不負盈虧之責","主管機關為金融監督管理委員會","保險期間每次一年且與學年之起訖日一致為原則"],"explanation":"學生團體保險主管機關為「教育部」","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P092","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":93,"page":12,"answer":4,"stem":"有關學生團體保險之敘述,何者為非?","options":["目前保險費由教育部邀集具獨立性的相關代表組成審議會逐年審議","學生團體保險之身故保險金受益人為被保險人之法定繼承人,醫療保險金之受益人為投保之學生","設置學生團體保險專戶專款專用,盈虧責任由政府負責","幼兒參加本保險,於保險契約訂立時已在疾病中,保險人對該項疾病不負給付保險金責任"],"explanation":"應為負給付保險金責任","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P093","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":94,"page":12,"answer":3,"stem":"投資型保險商品的設計,可以 A有效對抗通貨膨脹;B使得個人資金運用及退休計畫更具彈性;C降低壽險公司經營風險;D達到金融市場整合功能","options":["BD","ABD","ABCD","AB"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P094","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":95,"page":12,"answer":3,"stem":"投資型保險商品非全權委託的投資標的可包含:A證券投資信託基金受益憑證;B\n共同信託基金受益憑證;C各國中央政府發行之公債、國庫券;D可轉讓定期存單","options":["ABD","ABCD","ABC","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P095","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":96,"page":12,"answer":4,"stem":"下列何者屬於投資型保險商品規範,由保險人接受要保人以保險契約委任全權決定運用之投資標的之運用範圍?A公 債、國庫券;B台灣存託憑證;C外國有價證券;D結構型商品","options":["ABD","BCD","AC","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P096","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":97,"page":12,"answer":2,"stem":"投資型保險商品的相關費用有? A解約費用;B保費費用;C申購手續費;D贖回及轉換費用","options":["BCD","ABCD","BC","CD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P097","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":98,"page":12,"answer":2,"stem":"有關投資型保險商品敘述何者錯誤?","options":["專設帳簿的資產於保險公司破產時,得不受保險公司之債權人扣押","變額萬能壽險指彈性繳納保險費,保單現金價值有高低起伏但不可能降低至零","變額壽險指固定繳費,但保險金額隨著投資績效而變動","變額年金保險指保險費及年金額度都會變動"],"explanation":"變額萬能壽險現金價值有高低起伏,【也可能】降低至零","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P098","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":99,"page":12,"answer":2,"stem":"有關投資型保險商品銷售之規範,下列何者錯誤?","options":["招攬人員於銷售投資型保險商品2個月前曾協助同一保戶辦理貸款者,該員不得支領推介貸款報酬","當保費資金來源為貸款,原招攬人員應於承保前對客戶進行電訪並保留錄音紀錄以供查核","招攬人員另具備投資型保險商品測驗合格且完整變更登錄者","保險業應訂定客戶紛爭處理程序納入內部控制作業之處理程序,辦理內部稽核及自行查核"],"explanation":"當保費資金來源為貸款,由【非銷售通路人員】應於承保前對客戶進行電訪","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P099","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":100,"page":12,"answer":2,"stem":"有關國民年金制度敘述何者有誤?","options":["提供老年年金、生育給付、身心障礙年金、遺屬年金及喪葬給付等保障","投保對象為年滿20歲以上未滿65歲於國內設有戶籍的國民","投保對象須為沒有參加軍保、公教保、勞保及農保的國民","被保險人死亡時按其月投保金額一次發給5個月喪葬給付"],"explanation":"投保對象為年滿25 歲以上未滿65歲於國內設有戶籍的國民","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P100","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":101,"page":13,"answer":2,"stem":"就業保險之保險費率,目前為被保險人月投保薪資之","options":["5%","1%","3\n%","4%"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P101","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":102,"page":13,"answer":1,"stem":"勞工保險之普通事故保險費,被保險人應負擔之比率為","options":["20%","10%","30%","50%"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P102","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":103,"page":13,"answer":3,"stem":"以下何者為微型保險所指之經濟弱勢或特定身分者?A依農民健康保險條例投保農民健康保險之被保險人;B符合社會救助法規定低收入戶中低收入戶之家庭成員;\nC符合身心障礙者權益保障法定義之身心障礙者;D符合老人福利法規定領取中低收入老人生活津貼之老人","options":["ABC","ABD","ABCD","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P103","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":104,"page":13,"answer":1,"stem":"為避免投保微型保險所產生的道德危險,有關該險之風險控管機制何者為非?","options":["身故保險金受益人僅以被保險人家屬為限","保險業者須對承擔之風險妥善處理或適當安排再保險","失能保險金受益人不得受理指定或變更","個別被保險人投保微型保險超過累計投保金額限制時,保險業者得自行決定處理方式"],"explanation":"身故保險金受益人為被保險人家屬或法定繼承人為限","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P104","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":105,"page":13,"answer":2,"stem":"依據保險業辦理微型保險業務應注意事項,微型保險附加費用率上限為","options":["純保費之10%","總保費之15%","純保費之15%","總保費之10%"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P105","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":106,"page":13,"answer":1,"stem":"下列何者符合主管機關對於保障型及高齡化的保險商品之定義:A小額終老保險;\nB無保價金之人身保險;C進入年金給付期間且約定分期給付之遞延年金保險;D\n即期年金保險","options":["ABCD","ABD","ACD","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P106","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":107,"page":13,"answer":2,"stem":"有關勞工退休金採新制何者有誤?","options":["勞工退休請領時須併入個人綜合所得申報","每月提撥率得由勞工自由決定","勞工自願提繳的部分得自當年度個人綜合所得總額中全數扣除","勞工按月提繳退休金,可選擇儲存於勞保局 設立之勞工退休金個人專戶"],"explanation":"勞工自願提繳的部分每月提撥率於6%範圍內由勞工自由決定","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P107","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":108,"page":13,"answer":1,"stem":"下列何者為招攬人員銷售優體壽險商品應有之行為?","options":["完成優體險商品之在職教育訓練,始進行銷售","於招攬時,即承諾消費者可適用優體率","與其他同業之優體壽險費率、核保項目、標準進行不當比較","通過優體壽險商品測驗且完成登錄者,始進行銷售。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P108","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":109,"page":13,"answer":3,"stem":"所謂團體一年定期壽險之「平均保險費率」是依:A被保險團體的危險程度;B每一被保險員工的年齡;C每一被保險員工的保險金額;D每一被保險員工的性別;\n所計算出的保險費總和除以全體被保險員工保險金額總和計算。","options":["ABD","BCD","ABCD","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P109","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":110,"page":13,"answer":2,"stem":"團體保險內每位員工對每單位保險金額應繳的保險費通常係以何種費率乘以保險金額總額計算?","options":["分級保險費率","平均保險費率","平衡保險費率","團體保險費率。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P110","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":111,"page":13,"answer":1,"stem":"壽險業總公司下的業務部,通常掌理哪些事項? A 契約調查;B 財務管理;C \n人員督導管理;D 承保理賠","options":["AD","ABCD","ABD","C"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P111","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":112,"page":14,"answer":1,"stem":"有關金融科技創新及大數據應用何者正確?A 科技業者透過法律許可方式進行沙盒實驗不會受到既有法律追訴;B 為落實業務員親晤保戶取得其親簽要保文件,\n可透過保戶證件掃描搭配生物辨識判別其真實身分;C 透過數據分析協助保險公司統一將消費客群導向一致性業務模式;D 結合科技可設計外溢效果之保險商品,藉以改變要保人的生活作息","options":["AB","CD","ABCD","ABD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P112","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":113,"page":14,"answer":3,"stem":"何者有助於商品創新?A主管機關修正新型態商品認定標準,就部分保險商品改採核准制以縮短新商品審核流程;B運用數據解析人口老化及消費習慣改變以細分客群;C運用區塊鏈技術共享資料建立標準流程;D改進經營技術","options":["ABC","BC","BCD","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P113","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":114,"page":14,"answer":4,"stem":"保險業可以運用大數據技術,透過哪些方式建立標準化服務流程?A區塊鏈結合智能合約;B開發保險經營自動化系 統;C精簡保單作業流程;D監理沙盒實驗","options":["AB","ABCD","CD","ABC。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P114","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":115,"page":14,"answer":1,"stem":"壽險公司為改善經營技術培養專業人員以適應市場發展趨向,有關公司努力發展之重點何者為非?","options":["壽險市場已具備專業人員生存要件,行銷技術將施以個別化的教育訓練以提高行銷效果","經客戶同意透過業務員以行動裝置輸入客戶投保資料,以電子文件替代紙本要保書及相關文件與保險公司締結契約","運用區塊鏈技術簡化理賠調查,快速支付理賠以服務客戶","設計更符合客戶需要商品,\n加強創新及多樣化商品設計"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P115","chapter":"第五章 人身保險的種類"},{"subject":"保險實務","number":116,"page":14,"answer":2,"stem":"透過數據分析及金融科技技術的提升,可以協助保險業 ?","options":["業務模式更複雜","創造差異化提升競爭力","概括消費群","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P116","chapter":"第七章 壽險行銷活動"},{"subject":"保險實務","number":117,"page":14,"answer":1,"stem":"保險業授權代收保險費之人收取以下列何種方式繳納保險費時,應同時交付保戶送金單、預收保費證明或收據? A現金;B信用卡授權書;C支票;D劃撥匯款單","options":["AC","AB","ABC","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P117","chapter":"第七章 壽險行銷活動"},{"subject":"保險實務","number":118,"page":14,"answer":1,"stem":"保險業授權代收保險費之人包括 A保險公司授權之所屬業務員;B保險經紀人或其所屬保險業務員;C保險公司未登錄之收費員;D保險代理人或其所屬保險業務員","options":["AD","ABC","ABCD","ABD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P118","chapter":"第七章 壽險行銷活動"},{"subject":"保險實務","number":119,"page":14,"answer":1,"stem":"依保險業授權代收保險費應注意事項之規定,何者為非?","options":["保險業授權所屬保險業務員、保險經紀人及保險代理人或其所屬保險業務員代收保險費","有權代收保險費之人未將所領之逾期送金單繳回者,保險業不得再發給新單","有權代收保險費之人代收以現金繳納保險費,單張保單當期以新台幣5萬元為上限","以上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題
