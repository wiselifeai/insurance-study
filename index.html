壽保險契約，除喪葬費用之給付外，其餘死亡給付之約定於被保險\n人滿十五歲時始生效力。前項喪葬費用之保險金額，不得超過遺\n產及贈與稅法第十七條有關遺產稅喪葬費扣除額之一半。","stem":"以未滿 15 歲之未成年人投保含死亡給付之傳統型人壽保險契約，\n於滿 15 歲前身故者，保險公司應","options":["返還帳戶價值","返還保單價值準備金","不得超過遺產及贈與稅法第 17 條有關遺產稅喪葬費用之一半","依約給付保險金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L007","subject":"保險法規","chapter":"第一章 人身保險契約","number":7,"page":3,"answer":4,"explanation":"C 示範條款規定：失能及醫療保險之受益人以被保險本人為限，且事\n後不得加以更改。\nD 受益人之指定或變更屬要保人之權利，無人數及對象之限制。","stem":"有關受益人規定何者正確？\nA因保險給付不同可區分為滿期、身故、失能或醫療、年金及紅利\n等受益人\nB為人身保險契約關係人\nC保險事故發生時有權受領保險金，而失能保險金之受益人不以被\n保險人為限\nD與要保人對被保險人需有保險利益","options":["ABD","ABCD","BCD","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L008","subject":"保險法規","chapter":"第一章 人身保險契約","number":8,"page":3,"answer":2,"explanation":"保險法第 121 條規定：受益人故意致被保險人於死或雖未致死者，喪\n失其受益權。因此保險公司仍需給付全額失能保險金。","stem":"受益人謀害被保險人未致死僅致失能，則保險公司給付","options":["保單價值準備金","全額失能保險金","全部已繳保險費","失能保險金 1/2"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L009","subject":"保險法規","chapter":"第一章 人身保險契約","number":9,"page":3,"answer":4,"explanation":"(1)保險法第 49 條規定：保險契約除人身保險外，得為指示式或無記\n名式。\n(2)保險法第 44 條規定：利害關係人，均得向保險人請求保險契約謄\n本。\n(3)保險法第 45 條規定：受益人有疑義時，推定要保人為自己之利益\n而訂定。","stem":"有關保險法之規定何者正確？","options":["人身保險契約得為指示式或無記名式","除要保人外，其餘利害關係人不得向保險人請求保險契約謄本","受益人有疑議時，其保險金額作為被保險人遺產","本法之強制規定不得以契約變更之，但有利於被保險人者不在此\n限"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L010","subject":"保險法規","chapter":"第一章 人身保險契約","number":10,"page":3,"answer":4,"explanation":"(4)債務人，債權人僅能於債務人所欠的債務金額內具有保險利益。","stem":"有關保險利益原則之敘述，何者為非？","options":["又稱為可保利益原則","存在目的系避免賭博行為發生","要保人對於為其管理財產之人具有保險利益","債權人對債務人之保險利益沒有限制"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L011","subject":"保險法規","chapter":"第一章 人身保險契約","number":11,"page":4,"answer":2,"explanation":"限制行為能力人訂定保險契約，須經其法定代理人之同意（事前允許\n或事後承認），或於限制原因消滅 自己承認使有效。","stem":"下列何者不是限制行為能力人訂定保險契約之生效方式?","options":["於限制原因消滅後自己承認","經被保險人同意","經其法定代理人事後承認","經其法定代理人事前允許"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L012","subject":"保險法規","chapter":"第一章 人身保險契約","number":12,"page":4,"answer":3,"explanation":"(3)合夥人或共有人聯合為被保險人時，其中一人或數人讓與保險利\n益於他人者，保險契約不因之而失效。","stem":"有關保險利益之敘述，何者有誤？","options":["凡基於有效契約而生之利益，得為保險利益","被保險人死亡，保險契約除另有訂定外，仍為繼承人之利益而存\n在","合夥人為被保險人時，其中一人讓與保險利益於他人者，保險契\n約失其效力","要保人對於因財產上之現有利益而生之期待利益，有保險利益"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L013","subject":"保險法規","chapter":"第一章 人身保險契約","number":13,"page":4,"answer":1,"explanation":"此案屬於受益人有確定者，則被保險人死亡時該死亡保險金歸此約定\n受益人。","stem":"死亡保險金受益人為被保險人配偶王大華，被保險人亡故前已離婚\n且再婚，則被保險人死亡時該死亡保險金歸","options":["前配偶王大華","要保人或其他應得之人","被保險人遺產","再婚之配偶"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L014","subject":"保險法規","chapter":"第一章 人身保險契約","number":14,"page":4,"answer":4,"explanation":"(4)保險人於賠償後，可直接向加害第三人要求賠償。","stem":"有關代位原則敘述何者錯誤？","options":["財產保險適用","因為人身無價，故人壽保險不適用","又稱為權利代位","保險人於賠償後須經被保險人同意始得代位行使被保險人對於第\n三人之請求權"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L015","subject":"保險法規","chapter":"第一章 人身保險契約","number":15,"page":5,"answer":2,"explanation":"(2)若紅利未特別指定予何人，紅利原則上應由要保人領取。","stem":"各項保險給付之受益人，何者錯誤？","options":["滿期保險金受益人由要保人指定，變更時由要保人申請","紅利給付之受益人皆為要保人","醫療給付之受益人以被保險人為限，且不得事後加以變更","身故保險金如作為被保險人遺產，依民法繼承順位分配"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L016","subject":"保險法規","chapter":"第一章 人身保險契約","number":16,"page":5,"answer":3,"explanation":"B 業務員於親晤被保險人後誠實填報業務員報告書不屬於最大誠信\n原則\nD 為維護契約安定性，如保險事故發生保險人才知要保人違反告知\n義務時，且危險發生基於未說明事實者，得解除契約","stem":"有關最大誠信原則何者正確？\nA契約訂立時要保人或被保險人應將有關的重要事實告訴保險人\nB業務員應於親晤被保險人後誠實填報業務員報告書\nC要保人違反告知義務時保險人得解除契約\nD為維護契約安定性，如保險事故發生保險人才知要保人違反告知\n義務時，且危險發生基於未說明事實者，仍不得解除契約","options":["ABC","ABCD","AC","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L017","subject":"保險法規","chapter":"第一章 人身保險契約","number":17,"page":5,"answer":3,"explanation":"失能保現金、醫療保險金、年金保險金之受益人皆為被保險人本\n人。","stem":"有關要保人何者為非？","options":["須投保時填寫要保書並善盡告知、通知保險公司保險事故發生之\n義務","向保險人申請訂立保險契約之人","有指定各項保險金受益人、申請保險單借款及聲明保費自動墊繳\n之權利","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L018","subject":"保險法規","chapter":"第一章 人身保險契約","number":18,"page":5,"answer":3,"explanation":"失能保現金、醫療保險金、年金保險金之受益人皆為被保險人本\n人。","stem":"何者非要保人可指定受益人領取之保險金？\nA失能保現金、B醫療保險金、C終身壽險保險金、D年金保險金","options":["BCD","ACD","ABD","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L019","subject":"保險法規","chapter":"第一章 人身保險契約","number":19,"page":6,"answer":2,"explanation":"ABCD 皆正確。","stem":"有關要保人之敘述何者正確？\nA保險契約當事人 B自然人 C機關行號 D對保險對象需具有保險利\n益","options":["CD","ABCD","ABD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L020","subject":"保險法規","chapter":"第一章 人身保險契約","number":20,"page":6,"answer":4,"explanation":"債權人未經債務人書面承認而逕以債務人為被保險人訂立之年金保\n險契約有效。","stem":"債權人未經債務人書面承認而逕以債務人為被保險人訂立之年金保\n險契約","options":["無效","失其效力","需債務人同意後才有效","有效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L021","subject":"保險法規","chapter":"第一章 人身保險契約","number":21,"page":6,"answer":1,"explanation":"保險法第 20 條規定，於有效契約而生之利益，亦得為保險利益。","stem":"依保險法第 20 條規定基於有效契約而生之利益","options":["得為保險利益","僅得對有效契約有保險利益","不得為保險利益","以上皆是"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L022","subject":"保險法規","chapter":"第一章 人身保險契約","number":22,"page":6,"answer":1,"explanation":"被保險人若身體遭受失能必須就醫治療時，為使失能保險金能確實\n作為支\n應被保險人因失能所引起的各項費用，所以失能保險之受益人以被\n保險人\n本人為限，且不得加以變更。","stem":"下列何者錯誤？","options":["失能保險金的受益人原則上為被保險人本人，如要變更須在保險\n事故發生前","要保人可隨時終止保險契約","受益人應在知悉保險事故發生後，於法定或契約約定期間內通知\n保險公司，並檢具所需文件申領保險金","受益人係經要保人指定，享有保險金請求權的人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L023","subject":"保險法規","chapter":"第一章 人身保險契約","number":23,"page":6,"answer":3,"explanation":"主力近因是指致被保險人死亡或受傷最主要或有效的原因，而不是\n最直接 或最接近的原因，類似民法中的因果關係，假設原因有 2 個\n以上，且每個 原因之間有因果關係且未中斷時，則以最先發生並造\n成一連串事故之原因 為主力近因。","stem":"有關主力近因原則之敘述，何者正確？\nA類似民法上的相當因果關係\nB常用於傷害保險與健康保險之賠償責任認定\nC導致被保險人死亡原因有2個以上，而每個原因有因果關係雖有中\n斷，其最先發生原因仍為主力近因\nD即指最直接或最接近被保險人死亡的原因","options":["ABD","ABCD","AB","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L024","subject":"保險法規","chapter":"第一章 人身保險契約","number":24,"page":7,"answer":1,"explanation":"受益人經要保人指定後，要保人在保險事故發生前，仍得以契約或\n遺囑處分之。\n要保人行使變更受益人之處分權時，應通知保險公司並檢附被保險\n人同意書。","stem":"受益人經指定後","options":["經被保險人同意於保險事故發生前得變更受益人","不得再變更受益人","於保險事故發生前得變更受益人","於保險事故發生後得變更受益人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L025","subject":"保險法規","chapter":"第一章 人身保險契約","number":25,"page":7,"answer":1,"explanation":"要保人對於下列個人之生命或身體有保險利益：\n本人或家屬、生活費或教育費養給之人、債務人、為本人管理財產\n獲利益之人。","stem":"張三以自己為要保人，對下列何者之生命或身體無保險利益？\nA借錢給張三的李四 B張三本人 C欠張三錢的王老五","options":["A","AC","ABC","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L026","subject":"保險法規","chapter":"第一章 人身保險契約","number":26,"page":7,"answer":3,"explanation":"要保人或被保險人，對於保險標的物無保險利益者，保險契約失其\n效力。","stem":"依保險法第 17 條之規定，要保人或被保險人，對於保險標的物無\n保險利益者，保險契約","options":["有效","無效","失其效力","以上皆非"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L027","subject":"保險法規","chapter":"第一章 人身保險契約","number":27,"page":7,"answer":4,"explanation":"A 失能及醫療保險金之受益人以被保險人本人為限，且不得事後加\n以變更","stem":"依據保險法規定，要保人的權力包含？\nA變更失能及醫療保險金之受益人 B行使契約撤銷權\nC申請契約變更 D申請保險單借款、聲明續期保險費自動墊繳","options":["ABCD","ABD","ABC","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L028","subject":"保險法規","chapter":"第一章 人身保險契約","number":28,"page":7,"answer":3,"explanation":"甲提供乙學費，甲即為乙生活費或教育費所仰給之人，則乙對甲有\n保險利益。丙銀行借款給甲，甲是債務人，丙是債權人，債權人對\n債務人有保險利益。A甲對自己有保險利益、B乙對甲有保險利益、\nC丙銀行是債權人，對甲也有保險利益。","stem":"某甲為支應其子某乙之學費向丙銀行貸款，請問下列何者對某甲具\n有保險利益？A甲 B乙 C丙銀行 D某甲投保的保險公司","options":["BCD","AB","ABC","A"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L029","subject":"保險法規","chapter":"第一章 人身保險契約","number":29,"page":7,"answer":1,"explanation":"依保險法第 46 條：「保險契約由代理人訂立者，應載明代訂之意\n旨。」 之規定辦理，故得委由代理人代理。","stem":"對於要保人的敘述，何者錯誤？","options":["要保人訂立保險契約不得委由代理人代理","要保人可以為自然人或法人","要保人負有交付保險費之義務","要保人對被保險人須具有保險利益"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L030","subject":"保險法規","chapter":"第一章 人身保險契約","number":30,"page":8,"answer":1,"explanation":"依保險法第 45 條第 2 項規定：「受益人有疑義時，推定要保人為\n自己之利益而訂立。」即由法律推定以要保人為受益人。","stem":"按照我國保險法條規定，受益人有疑義時，推定誰為受益人?","options":["要保人","被保險人","被保險人之法定繼承人","以上三者皆可"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L031","subject":"保險法規","chapter":"第一章 人身保險契約","number":31,"page":8,"answer":2,"explanation":"C 保險事故發生時有權受領保險金，而失能保險金之受益人僅以被\n保險人為限\nD 要保人只對被保險人具有保險利益","stem":"有關保險受益人之規定，何者正確?\nA因保險給付不同可區分為滿期、身故、失能或醫療、年金及紅利\n等受益人\nB為人身保險契約關係人\nC保險事故發生時有權受領保險金，而失能保險金之受益人不以被\n保險人為限\nD與要保人、被保險人須具有保險利益","options":["BCD","AB","ABCD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L032","subject":"保險法規","chapter":"第一章 人身保險契約","number":32,"page":8,"answer":2,"explanation":"指定時不限於指出受益人之姓名，即以類名指定亦可，如配偶、子\n女。","stem":"人壽保險受益人之指定何者正確？ A除自然人外，得指定法人\nB得指定一人或數人 C可同時指定自然人及法人\nD訂立保險契約時得僅載明確定受益人之方法","options":["ABCD","ABC","BD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L033","subject":"保險法規","chapter":"第一章 人身保險契約","number":33,"page":8,"answer":1,"explanation":"(1)要保人與被保險人間須有保險利益。","stem":"下列何者不是保險契約之成立要件？","options":["受益人與被保險人間須有保險利益","意思表示一致","要保人須具有行為能力","支付對價"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L034","subject":"保險法規","chapter":"第一章 人身保險契約","number":34,"page":8,"answer":4,"explanation":"要保人對於生活費或教育費所仰給之人有保險利益。","stem":"要保人對下列何者之生命或身體，無保險利益？","options":["債務人","本人","為本人管理財產或利益之人","生活費或教育費所收受之人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L035","subject":"保險法規","chapter":"第一章 人身保險契約","number":35,"page":9,"answer":2,"explanation":"依保險法之規定，受益人於請求保險金時，應以生存者為限。","stem":"依保險法之規定，受益人於請求保險金時，應以","options":["有保險利益者","生存者","有保險利益者且生存者","有行為能力者為限"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L036","subject":"保險法規","chapter":"第一章 人身保險契約","number":36,"page":9,"answer":4,"explanation":"人身保險契約僅適用保險利益原則、最大誠信原則、主力近因原\n則。產險 除了適用上述三項原則外，另適用損害填補、分攤、保險\n代位原則。","stem":"人壽保險契約是以人的生命或身體為保險標的，所以適用","options":["損害填補原則","分攤原則","保險代位原則","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L037","subject":"保險法規","chapter":"第一章 人身保險契約","number":37,"page":9,"answer":4,"explanation":"分攤原則：指保險人和保險人之間，在保險事故發生後對理賠金額\n的分攤。\n除實支實付型的健康險商品較適用損害填補原則及分攤原則外，在\n人壽保險並不適用分攤原則。","stem":"A人壽保險、B實支實付型的健康保險、C年金保險、D日額型健康\n保險，以上何者適用分攤原則？","options":["AB","BD","ABCD","B"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L038","subject":"保險法規","chapter":"第一章 人身保險契約","number":38,"page":9,"answer":2,"explanation":"主力近因：指導致被保險人死亡或受傷的最主要或最有效的原因，\n類似我國民法上的相當因果關係，如果導致保險事故發生的主要近\n因為保單上所保的危險，則保險人自應負責，反之則不必負責。","stem":"何謂主力近因原則？","options":["非民法中的因果關係","是指導致被保險人死亡或受傷的最主要或最有效的原因","導致保險事故發生的主要近因不一定是保險單上所保的危險，且\n保險人仍應負責","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L039","subject":"保險法規","chapter":"第一章 人身保險契約","number":39,"page":9,"answer":3,"explanation":"受益人的產生方式有約定、指定、法定 3 種方式。","stem":"受益人的產生方式 A約定、B指定、C確定、D法定","options":["AB","BCD","ABD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L040","subject":"保險法規","chapter":"第一章 人身保險契約","number":40,"page":9,"answer":1,"explanation":"處分保單權利，如受益人之指定與變更（需被保險人書面同意）、\n保單貸款等。","stem":"要保人以契約或遺囑變更受益人時，非經通知，不得對抗","options":["保險人","受益人","被保險人","保險業務員"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L041","subject":"保險法規","chapter":"第一章 人身保險契約","number":41,"page":10,"answer":2,"explanation":"A 是從損害填補原則延伸而來\nB 對於理賠金額之分攤","stem":"有關分攤原則敘述何者正確？\nA由保險代位原則延伸而來\nB又稱為攤派原則\nC分攤原則指保險費之分攤應公平合理\nD人壽保險及年金保險不適用分攤原則","options":["ABD","BD","BC","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L042","subject":"保險法規","chapter":"第一章 人身保險契約","number":42,"page":10,"answer":2,"explanation":"要保人對以下人有保險利益：本人或其家屬、生活費或教育費仰給\n之人、 債務人、為本人管理財產或利益之人","stem":"甲提供生活費或教育費給乙，則","options":["甲與乙互無保險利益","乙對甲有保險利益","甲與乙互有保險利益","甲對乙有保險利益"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L043","subject":"保險法規","chapter":"第一章 人身保險契約","number":43,"page":10,"answer":4,"explanation":"全選","stem":"下列有關受益人產生之敘述何者為是？","options":["無人數的限制","可為約定、指定、法定","受益人有疑義時，推定要保人為自己之利益而訂立","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L044","subject":"保險法規","chapter":"第一章 人身保險契約","number":44,"page":10,"answer":4,"explanation":"(4)人身保險人僅能為法人。","stem":"下列有關保險人之規定，何者為非？","options":["目前國內之保險公司，均為股份有限公司","非保險業不得兼營保險業務","保險法之規定，保險業之組織以股份有限公司或合作社為限","人身保險人可為法人或自然人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L045","subject":"保險法規","chapter":"第一章 人身保險契約","number":45,"page":11,"answer":2,"explanation":"(1)滿 7 歲之未成年人為限制行為能力人，其所為意思表示及所受意\n思表示 應得法定代理人允許，惟未成年人已婚者，有行為能力\n(3)子女未滿 7 歲， 須由法定代理人代簽孩子姓名及在法定代理人簽\n名欄位上親自簽名同意\n(4)限制行為能力人為日常生活必需之意思表示，不須得法定代理人\n允許。","stem":"下列何者正確？","options":["滿 7 歲之未成年人皆為限制行為能力人，其所為意思表示及所受\n意思表示應得法定代理人允許","法院依聲請權人聲請其家屬有精神障礙致不能為意思表示者，得\n為監護宣告或輔助宣告","未滿 7 歲之未成年人投保時，僅由法定代理人在法定代理人欄位\n親簽同意已足","限制行為能力人為日常生活必需之意思表示，仍應得法定代理人\n允許"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L046","subject":"保險法規","chapter":"第一章 人身保險契約","number":46,"page":11,"answer":3,"explanation":"(1)保險契約有效期間是要保人交付保險費後，保險公司應負保險責\n任期間\n(2)受益人是要保人指定或要保人或被保險人約定，保險事故發生時\n或約定情況發生時，享有賠償請求權之人\n(4)團體保險契約之死亡受益人被保險人家屬或指定法定繼承人 。","stem":"下列敘述何者正確？","options":["保險契約有效期間是要保人與保險公司約定，交付保險費的期間","受益人是指保險事故發生時身體遭 受損害，享有賠償請求權之人","受益人是指經要保人指定，享有保險金請求權的人","團體保險契約之死亡受益人由要保人指定"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L047","subject":"保險法規","chapter":"第一章 人身保險契約","number":47,"page":11,"answer":4,"explanation":"保險業務員不可代為交付保險費。","stem":"下列何者依保險法規定得代為交付保險費？\nA信託業、B被保險人、C受益人、D保險業務員","options":["BCD","BC","ABCD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L048","subject":"保險法規","chapter":"第一章 人身保險契約","number":48,"page":11,"answer":2,"explanation":"(1)僅產物保險得行使代位請求權\n(3)指保險人於給付賠償後，保險人代位行使被保險對第三人之請求\n權。","stem":"下列有關保險代位原則之敘述，何者正確？","options":["人壽保險與產物保險依法均得代位行使請求權","人壽保險不得代位行使請求權","指事故發生時，由保險人代位行使被保險對第三人之請求權","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L049","subject":"保險法規","chapter":"第一章 人身保險契約","number":49,"page":12,"answer":4,"explanation":"B 保險利益指要保人應對於被保險人之生命或身體因具有利害關係而\n可享 有之合法經濟利益。","stem":"有關保險利益原則敘述何者正確？\nA又稱為可保利益\nB指要保人對於被保險人生命身體因具有利害關係而可享有的合法\n及不合法的經濟利益\nC要保人對於為其管理財產或利益之人有保險利益\nD保險利益包含現有利益及期待利益","options":["ABCD","AC","ABC","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L050","subject":"保險法規","chapter":"第一章 人身保險契約","number":50,"page":12,"answer":3,"explanation":"保險利益：指要保人應對於被保險人之生命或身體因具有利害關係而\n可享 有之合法經濟利益。","stem":"保險利益須存在於","options":["被保險人與受益人間","要保人與受益人間","要保人與被保險人間","要保人與保險人間"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L051","subject":"保險法規","chapter":"第一章 人身保險契約","number":51,"page":12,"answer":4,"explanation":"訂立契約之雙方當事人必須具有行為能力，若為限制行為能力之人，\n須經 法定代理人同意或於限制原因消滅後自己承認。","stem":"要保人訂立契約須","options":["具有行為能力","不須具有行為能力","限制行為能力於限制原因消滅後自己承認","僅 1、3 為是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L052","subject":"保險法規","chapter":"第一章 人身保險契約","number":52,"page":12,"answer":3,"explanation":"要保人對為被保險人所知者應負通知保險人之義務。","stem":"要保人對下列何者應付通知保險人之義務","options":["為保險人所知者","經保險人聲明不必通知者","為被保險人所知者","依通常注意為保險人所應知，或無法諉為不知者"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L053","subject":"保險法規","chapter":"第一章 人身保險契約","number":53,"page":12,"answer":3,"explanation":"分攤原則主要目的是使被保險人不致不當得利，由損害填補原則延伸\n而來。","stem":"分攤原則其主要目的是","options":["確定保險人賠償責任","使要保人不致不當得利","使被保險人不致不當得利","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L054","subject":"保險法規","chapter":"第一章 人身保險契約","number":54,"page":12,"answer":2,"explanation":"B 僅一張即可發生\nC 主要適用於財產保險，不限於人身保險\nD 也適用於部分健康保險，不僅限財產保險","stem":"對於損害填補原則之敘述何者正確？\nA防止被保險人不當得利 B需保險人有二張以上保險單才可能發生\nC僅適用於人身保險 D僅適用於財產保險","options":["AD","A","BD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L055","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":55,"page":13,"answer":2,"explanation":"保險法第 115 條規定：利害關係人，均得代要保人交付保險費。","stem":"有關人身保險契約之保險費何者為非？","options":["信託業依信託契約有交付保險費義務者， 由信託業代為交付","僅應由要保人依保險契約交付","保險契約簽定時保險費能確定者，應於保險契約生效前交付之","可分一次及分期交付兩種"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L056","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":56,"page":13,"answer":2,"explanation":"約定保單型態為電子保單後，仍舊可以與保險公司申請補發紙本保單","stem":"下列有關電子保單的敘述何者為非？","options":["保險人與要保人共同約定","約定後不能恢復紙本","保費費率應該反映成本","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L057","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":57,"page":13,"answer":4,"explanation":"受益人經指定後，要保人得於保險事故發生前，以契約或遺囑處分。","stem":"有關受益人之一為維持契約效力代繳險費之規定，何者錯誤？","options":["受益人領取保險金仍 依保單所載順序及比例給付","受益人待繳保險費屬民法上無因管理","受益人代繳 保費，不影響與其他受益人間對於保險金有連帶債權\n之關係","代繳保費之受益人得 要求保險人不得將保險金給付給其他受益人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L058","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":58,"page":13,"answer":4,"explanation":"以上選項皆正確","stem":"關於保險費及保險費率之敘述各項何者正確？\nA 保險費繳納的方式可分為一次繳清及分期交付二種\nB 一次繳清的保險費又稱為躉繳保險費\nC保險費是保險公司依據保 險金額、保險費率及繳費方式等因素所\n計算出要保人每期應交付保險公司的金額\nD 分期交付保險費又分為每年、每半年、每季及每月交付等四種，\n按年分期交付的保險費 又稱為年繳保險費","options":["ABD","BCD","ABC","ABCD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L059","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":59,"page":14,"answer":1,"explanation":"(2)繳費期間與保險期間不一定相同\n(3)要保人與保險公司所約定之保險契約存續期指的是保險期間\n(4)無此項規定","stem":"有關「繳費期間」之敘述何者正確？","options":["於繳費期間屆滿後，保險契約持續有效到保險 期間終了","「繳費期間」和「保險期間」一定相同","繳費期間是要保人與保險公司 所約定之保險契約存續期","要保人不得約定交付保險費的繳費期間比保險期間短的保險契約"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L060","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":60,"page":14,"answer":2,"explanation":"契約解除一經解除則溯及訂立時自始無效，且保險人無須退還保費。\n契約終止指的是保險契約的當事人不願讓契約存續，中途使之效力終\n止，因此終止之契約效力為自終止日起消滅。契約終止前發生之保險\n事故，保險人仍應付保險責任。","stem":"契約之解除與契約之終止，對契約效力而言","options":["解除為自解除之日起消滅，終止為自始不存在","解除為自始不存在，終止為自終止之日起消滅","自解除或終止之日起不存在","皆為自始不存在"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L061","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":61,"page":14,"answer":1,"explanation":"根據住院醫療費用保險單示範條款第 12 條規定：保證續保適用時，\n續保時，按續保生效當時依規定陳報主管機關之費率及被保險人年齡\n重新計算保險費。","stem":"住院醫療費用保險若包含保證續保條款，保險公司可按續保生效當\n時重新計算保險費 A陳報主管機關之費率、B該險種之經驗費率、C\n被保險人年齡、D被保險人身體狀況","options":["AC","BD","BCD","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L062","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":62,"page":14,"answer":1,"explanation":"要保人自停效日起 6 個月後申請復效者，保險人得於要保人申請復\n效日起 5 日內要求提供可保證明，或於收到前項可保證明後 15 日內\n不為拒絕者，視為同意復效。","stem":"要保人自停效日起 6 個月後申請復效者，保險人得於要保人申請復\n效日起 A 日內要求提供可保證明，或於收到前項可保證明後 B 日\n內不為拒絕視為同意復效，請問 A、B 應為？","options":["A 為 5，B 為 15","A 為 5，B 為 10","A 為 10，B 為 30","A 為 10，B 為 15"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L063","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":63,"page":15,"answer":2,"explanation":"以受監護宣告尚未撤銷者為被保險人投保之人壽保險契約，其喪葬費\n用保險金額如超過遺產及贈與稅法有關喪葬費扣除額 1/2 時，保險人\n僅就超過部分不負給付保險金責任，無息退還超過部分之已繳保費。","stem":"以受監護宣告尚未撤銷者為被保險人投保之人壽保險契約，其喪葬\n費用保險金額如超過遺產及贈與稅法有關喪葬費扣除額 1/2 時","options":["保險人完全不負給付保險金責任，無須退還已繳保費","保險人僅就超過部分不負給付保險金責任，無息退還超過部分之\n已繳保費","保險人僅就超過部分不負給付保險金責任，加計利息退還超過部\n分之已繳保費","保險人完全不負給付保險金責任，無息退還已繳保費"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L064","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":64,"page":15,"answer":3,"explanation":"(1)保單條款是保險人與要保人共同遵守的約定\n(2)保戶同意後能再向保險人申請紙本保單","stem":"保戶以網址取代紙本保單條款之規定，何者正確？","options":["保單條款是保險人與被保險人共同遵守的約定","保戶同意後不能再向保險人申請紙本保單","保險人因此節省的紙張印製成本需於附加費用反映","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L065","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":65,"page":15,"answer":2,"explanation":"無論有無體檢，要保人得於收到保單翌日起十日內以書面檢同保險單\n撤銷契約，自書面到達之翌日零時起自始無效。","stem":"甲以無體檢保件投保後，發覺保險內容非當初本意，故書面向保險\n人行使契約撤銷權，其契約","options":["自書面送達時起自始無效","自書面到達之翌日零時起自始無效","因無體檢保件，故甲不得主張撤銷權","自書面到達之日零時起自始無效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L066","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":66,"page":16,"answer":3,"explanation":"ABCD 皆為法定無效事由。","stem":"何者為適用人身保險之法定無效事由？\nA契約訂立時保險標的危險已發生或已消滅\nB由第三人訂立之死亡保險契約，未經被保險人書面同意並約定保\n險金額\nC被保險人以不實年齡投保，其真實年齡已超過保險人所定保險年\n齡限度者\nD要保人意圖不當得利而為複保險","options":["ABD","BCD","ABCD","ABD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L067","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":67,"page":16,"answer":2,"explanation":"(2)甲型於給付期間可採分紅或不分紅方式。","stem":"有關利率變動型年金之敘述，何者為非？","options":["若採分紅方式設計應明訂計算方式及給付方式","甲型於給付期間僅採不分紅方式設計","於累積期間不論甲型或乙型，均無紅利給付","乙型於給付期間通常無紅利給付"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L068","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":68,"page":16,"answer":4,"explanation":"(1)保險契約因違反告知義務而解除時，保險人無須返還所收保費。\n(2)保險契約因保險人破產而中止，其終止後之保險費，已交付者，\n保險人應返還之。\n(3)保險人對於要保人或被保險人因履行道德上之義 務所致之損害，\n負賠償責任。","stem":"下列何者正確？","options":["保險契約因違反告知義務而解除時，保險人應返還所收保費","保險契約因保險人破產而中止，其終止後之保費已交付者無須返\n還","保險人對於要保人或被保險人因履行道德上之義務所致之損害，\n不負賠償責任","訂立保險契約時僅要保人知悉危險已發生，保險人得請求償還費\n用，其已收受之保費無須返還"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L069","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":69,"page":17,"answer":1,"explanation":"保險契約法定終止事由有保險人破產時、保險標的物非因保險契約\n所載之事故而完全滅失時。","stem":"保險契約法定終止事由有 A保險人破產時 B要保人任意終止時\nC保險契約停效後且已逾申請復效所訂期限\nD保險標的物非因保險契約所載之事故而完全滅失時","options":["AD","ACD","BC","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L070","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":70,"page":17,"answer":3,"explanation":"A 要保人得於收到保單翌日起十日內以書面檢同保險單撤銷契約\nC 契約撤銷效力自要保人郵寄郵戳翌日零時起生效。","stem":"下列何者正確？\nA要保人得於收到保單翌日起十日內以書面檢同保險單終止契約\nB契約撤銷效力自要保人書面意思表示到達保險人翌日零時起生效\nC契約撤銷效力自要保人郵寄郵戳當日零時起生效\nD撤銷生效前如發生保險事故，保險人仍應應負保險責任","options":["ACD","AB","BD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L071","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":71,"page":17,"answer":3,"explanation":"加重保險人之義務非約定無效事由。","stem":"保險契約如約定事項顯失公平者，該部分之約定無效，下列何者非\n無效事由？","options":["免除或減輕保險人依保險法應負之義務","使要保人、受益人或被保險人拋棄或限制其依保險法所享之權利","加重保險人之義務","其他於要保人、受益人或被保險人有重大不利益之情事"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L072","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":72,"page":17,"answer":2,"explanation":"D 由第三人訂立之年金保險契約，未經被保險人書面同意並約定保\n險金額者契約仍有效。","stem":"有關年金保險敘述，何者為是？\nA保險費不得以訴訟方式請求交付\nB利害關係人得代要保人交付保險費\nC保險費到期未交付不適用寬限期間之規定\nD由第三人訂立之契約，未經被保險人書面同意並約定保險金額者\n契約無效","options":["BCD","ABC","ABD","AB"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L073","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":73,"page":18,"answer":1,"explanation":"(2)當事人一方對於他方應通知之事項怠於通知者，如為故意隱匿，\n或因過失，遺漏或為不實之說明，他方始得據為解約之原因\n(3)非因要保人或被保險人行為致危險增加時，要保人或被保險人如\n未及時通知，對於保險人因此所受之損失，應負賠償責任","stem":"有關保險契約之敘述，何者正確？","options":["當事人一方違背特約條款時，即使危險已發生，他方仍得解除契\n約","當事人一方對於他方應通知之事項怠於通知者，僅於故意造成，\n他方始得據為解約之原因","非因要保人或被保險人行為致危險增加時，要保人或被保險人如\n未及時通知，對於保險人因此所受之損失，免負賠償責任","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L074","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":74,"page":18,"answer":4,"explanation":"(1)到期未交付適用寬限期間之規定\n(2)保險人得以訴訟請求交付\n(3)利害關係人得代要保人交付","stem":"依保險法規定，傷害保險之保險費","options":["到期未交付不適用寬限期間之規定","保險人不得以訴訟請求交付","利害關係人不得代要保人交付","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L075","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":75,"page":18,"answer":3,"explanation":"主管機關訂定示範條款目的為使各人身保險業在販售同一種類的保\n險單時有統一的作業處理方式，減少因條款文字說明或解釋的分歧\n與不明而導致無謂的糾紛，確立人身保險商品在社會上的信譽。","stem":"主管機關訂定示範條款目的為？\nA確立保險商品在社會上的信譽\nB減少條款文字或解釋上的分歧\nC授權訂定條款的彈性提高市場競爭力\nD使保險業販售同商品時有統一作業處理方式","options":["AC","ABC","ABD","BD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L076","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":76,"page":19,"answer":3,"explanation":"(3)日額型每次傷害給付日數不得超過 90 日，但超過 180 日繼續治\n療者，受益人若能證明被保險人之治療與該意外傷害事故具有因果\n關係者，不在此限。","stem":"有關傷害醫療保險金之敘述，何者為非？","options":["實支實付型之保險給付，保險公司僅就符合意外傷害事故，且於\n登記合格的醫院或診所治療之實際醫療費用，超過全民健康保險部\n分給付","保險公司基於審核保險金需要，得對被保險人身體予以檢驗，另\n得徵詢其他醫師專業意見，所生費用由保險公司負擔","日額型每次傷害給付日數不得超過 180 日","一般以附約方式處理，分成實支實付與日額型 2 種"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L077","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":77,"page":19,"answer":2,"explanation":"要保人在保險契約有效期間內得申請減少保險金額，但不得低於最\n低承保金額，其減少部分視為終止契約。","stem":"要保人在保險契約有效期間內得申請減少保險金額，但不得低於最\n低承保金額，其減少部分視為？","options":["解除契約","終止契約","無效","停效"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L078","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":78,"page":19,"answer":1,"explanation":"(1)保險金額是保險公司同意承保的金額。","stem":"下列何者為非？","options":["要保人希望投保的金額稱為保險金額","保險事故發生後保險公司給付之金額稱為保險金","保險公司就平準繳費的保險契約將來可能發生的給付責任所提存\n的金額稱為責任準備金","保險公司同意承保之金額稱為保險金額"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L079","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":79,"page":19,"answer":4,"explanation":"D 屬強化服務非法定義務。","stem":"保險公司於保單申請復效期限屆滿前提供哪些服務？\nA於申請復效期限屆滿前 3 個月通知要保人申請復效\nB通知以書面、電子郵件、簡訊或其他約定方式擇一方式\nC依要保人最後留存公司聯絡資料通知\nD屬於法定義務","options":["AD","CD","ABCD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L080","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":80,"page":20,"answer":4,"explanation":"依《保險法》第 116 條：\n催告應送達於要保人，或負有交付保險費義務之人之最後住所或居\n所，保險費經催告後，「應依與保險人約定之交付方法交付之」。","stem":"依保險法規定，保費超過寬限期間而仍未交付，除約定得由保險公\n司自動墊繳者外，保險單即停止效力，要保人於催告期間繳付保費\n應","options":["以郵局劃撥繳費","依原約定方式繳費","以網路連線交付","依與保險人約定之交付方法交付之"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L081","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":81,"page":20,"answer":4,"explanation":"有自動墊繳的保險契約，給付保險金時應扣還墊繳保費本息。","stem":"有自動墊繳的保險契約，給付保險金時","options":["應扣還墊繳保費之利息","應扣還墊繳保費","無需扣還墊繳保費","應扣還墊繳保費本息"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L082","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":82,"page":20,"answer":4,"explanation":"若因保單借款本息已逾保單價值準備金，而使保單停效，欲恢復效\n力，須先清償欠款，但清償方式可採部分清償，且未償餘額不可以\n超過原保單借款可借金額之上限。","stem":"人壽保險單示範條款約定，保險契約因保險單借款本息逾保單價值\n準備金而停效者，要保人於復效時","options":["均須經保險公司同意始得復效","須清償全部欠繳保險單借款本息始得復效","於停效後6個月內之復效申請始得部分清償後復效","得部分清償欠繳保險單借款本息後復效，其未償餘額並不得逾保\n險單借款約定可借金額之上限"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L083","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":83,"page":20,"answer":4,"explanation":"年金保險的給付原則為被保險人生存時給付，但法令另有規定，保\n險公司須設計保證的給付方式，不論被保險人生存與否，保證給付\n固定期間的年金，稱為保證期間年金。","stem":"年金保險中，不論被保險人生存與否，保險公司保證給付期間的年\n金保險稱為？","options":["遞延年金保險","即期年金保險","保證金額年金保險","保證期間年金保險"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L084","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":84,"page":20,"answer":3,"explanation":"保戶違反告知義務足以變更或減少保險人對危險之估計者，保險人\n得解除契約，契約自始無效，且保險人無須返還保費。","stem":"保戶違反告知義務時，保險人得","options":["解除契約返還已繳保費","解除契約並按解約金列表給付","解除契約不返還保費","終止契約並按解約金列表給付"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L085","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":85,"page":20,"answer":3,"explanation":"年金保險契約是生存契約，且年金保險契約無道德風險問題，故仍\n有效。","stem":"債權人未經債務人書面承認而逕以債務人為被保險人訂立之年金保\n險契約","options":["停效","無效","有效","視情形而定"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L086","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":86,"page":21,"answer":2,"explanation":"被保險人於本契約有效期間內因不同義務傷害事故申領失能保險金\n時，保 險公司累計給付金額最高以保險金額為限。","stem":"失能保險金不論被保險人失能次數及程度如何，受益人得請領之總\n金額皆不得超過","options":["責任準備金","保險金額","所繳保險費總額","保單價值準備金"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L087","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":87,"page":21,"answer":1,"explanation":"第二期以後分期保險費到期未交付時，自保險單所載交付日期起三\n十日仍未交付者，本公司得自翌日起按第十三條規定將本契約變更\n為減額繳清保險，使本契約繼續有效。","stem":"遞延年金保險第二期以後保險費如未依約繳付，不適用何者規定?\nA寬限期、B停效、C變更為減額繳清保險","options":["AB","AC","BC","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L088","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":88,"page":21,"answer":3,"explanation":"月繳或季繳者，寬限期限之起算得免經催告之程序，保險契約的寬\n限期間自保險單所載交付日期的翌日起 OO 日（不得低於三十日）","stem":"月繳或季繳保險契約第二期以後分期保險費到期未交付，其寬限期\n間之起算日為","options":["保險費應繳日","催告到達之翌日","保險費應繳日之翌日","催告到達之日"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L089","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":89,"page":21,"answer":1,"explanation":"保險契約停效後，要保人可以在保險契約停止效力起 6 個月內清償\n保險費扣除停效期間危險保險費後的餘額及保險契約約定之利息\n後，翌日上午零時起開始恢復其效力。","stem":"申請復效時，要保人可以在保險契約停止效力 6 個月內清償欠繳保\n險費扣除停效期間的「」後之餘額及保險契約約定之利息後，翌日\n上午零時起開始恢復其效力。","options":["危險保險費","儲蓄保險費","純保險費","附加保險費"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L090","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":90,"page":21,"answer":1,"explanation":"保險金的給付：保險公司應於收齊申請文件後 15 日內給付保險金\n額，逾期保險公司應按年利一分加計利息給付。","stem":"保險金的支付除情況特殊外，保險公司應於收齊所需文件後「」內\n給付，逾期保險公司應按年利一分加計利息給付。","options":["15 日","5 日","1 個月","10 日"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L091","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":91,"page":21,"answer":2,"explanation":"醫院：依照醫療法規定，領有開業執照並設有病房收治病人之公、\n私立及財團法人醫院。\n診所、國術館、安養中心等皆不屬於醫院範疇。","stem":"下列何者不屬於住院醫療保險所稱醫院？\nA健檢中心、B安養中心、C診所、D國術館","options":["BD","ABCD","AB","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L092","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":92,"page":22,"answer":4,"explanation":"通知之除外情形，當事人之一對下列各款，不負通知義務：為他方\n所知者依;通常注意為他方所應知，或無法諉為不知者;一方對於他方\n經聲明不必通知者。","stem":"保險事故的通知，如要保人或被保險人不於所規定之期限內通知\n者，除非下列何種情形之一，否則對保險人所受之損失應自負賠償\n責任","options":["為他方所知者","依通常注意為他方所應知，或無法諉為不知者","一方對於他方經聲明不必通知者","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L093","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":93,"page":22,"answer":4,"explanation":"保險法第 149 條，主管機關應依下列規定對保險為監管、接管、勒\n令停業清理或命令解散之處分。","stem":"保險業因業務或財務狀況顯著惡化，不能支付其債務或無法履行契\n約責任或有損被保險人之權益之虞時，下列何者為主管機關得為之\n處分 A監管、接管 B勒令停業清理 C直接處分轉售 D命令解散","options":["ABCD","AC","ABC","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L094","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":94,"page":22,"answer":3,"explanation":"保單價值準備金依保險法施行細則之規定，係指人身保險業以計算\n保險契 約簽單保險費之利率及危險發生率為基礎。","stem":"有關保單價值準備金之計算，除依主管機關規定外並以何者為基\n礎？ A危險發生率 B附加費用率 C簽單保險費之利率\nD4行庫每月初牌告之 2 年期定存最高利率平均值","options":["ABCD","BCD","AC","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L095","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":95,"page":22,"answer":3,"explanation":"受益人申領「失能保險金」時應檢具下列文件：\n保險金申請書、保險單或其謄本、失能診斷書;但必要時本公司得要\n求提供意外傷害事故證明文件、受益人的身分證明。","stem":"下列何者非受益人申領失能保險金應檢具之文件？","options":["保險金申請書及受益人之身分證明","保險單或其謄本","意外傷害事故證明文件","失能診斷書"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L096","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":96,"page":22,"answer":3,"explanation":"傷害保險與旅行平安險的主要區別：保險期限、承保期間和除外責\n任。(旅平險最多承保 180 天，傷害險則為一年期。)\n(B)承保時間依保單所載日期為準\n(D)承保的事故均為意外事故","stem":"下列何者是旅行平安險與傷害險的不同\nA保險期間可否因特殊事故延長 B承保時間計算之標準\nC除外責任項目 D承保事故","options":["CD","ACD","AC","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L097","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":97,"page":23,"answer":3,"explanation":"要保人行使契約撤銷權生效後，其效力\n(1)自要保人書面之意思表示到達翌日零時起，該契約自始無效\n(2)保險人應無息退還要保人所繳保險費。","stem":"要保人行使契約撤銷權生效後，則","options":["契約自行使撤銷權當日起無效","保險人應計息退還保險費","契約自始無效","保險人得扣除手續費"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L098","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":98,"page":23,"answer":1,"explanation":"維護金融之安定故名安定基金。","stem":"為保障被保險人之基本權益，並維護金融之安定，依保險法規定保\n險業應設置","options":["安定基金","業務發展基金","消費者保護基金","消費者補償基金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L099","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":99,"page":23,"answer":1,"explanation":"自 109 年 1 月 1 日起，保險公司於申請復效期限屆滿前至少三個月\n將以書面、電子郵件、簡訊或其他約定方法擇一通知，要保人行使\n申請復效之權利。","stem":"有關人壽保險單示範條款復效通知之規定，何者有誤？","options":["保險人於契約停效後至得申請復效之期限屆滿前1個月通知要保人\n復效權利","保險人以書面、電子郵件、簡訊或其他約定方式擇一通知","通知須載明未於期限屆滿前申請復效者，契約效力自期限屆滿之\n日翌日上午零時起終止","保險人依要保人最後留存之聯絡資料發出通知，視為已完成通知"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L100","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":100,"page":23,"answer":2,"explanation":"保單價值準備金不足墊繳一日之保險費時，經催告到達後逾 30 日\n仍未交付保險費時，契約效力停止。","stem":"有關人壽保險單示範條款保險費自動墊繳之規定，下列何者為非","options":["每次墊繳保險費的本息，應由保險公司出具憑證交予要保人","保單價值準備金不足墊繳一日之保險費時，自翌日起契約效力停\n止","自動墊繳係以墊繳當時之保單價值準備金扣除借款本息後之餘額\n辦理","自動墊繳經約定後仍可再變更"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L101","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":101,"page":23,"answer":2,"explanation":"減額繳清之效力：\n不需再繳保費、險種不變、保險期間不變、保險金額減少","stem":"保險契約變更為繳清保險後，契約之保險種類","options":["改變","不變","不一定","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L102","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":102,"page":24,"answer":1,"explanation":"減額繳清的保單保險金額僅會減少，且不得恢復。","stem":"保險契約改變為繳清保險以後，「」申請恢復原契約。","options":["不可以","二年內可以","一年內可以","隨時可以"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L103","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":103,"page":24,"answer":4,"explanation":"全選","stem":"依人壽保險單示範條款規定，受益人喪失受益權時，","options":["如無其他受益人受領保險金，該保險金作為被保險人遺產","要保人除聲明放棄處分權外，得於事故發生前通知保險人重新指\n定受益人","如有其他受益人受領保險金，喪失受益權之受益人原應得部分，\n按其他受益人原約定比例分歸其他受益人","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L104","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":104,"page":24,"answer":3,"explanation":"六個月內的復效：補繳保費、扣除停效期間危險保費後的餘額及利息\n六個月後的復效：上述條件之外，保險公司得於申請復效之日起五日\n內要求要保人提供被保險人可保證明","stem":"要保人於保險契約停止效力之日起6個月後申請恢復效力時，下列敘\n述何者正確\nA提出申請書\nB繳清欠繳的保險費扣除停效期間的危險保險費\nC提供被保險人可保證明","options":["BC","AB","ABC","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L105","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":105,"page":24,"answer":4,"explanation":"人壽保險的除外責任：一、要保人、被保險人的故意行為。\n二、被保險人 犯罪行為。\n三、被保險人飲酒後駕(騎)車，其吐氣或血液所含酒精成份超過道路\n交通法令規定標準者。\n四、戰爭、內亂及其他類似的武裝變亂。但契約另有約定者不在此\n限。\n五、因原子或核子能裝置所引起的爆炸、灼 熱、輻射或污染。但契\n約另有約定者不在此限。","stem":"下列何者為人壽保險單示範條款載明之除外責任？","options":["被保險人心神喪失所致事故","被保險人因飲酒後駕車所致事故","被保險人從事特技表演等競賽活動所致事故","要保人故意致被保險人於死"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L106","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":106,"page":25,"answer":1,"explanation":"(2)108 年 12 月底前投保的舊保單不溯及既往\n(3)保險公司得基於審核保險金需要，徵詢其他醫師專業意見經受益\n人同意調閱被保險人之就醫相關資料","stem":"為防堵不良醫療院所配合保戶要求開立不實醫療證明或診斷書詐領\n保險金之行為，金管會修正住院醫療費用保險單示範條款，下列敘\n述何者正確？","options":["保險公司得依其他醫生的第二意見決定理賠與否","108 年度已簽發的醫療保險單，經保險公司寄送保單權益變更通\n知書後亦得適用","保險公司得憑該條款調閱被保險人的就醫紀錄，不須另外取得授\n權","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L107","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":107,"page":25,"answer":4,"explanation":"借款本息如超過保單價值準備金時，保單效力即停止，保險公司應於\n停效日前 30 日內以書面通知要保人。","stem":"要保人以保險單為質向保險人借款，借款到期應將本息償還保險公\n司，逾期未償之本息超過保單價值準備金時，保險契約?","options":["無效","立即失效","經書面通知到達後逾三十天仍未繳付時，保險契約之效力停止","立即停效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L108","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":108,"page":25,"answer":2,"explanation":"即期年金：保險費躉繳 (一次繳清)，於契約生效後即進入年金給付期\n間。遞延年金：保險費分期交付，於繳費終了後或經過一定的期間或\n被保險人到達一定年齡才進入年金給付期間。","stem":"年金保險的保費一次繳清後，保險公司立即開始給付年金者稱為","options":["遞延年金","即期年金","付清年金","躉繳年金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L109","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":109,"page":25,"answer":2,"explanation":"因生產住院指延伸的醫療行為，不在此限。","stem":"下列何者是健康保險給付事由？","options":["被保險人因墮胎所致疾病","被保險人因生產住院","被保險人因墮胎所致死亡","被保險人故意自殺"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L110","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":110,"page":25,"answer":4,"explanation":"全選","stem":"年金開始給付後，要保人即不得要求辦理","options":["減額繳清保險","減少年金金額","終止契約或保險單借款","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L111","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":111,"page":26,"answer":3,"explanation":"保險公司在同意承保前預收相當於第一期保險費，而在同意承保之意\n思表 示前發生應予給付之保險事故時，保險公司仍負保險責任。","stem":"某甲於 94 年 10 月 1 日向某保險公司投保養老保險，同日繳納 第\n一次保險費，並於次日接受體檢，同月5日保險公司同意承保，據知\n某甲於承保前一日車禍而死，試問保險公司應","options":["僅返還所繳保險費","不一定理賠，視個案而定","理賠","不理賠"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L112","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":112,"page":26,"answer":2,"explanation":"契約撤銷權之規定適用於自 84 年 4 月 1 日起簽訂之個人兩年期以\n上人身保險契約。","stem":"契約撤銷權之規定適用於個人「」人身保險契約。","options":["十年期以上","兩年期以上","五年期以上","一年期"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L113","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":113,"page":26,"answer":4,"explanation":"利率變動型年金保險甲型為固定年金金額。\n甲是固定的，乙是變動的。","stem":"利率變動型年金保險甲型為","options":["變動年金金額","不固定年金金額","彈性年金金額","固定年金金額"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L114","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":114,"page":26,"answer":3,"explanation":"要保人終止保險契約，而保險費已付足一年以上者，保險人應於接到\n通知後一個月內償付解約金，其金額不得低於要保人應得保單價值準\n備金之四分之三。","stem":"要保人終止保險契約，而保險費已付足一年以上者，保險人應於接\n到通知後一個月內償付解約金，其金額不得低於要保人應得保單價\n值準備金之","options":["二分之一","四分之一","四分之三","三分之一"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L115","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":115,"page":26,"answer":1,"explanation":"意外險的費率看的是職業等級，被保險人職業變更，而致危險增加\n者，於危險發生前，按差額比例增收未滿期保險金;未通知而發生事\n故，危險發生後，按原收保費與應收保費比例折算保險金。","stem":"某甲購買傷害險時任職於國中教師，兩年後轉任救生員一職，未告\n知保險公司，後來發生意外事故致死，則保險公司在傷害險部分","options":["按原收保險費與應收保險費比例理賠","依原投保金額理賠","補足保費差額後理賠原保險金額","不予理賠"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L116","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":116,"page":26,"answer":3,"explanation":"復效的契約其保險費之計算，是依原保單的保單價值準備金及原投\n保年齡的標準繼續繳費。","stem":"復效的契約其保險費之計算","options":["視個別契約而定","由要保人與保險公司重新約定","按原投保年齡標準","按復效時年齡計算"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L117","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":117,"page":27,"answer":2,"explanation":"自動墊繳保價金不足，沒有成功墊繳，等於保費沒有繳，只要保費\n沒有繳，就是走沒有繳費的流程：先催告，進入 30 天寬限，再來\n就停效。","stem":"當要保人屆期未交保費，保險人自動墊繳其應繳保費及利息，若保\n單價值準備金之餘額不足墊繳一日的保險費且經催告到達後逾 30\n天仍未繳費時，保險契約效力即","options":["無效","停止","終止","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L118","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":118,"page":27,"answer":1,"explanation":"責任準備金的提存與預定死亡率及預定利率有關。","stem":"責任準備金的提存與下列哪些費率因子有關？\nA預定死亡率 B預定營業費用率 C預定利率","options":["AC","AB","BC","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L119","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":119,"page":27,"answer":3,"explanation":"被保險人因犯罪處死或拒捕或越獄致死，如保險費付足 2 年以上\n者，保險人應將其保單價值準備金返還予應得之人。","stem":"被保險人因犯罪處死或拒捕或越獄致死，如保險費付足 2 年以上\n者，保險人","options":["得給付申請部分保險金","不得給付保險金","應將其保單價值準備金返還予應得之人","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L120","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":120,"page":27,"answer":4,"explanation":"特別災難失蹤 1 年、一般失蹤 7 年、80 歲以上 3 年","stem":"依民法第八條第三項規定，失蹤人為遭遇特別災難者，得於特別災\n難終了滿「」後，為死亡宣告。","options":["三年","七年","五年","一年"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L121","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":121,"page":27,"answer":3,"explanation":"依據保單示範條款，保險公司應於保單申請復效期限屆滿前至少三\n個月，以書面、電子郵件、簡訊或其他方式通知要保人申請復效之\n權利。","stem":"依據保單示範條款，保險公司應於保單申請復效期限屆滿前至少幾\n個月，通知要保人申請復效之權利？","options":["1 個月","2 個月","3 個月","6 個月"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L122","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":122,"page":27,"answer":2,"explanation":"傷害保險契約的定義係指非由疾病引起之突發外來事故所致者。","stem":"保險法第 131 條第 2 項有關意外傷害之要件，何者為是？\nA非由疾病引起、B單獨事故、C外來事故、D突發事故","options":["ABD","ACD","ABCD","ABC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L123","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":123,"page":28,"answer":1,"explanation":"依據保單示範條款，保險公司應於保單申請復效期限屆滿前至少三\n個月，以書面、電子郵件、簡訊或其他方式通知要保人申請復效之\n權利。","stem":"關於保單申請復效期限屆滿前之通知，以下敘述何者正確？","options":["需於至少三個月前發出通知","屬於法定義務，並應註明於契約條款中","為保障保戶權益，應以雙掛號通知","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L124","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":124,"page":28,"answer":4,"explanation":"契約終止為要保人提出解約，拿走了解約金，不能再恢復。","stem":"壽險契約終止後","options":["僅主契約部分可恢復","附約部分可恢復","雙方同意後可以恢復","不能恢復原契約"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L125","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":125,"page":28,"answer":1,"explanation":"保單價值準備金給要保人領，要保人死亡，變成遺產，依法申報遺\n產稅。","stem":"李嗣以其子李玖為被保險人購買人身保險，當李嗣死亡時李玖未辦\n理變更要保人且其他利害關係人也未代為續繳保險費，若該保險單\n已累積有保單價值準備金，則該保單價值準備金應","options":["列入李嗣之遺產總額，申報遺產稅","視為保險給付，但列入所得","由李玖申請領回","視為保險給付，不列入所得"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L126","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":126,"page":28,"answer":3,"explanation":"受益人變更的聲請要件：未發生保險事故前、需被保險人同意","stem":"人壽保險保險事故發生前，要保人得變更受益人，但須經何人之書\n面承認者始生效力","options":["受益人","保險人","被保險人","要保人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L127","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":127,"page":28,"answer":4,"explanation":"傷害保險契約的定義係指非由疾病引起之突發外來事故所致者。題\n目陳光華父親因疾病死亡故不理賠。","stem":"陳光華的父親曾於生前投保傷害保險貳百萬元，並以陳光華為死亡\n保險金受益人，但陳光華一直到父親因疾病死亡後二年，始知父親\n投保，此時保險公司","options":["仍應如額給付保險金","陳光華須證明確係不知其父投保事實才延遲申請，否則保險公司\n仍得拒絕給付","僅給付保單價值準備金","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L128","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":128,"page":29,"answer":2,"explanation":"保險人破產時，保險契約於破產宣告日終止，其終止後之保費，已\n交付者，應返還之。","stem":"保險人破產時，保險契約","options":["不因之而失效","於破產宣告日終止","停效","保險人應返還全部保險費"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L129","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":129,"page":29,"answer":2,"explanation":"(1)只要符合保險利益均可\n(3)(4)生效以保單所載時日","stem":"有關傷害保險契約，下列敘述何者正確？","options":["僅得以自己為被保險人投保","以職業為危險估計的主要依據","一律採「追溯生效」","契約效力自保單所載翌日零時起生效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L130","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":130,"page":29,"answer":4,"explanation":"僅有要保人知保險事故已發生者，契約無效且不退還所收保險費。","stem":"投保旅行平安保險時，若僅有要保人知保險事故已發生者，保險公\n司","options":["依事故比例退還部分保險費","加計利息退還保險費","僅退還所收保險費","不退還所收保險費"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L131","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":131,"page":29,"answer":3,"explanation":"主管機關得為之處分：監管、接管、勒令停業清理、命令解散","stem":"保險業因業務或財務狀況顯著惡化，不能支付其債務或無法履行契\n約責任或有損被保險人之權益之虞時，下列何者非主管機關得為之\n處分","options":["監管、接管","勒令停業清理","直接處分轉售","得為1、2選項之處分"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L132","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":132,"page":29,"answer":2,"explanation":"附保證期間之年金保險，被保險人於保險契約年金保證期間內尚未\n領取之金額稱為未支領年金餘額。","stem":"附保證期間之年金保險，被保險人於保險契約年金保證期間內尚未\n領取之金額稱為","options":["年金保額","未支領年金餘額","生存年金金額","年金金額"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L133","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":133,"page":30,"answer":4,"explanation":"被保險人故意自殺應自訂約或複效之日起二年後始生效力。\n此題複效僅二個月，保險人不付給付保險金之責，但保費付足二年\n以上者，保險公司應返還保單價值準備金於應得之人。","stem":"某甲曾於五年前投保死亡保險 200 萬元，後該保險因未繳保費於去\n年一月停效，今年十月又辦理復效完畢，某甲於復效兩個月後即跳\n海自殺身故，保險人對本案應如何處理？","options":["不給付死亡保險金，但退還所繳保費","完全不給付","應照保險金額理賠","僅返還保單價值準備金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L134","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":134,"page":30,"answer":2,"explanation":"B被保險人住院期間所發生，且全民健康保險規定其保險對象應自行\n負責即不屬於全民健康保險給付範圍下一定項目之住院醫療費用及\n手術費用予以給付。","stem":"有關實支實付型住院醫療費用保險之陳述何者正確？\nA具有損害填補的原則\nB只要是住院醫療相關費用皆可給付\nC對於全民 健保核付的費用不給付\nD對於保險對象自行負擔之一定項目費用給付","options":["B","ACD","ABCD","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L135","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":135,"page":30,"answer":3,"explanation":"(1)受益人故意傷害被保險人未遂時，喪失其受益權，要保人不須要\n撤銷其受益權。\n(2)要保人故意致被保險人於死者，保險人雖不負給付保險金額之\n責，但仍應將保單價值準備金返還予應得之人。","stem":"有關保險法之規定何者正確？","options":["傷害保險之受益人故意傷害被保險人未遂時，要保人得撤銷其受\n益權利","要保人故意致被保險人於死者，保險人雖不負給付保險金額之\n責，但仍應將保單價值準備金繳交國庫","人壽保險受益人故意致被保險人於死或雖未致死者，喪失其受益\n權","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L136","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":136,"page":31,"answer":4,"explanation":"傷害保險之不保事項：被保險人從事角力、摔跤、柔道、空手道、\n跆拳道、馬術、拳擊、特技表演、汽車、機車及自行車競賽或表\n演。","stem":"傷害保險的被保險人從事下列何種活動，致成死亡或傷害時，除契\n約另有約定外，保險公司不負給付保險金之責？\nA滑翔翼、B汽機車競賽或表演、C跆拳道、D馬術","options":["AB","ABCD","BC","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L137","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":137,"page":31,"answer":4,"explanation":"(4)要保人於契約有效期間內，得申請減少保險金額。","stem":"有關長期照顧保險，下列何者錯誤？","options":["被保險人身故時保險金尚有未完全給付者，以被保險人法定繼承\n人為受益人","被保險人身故時契約效力即行終止","各項保險金受益人皆為被保險人，保險人不受理指定或變更","要保人於契約有效期間不得申請減少保險金額"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L138","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":138,"page":31,"answer":3,"explanation":"因違反告知而得解除契約之權利，自保險公司知有解除原因經過一\n個月不行使而消滅。","stem":"因違反告知而得解除契約之權利，自保險公司知有解除原因經過\n「」不行使而消滅。","options":["二年","一年","一個月","二個月"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L139","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":139,"page":31,"answer":3,"explanation":"B、C 適用於自 81 年 4 月 1 日起簽訂之個人 2 年期以上人身保險\n契約。","stem":"有關契約撤銷權何者正確？\nA不論有無體檢保件之要保人均得主張行使\nB各種人身保險契約皆適用\nC不論何時簽訂之人身保險契約皆適用\nD保險公司應於簽收保單回條以明顯字體提醒保戶如何行使契約撤\n銷及效果","options":["BCD","ABCD","AD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L140","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":140,"page":31,"answer":4,"explanation":"A 保險費按照原投保年齡的標準繼續繳費。","stem":"有關保險契約復效之陳述何者正確？\nA其保險費之計算重新約定\nB可維持原保險單歷年繳費的保單價值準備金\nC較重新投保更為有利","options":["ABC","AB","AC","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L141","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":141,"page":32,"answer":2,"explanation":"依保險法第 43 條規定，保險契約應以保險單或暫保單為之。","stem":"依保險法第 43 條規定，保險契約應以「」為之。","options":["要保書","保險單或暫保單","體檢報告書","送金單"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L142","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":142,"page":32,"answer":1,"explanation":"健康險除外責任：故意行為、犯罪行為、健康檢查、懷孕、流產、\n分娩","stem":"下列何者不是健康保險給付事由？\nA被保險人故意自殺 B被保險人住院健康檢查\nC被保險人墮胎所致之死亡 D被保險人因車禍流產","options":["ABC","ABCD","AC","D"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L143","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":143,"page":32,"answer":3,"explanation":"依個人傷害保險示範條款規定，附加日額給付醫療保險金之傷害保\n險，其每次傷害給付日數不得超過 90 日。","stem":"依個人傷害保險示範條款規定，附加日額給付醫療保險金之傷害保\n險，其每次傷害給付日數不得超過","options":["180 日","60 日","90 日","30 日"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L144","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":144,"page":32,"answer":2,"explanation":"年金保險不論被保險人生存與否，保險公司保證給付金額的年金保\n險稱為保證金額年金保險。","stem":"年金保險不論被保險人生存與否，保險公司保證給付金額的年金保\n險稱為？","options":["保證期間年金保險","保證金額年金保險","遞延年金保險","即期年金保險"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L145","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":145,"page":32,"answer":1,"explanation":"風險增加：若非要保人所致，應於10日內通知保險人；若為要保人\n所致，應於知悉後立即通知保險人。","stem":"依我國保險法第 59 條規定，保險契約內所載增加危險之情形，非\n由於要保人或被保險人之行為所致者，要保人或被保險人應於知悉\n後「」內通知保險人。","options":["十日內","三十日內","五日內","二十日"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L146","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":146,"page":32,"answer":4,"explanation":"特別護士之護理費，不包含在實支實付型住院醫療費用保險的給付\n內容中。","stem":"實支實付型住院醫療費用保險之給付內容，不包含下列哪項費用？","options":["管灌飲食以外之膳食費","來往醫院之救護車費","超等住院之病房費差額","特別護士之護理費"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L147","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":147,"page":32,"answer":1,"explanation":"要保人得隨時終止契約，保險費已付足一年以上或繳費累積達有保\n單價值準備金者，保險人應於接到通知一個月內償付解約金。","stem":"保單如累積達有保單價值準備金且辦理解約時，依保險法規定保險\n公司應於接到通知後「」內償付解約金。","options":["一個月","二個月","十五天","二十天"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L148","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":148,"page":33,"answer":4,"explanation":"皆為傷害保險除外責任","stem":"下列何者非屬於傷害保險的除外責任？","options":["被保險人飲酒後駕（騎）車，其吐氣或血液所含酒精成份超過道\n路交通法令規定標準者","被保險人犯罪行為","要保人、被保險人的故意行為","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L149","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":149,"page":33,"answer":2,"explanation":"人壽保險單示範條款第十條：要保人或受益人應於知悉本公司應負保\n險責任之事故後○○日（不得少於五日）內通知保險公司。","stem":"現行人壽保險單示範條款規定，要保人或受益人應於知悉被保險人\n死亡或其他保險事故時「」通知保險公司。","options":["於十日內","依契約規定日期，不得少於五日內","三十日內","即時"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L150","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":150,"page":33,"answer":4,"explanation":"要保人破產時，保險契約仍為破產債權人之利益而存在。","stem":"要保人破產時，保險契約仍為「」之利益而存在。","options":["保險人","被保險人","要保人","破產債權人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L151","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":151,"page":33,"answer":4,"explanation":"保險法規定保險公司應於收齊所需文件後 15 日內為給付，如因可歸\n責於保險公司之事由而逾期給付者，保險公司應按年利一分加計利息\n給付。","stem":"保險法第 34 條規定保險人應付之賠償金額確定後，應於約定期限\n內給付之，無約定者應於接到通知後幾日內給付之","options":["10 日","30 日","20 日","15 日"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L152","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":152,"page":33,"answer":2,"explanation":"利率變動型年金保險甲型為固定年金金額，在年金給付開始日，保險\n公司以當時所累積之年金保單價值準備金（如有保險單借款應扣除保\n險單借款及其應負利息後），依據當時預定利率及年金生命表計算可\n以領取之年金金額。","stem":"利率變動型年金保險甲型為固定年金金額，在年金給付開始日，保\n險公司以當時所累積之年金保單價值準備金，依據當時「」及年金\n生命表計算可以領取之年金金額。","options":["十年期公債殖利率","預定利率","宣告利率","定存利率"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L153","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":153,"page":34,"answer":3,"explanation":"A 人壽保險之保險費到期未交付者，除契約另有訂定外，經催告到達\n後屆 30 日仍不交付時，保險契約之效力停止\nC 年繳或半年繳的保險費，自催告到達的隔日起算，有 OO 天（不\n得少於 30 天）的寬限期。\nD 月繳或季繳的保險費，則不另為催告，從保險單所載的交付日期的\n隔日開始，同樣享有 OO 天（不得少於 30 天）的寬限期。若在寬限\n期結束後仍未支付保險費，除非契約另有規定，否則保險契約將自動\n失效。","stem":"關於寬限期間之述敘，何者錯誤？\nA逾寬限期間仍未繳付保險費者，契約至寬限期間終了之翌日起終\n止效力\nB如在寬限期間發生保險事故，保險公司仍負給付責任\nC年繳或半年繳件，自保單所載之交付日期之翌日起 30 日為寬限期\n間\nD季繳或月繳件，至催告到達日期之翌日起 30 日為寬限期間","options":["ABCD","BCD","ACD","CD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L154","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":154,"page":34,"answer":4,"explanation":"墊繳保險費的利息，自寬限期間終了的翌日起，按當時保險公司公告\n的利率計算（不得超過本保單辦理保單借款的利率）。","stem":"有關自動墊繳保險費利息之計算何者正確？","options":["自寬限期限終了當日起算","按當時市場利率計算","自應繳日翌日起算","自寬限期間終了翌日起算"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L155","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":155,"page":34,"answer":1,"explanation":"撤銷之方式應以書面通知保險人及要保人。\n被保險人依前項規定行使其撤銷權者，視為要保人終止保險契約。","stem":"下列有關保險法第 105 條規定之敘述何者為非？","options":["被保險人得隨時依本條為撤銷並通知要保人即生效力","被保險人依本條行使撤銷權時，視為要保人終止契約","由第三人訂立之死亡保險契約須經被保險人書面同意並約定保險\n金額，否則契約無效","被保險人得隨時依本條所為之同意得隨時撤銷"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L156","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":156,"page":35,"answer":1,"explanation":"(1)保證續保在續保時，保險公司可按續保當時費率重新起算","stem":"有關住院醫療費用保險何者錯誤？","options":["如有保證續保條款時，保險人不得拒絕續保及不得依續保當時之\n費率規定重新計算保費","被保險人於契約有效期間屆滿出院，因同一疾病於出院後 14 日\n內於同一醫院再住院，保險人就再住院部分不給付保險金","保戶如前往非屬健保特約院所就醫，保險人於限額內得按實際支\n出費用不低於 65% 給付","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L157","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":157,"page":35,"answer":2,"explanation":"依「保險法第」69 條：關於未來事項之特約條款，於未屆履行期前\n危險已發生，或其履行為不可能，或在訂約地為不合法而未履行者，\n保險契約不因之而失效。","stem":"依保險法規定，關於未來事項之特約條款，於未屆履行期前危險已\n發生，或其履行為不可能，或在訂約地為不合法而未履行者，保險\n契約","options":["因之失效","不因之而失效","停止效力","自始無效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L158","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":158,"page":35,"answer":1,"explanation":"依「保險法」第 120 條第 2 項：保險人於接到要保人之借款通知\n後，得於一個月以內之期間，貸給可得質借之金額。","stem":"保險公司接到要保人申請保險單借款，應於「」貸給可借之金額。","options":["一個月內","二個月內","三個月內","半年內"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L159","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":159,"page":35,"answer":4,"explanation":"A 健康保險、傷害保險未有規定不得訴訟請求\nB 利害關係人可代要保人交付保險費\nC 保險費到期未交付適用寬限期間之規定","stem":"有關健康保險何者為是？\nA保險費不得以訴訟方式請求交付\nB利害關係人不得代要保人交付保險費\nC保險費到期未交付不適用寬限期間之規定\nD由第三人訂立之契約，未經被保險人書面同意並約定保險金額者\n契約無效","options":["AC","ACD","ABD","D"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L160","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":160,"page":36,"answer":1,"explanation":"(1)保險人應給付各該項失能保險金之和，且最高以保險金額為限","stem":"傷害保險中被保險人因同一意外事故致成失能等級表所列二項以上\n失能程度者，何者有誤？","options":["保險人應給付失能程度較嚴重者，且最高以保險金額為限","意外事故合併以前的失能可領較嚴重項目失能保險金者，按較嚴\n重項目給付","若二項失能項目皆屬同一手但失能等級不同時，給付較嚴重項目\n失能保險金","若二項失能項目屬於同一手時，僅給付依項失能保險金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L161","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":161,"page":36,"answer":4,"explanation":"傷害保險受益人申請失能保險金，保險人基於審核保險金需要得對被\n保險人身體予以檢驗，另得徵詢其他醫師之醫學專業意見另並得經受\n益人同意 調閱被保險人就醫相關資料因此所生費用由保險公司負\n擔 。","stem":"有關傷害保險受益人申請失能保險金，下列何者錯誤？","options":["保險人基於審核保險金需要得對被保險人身體予以檢驗","保險人得經受益人同意調閱被保險人就醫相關資料","保險人得自付費用另徵詢其他醫師之醫學專業意見","受益人應檢具被保險人除戶戶籍謄本"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L162","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":162,"page":36,"answer":1,"explanation":"A 人壽保險之保險費不得以訴訟方式請求交付\nC 受益人經指定後，要保人對其保險利益除聲明放棄處分權者外仍\n得以契約或遺囑處分之","stem":"下列何者為是？\nA人壽保險之保險費可以訴訟方法請求交付\nB利害關係人得代要保人交付保險費\nC受益人經指定後，要保人對其保險利益喪失處分權\nD受益人得於部分條件下將其利益轉讓他人","options":["BD","BCD","ABCD","B"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L163","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":163,"page":36,"answer":4,"explanation":"要保人或被保險人對於保險人的書面詢問應據實說明，要保人有故\n意隱匿或因過失遺漏，或為不實之說明，足以變更或減少保險人對\n於危險之估計者，保險人得解除契約;其危險發生後亦同。","stem":"要保人或被保險人對於保險人的書面詢問若有故意隱匿或因過失遺\n漏，或為不實之說明，足以變更或減少保險人對於危險之估計者，\n保險人得","options":["停止契約","終止契約","撤銷契約","解除契約"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L164","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":164,"page":37,"answer":3,"explanation":"C 與原保險金額不同\nD 已躉繳，故繳費方式不同","stem":"有關減額繳清保險之敘述，何者正確？\nA與原保險同一種類 B與原保險期間相同\nC與原保險之保險金額相同 D與原保險之繳費方式相同","options":["A","ABC","AB","ABD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L165","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":165,"page":37,"answer":2,"explanation":"如被保險人以乘客身分搭乘領有載客執照之交通工具，該交通工具\n之預定抵達時刻係在本契約的保險期間內，因故延遲抵達而非被保\n險人所能控制者，本保險單自動延長有效期限至被保險人終止乘客\n身分時為止，但延長之期限不得超過二十四小時。","stem":"旅行平安保險單示範條款有延長保險期間之規定，其要件不包括","options":["被保險人須為乘客","該交通工具因故延遲抵達為被保險人所能控制","該交通工具之預定抵達時刻在保險契約期間內","搭乘之交通工具須領有載客執照"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L166","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":166,"page":37,"answer":2,"explanation":"B 遞延年金保險在年金給付開始前如有保單借款，給付開始時應就\n當時年金保單價值準備金扣除保險單借款及其應付利息計算年金金\n額\nC 保險人為避免以不實醫療證明詐領保險金，得經受益人同意調閱\n被保險人就醫資料。","stem":"以下何者正確？\nA含保證給付的年金保險，受益人得申請貼現提前給付\nB遞延年金保險在年金給付開始前如有保單借款，給付開始時應就\n當時年金保單價值準備金扣除保單借款本金計算年金金額\nC保險人為避免以不實醫療證明詐領保險金，得經要保人同意調閱\n被保險人就醫資料\nD住院醫療費用保險期間以一年為原則","options":["ABCD","AD","BCD","ABC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L167","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":167,"page":37,"answer":4,"explanation":"保險公司應負責任的開始應自同意承保且收取全部保險費後負保險\n責任。\n如題目改遞延年金，應自同意承保且收取第一期保險費後負保險責\n任。","stem":"保險公司對即期年金應負的保險責任由何時開始","options":["要保人交付保費","保險人同意承保","保險人同意承保且送達保單","保險人同意承保且要保人繳付全部保險費"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L168","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":168,"page":38,"answer":3,"explanation":"以被保險人終身為期，不附生存條件之死亡保險契約，如保險費已\n付足二年以上而有不交付時，保險人僅得減少保險金額。","stem":"以被保險人終身為期，不附生存條件之死亡保險契約，如保險費已\n付足二年以上而有不交付時，保險人","options":["得以被保險人指定的方式處理","得解除契約","僅得減少保險金額","得終止契約"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L169","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":169,"page":38,"answer":4,"explanation":"要保人中途請求終止契約，如果交付的保險費累積達有保單價值準\n備金，保險人應於接到通知一個月內償付解約金，其金額不得少於\n要保人應得保單價值準備金 3/4。","stem":"要保人中途請求終止契約，如果交付的保險費累積達有保單價值準\n備金，可以領回","options":["已繳全部保險費加計利息","已積存責任準備金之金額","由保險公司決定可領之金額","解約金表所列解約金額"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L170","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":170,"page":38,"answer":3,"explanation":"(3)停效後超過 6 個月之復效，保險公司得於申請復效之日 5 日內要\n求要保人提供被保險人可保證明。","stem":"有關復效規定之敘述何者為非？","options":["停效後超過 6 個月之復效，如被保險人之危險程度有重大變更之\n情形者，保險人得拒絕其復效","約定復效之期限，自停止效力之日起不得低於2年","停效後超過 6 個月之復效，要保人填寫復效申請並繳清欠繳保險\n費、約定之利息及其他費用後，於翌日上午零時恢復其效力","停效後 6 個月內之復效於要保人繳清欠繳保險費、約定之利息及\n其他費用後，翌日上午零時恢復其效力"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L171","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":171,"page":38,"answer":2,"explanation":"傷害保險契約生效日原則上自保險單上所載的日時開始生效。","stem":"傷害保險契約生效日","options":["一律自保單所載始日零時起生效","原則上自保險單上所載的日時開始生效","不得由契約當事人約定生效時間","原則上自保險單所載始日午夜十二時起生效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L172","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":172,"page":39,"answer":4,"explanation":"如果第二期以後保險費的繳付是以金融機構轉帳，或是指定地點交\n付或保險公司派員前往收取以外的繳費方式，不管繳別為何均應催\n告。","stem":"依人壽保險單示範條款規定，約定以金融機構轉帳繳納保險費者，\n何種繳別須經催告程序以計算寬限期間","options":["月繳","季繳","年繳","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L173","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":173,"page":39,"answer":2,"explanation":"受益人變更聲請方式：書面通知保險人","stem":"受益人變更，保險公司應","options":["實地調查變更情形","僅就書面審核即可","除書面審核外，亦需實地調查","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L174","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":174,"page":39,"answer":4,"explanation":"保險費的繳納方式有：向保險公司所在地或指定地點交付、保險公\n司派員收取及約定以金融機構轉帳。","stem":"保險費的繳納方式有 A向保險公司所在地或指定地點交付\nB保險公司派員收取 C約定以金融機構轉帳 D保險業務員墊繳","options":["BCD","BD","AB","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L175","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":175,"page":39,"answer":4,"explanation":"(4)訂立契約時要保人或被保險人對於保險人之書面詢問應據實說\n明，要保人故意隱匿，或因過失，遺漏或為不實之說明，足以變更\n或減少保險人對危險之估計者，保險人得解除契約;其危險發生後亦\n同。","stem":"下列何者不是保險人依保險法第 64 條解除契約之要件","options":["要保人隱匿或遺漏不為說明，或為不實之說明","須足以變更或減少保險人對於危險之估計","要保人之不實告知，須在契約訂立時","要保人之不實告知，須在保險事故發生時"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L176","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":176,"page":39,"answer":1,"explanation":"如於保險事故後始發覺短繳保險費者，保險公司得按原繳保費與應\n繳保險費之比例減少保險金額，而不得請求補足差額。","stem":"發生保險事故以後發覺被保險人投保年齡不實而致短繳保險費，且\n其錯誤非可歸責於保險公司者，受益人可得之金額為","options":["要保人不得要求補繳短繳保險費，僅按原繳保險費比例減少保險\n金額","原保險金額減掉應補繳之保費","已繳保費加計利息退還要保人","保險人無息退還所有已繳保費"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L177","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":177,"page":40,"answer":3,"explanation":"(3)四肢機能永久完全喪失，不須經過 3 個月後其機能仍完全喪失\n者。","stem":"有關完全失能等級之敘述，何者有誤?","options":["永久喪失咀嚼機能係指因器質障害，除流質食物外不能攝取者","失明係指視力永久在萬國式視力表 0.02 以下","四肢機能永久完全喪失係指經 3 個月以後，其機能仍完全喪失者","喪失言語機能係指構成語言之四種語音機能，有三種以上不能構\n音"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L178","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":178,"page":40,"answer":3,"explanation":"雇主為員工投保團體人壽保險的好處是降低員工流動率、增進員工\n福利。","stem":"雇主為員工投保團體人壽保險的好處是","options":["可因此不必投保勞工保險","與壽險業建立良好關係，方便資金融通","降低員工流動率","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L179","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":179,"page":40,"answer":4,"explanation":"壽保險契約約定有自動墊繳者，應以當時的保單價值準備金自動墊\n繳其應繳的保險費及利息。","stem":"依據人壽保險單示範條款之規定，人壽保險契約約定有自動墊繳\n者，應以當時的","options":["保險金","保單責任準備金","投保金額","保單價值準備金自動墊繳其應繳的保險費及利息"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L180","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":180,"page":40,"answer":2,"explanation":"A 傷害保險之保險費得以訴訟請求交付\nB 利害關係人得代要保人交付保險費\nC 傷害保險之保險費到期未交付適用寬限期間之規定","stem":"下列何者為是？\nA傷害保險之保險費不得以訴訟請求交付\nB利害關係人不得代要保人交付保險費\nC傷害保險之保險費到期未交付不適用寬限期間之規定\nD由第三人訂立之傷害保險契約，未經被保險人書面同意並約保險\n金額者契約無效","options":["ABCD","D","AD","AC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L181","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":181,"page":40,"answer":3,"explanation":"要保人故意致被保險人於死者，保險人不負給付保險金之責。\n但保險費付足二年以上者，保險公司應將其保單價值準備金返還予\n應得之人。","stem":"要保人故意致被保險人於死者，保險人","options":["無須給付保險金，但應退還所繳保險費","須給付保險金","無須給付保險金，但應退還保單價值準備金予應得之人或解交國\n庫","無須給付保險金，退還保單加值準備金及所繳保險費"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L182","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":182,"page":41,"answer":2,"explanation":"被保險人因疾病或傷害致成失能時，保險人應給付保險金。","stem":"被保險人投保健康保險後，因疾病致成失能時，保險人","options":["退還所繳保險費","應給付保險金","酌給慰問金","不給付保險金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L183","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":183,"page":41,"answer":2,"explanation":"保險契約構成不包括廣告文宣。","stem":"下列何者為保險契約構成部份？\nA附著之要保書、B批註書、C廣告文宣、D保單條款","options":["ABCD","ABD","AD","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L184","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":184,"page":41,"answer":4,"explanation":"由第三人訂立之年金保險契約，未經被保險人書面承諾，並約定保\n險金額，其保險契約有效。","stem":"由第三人訂立之年金保險契約，未經被保險人書面承諾，並約定保\n險金額，其保險契約","options":["效力未定","無效","得撤銷","有效"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L185","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":185,"page":41,"answer":2,"explanation":"年金保險以被保險人生存為給付條件，因此不涉及道德風險。\n根據保險法規定，人壽保險與年金保險的保險費不得透過訴訟進行\n請求。","stem":"年金保險契約下列何者為是？\nA得由本人或第三人訂立之\nB未經保險人書面承認並約定保險金額契約無效\nC利害關係人均得代要保人交付保險費\nD保險人對於保險費得以訴訟請求交付","options":["BC","AC","ABCD","ABC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L186","subject":"保險法規","chapter":"第二章 人身保險契約條款","number":186,"page":41,"answer":2,"explanation":"壽保險費除於簽訂保險契約時尚未確定者外，無論其交付方式為何\n應於契約生效前交付。","stem":"人壽保險費除於簽訂保險契約時尚未確定者外，無論其交付方式為\n何應於何時交付？","options":["契約生效後","契約生效前","契約生效時","發生保險事故前"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L187","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":187,"page":42,"answer":3,"explanation":"下列情形之保費，不能以列舉方式扣除：\n(1)非直系親屬間如兄弟姐妹互為繳納保險費者\n(2)子女已成年並自行報稅者之父母代繳保險費\n(3)因個人綜合所得稅以「戶」為申報單位，而要保人與被保險人非\n同一戶申報戶內者\n(4)未經核准在台銷售之境外保單\n(5)汽車保險、火災保險、責任保險等非屬人身保險之保費","stem":"哪些情況繳納保險費，於繳納綜合所得稅時不得扣除？\nA父母申報代繳成年子女壽險保費，且子女已自行報稅\nB車險及火險的保費\nC申報代繳兄弟姊妹的壽險保費\nD為受其扶養之直系血親尊親屬繳納之壽險保費","options":["ABCD","BC","ABC","AD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L188","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":188,"page":42,"answer":3,"explanation":"被保險人早於受益人身故，故此筆保險金應領之人為受益人，受益人\n身故後，成為受益人之遺產","stem":"死亡保險契約，要保人所指定之受益人如在被保險人死亡後才身\n故，且保險公司尚未給付保險金時，則保險金應作為","options":["歸屬國庫","被保險人之遺產","受益人之遺產","要保人之遺產"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L189","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":189,"page":42,"answer":3,"explanation":"男子入贅仍保有其對父母之繼承權","stem":"我國民法對於第一順位繼承人之見解，下列敘述何者錯誤？","options":["母與父離婚，子女仍對 其父母有繼承權","父死母再嫁者，子女仍對其母有繼承權","男子入贅於妻家，將喪失其對父母之繼承權","繼父母與繼子女之間，不得相互繼承"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L190","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":190,"page":42,"answer":4,"explanation":"依遺產及贈與稅法第 17 條規定，子女扣除額是 40 萬（已滿 18 歲成\n年）、父母扣除額 100 萬，所以 40 + 100 = 140 萬","stem":"依遺產及贈與稅法第 17 條規定，被繼承人僅遺有成年子女 1 名及\n母親，扣除額合計為「」萬元","options":["223","173","180","140"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L191","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":191,"page":42,"answer":1,"explanation":"遺產及贈與稅法第 17 條規定，配偶扣除額為 400 萬元\n（遺產及贈與稅法第 12-1 條配偶扣除額為 553 萬元）","stem":"依遺產及贈與稅法第 17 條規定，配偶之扣除額為「」萬元。","options":["400","500","350","493"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L192","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":192,"page":42,"answer":1,"explanation":"遺產及贈與稅法第 17 條規定，祖父母扣除額為 40 萬元\n（遺產及贈與稅法第 12-1 條祖父母扣除額為 56 萬）","stem":"依遺產及贈與稅法第 17 條規定，祖父母之扣除額為「」萬元","options":["40","45","100","50"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L193","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":193,"page":42,"answer":4,"explanation":"遺贈稅法第 17 條規定，成年子女之扣除額為 40 萬元\n（遺產及贈與稅法第 12-1 條成年子女之扣除額為 56 萬）","stem":"依遺產及贈與稅法第 17 條規定，成年子女之扣除額為「」萬元","options":["100","120","50","40"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L194","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":194,"page":43,"answer":4,"explanation":"贈與總額 - 免稅額 - 扣除額 = 課稅贈與淨額\n1.夫妻間的贈與不計入贈與總額\n2.父母贈與子女婚嫁財物不超過 100 萬元也不計入\n因此，只有贈與兒子的房屋 2000 萬元計入課稅贈與總額","stem":"老王去年度共有三次贈與，贈與其子 1 棟房屋 2000 萬元，贈與其\n妻轎車 200 萬元，贈與其女出嫁禮金 80 萬元，則老王今年度課稅\n贈與總額「」萬元。","options":["2280","2080","2200","2000"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L195","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":195,"page":43,"answer":1,"explanation":"以上皆可","stem":"關於遺產稅款之繳納方式有 A現金繳納 B實物抵繳 C分期繳納 D\n部分現金繳納，部分實物一次抵繳","options":["ABCD","AC","BCD","ABD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L196","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":196,"page":43,"answer":3,"explanation":"A 向產險公司投保之意外傷害險、健康險，該保費可扣除\nC 團體壽險之保費，每人每月保費 2 千元以內免視為被保險人薪資\n所得。","stem":"何者正確？\nA凡向產險公司投保之保費皆不得列舉扣除\nB現行長期照顧特別扣除額為每人每年 12 萬元\nC團體投資型保險每人每月保費 2 千元 以內免視為被保險人薪資所\n得\nD團體保單經驗分紅退費之給付免納所得稅","options":["ABCD","AD","BD","BCD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L197","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":197,"page":43,"answer":3,"explanation":"C 醫療費用支出曾受保險給付，不得再以醫療費扣除額申報\nD 死亡保險金指定法定繼承人，各該繼承人領取保險金無須繳納遺\n產稅","stem":"下列何者正確？\nA滿期保險給付所含之利益所得，受益人享有免納利息所得之稅法\n優惠\nB勞工退休請領勞退帳戶退休金時，屬退職所得須計入個人綜所稅\n總額\nC醫療費用支出曾受保險給付，得再以醫療費扣除額申報\nD死亡保險金指定法定繼承人，各該繼承人領取保險金後須繳納遺\n產稅","options":["ABC","ABD","AB","BD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L198","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":198,"page":44,"answer":4,"explanation":"(4)屬單獨行為，只要程序完整，無須法院同意","stem":"有關拋棄繼承何者錯誤？","options":["繼承人中一人拋棄，其應繼分歸屬於其他繼承人","拋棄繼承無須開具遺產清冊但需書面呈報法院","遺屬在知悉得繼承之時起 3 個月內表示，且不得申請延長","屬單獨行為需經法院同意始生效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L199","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":199,"page":44,"answer":3,"explanation":"如乙未向法院表示拋棄繼承，則乙僅就繼承之保險金償還債務即可。","stem":"甲生前投保 20 萬元之死亡保險未指定受益人，但另有債務25萬\n元，假設甲死後除了保險金外沒有其他財產，而僅有一子乙，又乙\n未向法院表示拋棄繼承，則乙","options":["繼承保險金但無須償還任何債務","以保險金償還債務後仍餘債務 5 萬元須償還","僅就繼承之保險金償還債務即可","不繼承保險金亦無須繼承債務"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L200","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":200,"page":44,"answer":3,"explanation":"(3)配偶與子和女共同繼承時，應繼分按人數平均分配。","stem":"下列的敘述何者有誤？","options":["納稅義務人為自己投保之人身保險費可採列舉扣除額方式申報自\n綜合所得總額中扣除","配偶與子和女共同繼承時，配偶特留分為應繼分之 1/2","配偶與子和女共同繼承時，配偶應繼分為遺產總額之 1/2","死亡保險未指定身故受益人時，該死亡保險金作為被保險人遺產"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L201","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":201,"page":44,"answer":3,"explanation":"人身保險、勞工保險、軍公教保險之保險給付及壽險滿期保險金在\n一定條件下免納所得稅。","stem":"下列敘述何者錯誤？","options":["凡屬人身保險之保險給付，在一定條件下不論其項目名稱均得依\n法免納所得稅","軍公教保險之保險給付免納所得稅","人壽保險之解約金屬人身保險之保險給付範圍","壽險滿期保險金在一定條件下得享有免稅優惠"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L202","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":202,"page":45,"answer":3,"explanation":"企業投保團體壽險主要目的：為謀員工的福利、為員工退休或退職\n提存準備金、為防意外災變影響員工生活並減輕雇主的責任、減免\n營利事業所得稅。","stem":"A謀求員工福利 B為員工退休或退職提存準備金 C減輕雇主責任\nD減免營利事業所得稅，上述何者是企業投保團體人壽保險之主要\n目的？","options":["ABC","ACD","ABCD","BCD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L203","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":203,"page":45,"answer":1,"explanation":"失蹤宣告：\n一般失蹤滿 7 年\n80 歲以上失蹤人滿 3 年\n特別災難事故滿 1 年","stem":"依民法第八條對失蹤人為死亡宣告之期限，何者正確？\nA如遇特別災難於災難終了滿三年後 B一般失蹤滿七年後\nC失蹤人為八十歲以上於失蹤滿一年後\nD得由利害關係人向檢察官聲請宣告","options":["B","BD","ABCD","ABC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L204","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":204,"page":45,"answer":3,"explanation":"應繼分：配偶 1/2，兄弟姊妹 1/2。","stem":"死亡保險金 300 萬未指定身故受益人，如被保險人僅有配偶和兄弟\n姊妹，該保險金應如何分配？","options":["配偶 200 萬、兄弟姊妹 100 萬","配偶 100 萬、兄弟姊妹 200 萬","配偶 150 萬、兄弟 姊妹 150 萬","按人數平均分配"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L205","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":205,"page":45,"answer":2,"explanation":"祖父母扣除額每人 56 萬。（113 年更新）","stem":"依現行遺產及贈與稅法規定，祖父母之扣除額為「」元。","options":["100 萬","56 萬","111 萬","445 萬"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L206","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":206,"page":45,"answer":2,"explanation":"依現行遺產稅及贈與稅法規定，直系血親卑親屬每人扣除額為 56\n萬。（113 年更新）","stem":"依現行遺產稅及贈與稅法規定，直系血親卑親屬每人扣除額為？","options":["45 萬","56 萬","55 萬","40 萬。"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L207","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":207,"page":45,"answer":2,"explanation":"依遺產及贈與稅法第 12-1 條規定，被繼承人遺有父母者，父母每人\n可扣除額為 138 萬。（113 年更新）","stem":"依遺產及贈與稅法第 12-1 條規定，被繼承人遺有父母者，父母每\n人可扣除額為「」。","options":["100 萬","138 萬","445 萬","400 萬"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L208","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":208,"page":45,"answer":4,"explanation":"贈與稅納稅義務人，每年得自贈與總額中減除免稅額 244 萬元。\n（113 年更新）","stem":"依現行遺產及贈與稅法規定，贈與稅之免稅額為","options":["200 萬","250 萬","123 萬","244 萬元"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L209","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":209,"page":46,"answer":4,"explanation":"依遺產及贈與稅法第 12-1 條規定，現行被繼承人之喪葬費用扣除額\n為 138 萬。（113 年更新）","stem":"依遺產及贈與稅法第 12-1 條規定，現行被繼承人之喪葬費用扣除\n額為「」元。","options":["100 萬","50 萬","40 萬","138 萬"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L210","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":210,"page":46,"answer":4,"explanation":"應繼分：各繼承人對於遺產上之一切權利義務所得繼承之比例。","stem":"「」乃法定繼承人對遺產依法得繼承之數額。","options":["特留分","持分","法定繼承額","應繼分"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L211","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":211,"page":46,"answer":3,"explanation":"成年長子的保費 2 萬 5 千元，由於需自行申報，這部分不計入。\n某甲和配偶的保費各為 2 萬 4 千元，合計 4 萬 8 千元。\n未成年次子的保費 1 萬 2 千元，可以計入。\n因此，總扣除額為 6 萬元整。","stem":"某甲一家投保人壽保險，全年所繳保費：某甲及其配偶分別各為二\n萬四千元、成年長子二萬五千元、未成年次子一萬二千元，某甲於\n申報綜合所得稅時採用列舉扣除法，則一年可扣除的保險費為？","options":["八萬五千元","八萬四千元","六萬元","六萬一千元"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L212","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":212,"page":46,"answer":1,"explanation":"遺產稅或贈與稅應納稅額在三十萬元以上，納稅義務人確有困難，\n不能一次繳納現金時，得於納稅期限內，向該管稽徵機關申請分十\n八期以內繳納，每次間隔以不超過 2 個月為限","stem":"遺產稅或贈與稅應納稅額在三十萬元以上，納稅義務人確有困難，\n不能一次繳納現金時，得於納稅期限內，向該管稽徵機關申請，分\n「」以內繳納。","options":["十八期","六期","三十六期","二十四期"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L213","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":213,"page":46,"answer":3,"explanation":"被保險人之法定繼承人可以拋棄繼承被保險人之債務，但應於知悉\n其得繼承之時起三個月內以書面向法院表示。","stem":"被保險人之法定繼承人可以拋棄繼承被保險人之債務，但應於知悉\n其得繼承之時起「」內以書面向法院表示。","options":["二個月","一個月","三個月","六個月"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L214","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":214,"page":46,"answer":2,"explanation":"D 父母於子女婚嫁贈與財務，免稅額 100 萬","stem":"以下何者得不計入贈與總額？\nA捐贈公有事業機構之財產\nB扶養義務人為受扶養人支付之生活費\nC配偶相互贈與之財產\nD父母於子女婚嫁時所贈與之財物，總金額不超過 200 萬元","options":["ACD","ABC","ABCD","AC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L215","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":215,"page":46,"answer":4,"explanation":"當所有第一順位繼承人全部拋棄繼承，由其直系親卑親屬隔代繼\n承。","stem":"依民法規定第一順位繼承人全部拋棄繼承，由其次親等人辦理繼承\n者，稱為","options":["代位繼承","概括繼承","共同繼承","隔代繼承"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L216","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":216,"page":47,"answer":3,"explanation":"贈與納稅義務人應於行為發生後 30 天內，向贈與人戶籍所在地之\n稅捐機關申報。","stem":"贈與人在一年內贈與他人之財產總值超過贈與稅免稅額時，應於超\n過免稅額之贈與行為發生後「」，向贈與人戶籍所在地之稅捐機關\n申報。","options":["二個月內","十日內","三十日內","二十日內"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L217","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":217,"page":47,"answer":3,"explanation":"繼承權利由當然繼承人（配偶）加上順位繼承人繼承，人數為其身\n故時之當然繼承人及順位繼承人數量分，此題有配偶 1 人以及 2 子\n1 女，共 4 人。","stem":"李君以自己為被保險人，身故受益人欄位僅寫配偶及子女，投保當\n時育有一子，投保後再生育一子一女，李君死亡時，其妻、子、女\n皆生存，共有幾人可享有保險金受領權？","options":["2 人","3 人","4 人","5 人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L218","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":218,"page":47,"answer":2,"explanation":"(2)死亡事實或贈與行為發生前 2 年內，被繼承人或贈與人自願喪失\n中華民國國籍，需課徵遺產稅或贈與稅。","stem":"下列敘述何者錯誤？","options":["經常居住國外之非中華民國國民，其在國內之贈與應課贈與稅","死亡事實或贈與行為發生前 2 年內，被繼承人或贈與人自願喪失\n中華民國國籍，免課徵遺產稅或贈與稅","經常居住國外之中華民國國民，其在國內之贈與應課贈與稅","經常居住國內之中華民國國民，對於其在中華民國境外財產之贈\n與應課贈與稅"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L219","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":219,"page":47,"answer":2,"explanation":"遺囑處分：若有遺囑，應依遺囑分配，但需考慮是否侵害法定繼承\n人的特留分。\n應繼分為 1000 萬元 ÷ 2 = 500 萬元，特留分為應繼分的一半，即\n500 萬元 ÷ 2 = 250 萬元。因此，父親可領 125 萬元。","stem":"某甲身故後留有死亡保險金 1000 萬元，因未指定身故受益人，若\n某甲沒有其他遺產，但立有遺囑將保險金全部歸配偶所有，在僅有\n配偶和父母之情形下，則該保險金，某甲父親可領到「」元。","options":["333 萬","125 萬","250 萬","500 萬"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L220","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":220,"page":47,"answer":4,"explanation":"(1)贈與人逾繳納期限尚未繳納，且在中華民國境內無財產可供執\n行，以受贈人為納稅義務人\n(2)贈與人行蹤不明者，以受贈人為納稅義務人\n(3)贈與稅未繳清前不得先行分割遺產或辦理移轉登記","stem":"有關贈與稅敘述何者正確？","options":["贈與人逾繳納期限尚未繳納，且在中華民國境內有財產可供執\n行，以受贈人為納稅義務人","贈與人行蹤不明者，仍應以贈與人為納稅義務人","贈與稅未繳清前得先行分割遺產或辦理移轉登記","贈與人死亡時贈與稅尚未核課者，以受贈人為納稅義務人"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L221","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":221,"page":48,"answer":2,"explanation":"每人每年扣除數額以不超過新台幣 24,000 元為限。\n但全民健康保險之保險費不受金額限制。\n20,000 + 24,000 + 24,000 + 12,000 = 80,000","stem":"共同居住之家人投保人壽保險，全年所繳保費：阿公二萬元、父母\n共二萬四千元、未成年長子二萬五千元、未成年次子一萬二千元\n若全家合併申報綜合所得稅且採用列舉扣除法，則一年可扣除的保\n險費為","options":["十一萬七千元","八萬元","十二萬元","十萬四千元"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L222","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":222,"page":48,"answer":3,"explanation":"由多位受益人共同領取保險金，其受領之順序及比例詳載於保險\n單，否則未經確定者，應依民法第 271 條之規定由各受益人平均分\n受其權利。","stem":"保險金受領人為數人時，其受益之分配應詳載於保險單，如其數額\n尚未確定者應","options":["墊交保費之受益人可獨得","由受益人間彼此協商","平均分受其權利","依應繼分比例分配"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L223","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":223,"page":48,"answer":4,"explanation":"依據所得稅法第 14 條規定，員工依勞工退休條例自願提繳之退休\n金，合計在每月工資 6% 範圍內，不計入提繳年度薪資所得課稅。","stem":"依據所得稅法第 14 條規定，員工依勞工退休條例自願提繳之退休\n金，合計在每月工資「」範圍內，不計入提繳年度薪資所得課稅。","options":["8%","5%","10%","6%"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L224","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":224,"page":48,"answer":2,"explanation":"法定繼承人的優先順序為當然繼承人（配偶）→第一順位（直系血\n親卑親屬）→ 第二順位（父母）→第三順位（兄弟姊妹）→第四順\n位（祖父母）","stem":"依據民法繼承編之規定，A父母、B子女、C兄弟姊妹、D祖父母，\n在繼承開始時之繼承順序為何？","options":["BADC","BACD","ABCD","BCAD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L225","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":225,"page":48,"answer":3,"explanation":"民法第 11 條規定，同時遇難，無法證明先後，推定為同時死亡。","stem":"二人以上同時遇難，不能證明死亡之先後時，","options":["視為同時死亡","推定年紀大者先死","推定同時死亡","由法院裁定"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L226","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":226,"page":48,"answer":4,"explanation":"(1)繼父母與繼子女間之間是直系姻親而非血親，故其相互間無繼承\n問題\n(2)父死母再嫁者，子女仍對其親生父母有繼承權\n(3)男子入贅妻家後對原父母之繼承權不受影響。","stem":"有關繼承的敘述何者正確？","options":["繼父母與繼子女間為直系血親相互有繼承權","父死母再嫁者，子女對其母喪失繼承權","男子入贅妻家後喪失對父母之繼承權","非婚生子女經準正後對其生父有繼承權"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L227","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":227,"page":49,"answer":1,"explanation":"拋棄繼承為繼承人之單獨行為，只要程序完整，無須法院同意。","stem":"繼承人拋棄繼承時，下列敘述何者錯誤？","options":["須經法院同意","須以書面呈報法院","書面通知因其拋棄而應為繼承之人","不繼承財產，亦不用負擔任何債務"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L228","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":228,"page":49,"answer":1,"explanation":"稅款得申請延長兩個月繳清稅款，超過 30 萬以上得分 18 期，以不\n超過 2 個月為限","stem":"遺產稅及贈與稅納稅義務人，應於稽徵機關送達核定納稅通知書之\n日起「」內，繳清應納稅款。","options":["二個月","一個月","半年","三個月"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L229","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":229,"page":49,"answer":2,"explanation":"B、D 勞退退休金屬退職所得，計入個人綜合總額所得，故要課稅。\n勞保老年給付：屬人身保險給付全額免稅","stem":"有關勞工自願提撥薪資一定百分比至個人勞退帳戶，何者正確？\nA提撥年度個人所得總額減少有減稅效果\nB退休後請領該帳戶退休金屬退職所得，不計入個人綜合所得總額\nC退休後請領該帳戶退休金，應計入個人綜合所得總額\nD該退休金屬人身保險給付，依所得稅法規定全額免稅","options":["BD","AC","ABD","AD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L230","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":230,"page":49,"answer":3,"explanation":"有指定受益人＋拋棄繼承：領保險金且無須繼承負債\n無指定受益人＋拋棄繼承：不領保險金且無須繼承負債","stem":"老王投保 20 萬元之死亡保險，受益人為小明，但另有債務25萬\n元，假設老王除了保險金外沒有其他財產，而老王只有一子小明，\n小明向法院表示拋棄繼承，則小明","options":["須償還債務 5 萬元","須償還債務 25 萬","僅領取 20 萬元保險金","不繼承保險金亦無須償還任何債務"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L231","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":231,"page":49,"answer":3,"explanation":"依現行規定遺產及贈與稅法規定，遺產稅稅率最高課稅級距為 20%","stem":"依現行規定遺產及贈與稅法規定，遺產稅稅率最高課稅級距為？","options":["10%","15%","20%","30%"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L232","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":232,"page":49,"answer":2,"explanation":"依遺產及贈與稅法規定，遺產總額包括被繼承人死亡前 2 年內贈與\n配偶及直系血親卑親屬、父母、兄弟姊妹、祖父母等法定繼承人及\n上述法定繼承人配偶的財產。","stem":"依遺產及贈與稅法規定，遺產總額包括被繼承人死亡前「」內贈與\n配偶及子女、父母、兄弟姊妹、祖父母等法定繼承人及上述法定繼\n承人配偶的財產。","options":["五年","二年","六年","一年"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L233","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":233,"page":50,"answer":2,"explanation":"應繼分：1000 萬元 ÷ 2 = 500 萬元（每人應繼分）\n特留分：應繼分的一半，即 500 萬元 ÷ 2 = 250 萬元（每人特留\n分）\n由於 60% 的遺產捐贈侵犯了特留分，乙和丙可以主張各自的特留\n分。因此，乙最終可繼承 250 萬元。","stem":"甲僅遺有子女乙與丙，甲死後遺留財產 1000 萬元，甲於遺囑中表\n示將其遺產 60% 全數捐給慈善機構，僅留 40% 由乙、丙平均分\n配，則依民法規定乙可繼承多少金額？","options":["400 萬元","250 萬元","200 萬元","500 萬元"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L234","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":234,"page":50,"answer":3,"explanation":"繼承人中一人拋棄繼承，其應繼分歸屬於其他繼承人。","stem":"繼承人中一人拋棄繼承，其應繼分歸屬於","options":["國庫","次順位繼承人","其他繼承人","被繼承人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L235","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":235,"page":50,"answer":3,"explanation":"若保險金在死亡保險中未指定身故受益人之受領順序及比例時，又被\n保險人僅列有子女和配偶，則該保險金按人數平均分配","stem":"若保險金在死亡保險中未指定身故受益人之受領順序及比例時，又\n被保險人僅列有子女和配偶，則該保險金應如何分配？","options":["配偶、子女各二分之一","配偶三分之二、子女三分之一","按人數平均分配","配偶獨領"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L236","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":236,"page":50,"answer":1,"explanation":"被保險人立有遺囑時，依照被保險人的遺囑分配，但必須考慮被保險\n人的遺囑內容是否有侵害到法定繼承人的特留分。","stem":"遺囑人於不違反關於「」規定之範圍內，得以遺囑自由處分遺產。","options":["特留分","應繼分","保留分","遺贈分"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L237","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":237,"page":50,"answer":4,"explanation":"B 有保單價值準備金且超過贈與免稅額，甲須申報贈與稅（贈與人為\n納稅義務人）\nD 丙同時為受益人者，不須將保險給付列入當年度基本所得額（非同\n一人才需要列入當年度所得）","stem":"訂立要保人甲與被保險人乙為不同人之人壽保險，若變更要保人為\n丙，何者正確？\nA有保單價值準備金且超過贈與免稅額，甲須申報贈與稅\nB有保單價值準備金且超過贈與免稅額，丙須申報贈與稅\nC丙非同時為受益人者，則受益人須將保險給付列入當年度基本所\n得額\nD丙同時為受益人者，須將保險給付列入當年度基本所得額","options":["BC","ACD","BD","AC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L238","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":238,"page":50,"answer":4,"explanation":"自 2023 年 1 月 1 日起，民法將 18 歲定為完全行為能力人，因此，\n扣除額為：19 歲子女 40 萬元 + 母親 100 萬元 = 140 萬元\n（113 年更新）","stem":"依遺產及贈與稅法第 17 條規定，被繼承人僅遺有 19 歲子女 1 名及\n母親，扣除額合計為「」萬元。","options":["223","173","180","140"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L239","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":239,"page":51,"answer":4,"explanation":"依遺贈稅法第 16 條第 9 款規定，約定於被繼承人死亡時，給付其所\n指定受益人之人壽保險金額，軍公教人員、勞工或農民保險之保險金\n額及互助金，皆不計入遺產總額。","stem":"按遺產及贈與稅法規定，約定被繼承人死亡時給付其所指定受益人\n之 A人壽保險之死亡保險金 B勞工保險之死亡保險金\nC軍公教保險之死亡保險金 D撫恤金\n以上何者不計入遺產總額？","options":["ABCD","BD","D","ABC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L240","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":240,"page":51,"answer":3,"explanation":"A 就個人綜合所得淨額計徵之\nC 非中華民國境內居住之個人，而有中華民國來源所得者，其應納稅\n額，分別就源扣繳。","stem":"有關個人綜合所得稅之課徵何者正確？\nA就個人綜合所得總額計徵之\nB有中華民國來源所得之個人，應就其中華民國來源之所得，課徵\n綜合所得稅\nC非中華民國境內居住之個人一律免納所得稅","options":["ABC","AB","B","BC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L241","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":241,"page":51,"answer":1,"explanation":"總贈與財產為 600 萬 * 2 = 1200 萬\n贈與淨額為 1200 萬 - 244 萬（免稅額） = 956 萬","stem":"甲父於去年 1 月及 8 月分別贈與其子共兩棟房子，各值新台幣 600\n萬元，甲父應計稅的贈與稅淨額為？","options":["956 萬","1000 萬","760 萬","780 萬元"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L242","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":242,"page":51,"answer":1,"explanation":"由營利事業負擔之團體壽險保險費，每人每月保險費在新臺幣 2 千\n元以內部份，免視為被保險人之薪資所得。\n2,000 + 2,000 + 2,000 = 6,000元","stem":"某公司三位員工投保團體人壽保險，其中甲員工每月之保險費為五\n千元，乙員工為三千元，丙員工為二千元，則試問該公司在新臺幣\n多少元以內部分，可以免視為員工之薪資所得？","options":["六千元","三千元","四千元","五千元"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L243","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":243,"page":51,"answer":3,"explanation":"(1)拋棄繼承為求程序完整，得以書面向法院申請，不得申請延展期間\n(2)拋棄繼承後，不繼承財產亦不用負擔債務\n(4)當繼承人其中一人拋棄繼承，其應繼份歸屬於其他繼承人","stem":"下列何者正確？","options":["拋棄繼承為求程序完整，得以書面向法院向法院申請延展期間","拋棄繼承後，不繼承財產但負擔債務","拋棄繼承後，應以書面通知因其拋棄而應為繼承之人","當繼承人不只一人，拋棄繼承須共同為之"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L244","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":244,"page":52,"answer":1,"explanation":"遺產稅或贈與稅應納稅額在 30 萬元以上，納稅義務人確有困難，不\n能一次繳納現金時，得於納稅期限內，向該管稽徵機關申請，分十八\n期以內繳納，每期間隔以不超過二個月為限。","stem":"遺產稅或贈與稅應納稅額在三十萬元以上，納稅義務人確有困難，\n不能一次繳納現金時，得於前項規定納稅期限內，向主管稽徵機關\n申請，分十八期以內繳納，每期間隔以不超過「」為限。","options":["二個月","一個月","半年","三個月"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L245","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":245,"page":52,"answer":4,"explanation":"依所得稅法規定，納稅義務人本人、配偶或受扶養直系親屬的人身保\n險費，得從個人所得總額中採列舉申報方式扣除，但每人每年扣除數\n額以不超過新台幣兩萬四千元為限。","stem":"某甲為自己及其父投保人壽保險，年繳保費各為二萬四千元及一萬\n五千元，但其父未受其扶養，則甲在申報綜合所得稅時如採用列舉\n扣除法時","options":["不得申報扣除","得扣除一萬五千元","得扣除一萬二千元","得扣除二萬四千元"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L246","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":246,"page":52,"answer":3,"explanation":"胎兒為繼承人時，非保留其應繼分，他繼承人不得分割遺產。","stem":"胎兒為繼承人時，非保留其「」，他繼承人不得分割遺產。","options":["遺贈分","特留分","應繼分","保留分"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L247","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":247,"page":52,"answer":3,"explanation":"(1)以贈與淨額課稅，贈與淨額 = 贈與總額 1000 萬 - 免稅額 244\n萬 - 扣除額 0 = 756 萬\n(2)對有贈與行為之贈與人課徵\n(3)贈與總額為房子價值 1000 萬\n(4)一定條件指贈與人有下列情形以受贈人小華為納稅義務人：行蹤\n不明、逾繳納期限未繳且在境內無財產可供執行、死亡時贈與稅尚\n未核課。","stem":"小華父親將一千萬的房子贈與小華後，沒有其他財產，以下敘述何\n者錯誤？","options":["贈與人應就 756 萬元計算繳納贈與稅","贈與稅之納稅義務人為小華父親","贈與總額為 780 萬元","稽徵機關在一定條件下可向小華課稅"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L248","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":248,"page":52,"answer":4,"explanation":"保險契約涉及訴訟，示範條款要求以要保人住所所在地為第一審管\n轄法院，但
