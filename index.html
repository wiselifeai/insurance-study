"id":"G114L244","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":245,"page":40,"answer":4,"stem":"依據金消法規定,金融消費者係指接受金融服務業提供金融商品或服務,但不包含 A\n專業投資機構;B符合一定財力之自然人;C一般消費者;D專業能力之自然人","options":["AD","ABCD","BCD","ABD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L245","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":246,"page":41,"answer":1,"stem":"依金消法規定,金融服務業包括 A期貨業;B保險業;C證券交易所;D證券集中保管事業","options":["AB","ABCD","BCD","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L246","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":247,"page":41,"answer":1,"stem":"為保障被保險人之基本權益,並維護金融之安定,依保險法規定保險業應設置","options":["安定基金","業務發展基金","消費者保護基金","消費者補償基金"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L247","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":248,"page":41,"answer":2,"stem":"為保護金融消費者,金融服務業依據金消法規定訂定業務人員酬金制度並提報哪個單位通過","options":["股東大會","董【理】事會","主管機關","業務員代表大會"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L248","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":249,"page":41,"answer":3,"stem":"保險業因切實確認保險商品之相關佣金、獎金及營業費用不應超過何種費用而造成費差損","options":["責任準備金","所收總 保費","附加費用","保單價值準備金"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L249","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":250,"page":41,"answer":2,"stem":"有關金融機構確認客戶身分程序之敘述何者錯誤?","options":["應以風險為基礎","留存確認客戶身分之程序資料,應自業務開始時起至少保存五年","審查範圍擴及實質受益人","臨時交易者留存確認程序之資料, 應自臨時性交易終止時起至少保存五年。"],"explanation":"應自【業務關係終止時】起至少保存五年","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L250","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":251,"page":41,"answer":1,"stem":"業務員因銷售保險商品逕向要保人所蒐集之資料,下列敘述何者正確?","options":["若依法律規定得免告知者,得免為告知","法律雖有規定但基於保護消費者,皆需為告知,\n不得免除","不需告知要保人使用目的","屬公務機關之資料蒐集"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L251","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":252,"page":41,"answer":4,"stem":"非公務機關在蒐集個人資料時,除了須符合特定目的外,尚須具有下列何種情形之一,始得為之","options":["當事人自行公開 或其他已合法公開之個人資料","經當事人同意","與當事人有契約關係或類似契約關係","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L252","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":"補充-11","page":41,"answer":4,"stem":"非公務機關在蒐集個人資料時,除了須符合特定目的外,尚須具有下列何種情形之一,始得為之A 經當事人同意;B當事人自行公開或其他已合法公開之個人資料;C\n對當事人權益無侵害;D為增進公共利益所必要","options":["ABD","AB","ABC","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L-補充-11","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":253,"page":41,"answer":4,"stem":"保戶填寫要保書聲明同意保險人依個資法取得相關資料,即符合非公務機關於蒐集個資時,除符合特定目的外,亦符合 A法律明文規定;B 與當事人有契約關係且已採取適當安全措施;C經當事人同意;D為增進公共利益所必要","options":["A B","AD","AC","BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L253","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":254,"page":41,"answer":4,"stem":"保險業於核保理賠時須蒐集當事人之特種個資,除經當事人書面同意外,須符合法律明文規定使得為之,下列何者為保險業蒐集之特種個資?A健康檢查;B病歷;C指紋;D職業","options":["ABCD","ABC","BC","AB"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L254","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":255,"page":41,"answer":2,"stem":"有關人身保險契約之保險金信託規定,何者有誤?","options":["保險業為該保險金信託之受託人","要保人須於訂立保險契約時,同時洽訂信託契約","僅要保人與被保險人為同一人之保險契約得洽訂信託契約","僅死亡保險金及失能保險金得洽訂信託契約。"],"explanation":"要保人於【保險事故發生前】得預先洽訂信託契約","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L255","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":256,"page":41,"answer":4,"stem":"下列之金融機構何者適用洗錢防制法?A 證券商;B 保險公司;C 信用卡公司;D\n郵政機構","options":["BCD","AB","BD","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L256","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":257,"page":41,"answer":2,"stem":"下列何者為洗錢防制法適用之非金融事業或人員?A會計師;B地政士;C銀樓業;\nD不動產經紀業","options":["BCD","ABCD","CD","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L257","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":258,"page":42,"answer":2,"stem":"保險業得以共保方式承保情形有A基於公共利益考量;B配合政策需要;C能有效提升對投保大眾服務;D有關巨災損失保險","options":["ABC","ABCD","ABD","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L258","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":259,"page":42,"answer":4,"stem":"人身保險契約之內容均由保險公司單方面決定,要保人原則上並無討價還價的餘地。\n基於衡平原則,有何補救措施?","options":["要保人可解除契約","當契約條款有疑義時,\n應由保險人斟酌實際情況決定","契約條款之內容要保人可要求法院公證","當契約條款有疑義時,應做有利被保險人之解釋"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L259","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":260,"page":42,"answer":3,"stem":"有關金融消費者保護法規定,何者有誤? A金融服務業對金融消費者之責任得預先約定限制;B金融服務業對金融消費者之責任不得預先免除; C違反預先限制之約定無效; D金融服務業與金融消費者訂立契約條款顯失公平者契約無效","options":["BCD","A","AD","BC"],"explanation":"A「不得」預先約定限制  D 訂立契約條款顯失公平者,該「部分」契約無效","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L260","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":261,"page":42,"answer":1,"stem":"有關金融消費爭議處理之敘述,何者錯誤?","options":["金融業即使已依評議內容履行,爭議處理機構仍應將評議書送法院核可","消費者在評議成立後,得於不變期間內申請爭議處理機構將評議書送法院核可","爭議處理機構將評議書及卷證送請該機構事務所所在地之管轄法院核可","評議書經法院核可後與民事判決同一效力。"],"explanation":"已履行則免送法院核可","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L261","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":262,"page":42,"answer":3,"stem":"保險契約如約定事項顯失公平者,該部分之約定無效,下列何者非無效事由?","options":["免除或減輕保險人依保險法應負之義務","使要保人、受益人或被保險人拋棄或限制其依保險法所享之權利","加重保險人之義務","其他於要保 人、受益人或被保險人有重大不利益之情事"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L262","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":263,"page":42,"answer":4,"stem":"下列何者有誤?","options":["金融服務業刊登廣告不得有虛偽或其他足致他人誤信","金融服務業對金融消費者所提示之資料 或說明,應確保內容真實","金融服務業對金融消費者所負擔之義務不得低於廣告內容","金融服務業得藉由金融教育宣導方式,對消費者引薦個別金融商品或服務。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L263","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險法規","number":264,"page":42,"answer":4,"stem":"下列何者有誤?","options":["合夥人為被保險人時,其中一人或數人讓與保險利益於他人者,\n契約不因之而失效","外國保險業係指依外國法律組織登記,並經主管機關許可,在本國境內經營保險之機構","保險公證人係辦理保險標的查勘、 鑑定及估價而予證明之人","保險法所定各種準備金包含責任準備金、未滿期保費準備金、賠款準備金及保單價值準備金"],"explanation":"不包含保單價值準備金","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L264","chapter":"第四章 保戶權益相關重要法律介紹"},{"subject":"保險實務","number":34,"page":5,"answer":3,"stem":"就是將純保險費扣除已經過的危險保費後的資金提存保管，分別按照保險種類計算，記載於特設的帳簿，係指下列何者？","options":["解約金","保單紅利","責任準備金","保單價值準備金"],"explanation":"原檔此題語序為選項在前、題幹在後；已調整語序方便作答。答案依題庫為（3）。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P034","chapter":"第四章 人身保險的構造"},{"subject":"保險法規","number":143,"page":32,"answer":2,"stem":"贈與稅納稅義務人為","options":["受贈人","贈與人","遺贈人","以上皆可"],"explanation":"原 PDF 此題未附逐題解析。贈與稅特殊例外情形請依當期法規核對。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L143","chapter":"第三章 人身保險與稅法"}],"lessons":[{"id":0,"subject":"保險實務","chapter":"第一章 風險管理與保險","overview":"先學會看懂「不確定性」，後面的保險商品才不會只是背名詞。這一章的核心是：什麼叫風險、怎麼衡量損失、如何選擇處理方式。","topics":[{"id":"0-0","title":"風險：不是一定會損失","definition":"風險是未來結果具有不確定性，並有發生損失的可能。保險主要承接可以衡量、可以聚集多數同類單位分散的風險。","example":"明天可能下雨使店面停業，損失是否發生及多大都不確定，這才需要衡量。","trap":"「一定會損失」不是風險的不確定性；「可能大賺一筆」則不等於可保的純粹風險。","refs":["P004","P005","P006","P025"]},{"id":"0-1","title":"損失頻率 × 損失幅度","definition":"損失頻率是一定期間內事故發生的次數或比率；損失幅度是每次事故平均損失金額。在題庫的基本模型中，預期損失成本＝預期損失頻率 × 平均損失幅度。","example":"100 位員工的年死亡率為 0.326%，每件撫卹金 100 萬元，每人的預期成本是 0.00326 × 1,000,000＝3,260 元。","trap":"「發生次數」是頻率，不是金額；「每次賠多少」是幅度，不是次數。","refs":["P001","P003","P010","P012","P017"]},{"id":"0-2","title":"純粹風險與投機風險","definition":"純粹風險的結果是「有損失或沒有損失」，不會因事故帶來獲利；投機風險則可能獲利也可能損失。題庫指出保險主要處理純粹風險。","example":"家裡失火是純粹風險；買股票可能賺也可能賠，是投機風險。","trap":"不是任何含有「風險」兩字的行為，都適合買保險轉嫁。","refs":["P008","P019","P025"]},{"id":"0-3","title":"基本風險與特定風險","definition":"基本風險影響範圍廣、較難由個人控制，例如大規模天災或經濟事件；特定風險主要影響特定個人或家庭，較有機會管理。","example":"地震波及整個城市屬基本風險；單一家庭遭竊是特定風險。","trap":"「基本」不是簡單，「特定」不是比較嚴重；兩者看的是波及範圍。","refs":["P007","P013","P027","P028"]},{"id":"0-4","title":"事故前：避免、預防、移轉","definition":"避免是退出或不從事危險活動；預防是降低事故發生機率；移轉是把財務損失的一部分交給其他人，例如購買保險。","example":"不參加危險攀岩＝避免；行車前檢查煞車＝預防；投保意外險＝移轉。","trap":"買保險不會讓意外「不發生」，它主要移轉符合條款的經濟後果。","refs":["P002","P011","P023"]},{"id":"0-5","title":"事故後：抑制；未移轉：自留","definition":"抑制是事故已發生後設法減輕損失；自留則是個人或企業仍需自行承擔的損失，不論是主動選擇、疏忽或保障不足。","example":"失火後立刻滅火是抑制；醫療險限額不足，差額自己負擔是自留。","trap":"勤洗手降低感染機率是預防，不是事故發生後的抑制。","refs":["P002","P011","P015","P023"]},{"id":"0-6","title":"道德風險與心理風險","definition":"道德風險與故意不誠實、企圖不當得利有關；心理風險與粗心、疏忽、冷漠導致危險增加有關。","example":"為領保險金蓄意縱火＝道德風險；投保後不維護房屋＝心理風險。","trap":"兩者都是無形風險因素，但「故意」與「疏忽」是判斷關鍵。","refs":["P018","P024"]}]},{"id":1,"subject":"保險實務","chapter":"第二章 人身保險的意義與功能","overview":"人身保險並非「付錢換一筆可能拿不到的錢」，而是把個人難以承受的重大經濟後果，在許多保戶之間共同分攤；也可能有儲蓄及退休安排等功能。","topics":[{"id":"1-0","title":"人身保險保障什麼","definition":"人身保險以人的生命或身體相關風險為核心，依契約提供死亡、失能、醫療或生存等給付。保障對象與給付條件必須看商品種類。","example":"家庭主要收入者投保壽險，是在其不幸離世時補足家庭生活費。","trap":"「有保險」不等於「任何意外、疾病都賠」，仍需符合保障項目。","refs":["P033","P034"]},{"id":"1-1","title":"家庭與國家的功能","definition":"對家庭而言，保險有維持收入、分攤醫療與長期照護負擔等作用；對整體經濟而言，長期資金累積與風險分散也有其功能。","example":"新婚家庭規劃定期壽險，避免一人身故後房貸全部壓到另一人身上。","trap":"保障是契約約定的給付，不可把資產增值當成每張保單的必然結果。","refs":["P035","P036"]},{"id":"1-2","title":"國民生命表與經驗生命表","definition":"國民生命表來自一般人口統計；壽險業經驗生命表則反映特定保險經驗。二者母體不同，使用情境也不同。","example":"全國平均壽命與投保客群的死亡經驗，可能不完全相同。","trap":"看見「生命表」不要只背名字；先問「統計哪一群人」。","refs":["P032"]},{"id":"1-3","title":"投資型保險：保障與投資分開看","definition":"投資型保險可能結合保險保障與投資帳戶，投資結果會受市場影響；不能把預估報酬當保證報酬。","example":"若連結基金淨值下跌，帳戶價值可能下降，即使保單仍有保障功能。","trap":"商品名稱有「保險」不代表投資部分本金無風險。","refs":["P037"]}]},{"id":2,"subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","overview":"這章看保險產業為何會隨人口與科技改變：老年人口、家庭結構、消費者需求與金融科技，會推動保險的服務方式和商品設計。","topics":[{"id":"2-0","title":"家庭結構改變帶動保障需求","definition":"雙薪家庭、少子化與高齡化，讓醫療、退休、長期照護和家庭收入保障的比重改變。","example":"夫妻都有工作時，兩人的收入都可能需要適當的壽險與失能保障。","trap":"不要以為家中只有傳統單一收入者才有保障需求。","refs":["P039","P040","P056"]},{"id":"2-1","title":"壽險是長期契約","definition":"人生階段變了，保障需求也會改變，應定期檢視保額、受益人與繳費能力。","example":"從單身變為有小孩之後，家中收入保障額度可能需要重新評估。","trap":"「以前買過保單」不等於「現在規劃一定足夠」。","refs":["P048","P050"]},{"id":"2-2","title":"金融科技與大數據","definition":"科技可協助流程標準化、理賠與服務效率、風險分析，但使用資料時仍應遵循授權、個資與資安要求。","example":"客戶上傳文件可縮短理賠處理時間，但個資不能任意蒐集外流。","trap":"系統更快不代表能略過告知、核保或隱私保護。","refs":["P044","P054","P057"]},{"id":"2-3","title":"弱勢保障與普及金融","definition":"微型保險、小額終老等設計，反映不同族群對負擔得起的基本保障需求；實際投保資格與額度依當時規範與商品。","example":"所得較有限者先建立足夠且負擔得起的基礎保障，而非追逐最高保額。","trap":"舊題庫的投保資格、金額上限可能因政策調整，不適合只背舊數字。","refs":["P046","P047"]}]},{"id":3,"subject":"保險實務","chapter":"第四章 人身保險的構造","overview":"一張保單為什麼收這個保費？理賠錢從哪裡來？從「死亡率、利率、費用、準備金」四個概念串起這章，公式就比較容易理解。","topics":[{"id":"3-0","title":"保險費：純保費與附加費用","definition":"基本概念是：總保險費由支應預期保險給付的純保費與經營管理等附加費用構成；不同商品的精算方式可能更複雜。","example":"假設純保費每年 8,000 元、附加費用 2,000 元，總保費為 10,000 元（示意，非實際報價）。","trap":"「繳的保費全部都是儲蓄」是錯誤觀念。","refs":["P060","P061","P068"]},{"id":"3-1","title":"三種重要精算假設","definition":"死亡率影響預期給付，預定利率反映投資報酬假設，預定附加費用率反映費用。精算的核心是把未來收支換算到現在。","example":"其他條件固定時，死亡保障事故機率提高，通常會增加純保費需求。","trap":"預定利率不是保戶實際一定拿到的保證投資報酬。","refs":["P061","P067","P072","P092"]},{"id":"3-2","title":"責任準備金：保險公司要保留的資金","definition":"壽險多為長期契約，保險公司須依法及精算制度對未來義務提存準備金。這不是保戶可隨意全額領出的個人帳戶。","example":"保戶年輕時繳費，保險公司須兼顧未來長年期給付責任。","trap":"責任準備金、解約金、已繳保費，是不同概念與不同金額。","refs":["P038","P062","P076"]},{"id":"3-3","title":"保單價值準備金與解約金","definition":"有些長期保單累積保單價值準備金，提前終止可能有解約金；實際金額依保單及法規計算，不可直接認定等於累積保費。","example":"繳了三年保費後解約，拿回金額可能低於總繳保費。","trap":"「有準備金」不代表「解約時全額原封不動返還」。","refs":["P058","P059","P077"]},{"id":"3-4","title":"生命表與大數法則","definition":"保險公司利用大量相似風險單位的統計經驗，估算在一定期間內的理賠需求；個別人何時出險仍然不確定。","example":"1000 人裡每年預期約 3 人發生某事故，是整體預估，不是預測哪 3 個人。","trap":"把群體機率當成對個人的必然預言，是常見推論錯誤。","refs":["P072","P092","P097"]},{"id":"3-5","title":"分紅保單的來源","definition":"題庫談到死差、利差、費差與該險經營損益。分紅設計須依商品條款判斷，不要把過去紅利當作未來保證。","example":"若實際經營優於定價假設，符合條款時可能影響分紅；未來不一定相同。","trap":"「分紅」與「宣告利率」不是可以隨便互換的名詞。","refs":["P096","P102"]}]},{"id":4,"subject":"保險實務","chapter":"第五章 人身保險的種類","overview":"商品很多，先用「什麼時候給付？」分類最有效：死亡、活到特定期間、治療、事故受傷、失能、退休年金或長期照護。","topics":[{"id":"4-0","title":"定期壽險、終身壽險、養老保險","definition":"定期壽險提供約定期間的身故保障；終身壽險通常以終身死亡保障為核心；養老保險兼具約定生存滿期與身故相關安排。","example":"房貸責任期可比較定期壽險；希望一生有身故保障可研究終身壽險。","trap":"保費較高的商品不必然比較適合，應先問保障目標與負擔能力。","refs":["P115","P151"]},{"id":"4-1","title":"生存保險與年金保險","definition":"生存保險以約定時點生存作為重要給付條件；年金保險則重視自約定時間起定期給付，常用於退休現金流規劃。","example":"希望 65 歲後有規律收入，可以研究年金給付期間與保證條款。","trap":"年金和存款定存不同，需比較給付方式、費用與解約條件。","refs":["P140","P150","P173","P195"]},{"id":"4-2","title":"傷害險與健康險","definition":"傷害險通常著重符合契約定義的外來、突發、非疾病事故；健康險處理疾病或契約約定的醫療、失能等保障。","example":"滑倒骨折可能涉及意外傷害險；肺炎住院則應先檢視健康險條款。","trap":"「只要受傷就一定是意外險」忽略了事故定義與除外責任。","refs":["P123","P127","P135"]},{"id":"4-3","title":"實支實付與定額給付","definition":"實支實付多依合理且必要的實際醫療支出及限額給付；定額型則依住院天數、手術等約定條件給付固定額。","example":"住院帳單 2 萬元，不代表所有保單都按 2 萬元理賠。","trap":"不要只看「住院險」三字，要看日額、實支、限額、等待期及例外。","refs":["P131","P143","P156"]},{"id":"4-4","title":"團體保險與個人保險","definition":"團體保險通常以團體成員為範圍，契約架構、費率與資格認定可能不同；個人保險則依個人契約條件辦理。","example":"公司替員工投保團體定期壽險，離職後能否延續保障要看條款。","trap":"「公司已幫我保」並不代表個人所有需求都受保。","refs":["P118","P135","P169"]},{"id":"4-5","title":"微型保險與普及保障","definition":"微型保險旨在提供經濟弱勢或特定身分對象基本風險保障，其對象、文件與商品限制依監理規範。","example":"收入較少者可優先研究負擔得起的意外／死亡基本保障。","trap":"題庫中的資格條件與數額有時效性，不應視為永久不變。","refs":["P103","P104","P105","P134"]},{"id":"4-6","title":"利率變動型、投資型與外溢保單","definition":"利率變動型商品的宣告利率具有特定契約運作方式；投資型商品涉及投資帳戶價值；外溢保單可能鼓勵健康行為以觸發保障或費率相關機制。","example":"達成約定運動步數可能符合某外溢保單獎勵，仍須核對條款。","trap":"三者都不是「保證高報酬」的同義詞。","refs":["P129","P162","P195"]}]},{"id":5,"subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","overview":"投保流程要做到三件事：確認需求、取得真實資料、讓保險公司有足夠資訊正確核保。程序並不是為了增加麻煩，而是降低之後的爭議。","topics":[{"id":"5-0","title":"要保書與告知義務","definition":"要保書是保險公司評估風險的重要資料；要保人、被保險人須就書面詢問事項誠實說明，業務員不得代客隱瞞。","example":"要保書詢問曾否住院，不能因擔心拒保就填「沒有」。","trap":"「業務員叫我這樣填」通常不能使不實陳述變成正確。","refs":["P198","P200","P220"]},{"id":"5-1","title":"核保（危險選擇）","definition":"核保是保險公司依風險資料判斷承保、加費、除外或其他結果，可能考量健康、職業、財務與投保目的。","example":"職業危險程度不同，意外險承保條件可能不同。","trap":"業務員推介保單不等於保險公司已正式承諾承保。","refs":["P202","P205","P217"]},{"id":"5-2","title":"第一期保費與收據","definition":"首次繳費、代收人員授權、送金單與正式承保，可能是不同程序；應保留支付與收據證明。","example":"把現金交給業務員時，確認收款人授權與收據，避免日後爭議。","trap":"拿到代收證明不一定表示所有保障條件已生效。","refs":["P198","P203","P208","P223"]},{"id":"5-3","title":"客戶身分確認與異常行為","definition":"招攬時要了解投保目的、保費來源與關係人，注意不尋常付款、冒名或其他可疑訊號。","example":"陌生第三人替保戶繳高額保費卻說不清關係，應依公司程序提高注意。","trap":"「客戶說很急」不能成為跳過身分確認的理由。","refs":["P211","P212","P225"]}]},{"id":6,"subject":"保險實務","chapter":"第七章 壽險行銷活動","overview":"好的保險行銷不是背話術，而是幫對方看見缺口、理解代價、比較方案，並留下清楚的服務紀錄。","topics":[{"id":"6-0","title":"保障需求分析","definition":"先問家庭成員、現有保障、收支、負債、風險承擔能力，再規劃保額；需求應隨人生階段更新。","example":"家庭每月固定支出 6 萬元，有幼兒與房貸，收入中斷保障需求可能較高。","trap":"以高佣金商品倒推需求，不是以客戶利益為中心。","refs":["P230","P238","P250"]},{"id":"6-1","title":"保單健檢與保單活化","definition":"保單健檢是確認現有契約保障與不足；保單活化涉及既有保單權益重整，須先瞭解成本及可能失去的權益。","example":"舊終身壽險如要改作其他保障安排，先比較新舊保單利益。","trap":"「舊保單一定沒用」是容易造成損失的錯誤說法。","refs":["P226","P227","P228"]},{"id":"6-2","title":"保單轉換與適合度","definition":"轉換保單可能伴隨新等待期、費率、健康核保與解約成本，應清楚比較替代關係，不可單看新商品名稱。","example":"保戶健康已變差時，解掉舊約再投新約可能無法取得原有保障。","trap":"只強調新保單的好處而不揭露舊保單損失，是重要考點。","refs":["P234","P235"]},{"id":"6-3","title":"保險代理人與經紀人","definition":"題庫提醒注意代理人與經紀人的角色：代理人依代理關係招攬；經紀人則基於被保險人利益洽訂契約或提供服務。","example":"同樣協助買保險，法律定位和代表利益可能不同。","trap":"不要把代理人、經紀人與一般登錄業務員的法律身分完全畫上等號。","refs":["P258","P259"]}]},{"id":7,"subject":"保險實務","chapter":"附錄","overview":"這些跨章題應當作最後補強：用保單約定、給付文件與實際金流來串起前面學過的制度。","topics":[{"id":"7-0","title":"看解約／返還題：先分辨商品","definition":"不同型態保險對未到期保費、保單價值準備金及解約金有不同安排，題目通常要先辨認險種再套條款。","example":"短期保障與長期壽險的中途解約計算方式不必然相同。","trap":"不能看到「解約」就直接答「全部保費退回」。","refs":["P261","P265"]},{"id":"7-1","title":"失能請領：給付條件與證明","definition":"失能保險金的認定通常涉及事故、失能等級、診斷與申請文件，請依各保單與示範條款核對。","example":"申請失能給付時，可能需備診斷書、申請書及身分證明。","trap":"醫療費用收據不必然取代失能診斷證明。","refs":["P267"]}]},{"id":8,"subject":"保險法規","chapter":"第一章 人身保險契約","overview":"保險契約的重點不是法律文字本身，而是「誰可以投保、誰受保障、誰拿錢、誰有權改契約」。先把四種角色畫清楚，就能解開很多看似繞口的題目。","topics":[{"id":"8-0","title":"要保人、被保險人、保險人、受益人","definition":"要保人向保險公司申請契約並負主要繳費義務；被保險人是生命或身體被保障者；保險人是承擔約定風險的公司；受益人在符合條款時請領保險金。","example":"媽媽替兒子投保並指定爸爸為死亡受益人：媽媽＝要保人，兒子＝被保險人，爸爸＝受益人，保險公司＝保險人。","trap":"「要保人就是最後拿理賠金的人」不一定正確。","refs":["L002","L007","L019","L029"]},{"id":"8-1","title":"保險利益：不能把別人的生命當賭局","definition":"要保人對被保險人的生命或身體具有法律所承認的利益，才符合人身保險的保險利益規範；常見關係包括自己、家屬、債務人等，但範圍有限制。","example":"你對自己的生命有保險利益；對欠你錢的人則要留意債務利益範圍。","trap":"不能因為「對方有錢」就對任何陌生人的生命投保。","refs":["L002","L010","L025","L050"]},{"id":"8-2","title":"受益人指定與變更","definition":"死亡給付的受益人得依法律與契約指定及依法變更；醫療、失能等給付在題庫所引示範條款下，以被保險人本人為受益人。","example":"已指定前配偶為受益人，離婚不必然自動改成新配偶，應主動檢視指定。","trap":"「改婚姻狀態」與「已完成受益人變更」不是同一件事。","refs":["L007","L013","L015","L024"]},{"id":"8-3","title":"最大誠信與告知義務","definition":"保險依賴雙方對重要事實的誠實說明，投保時對書面詢問事項的告知十分重要。違反可能帶來契約解除等後果，需視法定條件及時效。","example":"要保書問三年內手術史，曾接受手術就應依實際狀況填答。","trap":"業務員不能因想快速成交而建議客戶隱瞞病史。","refs":["L016","L037"]},{"id":"8-4","title":"主力近因：找最有支配力的原因","definition":"主力近因不是時間上「離結果最近」的原因，而是造成損害最主要、最有效的原因；常見於意外與健康給付責任的討論。","example":"摔倒引發連續醫療併發情況時，要看事件間的因果鏈是否被中斷。","trap":"題目若說「一定是最後發生的原因」，要提高警覺。","refs":["L023","L038"]},{"id":"8-5","title":"代位原則與人身保險","definition":"損害保險中保險人賠償後可能代位向第三人求償；人壽保險通常不採財產損害填補那套代位機制。","example":"汽車受損理賠後保險公司向肇事者求償，與人壽死亡給付性質不同。","trap":"不要把財產保險的代位規則無差別套在所有人身保險。","refs":["L014","L035","L054"]},{"id":"8-6","title":"未滿 15 歲的死亡給付限制","definition":"題庫依保險法第 107 條說明未滿 15 歲被保險人的死亡給付與喪葬費規定；這類涉及法定上限、施行日期，務必對照現行條文。","example":"替小孩規劃保障時，先確認是否有死亡給付限制與法定喪葬費限額。","trap":"「小孩買了高保額終身壽險，所以未滿 15 歲身故就全額賠」不能直接推定。","refs":["L001","L006"]}]},{"id":9,"subject":"保險法規","chapter":"第二章 人身保險契約條款","overview":"同樣叫「保單沒效」，可能是無效、撤銷、解除、停效或終止。先辨識發生原因、時間點與法律效果，再去背期限、程序，會省下很多冤枉記憶。","topics":[{"id":"9-0","title":"成立、生效、無效：看起點","definition":"契約成立是雙方意思表示合致；生效是開始發生約定權利義務；無效則是因法定事由使契約不具應有效力。不同商品可能另有等待期及責任開始條款。","example":"完成簽約不代表所有疾病等待期都已過。","trap":"「填完要保書」與「所有保障都即刻生效」不能畫等號。","refs":["L055","L056","L080"]},{"id":"9-1","title":"撤銷、解除、終止：法律效果不同","definition":"撤銷涉及依特定制度撤回效力；解除可能因告知義務違反等事由；終止是讓契約向後結束。題目常用情境測試三者。","example":"保單收受後契約撤銷期內行使權利，與多年後因不繳費停效不同。","trap":"不要把「已過撤銷期」誤認為「以後絕不能終止」。","refs":["L069","L070","L139"]},{"id":"9-2","title":"寬限期、停效、復效","definition":"保費未依期繳納，依條款可能經催告與寬限期；條件成就後契約停效，停效後符合程序可能申請復效。復效有期限、風險評估與補繳等要求。","example":"忘記繳續期保費後收到催繳通知，應先確認寬限期與是否已停效。","trap":"停效不是自動等於終止；但停效期間也不代表原保障照常完全有效。","refs":["L101","L118","L121","L123"]},{"id":"9-3","title":"保單借款與自動墊繳","definition":"某些具有保單價值準備金的契約可依條款申請保單借款或自動墊繳保費；借款本息會影響可用價值與權益。","example":"長期沒還保單借款，利息累積可能影響保單效力。","trap":"保單借款不是保險公司無條件贈送的錢。","refs":["L107","L108","L114"]},{"id":"9-4","title":"保險金申領程序","definition":"保險事故發生後，應依約定通知、提出申請書和必要文件；保險人也有依條款處理理賠之義務。","example":"住院理賠可能要求醫療診斷、收據或其他證明。","trap":"「有醫師診斷」不必然等於「所有商品都一定理賠」。","refs":["L091","L149","L170"]},{"id":"9-5","title":"除外責任與等待期","definition":"除外責任明定某些原因或狀況不賠；等待期則限制特定初期事故的保障起點。兩者不能與一般免責額或給付限額混為一談。","example":"健康險在約定等待期間發生特定疾病事故，可能不符合給付條件。","trap":"投保前只問「每月多少錢」卻不看除外、等待期，是常見錯誤。","refs":["L090","L148","L170"]},{"id":"9-6","title":"電子保單與示範條款","definition":"電子保單重點在可驗證、保存、交付與閱讀；示範條款提供重要的契約參考，實際權利仍應以適用法規及個別契約為準。","example":"電子保單應妥善保存，並能確認是正式契約而非宣傳資料。","trap":"「網頁廣告寫了」不一定就是保單契約條款。","refs":["L056","L075","L183"]}]},{"id":10,"subject":"保險法規","chapter":"第三章 人身保險與稅法","overview":"考稅法題時，不要先急著背金額。把「保費扣除、身故給付、遺產繼承、遺產稅」當成四個不同問題，再看誰是納稅義務人、金流歸誰。","topics":[{"id":"10-0","title":"保費扣除與稅務優惠","definition":"人身保險費在符合所得稅法特定要件時，可能有列舉扣除；適用對象、項目與上限依課稅年度法令認定。","example":"繳了保費不代表每一張保單、所有人、所有金額都能不受限制扣除。","trap":"別把「有保單」直接翻譯成「保費全部免稅」。","refs":["L187","L201","L245"]},{"id":"10-1","title":"身故保險金是否計入遺產","definition":"指定受益人與未指定受益人，在民法繼承、遺產認定與稅務效果的判斷上可能不同，還須考量法律及實質課稅規範。","example":"若死亡給付沒有有效受益人，應確認是否成為被保險人遺產處理。","trap":"「保險金一律完全免稅」是危險的過度簡化。","refs":["L188","L200","L263"]},{"id":"10-2","title":"遺產繼承：順位、應繼分","definition":"先辨認配偶、直系血親卑親屬、父母等法定繼承人關係，再看各人的應繼分；有無遺囑與拋棄繼承也會影響結果。","example":"被繼承人留有配偶與子女時，不可直接認為只有配偶領全部遺產。","trap":"「受益人」與「法定繼承人」是不同法律概念。","refs":["L189","L226","L263"]},{"id":"10-3","title":"拋棄繼承與限定責任","definition":"拋棄繼承有法定期限、方式與通知程序；繼承人對債務之責任另受民法規範。","example":"知道自己有繼承權，卻發現可能債務龐大時，應立即了解法定程序。","trap":"「口頭說不要」不一定等於完成法律上的拋棄繼承。","refs":["L227","L233"]},{"id":"10-4","title":"遺產稅計算流程","definition":"理解公式順序：遺產總額 → 依法律扣除免稅額與扣除額 → 課稅遺產淨額 → 適用稅率；數字依死亡年度及當年公告規定。","example":"先區分「遺產總額」與「遺產淨額」，不然再背稅率也會算錯。","trap":"本題庫包含舊年度稅額、扣除額，正式考前必須查核當期公告。","refs":["L191","L209","L265"]},{"id":"10-5","title":"遺囑與特留分","definition":"遺囑可以規劃財產分配，但民法仍有法定形式及特留分等限制。","example":"立遺囑想把財產全給某人時，可能須考慮其他繼承人的特留分。","trap":"「寫了遺囑就能排除任何繼承權」不一定正確。","refs":["L236","L241"]}]},{"id":11,"subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","overview":"這章可把自己想像成保戶：有哪些權利？保險公司與業務員該揭露什麼？個人資料怎麼被保護？遇到爭議怎麼處理？","topics":[{"id":"11-0","title":"金融消費者保護與公平待客","definition":"金融服務業有說明、風險揭露、適合度與公平對待等責任，不能只以促成成交為目標。","example":"退休族承擔不了高波動，卻被推銷高風險商品，就需要檢視適合度。","trap":"簽名不代表業務員可跳過重要風險解說。","refs":["L267","L276","L306"]},{"id":"11-1","title":"適合度與重要資訊告知","definition":"銷售前了解客戶財務、風險承受度與保障目標，並充分說明費用、可能損失與限制。","example":"收入不穩定者不一定適合高額、長年不可輕易中斷的保費負擔。","trap":"不能只說「這商品很多人買」就算完成適合度評估。","refs":["L276","L283"]},{"id":"11-2","title":"申訴與金融消費評議","definition":"客戶遇爭議可依程序申訴，必要時循金融消費評議等機制；程序、期限與效力應查當期規定。","example":"對理賠認定不服，先保存契約、往來函文與理賠資料。","trap":"不要把評議中心誤認為保險公司內部客服單位。","refs":["L270","L291"]},{"id":"11-3","title":"個人資料保護","definition":"健康、財務、身分資料通常相當敏感；蒐集、處理、利用需有合法依據與必要範圍，不可任意對外使用。","example":"公司為核保收集病歷，不等於可把病歷轉給不相關行銷對象。","trap":"拿到客戶同意書不代表從此任何資料都可以無限制使用。","refs":["L299","L300"]},{"id":"11-4","title":"洗錢防制與可疑交易","definition":"必須辨識客戶、了解交易目的與資金來源，對不合理第三人付款、頻繁解約及刻意分拆交易等情況提高注意。","example":"躉繳大筆保費後很快申請高額借款、理由不明，是值得注意的訊號。","trap":"大額交易不自動等於洗錢，但也不能因為是熟客就不檢視異常。","refs":["L268","L294","L295"]},{"id":"11-5","title":"酬金制度與避免利益衝突","definition":"業務員報酬制度不得鼓勵不當銷售；契約撤銷、無效、解除等情形也可能涉及已給付酬金追回。","example":"業務員不應為了提高短期佣金而勸客戶不必要地轉換舊保單。","trap":"「佣金高」不是解釋商品適合客戶的合理理由。","refs":["L266","L312"]}]},{"id":12,"subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","overview":"這章是你的職業行為考試：資格、登錄、招攬範圍、教育訓練、公司管理與違規處分。先記住「資格通過不等於可以立刻無限制招攬」。","topics":[{"id":"12-0","title":"資格測驗與登錄不是同件事","definition":"通過資格測驗，是進一步依法登錄的要件之一；是否可以實際招攬，還須符合所屬公司及登錄規範。","example":"考取資格但尚未完成登錄，不可直接用正式業務員身分從事受規範招攬。","trap":"不要以為「有考過」就永久、無條件保有招攬資格。","refs":["L317","L321","L351"]},{"id":"12-1","title":"登錄限制與資格消極要件","definition":"管理規則對特定違法、停權或其他情況可能有限制；題庫常考禁止登錄與重新登錄條件。","example":"曾因重大違法受處分者，可能需要經過法定期間或符合其他條件。","trap":"法律上的「不得登錄」與「應停止招攬」不是同義。","refs":["L321","L329","L366"]},{"id":"12-2","title":"在職教育訓練","definition":"業務員需依規定參加教育訓練並完成考核或通報，訓練內容可能包含法令遵循與招攬倫理。","example":"未完成指定訓練，可能影響登錄或招攬資格。","trap":"不要只背單一舊題庫的訓練小時數，應與現行規定對照。","refs":["L319","L342","L357"]},{"id":"12-3","title":"不當招攬與處分","definition":"誇大保證、錯誤比較、代簽或誤導轉換可能違反招攬規範，公司與主管機關依程序處理。","example":"只展示競品缺點、不公平比較兩張保單，可能構成不當比較。","trap":"「客戶答應了」不能合法化業務員違規代簽或誤導。","refs":["L333","L339","L345"]},{"id":"12-4","title":"代理人、經紀人與業務員","definition":"保險代理人、保險經紀人與業務員的法定定位、服務關係和登錄／執業規範不同，考題常用角色名稱交換設陷阱。","example":"協助保戶比較保險方案時，先判斷提供服務者的法律角色。","trap":"不要把所有「賣保險的人」都當作同一種受規範主體。","refs":["L318","L351","L363"]}]},{"id":13,"subject":"保險法規","chapter":"附錄","overview":"附錄混合了前面幾章的情境題與制度題。複習時，把它當作「跨主題整合測驗」，先辨識是哪種法規和契約問題，再回到對應章節。","topics":[{"id":"13-0","title":"保險事故的證明與給付","definition":"失蹤、住院、失能等事故有不同證明方式與條款設計，需看被保險事故是否符合約定。","example":"某人失蹤不必然等於法定死亡；部分傷害險有特定先行給付與追回安排。","trap":"別把不同事故所需的文件、期限完全混用。","refs":["L367","L368","L385"]},{"id":"13-1","title":"資金運用與監理制度","definition":"保險業資金投資、保證金、準備金與財務監理制度，目的在協助保障保戶權益及維持公司支付能力。","example":"保險公司不是把所有保費任意拿去投資，仍需遵循監理規範。","trap":"投資上限與百分比屬修法敏感數字，不應只依舊題庫背誦。","refs":["L373","L375","L389"]},{"id":"13-2","title":"團體保險與保險金信託","definition":"團體契約的保障對象與請領資料、保險金信託的安排，具有不同的法律與作業條件。","example":"透過信託安排受益人將來使用保險金，須檢視信託及保險契約。","trap":"受益人取得保險金與信託管理方式，是需要分開看的兩件事。","refs":["L369","L383"]}]}],"meta":{"P":267,"L":389,"total":1094,"lessons":72,"new":438,"notes":28,"old":656,"exam":"2026-11-14"},"cramNotes":[{"id":"C1","subject":"保險實務","page":1,"title":"風險的四種分類","definition":"風險不是一定會發生損失，而是「將來發生損失的不確定性」。依衡量性分客觀與主觀；依損失性質分純粹與投機；依產生原因分靜態與動態；依波及範圍分基本與特定。","example":"房屋失火可能發生損失，是純粹風險；投資股票可能賺也可能賠，是投機風險；地震波及整個社區則具基本風險特性。","trap":"「損失可能賺錢」是投機風險，不是純粹風險。不要把「基本風險」誤認成損失輕微。","keywords":["風險","純粹","投機","客觀","主觀"]},{"id":"C2","subject":"保險實務","page":2,"title":"損失頻率、幅度與預期損失","definition":"損失頻率是一定期間事故發生的次數或機率；損失幅度是一次事故的平均損失金額。預期損失成本可用頻率的預期值 × 幅度的預期值理解。","example":"事故發生機率 0.326%，每次需要支付 100 萬元撫卹金，預期每人的成本就是 3,260 元。","trap":"看到 0.326% 是頻率，不是幅度；100 萬元是幅度，不是頻率。","keywords":["頻率","幅度","風險損失","損失成本"]},{"id":"C3","subject":"保險實務","page":2,"title":"風險程度矩陣","definition":"頻率高且幅度高，屬特別嚴重風險；一高一低，屬重要風險；兩者都低，屬不重要風險。","example":"機車輕微擦傷可能頻率較高但單次金額小；大火可能頻率低卻會造成巨額損失。","trap":"「頻率低」不等於「風險不重要」，還必須考慮損失幅度。","keywords":["重要的風險","嚴重","風險衡量"]},{"id":"C4","subject":"保險實務","page":2,"title":"風險管理：避免、預防、抑制、移轉與自留","definition":"避免是不參與風險活動；預防是在事故前降低發生機率；抑制是在事故發生後或進展中降低損失程度；移轉是將財務風險透過保險等轉給他方；自留是自行承擔剩餘損失。","example":"避免攀岩是避免；安裝安全裝置是預防；失火後立即灑水是抑制；投保火險是移轉；未投保部分由自己承擔是自留。","trap":"預防與抑制常被混淆，關鍵是要降低「發生機會」還是「損失程度」。題庫有些舊式例題用語可能不一致，以原題及當期教材為準。","keywords":["避免","預防","抑制","自留","移轉"]},{"id":"C5","subject":"保險實務","page":3,"title":"生命表與死亡率計算","definition":"生命表整理特定群體的死亡機率，用於估計人壽保險的風險成本。年度死亡率＝年度內死亡人數÷年初生存人數。","example":"年初有 1,000 人、當年死亡 4 人，死亡率為千分之四；每人投保 1,000 萬元，簡化的純危險成本約 4 萬元。","trap":"死亡率與生存率同一期間同一群體下合計為 1；不要把保費理解成只需使用死亡率，實際還涉及利率與費用。","keywords":["生命表","死亡率","生存率","預定死亡"]},{"id":"C6","subject":"保險實務","page":5,"title":"保險費三要素","definition":"保險費的主要計算因素包括預定危險發生率（例如死亡率）、預定利率，以及預定附加費用率。其他條件固定時，死亡率與費用率提高通常使保費增加；預定利率上升通常使保費降低。","example":"兩人買同樣 20 年期保障，較高風險通常需要較高的純危險保費。","trap":"利率與保費不是同方向：題目常用「利率高 → 保費高」誘導選錯。","keywords":["保險費","預定死亡率","預定利率","附加費用"]},{"id":"C7","subject":"保險實務","page":5,"title":"責任準備金、保單價值準備金與解約金","definition":"責任準備金是保險公司為將來契約給付責任依法提存的準備；保單價值準備金依特定保險精算基礎計算，與契約現金價值相關；解約金是保戶終止契約時依規定可領回的金額，三者不是同義詞。","example":"保險公司可能已提存數十萬元的責任準備，但保戶當天解約能拿到的款項仍須看解約金表。","trap":"解約金不等於全部已繳保費；也不是所有保單都有可領回的解約金。","keywords":["責任準備金","解約金","保單價值準備金"]},{"id":"C8","subject":"保險實務","page":6,"title":"分紅保單的三差益與四種領法","definition":"依公會 114 版筆記，利差、死差、費差的經營損益與分紅有關；紅利可能以現金給付、儲存生息、抵繳保費或購買增額繳清保險方式給付。","example":"客戶選擇抵繳保費，下一期需要自行付出的金額可能減少；選增額繳清則保障額度可能增加。","trap":"儲存生息不代表保障額度自動增加；抵繳保費也不是減少原保單契約保障。","keywords":["紅利","分紅","利差益","死差益","費差益"]},{"id":"C9","subject":"保險實務","page":7,"title":"定期、終身、養老、生存保險","definition":"定期壽險重在特定期間死亡保障；終身壽險重在終身死亡保障；生存保險以期滿仍生存作為給付條件；養老保險結合生存與死亡條件的給付。","example":"房貸負擔 20 年，可能適合先評估 20 年定期壽險作為風險保障的一環。","trap":"不要把「保險期滿仍生存才給付」當成所有人身保險共同特性。","keywords":["定期保險","終身保險","養老保險","生存保險"]},{"id":"C10","subject":"保險實務","page":7,"title":"年金：即期、遞延、固定與變動","definition":"即期年金通常繳費完成後不久開始領取；遞延年金則在約定將來日期開始。固定型年金給付金額相對固定，利率變動型在契約設計下可能有固定或變動年金給付。","example":"退休後每月開始領取年金，是年金「給付期間」；上班時持續繳費累積則是「累積期間」。","trap":"躉繳是繳費方式，不等於「即期」本身；要辨別開始領取的時間。","keywords":["年金","即期年金","遞延年金","宣告利率"]},{"id":"C11","subject":"保險實務","page":9,"title":"連生共存與最後生存者年金","definition":"連生共存年金要求全部受領人都還生存才繼續給付；最後生存者年金只要其中至少一人生存就持續給付，直到最後一人身故。","example":"夫妻兩人作為年金受領人：連生共存，一人過世就不再依該條件給付；最後生存者年金則讓另一人繼續領。","trap":"「有一人活著還能領」是最後生存者年金，不是連生共存。","keywords":["最後生存者","連生共存"]},{"id":"C12","subject":"保險實務","page":9,"title":"傷害保險與旅行平安險","definition":"傷害險處理意外傷害風險，涉及事故外來性、突發性，以及職業分類、死亡與失能給付等；旅行平安險另有保障期間和旅遊情境限制。","example":"行政內勤與高危險職業的事故風險不同，核保與費率可能依職業類別調整。","trap":"題庫特定費率倍數及旅平險天數屬可能調整的規範，不宜只背數字而不看適用年代。","keywords":["傷害保險","旅行平安","失能","職業"]},{"id":"C13","subject":"保險實務","page":10,"title":"長期照顧：生理與認知功能","definition":"公會筆記以日常生活自理能力及失智相關認知評估說明長期照顧狀態。日常活動涵蓋進食、移位、如廁、沐浴、平地移動、更衣等。","example":"若需長期由他人協助如廁、移位與沐浴，可能涉及長照契約定義，需要再看條款的持續期間與評量門檻。","trap":"失智診斷不代表自動符合所有長照保單理賠條件；期間與功能門檻以契約及當期示範條款為準。","keywords":["長期照顧","失智","ADL","認知"]},{"id":"C14","subject":"保險實務","page":14,"title":"保費收取與收據","definition":"保險公司與依法授權的人員可以依規定收取保費。收到保費後應留下符合規定的繳費或收據紀錄，避免招攬與金流混淆。","example":"客戶繳費時應向有權收款的單位或人員交付，並保留收據或繳費憑證。","trap":"保險經紀人和保險代理人在法律定位與授權上不同，不能因為都是「業務員」就視為相同。","keywords":["保費","代收","保險代理人","保險經紀人"]},{"id":"C15","subject":"保險實務","page":16,"title":"需求分析、核保與要保文件","definition":"規劃保險時，會評估家庭生活費、債務、教育費、退休與醫療需求；核保則重視被保險人的職業、健康與病史、保額、投保動機等資訊。","example":"一個有房貸及未成年小孩的家庭，保障缺口通常不能只看醫療保單，還要把長期收入中斷算進去。","trap":"保險規劃書不能用退佣比例取代保障內容；業務員也不得代客簽名。","keywords":["核保","需求分析","要保書","家庭生活"]},{"id":"C16","subject":"保險實務","page":17,"title":"保單活化與轉換","definition":"題庫把保單活化視為調整舊保單保障功能的方法之一，可能透過保單價值轉換成符合當前需求的新保障或年金。但轉換可能影響保障、成本與其他權利。","example":"年紀增加、長照需求提高時，可檢視既有保單是否仍符合需求，再衡量轉換前後利弊。","trap":"不能把保單活化說成「百利無一害」，也不能忽略舊保單權利或轉換條件。","keywords":["保單活化","保單轉換"]},{"id":"C17","subject":"保險法規","page":18,"title":"四種人：要保人、被保險人、受益人、保險人","definition":"契約當事人是保險人及要保人；被保險人是生命或身體受保障者；受益人是在約定事故發生時享有請求保險金權利的人。要保人與被保險人可為同一人也可不同。","example":"媽媽幫自己投保，指定孩子為身故受益人：媽媽是要保人與被保險人；孩子是受益人；保險公司是保險人。","trap":"受益人有請求權，不代表一定是繳保費者；保險金不是所有情況都直接進入遺產。","keywords":["要保人","被保險人","受益人","保險人"]},{"id":"C18","subject":"保險法規","page":20,"title":"受益人指定與變更","definition":"要保人可以在法定與契約限制內指定或變更受益人，涉及被保險人同意、對保險公司的通知等程序；醫療、失能及生存年金受益人另有特別限制。","example":"離婚前指定「某姓名」為身故受益人，之後離婚再婚，不能光憑身分改變就推定受益人自動換成新配偶。","trap":"「事故發生前」與「事故發生後」對受益人變更的判斷不同。","keywords":["受益人","變更","指定","身故"]},{"id":"C19","subject":"保險法規","page":21,"title":"保險利益：避免拿別人的生命打賭","definition":"保險利益旨在讓要保人與保險標的之間存在法律承認的利害關係。題庫列舉本人家屬、生活費或教育費所仰給者、債務人、財產或利益管理者等。","example":"甲借乙 100 萬元：甲對乙的生命風險可能存在以 100 萬元債權為限的保險利益，而不是無限大。","trap":"借錢給你的人與欠你錢的人，站在不同位置，保險利益判斷也不同。","keywords":["保險利益","債務人","債權人"]},{"id":"C20","subject":"保險法規","page":22,"title":"損害填補、分攤、代位不是同件事","definition":"損害填補強調實際損失獲得合理補償、避免不當得利；分攤是多家保險人對同一損失理賠責任的分擔；代位是保險人賠付後依法取得對第三人請求權。","example":"車被第三人撞壞，財產險公司理賠後可能依規定向肇事者求償，這是代位；兩家保險公司分擔同一可保損失則是分攤。","trap":"不要把代位當成「所有人身保險適用」；理賠要先確認商品屬定額給付還是損害填補。","keywords":["損害填補","代位","分攤","主力近因"]},{"id":"C21","subject":"保險法規","page":23,"title":"停效、復效、終止、解除的差異","definition":"停效是契約在特定情形暫停保障效力；復效是依法／依約恢復效力；終止使契約往後不再繼續；解除因重大告知義務問題等依規定產生不同效力。","example":"保費逾寬限期未交，保單可能停效；符合條件申請繳清復效後，再依契約恢復保障。","trap":"「停效」不等於「契約無效」；「解除」和「終止」的效果也不能互換。","keywords":["停效","復效","解除契約","終止契約"]},{"id":"C22","subject":"保險法規","page":24,"title":"續期保費寬限期與自動墊繳","definition":"公會 114 版比較不同繳費週期的寬限期起算：年繳及半年繳通常從催告到達後起算；月繳與季繳通常從應繳日後起算。具自動墊繳約定時可能使用保單價值準備金餘額墊付。","example":"若保單有足夠保單價值準備金並已約定自動墊繳，即使忘繳保費，也可能暫時避免停效，但墊繳本息仍需償還。","trap":"看到「寬限期間內發生事故」與「寬限期後停效」要分清；天數和起算點是考試陷阱。","keywords":["寬限期","催告","自動墊繳","墊繳"]},{"id":"C23","subject":"保險法規","page":25,"title":"復效程序要看六個月內外","definition":"公會精選以停效六個月內與超過六個月的復效流程區分；後者涉及可保證明、受理與拒絕的程序與期限。","example":"保戶停效三個月和停效一年後想恢復保障，可能需要準備的程序不同。","trap":"復效不是重新投保，通常仍涉及原保單權利；具體數字、期限須核對當期法規與示範條款。","keywords":["復效","停效六個月","可保證明"]},{"id":"C24","subject":"保險法規","page":31,"title":"所得稅：保費與保險金要分開","definition":"人身保險費的列舉扣除，與保險金給付的所得稅或遺產稅認定，是三個不同問題；要看要保／被保險／受益人及家庭申報關係。","example":"甲支付自己保費與非受扶養親友保費，稅務可扣除的範圍不能只依甲實際支出決定。","trap":"不要把「每人每年人身保費扣除額」和「死亡保險金是否列入遺產」混成同一規則。","keywords":["所得稅","列舉扣除","人身保險費","遺產"]},{"id":"C25","subject":"保險法規","page":32,"title":"繼承順序、應繼分與特留分","definition":"配偶為法定繼承人；血親依直系血親卑親屬、父母、兄弟姊妹、祖父母順位繼承。應繼分是法律原則分配比例，特留分是對特定繼承人最低保障的比例。","example":"被繼承人有配偶及兩名子女，先看配偶與子女的應繼分，再視遺囑是否侵害特留分。","trap":"有指定身故受益人與未指定受益人，對保險金是否進入遺產的討論不同。","keywords":["繼承","特留分","應繼分","法定繼承"]},{"id":"C26","subject":"保險法規","page":33,"title":"遺產稅與贈與稅：變動數字專區","definition":"114 年版的遺產／贈與稅題目包含扣除額、免稅額、申報期間和稅率等；這些數字可能隨年度或修法調整，本 HTML 保留原題庫選項與原答案，不推定它等於 115 年最新規定。","example":"看到「現行公告喪葬費扣除額」時，先理解是年度性數字，再回查考試採用年度的公告。","trap":"原始題庫內若多題金額年代不一致，不能將其中一題的數字套用到所有年度。","keywords":["遺產稅","贈與稅","扣除額","免稅額"]},{"id":"C27","subject":"保險法規","page":36,"title":"業務員登錄、換證與懲處","definition":"保險業務員有資格測驗、登錄、教育訓練、換證與停招等不同程序，各自有適用對象與條件；不能把合格證照與現職登錄資格視同一物。","example":"考過測驗不代表不須登錄就能立刻以業務員名義招攬保險。","trap":"停招、註銷、撤銷登錄的效果不同；題目通常考適用期間、再登錄程序和是否能同業登錄。","keywords":["登錄","換證","教育訓練","業務員"]},{"id":"C28","subject":"保險法規","page":40,"title":"公平待客與金融消費爭議","definition":"金融業務應遵守廣告招攬真實、商品適合度、資訊揭露、合理處理申訴等原則。定型化契約如果對保戶顯失公平，涉及法定效力限制。","example":"客戶因誤導廣告購買不適合的保單，事後發現與當初理解不同，可能涉及契約爭議與金融消費者保護。","trap":"不是「只要保險公司寫在條款就一律有效」；也不能把金融消費評議當成一般保險理賠流程。","keywords":["公平待客","金融消費","廣告","定型化"]}],"rawNotes":[{"id":"R0","subject":"保險實務","page":2,"text":"風險定義:是指損失發生的不確定性 \n存在具備三要件:A 具有不確定性 B 有損失的可能 C 屬於將來性"},{"id":"R1","subject":"保險實務","page":2,"text":"人身保險對國家有哪些功能?A透過再保、拓展外交;B互助共濟、社會安寧;C\n健全經營、整合金融;D形成資本、以增國富 (1)ABCD(2)ACD(3)B\nCD(4)ABC\n風險衡量:主要預估一定期間(如一年內)風險發生所造成的損失金額,包括: \n(1) 損失發生的頻率(次數、機率) \n(2) 損失發生的幅度(損失金額) \n(3) 損失成本=損失頻率預期值*損失幅度預期值"},{"id":"R2","subject":"保險實務","page":3,"text":"傳統型年金/利率變動型年金保費及責任準備金計算基礎\n預定危險發生率以年金生命表___%為基礎 \n時間    94.1.1 之前               94.1.1~101.6.30      101.7,1~ \n【保險費】 100%-120%               自行決定           自行決定 \n【責任準備金】 100%                90%         台灣壽險業第二回年金生命表100%為基礎"},{"id":"R3","subject":"保險實務","page":4,"text":"人壽保險經驗生命表的演進: \n78 年 首次分【男、女性】表→第三回經驗生命表 \n92 年 計算【保費】生命表得【自行決定】 \n自110.7.1 起計提【責任準備金】之生命表採用【第六回】生命表100%"},{"id":"R4","subject":"保險實務","page":4,"text":"死亡率公式=年度內之死亡人數 \n           年初之生存人數"},{"id":"R5","subject":"保險實務","page":5,"text":"養老保險中為給付死亡保險金、殘廢保險金財源之保險費稱為:(1)死亡保險費\n(2))附加保險費 (3)純保險費(4)生存保險費"},{"id":"R6","subject":"保險實務","page":6,"text":"分紅保險契約變更為【展期定期保險】後,得由各保險公司【依其實際情況決定】採分紅或不分紅\n保單。 \n分紅保險契約【復效】者,至少應依當年度經過期間【比例給付紅利】。"},{"id":"R7","subject":"保險實務","page":9,"text":"連生共存年金:年金受領人有2 人以上,各該人皆生存時才給付年金,如其中有人死亡,則不再給\n付年金。 \n最後生存者年金:年金受領人有2 人以上,只要其中1 人仍生存,保險人應繼續給付年金至最後一\n位受領人死亡為止。"},{"id":"R8","subject":"保險實務","page":10,"text":"長期照顧保險:  (政府推動長期照顧保險 主管機關:衛生福利部   保險人:中央健康保險署) \n1.生理功能障礙:6 項生活自理能力(進食、移位、如廁、沐浴、平地移動、更衣)持續存有3 項以上\n障礙。(不得超過6 個月) \n2.認知功能障礙:持續失智狀態,且依臨床失智量表(CDR)評估達中度(含)以上者。 \n但專科醫師辦定前述生理與認知功能障礙為終身無法治癒者,則不受多少月之限制。\n重點\n補充\n癌症保險於投保時之等待期間最長得為【90 天】,且復效時【不得】再約定有等待\n期間"},{"id":"R9","subject":"保險實務","page":14,"text":"有權代收保費之人:保險公司所屬業務員、保險代理人、保險代理人所屬業務員 \n (不包含保險經紀人)"},{"id":"R10","subject":"保險實務","page":14,"text":"下列何者非保險業授權代收保險費之人?(1)保險經紀人公司所屬業務員(2)保\n險公司授權之所屬業務員(3)保險代理人公司所屬業務員(4)保險代理人"},{"id":"R11","subject":"保險實務","page":16,"text":"哪些是保戶申請要保前應該提供給保戶之資料?A條款樣本;B人壽保險投保人須\n知;C商品說明書;D保單紅利試算表(1)BCD(2)ABC(3)ABCD\n(4)AB"},{"id":"R12","subject":"保險實務","page":18,"text":"保險法規精選_114 版\n人身保險契約的當事人:保險人與要保人 \n【保險人】是指經營人身保險事業的人,目前保險業組織均為股份有限公司。 \n【要保人】對被保險人具有保險利益,申請訂立契約並交付保險費之人,為自然人或法人(公司,機關\n團體)皆可。 \n人身保險契約的關係人:被保險人與受益人\n【被保險人】是以其生命、身體為保險標的,只要是自然人即可。 \n【受益人】是保險事故發生後,享有賠償請求權之人,法人或自然人皆可,以請求時生存者為限。 \n受益人產生的方式: \n(1)約定:載明受益人之姓名及被保險人的關係或確定受益人的方法。 \n(2)指定:由要保人指定,如滿期金、身故保險金受益人。 \n(3)法定:受益人有疑義時,法律推定【要保人】為受益人。 \n失能、醫療保險金及年金保險被保險人生存時,受益人限被保險人本人,且【不得】事後變更受益\n人。"},{"id":"R13","subject":"保險法規","page":19,"text":"保險法140 條:保險公司得簽訂參加保單紅利之保險契約。保險合作社簽訂之保險契約,以參加保單\n紅利者為限。前二項保單紅利之計算基礎及方法,應於保險契約中明訂之。"},{"id":"R14","subject":"保險法規","page":20,"text":"滿7 歲以上之未成年人,「有」限制行為能力,其所為意思表示及所受意思表示,應得法定代理人之允\n許,但【純獲法律上利益或日常生活】所必須者,不在此限。"},{"id":"R15","subject":"保險法規","page":21,"text":"要保人對下列各人之生命身體有保險利益: \n(1)本人或其家屬 \n(2)生活費或教育費所仰給之人,如甲提供生活費教育費給乙,則乙對甲有保險利益。\n(3)債務人,債權人僅能於債務人所欠債務金額內有保險利益。 \n(4)為本人管理財產或利益之人"},{"id":"R16","subject":"保險法規","page":22,"text":"損害填補原則及分攤原則於人身保險中僅適用實支實付健康險,分攤原則是指保險人與保險人之間對\n於理賠金額之分攤。 \n保險代為原則又稱權利代位,保險人得於給付賠償金額後,代位行使要保人對第三人的請求權,僅適\n用財產保險,人身保險皆不適用。"},{"id":"R17","subject":"保險法規","page":23,"text":"終止契約:分為\n人為終止:(1)要保人終止:可隨時終止---若有解約金可拿回解約金 \n          (2)保險人終止:於保險契約停效期間屆滿而要保人仍未申請復效時,契約失效(終止) \n法定終止:(1)當保險人破產時,保險契約於【破產宣告當天】終止 \n          (2)保險標的物非因保險契約所載之保險事故而完全滅失時 。"},{"id":"R18","subject":"保險法規","page":23,"text":"保險法第64 條:訂立保險契約時,要保人對保險人之書面詢問應據實說明,要保人有為隱匿或遺漏不\n為說明,足以變更或減少保險人之危險之估計者,保險人得解除契約,其危險發生後亦同。保險人無\n須退還保費。 \n解除權,自保險人【知】有解除之原因後,經過【一個月】不行使而消滅;或契約訂定後經過二年,\n即有可以解除之原因,亦不得解除契約。契約一經解除,則自始無效。"},{"id":"R19","subject":"保險法規","page":24,"text":"續期保費交付: \n(1)年繳及半年繳者,自催告到達翌日起30 日為寬限期。 \n(2)季繳及月繳者,自應繳日翌日起30 日為寬限期。 \n(3)金融機構轉帳,不論繳別,自催告到達翌日起30 日為寬限期。 \n寬限期內發生事故,保險公司仍負給付保險金責任,逾寬限期間仍未繳付保險費者,契約至寬限期間\n終了之翌日起【停止】效力。"},{"id":"R20","subject":"保險法規","page":25,"text":"保險契約復效:期限自保單停效日起不得低於2 年,復效期限屆滿前3 個月以書面、電子郵件等擇一\n方式通知要保人。 \n(1)停效6 個月內清償保費扣除停效期間危險保費及約定利息後於翌日上午零時恢復效力。 \n(2)停效6 個月後復效,保險人於【5 日】內要求提供可保證明,保險人收到後於【15 日】內不為拒\n絕,視為同意復效。 \n(3)復效好處可以原投保年齡繳費,維持原保單保單價值準備金,無論在滿期、解約金計算,紅利分配\n都比重新保有利。"},{"id":"R21","subject":"保險法規","page":27,"text":"由第三人訂立之死亡保險契約,未經被保險人書面承認並約定保險金額者,任何人均可主張契約無\n效。 \n但若為【年金保險契約】則有效,因為年金保險無風險。"},{"id":"R22","subject":"保險法規","page":28,"text":"人壽保險、年金保險之保費不得訴訟請求交付。 \n傷害保險、健康保險保費得訴訟請求交付。 \n保險契約涉訟者,以【要保人】住所為第一審管轄法院,若要保人住所於中華民國境外,則以【雙方\n契約約定】之地方法院為第一審管法院。"},{"id":"R23","subject":"保險法規","page":31,"text":"依據所得稅法規定,納稅義務人本人、配偶或受撫養直系親屬之【人身保險費】以列舉方式申報,得\n從個人所得總額扣除,每人每年上限2.4 萬元。 \n不能扣除的有:兄弟姐妹費保費、產險保費、非同一申報戶保費。 \n營利事業所得稅:團體保險保費於每人新台幣 $2,000 元/月以內,不列入員工個人薪資所得(不包含\n團體投資型保險)。"},{"id":"R24","subject":"保險法規","page":32,"text":"所得稅法規定符合一定條件的A滿期保險金;B醫療保險金;C失能保險金;D死亡\n保險金(1) ABCD(2)ABC(3)BD(4)BCD 得免納所得稅"},{"id":"R25","subject":"保險法規","page":32,"text":"法定繼承人之優先順序:配偶為當然繼承人 \n(1)直系血親卑親屬(子女優先) (2)父母 (3)兄弟姊妹(4)祖父母 \n應繼分:配偶與子女依人數均分,配偶與父母各 1/2,配偶與兄弟姊妹各1/2,配偶與祖父母,配偶\n2/3,祖父母1/3 \n特留分:配偶應繼分1/2,子女應繼分1/2,父母應繼分1/2,兄弟姊妹1/3,祖父母1/3"},{"id":"R26","subject":"保險法規","page":37,"text":"業務員經登錄後,取得相關資格後, \n保險業、保險代理人公司之業務員得登錄於另一家非經營同類保險業務之保險業【或】保險代理人公\n司。 \n保險【經紀人】公司之業務員得登錄為另一家非經營同類保險業務之保險【經紀人】公司,同時為財產\n險及人身保險業務員。"},{"id":"R27","subject":"保險法規","page":38,"text":"再登錄: \n(1)業務員經註銷登錄後,轉任其他公司或再回任職原所屬公司,重新辦理登錄者。 \n(2)受經營同類保險業務之停止招攬處分期間屆滿後,重新辦理登錄者。"},{"id":"R28","subject":"保險實務","page":1,"text":"風險的類別：客觀／主觀風險、純粹／投機風險、靜態／動態風險、基本／特定風險。客觀風險可觀察衡量；純粹風險只有損失機會，投機風險也有獲利可能。"},{"id":"R29","subject":"保險實務","page":2,"text":"依據風險衡量的結果分為三類：特別嚴重的風險（損失頻率與幅度皆高）；重要風險（一高一低）；不重要風險（皆低）。風險衡量指損失頻率與幅度，損失成本為兩者預期值乘積。"},{"id":"R30","subject":"保險實務","page":6,"text":"分紅保單：民國92年起可銷售依經營損益為分紅依據之商品。利差益、死差益及費差益可能成為分紅來源。給付方式可包括儲存生息、增額繳清、抵繳保費、現金給付。"},{"id":"R31","subject":"保險實務","page":8,"text":"利率固定型年金：非躉繳為定期定額，給付固定年金。利率變動型年金：可躉繳、非躉繳定期或不定期繳費；年金給付可能固定或變動。"},{"id":"R32","subject":"保險實務","page":9,"text":"連生共存年金：有兩人以上受領人，全部均生存才給付；最後生存者年金：只要還有一人生存，就持續給付至最後一人死亡。"},{"id":"R33","subject":"保險實務","page":16,"text":"家庭保障需求規劃：通常要評估家庭生活資金、購屋、子女教育、借款償還、醫療及退休資金等；重點是計算家庭財務缺口，而非只憑可負擔保費決定保障額。"},{"id":"R34","subject":"保險法規","page":18,"text":"契約當事人：保險人、要保人。契約關係人：被保險人、受益人。要保人可為自然人或法人；被保險人以其生命、身體為保險標的；受益人有領取保險金的權利。"},{"id":"R35","subject":"保險法規","page":21,"text":"保險利益：要保人對本人或家屬、生活費或教育費所仰給的人、債務人、為本人管理財產或利益的人有保險利益。債權人對債務人的保險利益，題庫提示以欠款金額為限。"},{"id":"R36","subject":"保險法規","page":22,"text":"損害填補原則旨在避免不當得利；分攤原則涉及多個保險人間的賠償分攤。保險代位原則主要討論財產保險，不能把所有人身保險一概視同財產險。"},{"id":"R37","subject":"保險法規","page":25,"text":"保單復效：從停效日起在法定／約定期限內申請。題庫有停效六個月內外申請的程序差別、提供可保證明的期限及通知義務等；法定期限應以考前最新版為準。"},{"id":"R38","subject":"保險法規","page":32,"text":"法定繼承順序：配偶是當然繼承人，血親順序為直系血親卑親屬、父母、兄弟姊妹、祖父母。應繼分與特留分是不同概念。"},{"id":"R39","subject":"保險法規","page":40,"text":"公平待客及定型化契約：契約疑義應作有利保戶的解釋；金融服務業廣告與招攬應真實、商品適合度應被重視，不能以定型化條款免除法定義務。"}]}</script>
<script>
'use strict';
const DB=JSON.parse(document.getElementById('DATA').textContent);const Q=DB.questions,CH=DB.lessons;const qMap=Object.fromEntries(Q.map(q=>[q.id,q]));
const STORE='insurance-study-v2';let persist={solved:{},wrong:{},bookmark:{},done:{},fluent:{},lastLesson:0,flashIndex:0};try{let raw=JSON.parse(localStorage.getItem(STORE));if(raw&&typeof raw==='object')persist={...persist,...raw}}catch(e){}
let S={view:'home',subject:'全部',chapter:null,quizIds:[],qIndex:0,selected:null,sessionCorrect:0,sessionCount:0,quizType:'all',search:'',searchMode:'questions',flashShow:false,flashIndex:0,limit:10,reviewOnly:false};
function save(){try{localStorage.setItem(STORE,JSON.stringify(persist))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function Lby(ch,sub){return CH.find(l=>l.chapter===ch&&l.subject===sub)}
function lessons(){return CH.filter(l=>S.subject==='全部'||l.subject===S.subject)}
function scopeQ(ch){return Q.filter(q=>(S.subject==='全部'||q.subject===S.subject)&&(!ch||q.chapter===ch))}
function qOf(l){return Q.filter(q=>q.subject===l.subject&&q.chapter===l.chapter)}
function doneCount(l){return l.topics.filter(t=>persist.done[t.id]).length}
function attempted(){return Object.keys(persist.solved).length}
function pct(a,b){return b?Math.round(a/b*100):0}
function toast(t){let prev=document.querySelector('.snackbar');if(prev)prev.remove();let e=document.createElement('div');e.className='snackbar';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function scrolltop(){window.scrollTo({top:0,behavior:'instant'})}
function setView(v,chapter=null){S.view=v;if(chapter!==null)S.chapter=chapter;S.selected=null;S.search='';render();scrolltop();document.getElementById('sidebar').classList.remove('open')}
function setSubject(sub){S.subject=sub;S.chapter=null;S.view='read';render();scrolltop()}
function nav(){let navs=[['home','⌂','學習總覽'],['read','▤','觀念教材'],['quiz','✎','題庫練習'],['flash','▧','觀念記憶卡'],['wrong','↺','錯題複習'],['saved','☆','收藏題目'],['search','⌕','搜尋教材與題目']];let out='<div class="nav-name">學習功能</div>';for(let [key,ic,name] of navs)out+=`<button class="navbtn ${S.view===key?'active':''}" data-action="nav" data-to="${key}"><span class="navicon">${ic}</span>${name}${key==='wrong'?`<span class="navcount">${Object.keys(persist.wrong).length}</span>`:''}</button>`;out+='<div class="nav-name">課程科目</div>';for(let sb of ['全部','保險實務','保險法規'])out+=`<button class="navbtn ${S.subject===sb?'active':''}" data-action="subject" data-val="${sb}"><span class="navicon">${sb==='全部'?'◎':sb==='保險實務'?'◈':'◇'}</span>${sb==='全部'?'全部教材':sb}<span class="navcount">${sb==='全部'?1094:sb==='保險實務'?430:664}</span></button>`;out+='<div class="nav-name">課程章節</div>';for(let l of lessons())out+=`<button class="chapterbtn ${S.chapter===l.id&&S.view==='read'?'active':''}" title="${esc(l.chapter)}" data-action="read" data-id="${l.id}"><span class="chaptbtntext">${esc(l.chapter.replace(/^第[一二三四五六七八九十]+章\s*/,''))}</span><span class="navcount">${doneCount(l)}/${l.topics.length}</span></button>`;document.getElementById('sidenav').innerHTML=out;

<div class="sectionhead"><h2>課程地圖</h2><button class="btn small" data-action="nav" data-to="read">檢視全部章節 →</button></div><div class="chapter-cards">${CH.filter(l=>['第一章 風險管理與保險','第一章 人身保險契約','第四章 人身保險的構造','第二章 人身保險契約條款'].includes(l.chapter)).map(chapterCard).join('')}</div><div style="margin-top:22px" class="note"><strong>法規提醒：</strong>本教材依你上傳的題庫原答案整理。法規、稅額、利率、期間與資格規範可能更新；題庫不是現行法規的替代品，考前請依當期官方資料核對。原題庫中的數字不會被偷偷改寫。</div>`}

function quizSetup(){let scope=scopeQ();let chapters=lessons();return `<h1 class="h1">題庫練習</h1><p class="lead">答完立刻顯示正確／錯誤，搭配題庫提供的原始解析；可針對章節練習，也可隨機抽題。</p><div class="quizintro"><div class="sectionhead" style="margin:0 0 17px"><h2>建立這次的測驗</h2><span class="label grey">共 ${scope.length} 題可選</span></div><div class="toolbar"><label>科目</label>${subjectFilter()}<label>章節</label><select class="select" id="chapterfilter"><option value="">全部章節</option>${chapters.map(l=>`<option value="${l.id}" ${S.chapter===l.id?'selected':''}>${esc(l.subject+' · '+l.chapter)}</option>`).join('')}</select><label>題數</label><select class="select" id="limitfilter"><option value="10">10 題｜快速複習</option><option value="20">20 題｜加強練習</option><option value="30">30 題｜模擬測驗</option><option value="all">本範圍全部題目</option></select></div><div class="actions"><button class="btn primary" data-action="start" data-type="random">隨機抽題開始 →</button><button class="btn" data-action="start" data-type="sequential">按題號依序練習</button><button class="btn ghost" data-action="nav" data-to="wrong">只練錯題（${Object.keys(persist.wrong).length}）</button></div></div><div class="note">判斷題目「何者錯誤」時，要選的是錯誤敘述；答題後會顯示題庫原本的正解和解析。原解析若沒逐一解釋每個干擾選項，網頁也不會假稱原題庫有解釋。</div>`}
function quizQuestion(){let q=qMap[S.quizIds[S.qIndex]];if(!q)return `<div class="empty">題目已結束 <button class="btn" data-action="finish">查看結果</button></div>`;let picked=S.selected;let total=S.quizIds.length;let correct=picked===q.answer;let answered=picked!==null;return `<div class="quizbar"><div><span class="eyebrow">${S.quizType==='wrong'?'錯題加強':S.quizType==='saved'?'收藏題練習':S.quizType==='single'?'單題練習':'題庫挑戰'}</span><div class="tiny" style="margin-top:5px">${esc(q.subject)} ・ ${esc(q.chapter)} ・ PDF 第 ${q.page} 頁</div></div><div class="tiny"><strong style="font-size:21px;color:#153f40">${S.qIndex+1}</strong> / ${total}</div></div>${progressbar(S.qIndex,total)}<div style="height:9px"></div><div class="question-card"><div class="panelhead"><span class="label">原題 #${q.number}</span><button class="btn small ${persist.bookmark[q.id]?'soft':''}" data-action="bookmark" data-id="${q.id}">${persist.bookmark[q.id]?'★ 已收藏':'☆ 收藏此題'}</button></div><div class="qstem">${esc(q.stem)}</div><div class="options">${q.options.map((opt,i)=>`<button class="option ${answered&&i+1===q.answer?'correct':''} ${answered&&i+1===picked&&picked!==q.answer?'wrong':''}" data-action="answer" data-val="${i+1}" ${answered?'disabled':''}><span class="letter">${i+1}</span><span>${esc(opt)}</span>${answered&&i+1===q.answer?'<span style="margin-left:auto">✓</span>':''}</button>`).join('')}</div>${answered?`<div class="explain"><div class="result ${correct?'good':'bad'}">${correct?'✓ 答對了！':'✕ 這題答錯了'}　｜　正確答案是（${q.answer}）</div><div style="font-weight:800;font-size:13px;color:#40565b">題庫原始解析</div><p>${esc(q.explanation)}</p><div class="caption" style="margin-top:15px">來源：${esc(q.subject)}精選題庫，第 ${q.page} 頁，題號 ${q.number}。解析為原題庫內容，個別法規數字須考前核對。</div></div>`:''}<div class="qfoot">${answered?`<button class="btn primary" data-action="next">${S.qIndex===total-1?'看測驗結果':'下一題 →'}</button>`:'<span class="caption">點選一個選項作答，或按鍵盤 1～4</span>'}<span class="right caption">已作答 ${S.sessionCount} 題／答對 ${S.sessionCorrect} 題</span></div></div>`}
function endQuiz(){let percent=pct(S.sessionCorrect,S.sessionCount);return `<div class="empty"><div class="emoji">${percent>=80?'🏆':'📘'}</div><div class="eyebrow">SESSION COMPLETE</div><h1 class="h1">這輪完成了！</h1><p class="lead" style="margin:auto">共答對 ${S.sessionCorrect} / ${S.sessionCount} 題，正確率 <strong>${percent}%</strong>。${percent>=80?'理解越來越紮實了。':'答錯並不可怕，錯題是下一輪最有效的教材。'}</p><div class="actions" style="justify-content:center"><button class="btn primary" data-action="nav" data-to="wrong">複習錯題 →</button><button class="btn" data-action="nav" data-to="quiz">再來一回測驗</button><button class="btn" data-action="nav" data-to="read">回觀念教材</button></div></div>`}
function listMode(kind){let ids=Object.keys(kind==='wrong'?persist.wrong:persist.bookmark).filter(id=>qMap[id]).filter(id=>S.subject==='全部'||qMap[id].subject===S.subject);let label=kind==='wrong'?'錯題複習':'收藏題目';return `<h1 class="h1">${label}</h1><p class="lead">${kind==='wrong'?'答錯的題目會自動收錄，重新答對後會從錯題清單移除。':'保留你想日後再看的重點題目，方便集中練習。'}</p><div class="toolbar">${subjectFilter()}<span class="caption">目前 ${ids.length} 題</span></div>${!ids.length?`<div class="empty"><div class="emoji">${kind==='wrong'?'🎉':'☆'}</div><h3>${kind==='wrong'?'目前沒有待複習錯題':'還沒有收藏題目'}</h3><p>${kind==='wrong'?'去挑戰新題目吧，答錯後就會收錄在這裡。':'答題畫面右上角點選「收藏此題」。'}</p><button class="btn primary" data-action="nav" data-to="quiz">開始練習 →</button></div>`:`<div class="actions" style="margin-bottom:20px"><button class="btn primary" data-action="start" data-type="${kind}">練習這 ${ids.length} 題 →</button>${kind==='wrong'?'<span class="caption">練習答對後自動清除錯題標記</span>':''}</div><div class="search-results">${ids.map(id=>{let q=qMap[id];return `<button class="search-item" data-action="one" data-id="${id}"><span class="label grey">${esc(q.subject)} · 題號 ${q.number}</span><strong>${esc(q.stem.slice(0,125))}</strong><small>${esc(q.chapter)} · PDF P.${q.page} →</small></button>`}).join('')}</div>`}`}
function flash(){let topiclist=lessons().flatMap(l=>l.topics.map(t=>({...t,subject:l.subject,chapter:l.chapter})));if(!topiclist.length)return'';let n=((S.flashIndex%topiclist.length)+topiclist.length)%topiclist.length,t=topiclist[n];return `<h1 class="h1">觀念記憶卡</h1><p class="lead">看到名詞，先在心裡說出定義，再翻面核對。背得出概念，比只記答案選項更能應付變化題。</p><div class="quizbar"><div class="caption">${esc(t.subject)} · ${esc(t.chapter)}</div><div class="caption">第 ${n+1} / ${topiclist.length} 張</div></div>${progressbar(n+1,topiclist.length)}<div class="flashcard" data-action="flip" role="button" tabindex="0"><div class="mini">${S.flashShow?'背面｜重點定義':'正面｜想想定義'}</div><h3>${esc(t.title)}</h3>${S.flashShow?`<p>${esc(t.definition)}</p><p style="color:#587d74">例：${esc(t.example)}</p>`:`<p style="color:#72918a">你能自己說出意思，再舉一個例子嗎？</p>`}<span class="caption">點一下翻面</span></div><div class="minirow"><button class="btn" data-action="flash-prev">← 上一張</button><button class="btn soft" data-action="flip">${S.flashShow?'收起答案':'翻面看解釋'}</button><button class="btn primary" data-action="flash-next">下一張 →</button></div>`}
function search(){let text=S.search.trim().toLowerCase(),t=[];if(text)t=Q.filter(q=>(S.subject==='全部'||q.subject===S.subject)&&(q.stem.toLowerCase().includes(text)||q.options.some(o=>o.toLowerCase().includes(text))||q.explanation.toLowerCase().includes(text)));let topics=text?lessons().flatMap(l=>l.topics.filter(t=>(t.title+t.definition+t.example+t.trap).toLowerCase().includes(text)).map(t=>({...t,chapterId:l.id,chapter:l.chapter,sub:l.subject}))):[];return `<h1 class="h1">搜尋教材與題目</h1><p class="lead">輸入關鍵字，例如「保險利益」、「復效」、「純粹風險」、「受益人」。</p><div class="toolbar"><input class="input searchbar" id="searchinput" value="${esc(S.search)}" placeholder="輸入要找的觀念或題目" autocomplete="off"><button class="btn primary" data-action="dosearch">搜尋</button>${subjectFilter()}</div>${text?`<div class="sectionhead"><h2>觀念單元 <span class="caption">${topics.length} 項</span></h2></div><div class="search-results">${topics.slice(0,25).map(t=>`<button class="search-item" data-action="jump-topic" data-id="${t.chapterId}" data-topic="${t.id}"><span class="label">${esc(t.sub)}</span><strong>${esc(t.title)}</strong><small>${esc(t.chapter)} →</small></button>`).join('')||'<p class="caption">沒有符合的觀念文章。</p>'}</div><div class="sectionhead"><h2>題庫原題 <span class="caption">${t.length} 題</span></h2></div><div class="search-results">${t.slice(0,70).map(q=>`<button class="search-item" data-action="one" data-id="${q.id}"><span class="label grey">${esc(q.subject)} #${q.number}</span><strong>${esc(q.stem.slice(0,140))}</strong><small>來源第 ${q.page} 頁 →</small></button>`).join('')||'<p class="caption">沒有符合的題目。</p>'}</div>${t.length>70?'<p class="caption">為避免頁面過長，僅顯示前 70 題。可使用更具體的關鍵字。</p>':''}`:'<div class="empty"><div class="emoji">⌕</div><h3>找到你真正想懂的觀念</h3><p>可以同時搜尋文章標題、定義、例子，以及題目與原始解析。</p></div>'}`}
function startQuiz(type,chapterId){let list;S.quizType=type;if(type==='wrong'){list=Object.keys(persist.wrong).map(id=>qMap[id]).filter(Boolean).filter(q=>S.subject==='全部'||q.subject===S.subject)}else if(type==='saved'){list=Object.keys(persist.bookmark).map(id=>qMap[id]).filter(Boolean).filter(q=>S.subject==='全部'||q.subject===S.subject)}else if(type==='single'){list=[qMap[chapterId]].filter(Boolean)}else {let lid=type==='chapter'?Number(chapterId):S.chapter;let l=CH.find(l=>l.id===lid);list=scopeQ(type==='chapter'&&l?l.chapter:undefined);if(type!=='chapter'&&l)list=list.filter(q=>q.chapter===l.chapter&&q.subject===l.subject);if(type==='chapter'&&l)list=list.filter(q=>q.subject===l.subject)}if(!list.length){toast('這個範圍目前沒有題目');return}if(type==='random'||type==='chapter'||type==='wrong'||type==='saved')for(let i=list.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}let lim=document.getElementById('limitfilter');let n=lim?lim.value:'10';if(type==='single'){n=1}else if(type==='wrong'||type==='saved'||type==='chapter'){n='all'}let max=n==='all'?list.length:Number(n||10);S.quizIds=list.slice(0,max).map(q=>q.id);S.qIndex=0;S.selected=null;S.sessionCorrect=0;S.sessionCount=0;S.view='quiz';render();scrolltop()}
function answer(v){if(S.selected!==null||!S.quizIds.length)return;let q=qMap[S.quizIds[S.qIndex]];S.selected=v;S.sessionCount++;if(v===q.answer){S.sessionCorrect++;delete persist.wrong[q.id]}else persist.wrong[q.id]=true;let old=persist.solved[q.id]||{n:0,right:0};persist.solved[q.id]={n:old.n+1,right:old.right+(v===q.answer?1:0),last:v===q.answer};save();render()}

function cramPage(){let a=examStats();let d=daysLeft(), t=d>20?0:d>10?1:d>3?2:3;let stages=[['第一階段｜搭建觀念','依章節讀定義、生活例子及易錯辨析；每天練一批未作答的公會題。'],['第二階段｜整合題型','公會 114 版重點練透；每次練題後看解析，錯題隔天再測一次。'],['第三階段｜考前模擬','每天兩科交替 30 題模擬，弱章節另外練習，法規金額與期限集中核對。'],['最後三天｜只看重點','重做錯題與收藏題、翻重點記憶卡，不再盲目大量刷全新題。']];return `<h1 class="h1">11/14 考前衝刺計畫</h1><p class="lead">考試是 2026 年 11 月 14 日。以下排程會隨台灣日期調整；可以離線使用，不需要帳號登入。</p><div class="stats"><div class="stat"><span class="big">${d}</span><span class="name">距考試天數</span></div><div class="stat"><span class="big">${a.read}/${a.total}</span><span class="name">公會精選進度</span></div><div class="stat"><span class="big">${a.rate}%</span><span class="name">公會最近一答對率</span></div><div class="stat"><span class="big">${a.wrong}</span><span class="name">公會錯題</span></div></div><div class="grid2">${stages.map((st,i)=>`<div class="panel" style="border-color:${i===t?'#7baf9d':'var(--line)'}"><span class="label ${i===t?'':'grey'}">${i===t?'目前建議階段':'學習階段 '+(i+1)}</span><h3 class="chapter-name">${st[0]}</h3><p class="subtle">${st[1]}</p></div>`).join('')}</div><div class="sectionhead"><h2>今天就從這裡開始</h2></div><div class="grid2"><div class="panel"><span class="label gold">先懂觀念</span><h3 class="chapter-name">${CRAM.length} 篇公會版重點精講</h3><p class="subtle">整理新 PDF 的分類、金額公式、保單運作、繼承和業務員法規；每篇含定義、實例與反例。</p><button class="btn primary" data-action="nav" data-to="notes">開始讀精講 →</button></div><div class="panel"><span class="label gold">再做考題</span><h3 class="chapter-name">公會精選 ${a.total} 題</h3><p class="subtle">涵蓋兩個考科並保留原 PDF 頁碼與答案。兩份舊題庫仍可選擇混合練習。</p><div class="actions"><button class="btn primary" data-action="start" data-type="priority" data-count="20">隨機 20 題 →</button><button class="btn" data-action="start" data-type="priority-unseen" data-count="20">只做未練題 →</button></div></div></div><div class="sectionhead"><h2>兩科交替練習</h2></div><div class="panel"><p class="subtle">建議把每天的練題時間分成兩部分：<b>保險實務</b>側重概念、風險管理、保費計算與商品差異；<b>保險法規</b>側重契約角色、告知、停復效、受益人及金額期限。</p><div class="actions"><button class="btn" const oldSearch=search;search=function(){let h=oldSearch();let kw=S.search.trim();if(!kw)return h;let m=CRAM.filter(n=>(n.title+n.definition+n.example+n.trap).includes(kw));return h.replace('<div class="sectionhead"><h2>題庫原題',`<div class="sectionhead"><h2>公會精講 <span class="caption">${m.length} 篇</span></h2></div><div class="search-results">${m.slice(0,20).map(n=>`<button class="search-item" data-action="open-note" data-id="${n.id}"><span class="label gold">公會精講 · P.${n.page}</span><strong>${esc(n.title)}</strong><small>${esc(n.definition.slice(0,100))} →</small></button>`).join('')||'<p class="caption">沒有符合的公會精講。</p>'}</div><div class="sectionhead"><h2>題庫原題`)};
// Event delegation hook placed in capture phase to handle new actions alongside old actions.
document.addEventListener('click',function(e){let x=e.target.closest('[data-action]');if(!x)return;let a=x.dataset.action;if(a==='fluent'){e.stopImmediatePropagation();persist.fluent[x.dataset.id]=!persist.fluent[x.dataset.id];save();render();return;}if(a==='open-note'){e.stopImmediatePropagation();S.subject='全部';setView('notes');setTimeout(()=>document.getElementById('cram-'+x.dataset.id)?.scrollIntoView({behavior:'smooth'}),40);return;}if(a==='priority-sub'){e.stopImmediatePropagation();S.subject=x.dataset.sub;startQuiz('priority',20);return;}},true);
document.addEventListener('change',e=>{if(e.target.id==='sourcefilter')S.pool=e.target.value;});

// Portable offline study history; a JSON export is optional and can be reimported into this same HTML.
document.addEventListener('click',function(e){let x=e.target.closest('[data-action]');if(!x)return;if(x.dataset.action==='backup'){e.stopImmediatePropagation();let blob=new Blob([JSON.stringify({app:'insurance-study',version:3,created:new Date().toISOString(),progress:persist},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='保險證照學習進度備份.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已匯出學習紀錄備份');}if(x.dataset.action==='restore'){e.stopImmediatePropagation();document.getElementById('progressimport')?.click();}},true);
document.addEventListener('change',async function(e){if(e.target.id!=='progressimport')return;let f=e.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.app!=='insurance-study'||!obj.progress||typeof obj.progress!=='object'||!obj.progress.solved||!obj.progress.done)throw Error('不是本網站的有效進度備份');persist={...persist,...obj.progress};save();render();toast('學習紀錄已載入');}catch(ex){alert('匯入失敗：'+ex.message)}finally{e.target.value='';}});

const originalSetSubject=setSubject;setSubject=function(sub){if(S.view==='notes'){S.subject=sub;render();scrolltop();return;}originalSetSubject(sub)};
// Cosmetic counts shown in legacy side menu already use original-bank totals; update in the newly added panel.

render();
</script></body></html>
