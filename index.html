身風險事故發生時可能導致 A遺族生活費用增加;B老年退休費用減少;C醫療費用增加;D收入減少","options":["ABC","ACD","BCD","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P132","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":133,"page":16,"answer":1,"stem":"哪些是契約危險選擇時應考量之項目?A被保險人的收入;B要保人的投保動機;\nC被保險人的職業;D被保險人的既往症、現症、家族遺傳病史","options":["ABCD","BD","BCD","CD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P133","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":134,"page":16,"answer":1,"stem":"要保人以自己為被保險人投保人壽保險,業務員對其家族應注意","options":["是否有人患有遺傳性疾病","是否有人從事危險職業","家人是否已投保","以上皆應注意"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P134","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":135,"page":16,"answer":1,"stem":"下列何者係壽險業務員招攬時應注意之事項?A受益人是否被拒保;B投保金額是否過高致有道德風險之虞;C受益人對被保險人是否有保險利益;D要保人是否有遺傳疾病","options":["B","ABCD","BCD","BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P135","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":136,"page":16,"answer":4,"stem":"下列何種情況,業務員應洽經驗較豐富公司之專任醫師或特約醫師擔任體檢工作?\nA被保險人投保的保險金額相當高; B被保險人過去有未能承保的紀錄;C被保險人過去有增加其他條件仍不能承保的紀錄;D要保人與被保險人非同一人","options":["ACD","ABCD","BCD","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P136","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":137,"page":16,"answer":3,"stem":"下列何者是保險公司核保的參考依據?A醫師的體檢報告書;B調查員的調查報告;C保戶填寫的要保文件;D業務員報告書","options":["BCD","ABD","AB\nCD","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P137","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":138,"page":16,"answer":4,"stem":"下列何者非屬壽險公司承保新契約時契約選擇之程序?","options":["業務員的選擇","核保人員的選擇","公司體檢醫師的選擇","生存調查人員的選擇"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P138","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":139,"page":16,"answer":2,"stem":"哪些是保戶申請要保前應該提供給保戶之資料?A條款樣本;B人壽保險投保人須知;C保單紅利試算表;D保險商品和定存利率比較表","options":["BCD","AB","ABCD","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P139","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":140,"page":16,"answer":1,"stem":"何者是防止道德風險之重要資料,應慎重處理? A 被保險人體格檢查書;B 被保險人告知書;C 被保險人之生存調查單;D 業務員填寫的招攬報告書","options":["A\nBCD","AD","ABC","AB"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P140","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":141,"page":16,"answer":3,"stem":"保險規劃書是向顧客說明保險公司提供的保障內容,用來解決顧客家庭經濟問題最有效的方式,該規劃書最少應具備A 契約內容;B保險名稱及特色;C退佣比例;D給付範圍及金額","options":["BD","BC","ABD","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P141","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":142,"page":17,"answer":3,"stem":"電話行銷人員行銷保險A應說明行銷目的及確認要保人身分;B應告知行銷人員姓名、登錄字號及所屬公司名稱;C依個人資料保護法,電話行銷過程不得錄音並備份存檔;D電話行銷人員若違反辦理電話行銷業務應注意事項,所屬公司應依規定予以懲處","options":["ABCD","AB","ABD","BD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P142","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":143,"page":17,"answer":1,"stem":"以下敘述何者正確? A家庭生活資金計算係以老么大學畢業的期間作為必要期間計算;B購屋資金計算係考量一旦家庭斷絕經濟來源後如何繼續繳付剩餘房屋價款;C借款償還金係以每月償還額乘上償還期間計算償還總額;D臨時預備金一般為現在每個月的生活費用的6個基數","options":["ABC","ABCD","BCD","ABD"],"explanation":"臨時預備金一般為現在每個月的生活費用的3 個基數","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P143","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":144,"page":17,"answer":3,"stem":"下列敘述正確? A要保人如尚未成年,皆須經過法定代理人簽章同意契約始生效;B 被保險人之職業須確實填寫;C 要保人或被保險人不能親自填寫者,保險契約得由業務員代為填寫再由保戶親自簽名;D保險契約保戶親自簽名處如為保戶親自按指印,其意思表示及效力與親簽一樣","options":["ABC","BC","ABD","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P144","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":145,"page":17,"answer":4,"stem":"保單轉換生效後,發生何種事情,保險公司不應提供回復契約之權利?","options":["保險公司無不實引導轉換,且舊保單之保險事故已發生始主張撤銷該次轉換","轉換後新保單已開始給付保險金或已有申請理賠紀錄","保險公司無不實引導轉換,\n且轉換生效日起 3 年後始主張撤銷該次轉換","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P145","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":146,"page":17,"answer":2,"stem":"有關保單活化敘述何者正確?A舊保單需投保時間夠長已累積有保單價值準備金;\nB若舊保單之保單價值準備金不足轉換支付新契約保費時,則無法轉換;C保單活化制度對保戶百利無一害;D屬於功能性轉換,將他益型保單轉化為自益型保單","options":["ACD","AD","ABD","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P146","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":147,"page":17,"answer":1,"stem":"有關保單轉換前進行變更適合度評估,何者正確?A確認的對象除了要保人還包括被保險人;B目的係透過保險配置使保單活化更能符合現況需求;C應考量轉換新保單之預定利率較舊保單高,保費成本相對較高;D舊保單透過解約並扣除稅額後可能比保單轉換更划算","options":["ABD","BD","AB","ABCD"],"explanation":"新保單之預定利率較舊保單【低】","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P147","chapter":"第六章 投保實務與契約的選擇"},{"subject":"保險實務","number":148,"page":17,"answer":1,"stem":"有關保單活化之敘述,何者錯誤?","options":["保戶可考量實際需求僅作部分轉換,但轉換後則無法再轉換回舊保單","保單 活化目的使保戶重新檢視自身保單所需,已提升退休生活的保障","利用舊保單之保單價值準備金轉換投保醫療險、長照險或年金保險","保戶限向同一壽險公司之舊保單身故保險金轉換成新契約之生前養老金"],"explanation":"轉換後3 年內(反悔期)可以將保單再次轉回舊保單","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P148","chapter":"附錄"},{"subject":"保險實務","number":150,"page":17,"answer":4,"stem":"目前人身保險業所簽發的保單為","options":["僅提供紙本保單","可利用網路投保來簽發電子保單","不限紙本保單","僅選項2、3為真。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P150","chapter":"附錄"},{"subject":"保險實務","number":151,"page":17,"answer":2,"stem":"道德風險因素之敘述何者正確?A屬於無形風險因素;B指因個人不小心、冷漠導致增加風險事故發生的機會;C如為領取保險金而縱火的行為;D如疏忽維護已投保財產保險之保險標的","options":["AB","AC","BD","C"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P151","chapter":"附錄"},{"subject":"保險實務","number":152,"page":18,"answer":4,"stem":"要保人在繳付相當於第一次保險費的金額時,保險契約","options":["即時成立","等到保險公司同意承保時才成立","於契約成立後,效力溯自繳付日開始起算","僅第2、3 選項為是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P152","chapter":"附錄"},{"subject":"保險實務","number":153,"page":18,"answer":2,"stem":"勞工保險之職業災害保險給付項目不包括 A 傷病及醫療:B 失業及年老: C 死亡:D\n生育及避孕","options":["AB","BD","ABC","AD"],"explanation":"勞保職災範圍:傷病、醫療、失能、死亡","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P153","chapter":"附錄"},{"subject":"保險實務","number":154,"page":18,"answer":2,"stem":"下列何者錯誤?","options":["業務員行銷時應先強調保障型商品之重要性","壽險業利用金融科技的目的係為完全取代人的服務以利提升經營效率","壽險業應動態配置資產以因應低利率環境","壽險業應加強增員及業務員教育訓練,防止業務員發生休勤現象。"],"explanation":"壽險業利用金融科技的目的【並非】取代人的服務","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P154","chapter":"附錄"},{"subject":"保險實務","number":155,"page":18,"answer":4,"stem":"有關人身保險業務員登錄之敘述,何者錯誤?","options":["未依規定期限完成換證之業務員,所屬公司應停止其招攬行為","登錄證分為第1年至第5年度之登錄證與第\n6年度起登錄證二種","業務員自初次登錄日起每滿5年須完成教育訓練並辦理換證","未依規定期限完成換證之業務員,其登錄資格及測驗合格證號將被取消。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P155","chapter":"附錄"},{"subject":"保險實務","number":156,"page":18,"answer":2,"stem":"下列何者非屬壽險公會「保險科技運用共享平台」保險存摺服務有提供的的功能?","options":["提供身分驗證功能,讓保戶可以透過保險存摺進行身分驗證後,進行理賠申請","快速算出保戶人身保障缺口,提供保障補強之建議","支援單一登入功能,透過保險存摺登入保險公司,查詢更詳細的保單資訊","輕鬆查詢保戶之個人保單"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114P156","chapter":"附錄"},{"subject":"保險法規","number":1,"page":19,"answer":3,"stem":"按照我國保險法規定,受益人有疑義時,推定誰為受益人?","options":["被保險人","被保險人之法定繼承人","要保人","以上三者皆可。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L001","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":"補充-01","page":19,"answer":3,"stem":"依保險法第 45 條規定,受益人有疑義時,推定要保人為","options":["被保險人","受益人之繼承人","要保人自己","以上皆是 之利益而訂立"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L-補充-01","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":2,"page":19,"answer":3,"stem":"有關要保人之敘述何者正確?A保險契約當事人;B自然人;C機關行號;D對要保險對象需具有保險利益","options":["AB D","BCD","ABCD","CD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L002","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":3,"page":19,"answer":3,"stem":"何者非要保人可指定受益人領取之保險金? A失能保險金;B醫療保險金;C終身壽險保險金;D年金保險金","options":["BCD","ACD","ABD","AB"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L003","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":4,"page":19,"answer":4,"stem":"要保人何時應負通知保險人義務?","options":["為保險人所知者","依通常注意為保險人所應知,或無法諉為不知者","經保險人聲明不必通知者","為被保險人所知者"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L004","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":5,"page":19,"answer":4,"stem":"保險事故的通知,如要保人或被保險人不於所規定之期限內通知者,除非下列何種情形之一,否則對保險人所受之損失應自負賠償責任","options":["為他方所知者","依通常注意為他方所應知,或無法諉為不知者","一方對於他方經聲明不必 通知者","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L005","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":6,"page":19,"answer":1,"stem":"對於要保人的敘述,何者錯誤","options":["要保人訂立保險契約不得委由代理人代理","要保人可以為自然人或法人","要保人負有交付保險費之義務","要保人對被保險人須具有保險利益。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L006","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":7,"page":19,"answer":4,"stem":"要保人訂立契約須","options":["具有行為能力","不須具有行為能力","限制行為能力於限制原因消滅後自己承認","僅 1,3為是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L007","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":8,"page":19,"answer":3,"stem":"要保人故意致被保險人於死者,保險人","options":["無須給付保險金,但應退還所繳保險費","須給付保險金","無須給付保險金,但應退還保單價值準備金予應得之人或解交國庫","無須給付保險金、退還保單價值準備金及所繳保費"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L008","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":9,"page":19,"answer":4,"stem":"下列有關保險人之規定,何者為非?","options":["目前國內之保險公司均為股份有限公司","非保險業不得兼營保險業務","保險法之規定,保險業之組織以股份有限公司或合作社為限","人身保險人可為法人或自然人"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L009","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":10,"page":19,"answer":2,"stem":"下列敘述何者正確?A保險合作社簽訂之保險契約,得為分紅或不分紅保單;B保險公司簽訂之保險契約,以參加保單紅利者為限;C保單紅利計算基礎及方法應於保險契約中明訂;D保險合作社簽訂之保險契約,以參加保單紅利者為限","options":["AC","CD","ABC","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L010","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":11,"page":19,"answer":3,"stem":"依保險法規定,人身保險合作社之預定社員人數不得低","options":["800","1000","500","100 人"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L011","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":12,"page":19,"answer":1,"stem":"受益人經指定後","options":["經被保險人同意於保險事故發生前得變更受益人","不得再變更受益人","於保險事故發生 前得變更受益人","於保險事故發生後仍得變更受益人"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L012","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":13,"page":20,"answer":1,"stem":"要保人以契約或遺囑變更受益人時,非經通知,不得對抗","options":["保險人","受益人","被保險人","保險業務員。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L013","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":14,"page":20,"answer":2,"stem":"有關保險受益人規定何者正確?A因保險給付不同可區分為滿期、身故、失能或醫療、年金及紅利等受益人;B為人身保險契約關係人;C保險事故發生時有權受領保險金,而失能保險金之受益人不以被保險人為限;D與要保人、被保險人具有保險利益","options":["ABCD","AB","ABD","BCD。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L014","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":15,"page":20,"answer":2,"stem":"人壽保險受益人之指定何者正確?A除自然人外,得指定法人;B得指定一人或數人;C可同時指定自然人及法人;D 訂立保險契約時得僅載明確定受益人之方法","options":["ABCD","ABC","BD","ABD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L015","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":16,"page":20,"answer":3,"stem":"有關保險法之規定何者正確?","options":["傷害保險之受益人故意傷害被保險人未遂時,要保人得撤銷其受益權利","要保人故意致被保險人於死者,保險人雖不負給付保險金額之責,但仍應將保單價值準備金繳交國庫","人壽保險受益人故意致被保險人於死或雖未致死者,喪失其受益權","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L016","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":17,"page":20,"answer":4,"stem":"下列何者不是限制行為能力人訂定保險契約之生效方式","options":["於限制原因消滅後自己承認","經其法定代理人事後承認","經其法定代理人事前允許","經受益人同意"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L017","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":18,"page":20,"answer":2,"stem":"下列何者依保險法規定得代為交付保險費?A信託業;B被保險人;C受益人;D保險業務員","options":["ABCD","AB C","BC","AB"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L018","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":19,"page":20,"answer":2,"stem":"以受監護宣告尚未撤銷者為被保險人投保之人壽保險契約,其喪葬費用保險金額如超過遺產及贈與稅法有關喪葬費扣除 額1/2時","options":["保險人完全不負給付保險金責任,無須退還已繳保費","保險人僅就超過部分不負給付保險金責 任,無息退還超過部分之已繳保費","保險人僅就超過部分不負給付保險金責任,加計利息退還超過部分之已繳保費","保險人完全不負給付保險金責任,無息退還已繳保費"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L019","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":20,"page":20,"answer":2,"stem":"以下何者正確?","options":["滿7歲未成年人皆為限制行為能力人,其所為意思表示及所受意思表示應得法定代理人允許","法院依聲請權人聲請其家屬有精神障礙致不能為意思表示者,得為監護宣告或輔助宣告","未滿7歲之未成年人投保時,僅由法代在法定代理人欄位親簽同意已足","限制行為能力人為日常生活所必需之意思表示仍應法定代理人允許"],"explanation":"選項1 應為滿7 歲未成年人「有」限制行為能力","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L020","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":21,"page":20,"answer":4,"stem":"以未滿15足歲之未成年人投保含死亡給付之傳統人壽保險契約,於滿15歲前身故者,保險公司應","options":["返還保單價值準備金","依約給付保險金","返還帳戶價值","除喪葬費用給付外,其餘死亡給付於被保險人滿15歲時始生效力"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L021","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":22,"page":20,"answer":3,"stem":"有關要保人之敘述,何者為非?","options":["須投保時填寫要保書並善盡告知、通知保險人保險事故發生之義務","向保險人申請訂立保險契約之人","有指定各項保險金受益人、申請保險單借款及聲明保費自動墊繳之權利","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L022","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":23,"page":21,"answer":1,"stem":"下列有關保險法第一百零五條規定之敘述何者為非","options":["被保險人得隨時依本條為撤銷並通知要保人即生效力","被保險人依本條行使撤銷權時,視為要保人終止契約","由第三人訂立之死亡保險契約須經被保險人書面同意並約定保險 金額,否則契約無效","被保險人得隨時依本條所為之同意得隨時撤銷"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L023","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":24,"page":21,"answer":3,"stem":"下列敘述何者正確?","options":["保險契約有效期間是要保人與保險公司約定,交付保險費的期間","受益人是指保險事故發生時身體遭受損害,享有賠償請求權之人","受益人是指經要保人指定,享有保險金請求權的人","團體保險契約之 死亡受益人由要保人指定"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L024","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":25,"page":21,"answer":2,"stem":"死亡保險金受益人為被保險人配偶王大華,被保險人亡故前已離婚且再婚,則被保險人死亡時該死亡保險金歸?","options":["要保人或其他應得之人","前配偶王大華","再婚之配偶","被保險人遺產"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L025","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":26,"page":21,"answer":1,"stem":"下列何者為非?","options":["要保人希望投保的金額稱為保險金額","保險事故發生後保險公司給付之金額稱為保險金","保險公司就平準繳費的保險契約將來可能發生的給付責任所提存的金額稱為責任準備金","保險公司同意承保之金額稱為保險金額。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L026","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":27,"page":21,"answer":3,"stem":"最大誠信原則,何者正確?A契約訂立時要保人或被保險人應將有關的重要事實告知保險人;B業務員應於親晤被保險人後,誠實填報業務員報告書;C要保人違反告知義務時,保險人得解除契約;D為維護契約安定性,如保險事故發生保險人才知要保人違反告知義務時,且危險發生基於未說明事實者,仍不得解除契約","options":["ABC","ABCD","AC","ACD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L027","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":28,"page":21,"answer":1,"stem":"依保險法第20條規定基於有效契約而生之利益","options":["得為保險利益","僅得對有效契約有保險利益","不得為保險利益","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L028","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":29,"page":21,"answer":3,"stem":"有關保險利益之敘述,何者有誤?","options":["凡基於有效契約而生之利益,得為保險利益","被保險人死亡,保險契約除另 有訂定外,仍為繼承人之利益而存在","合夥人為被保險人時,其中一人讓與保險利益於他人者,保險契約失其效力","要保人對於因財產上之現有利益而生之期待利益,有保險利益"],"explanation":"應為保險契約【不因之而失效】","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L029","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":30,"page":21,"answer":4,"stem":"有關保險利益原則敘述,何者為非?","options":["要保人對於為本人管理財產或利益之人有保險利益","存在目的是避免賭博 行為發生","又稱為可保利益原則","債權人對債務人的保險利益没有限制"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L030","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":31,"page":21,"answer":3,"stem":"張三以自己為要保人,對下列何者生命或身體有保險利益:A借錢給張三的李四;B\n張三本人;C欠張三錢的王老五","options":["AB","A","BC","ABC。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L031","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":32,"page":21,"answer":3,"stem":"依保險法第17條之規定,要保人或被保險人對於保險標的物無保險利益者,保險契約","options":["有效","無效","失其效力","以上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L032","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":33,"page":22,"answer":1,"stem":"要保人對下列何者之生命或身體無保險利益?","options":["生活費或教育費所收受之人","為本人管理財產或利益之人","債務人","本人"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L033","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":34,"page":22,"answer":2,"stem":"對於損害填補原則之敘述何者正確?A防止被保險人不當得利;B需保險人有二張以上保險單才可能發生;C僅適用於人身保險;D僅適用於財產保險","options":["ABC","A","ABD","BD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L034","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":35,"page":22,"answer":3,"stem":"分攤原則其主要目的是","options":["確定保險人賠償責任","使要保人不致不當得利","使被保險人不致不當得利","以 上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L035","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":36,"page":22,"answer":4,"stem":"A年金保險;B實支實付型的健康險商品;C人壽保險;D日額型的健康保險;以上何者適用分攤原則?","options":["AB","BD","ABCD","B"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L036","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":37,"page":22,"answer":3,"stem":"主力近因陳述,下列何者正確?A類似民法的相當因果間係;B常用於傷害險與健康險賠償責任認定;C導致被保人死亡原因有2個以上,而每個原因間有因果關係雖有中斷,其最先發生原因就是所謂主力近因;D即指最直接或最接近被保險人死亡的原因","options":["ABD","ABCD","AB","BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L037","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":38,"page":22,"answer":2,"stem":"下列有關保險代位原則之敘述,何者正確?","options":["人身保險與產物保險依法均得代位行使請求權","人壽保險不得代位行使請求權","指事故發生時,由保險人代位行使被保險對第三人之請求權","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L038","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":39,"page":22,"answer":4,"stem":"有關保險代位原則之敘述何者錯誤?","options":["財產保險適用","因為人身無價,故人壽保險不適用","又稱為權利代位","保險人於賠償後需經被保險人同意始得代位行使被保險人對於第三人之請求權。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L039","chapter":"第一章 人身保險契約"},{"subject":"保險法規","number":40,"page":22,"answer":3,"stem":"保戶以網址取代紙本保單條款之規定,何者正確?","options":["保單條款是保險人與被保險人共同遵守的約定","保戶同意後不能再向保險人申請紙本保單","保險人因此節省的紙張印製成本需於附加費用反映","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L040","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":41,"page":22,"answer":3,"stem":"以被保險人終身為期,不附生存條件之死亡保險契約,如保險費已付足二年以上而有不交付時,保險人","options":["得以被保險人指定的方式處理","得解除契約","僅得減少保險金額","得終止契約。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L041","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":42,"page":22,"answer":3,"stem":"要保人終止保險契約,而保險費已付足一年以上者,保險人應於接到通知後一個月內償付解約金,其金額不得低於要保人應得保單價值準備金之","options":["二分之一","四分之一","四分之三","三分之一 。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L042","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":43,"page":22,"answer":4,"stem":"要保人中途請求終止契約,如果交付的保險費累積達有保單價值準備金,可以領回","options":["已繳全部保險費加計利息","已積存責任準備金之金額","由保險公司決定可領之金額","解約金表所列解約金額"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L043","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":44,"page":22,"answer":3,"stem":"要保人終止保險契約,繳費累積達有保單價值準備金,保險人應於接到通知後多久時間內償付解約金","options":["十五天","二個月","一個月","二十天"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L044","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":45,"page":23,"answer":1,"stem":"要保人在保險契約有效期間內得申請減少保險金額,但不得低於最低承保金額,其減少部分視為","options":["終止契約","停效","無效","解除契約"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L045","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":46,"page":23,"answer":1,"stem":"保險契約法定終止事由有A保險人破產時;B要保人任意終止時;C保險契約停效後且已逾申請復效所訂期限;D保險標的物非因保險契約所載之事故而完全滅失時","options":["AD","ACD","BC","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L046","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":47,"page":23,"answer":4,"stem":"要保人行使契約撤銷權生效後,則","options":["契約自行使撤銷權當日期無效","保險人得扣除手續費","保險人應加計利息退還保險費","契約自始無效"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L047","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":48,"page":23,"answer":2,"stem":"契約撤銷權之規定適用於個人","options":["五年期以上","二年期以上","一年期","十年期以上 人身保險契約"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L048","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":49,"page":23,"answer":3,"stem":"要保人行使契約撤銷權,撤銷效力自何時起生效?","options":["自要保人書面意思表示到達起","自要保人親自送達當日零時起","自要保人書面意思表示到達翌日零時起","自要保人親自送達翌日起"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L049","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":50,"page":23,"answer":2,"stem":"甲以無體檢保件投保後,發覺保險內容非當初本意,故書面向保險人行使契約撤銷權,其契約","options":["自書面到達時起自始無效","自書面到達之翌日零時起自始無效","因無體健保件,故甲不得主張撤銷權","自書面到達之日零時起自始無效"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L050","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":51,"page":23,"answer":4,"stem":"要保人或被保險人對於保險人的書面詢問若有故意隱匿或因過失遺漏,或為不實之說明時,足以變更或減少保險人對於 危險之估計者,保險人得","options":["停止契約","終止契約","撤銷契約","解除契約"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L051","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":52,"page":23,"answer":4,"stem":"下列何者非保險人依保險法第64條解除契約之要件","options":["要保人隱匿或遺漏不為說明,或為不實之說明","須足以變 更或減少保險人對於危險之估計","要保人之不實告知,須在契約訂立時","要保人之不實告知,須在保險事故發生時"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L052","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":53,"page":23,"answer":3,"stem":"因違反告知而得解除契約之權利,自保險公司知有解除原因經過","options":["二年","一年","一個月","二個月 不行使 而消滅"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L053","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":54,"page":23,"answer":4,"stem":"要保人如違反保險法第64條告知義務時,保險人得","options":["終止契約並按解約金列表給付","解除契約並按解約金列表給付","解除契約並返還已繳保險費","解除契約且不返還保險費"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L054","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":55,"page":23,"answer":1,"stem":"「契約之解除」與「契約之終止」,對契約效力而言?","options":["解除為自始不存在,終止為自終止之日起消滅","解除為自解除之日起不存在,終止為自始不存在","皆為自始不存在","自解除或終止之日起不存在"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L055","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":56,"page":24,"answer":3,"stem":"下列何者正確?A要保人得於收到保單翌日起十日內以書面檢同保單終止契約;B契約撤銷效力自要保人書面意思表示到達保險人翌日零時起生效; C契約撤銷效力自要保人郵寄郵戳當日零時生效;D撤銷生效前如發生保險事故,保險人仍應負保險責任","options":["ACD","AB","BD","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L056","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":57,"page":24,"answer":3,"stem":"有關保險契約之敘述,何者正確?","options":["當事人一方對於他方應通知之事項怠於通知者,僅於故意造成,他方始得據為解約之原因","非因要保人或被保險人之行為致危險增加時,要保人或被保險人如未及時通知,對於保險人因此所受之損失,免負賠償責任","當事人一方違背特約條款時,即使危險已發生,他方仍得解除契約","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L057","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":58,"page":24,"answer":3,"stem":"何者為適用人身保險之法定無效事由?A契約訂立時保險標的危險已發生或已消滅;\nB 由第三人訂立之死亡保險契 約,未經被保險人書面同意並約定保險金額;C被保險人以不實年齡投保,其真實年齡已超過保險人所定保險年齡限度者;D要保人意圖不當得利而為複保險","options":["ABC","BCD","ABCD","ABD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L058","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":59,"page":24,"answer":1,"stem":"依據保險法規定,要保人的權利包含A變更失能及醫療保險金之受益人;B行使契約撤銷權;C 申請契約變更;D申請保險單借款、聲明續期保險費自動墊繳","options":["BC\nD","ABCD","ABD","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L059","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":60,"page":24,"answer":4,"stem":"依人壽保險單示範條款規定,約定以金融機構轉帳繳納保險費者,何種繳別須經催告程序以計算寬限期間","options":["月繳","季繳","年繳","以上皆是。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L060","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":"補充-02","page":24,"answer":3,"stem":"依人壽保險單示範條款規定,下列何種繳納保險費方法,應經催告程序以計算寬限期間","options":["月繳","季繳","年繳","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L-補充-02","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":61,"page":24,"answer":4,"stem":"要保人在繳付相當於第一次保險費的金額時,保險契約","options":["即時成立","等到保險公司同意承保時才成立","於契約成立後,效力溯自繳費日開始起算","僅第2及第3選項為是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L061","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":62,"page":24,"answer":3,"stem":"月繳或季繳保險契約第二期以後分期保險費到期未交付,其寬限期間之起算日為","options":["保險費應繳日","催告到達之翌日","保險費應繳日之翌日","催告到達之日"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L062","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":63,"page":24,"answer":1,"stem":"遞延年金保險第二期以後保險費如未依約繳付,不適用何種規定?A寬限期間;B停效;C變更為減額繳清保險","options":["AB","ABC","AC","BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L063","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":64,"page":24,"answer":3,"stem":"關於寬限期間之敘述,選出錯誤之選項:A逾寬限期間仍未繳付保險費者,契約至寬限期間終了之翌日起終止效力;B 如在寬限期間發生保險事故,保險公司仍負給付責任;C年繳或半年繳件,自保單所載之交付日期之翌日起30 日為寬限期間;D季繳或月繳件,至催告到達日期之翌日起30日為寬限期","options":["ABCD","BCD","A\nCD","C D"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L064","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":65,"page":25,"answer":3,"stem":"依保險法規定,保險費超過寬限期間仍未交付,除約定得由保險公司自動墊繳者外,\n保險單即停止效力,要保人於催告期間繳付保險費應","options":["依原約定式繳費","以郵局劃撥繳付","依與保險公司約定之交付方法交付","以網路連線交付"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L065","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":66,"page":25,"answer":2,"stem":"有關自動墊繳的保險契約,給付保險金時","options":["應扣還墊繳保費","應扣還墊繳保費本息","應扣還墊繳保費之利息","無需扣還墊繳保費。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L066","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":67,"page":25,"answer":4,"stem":"關於保費自動墊繳,何者錯誤?","options":["要保人得於次一墊繳日前以書面或其他約定方式通知保險人停止自動墊繳","保 單價值準備金餘額不足墊繳1日之保費且經催告逾\n30日仍未繳交,保單效力即行停止","墊繳之本息應由保險人出具憑證","自動墊繳保費自寬限期終了日開始計息"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L067","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":68,"page":25,"answer":3,"stem":"有關自動墊繳保險費利息之計算何者正確?","options":["自應繳日翌日起算","按當時市場利率計算","自寬限期間終了翌日起算","自寬限期間終了當日起算"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L068","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":69,"page":25,"answer":4,"stem":"依據人壽保險單示範條款之規定,人壽保險契約約定有自動墊繳者,應以當時的哪種金額自動墊繳其應繳的保險費及利息","options":["保險金","保單責任準備金","投保金額","保單價值準備金"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L069","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":70,"page":25,"answer":4,"stem":"人壽保險單示範條款保險費自動墊繳之規定,下列何者為非?","options":["要保人自應償付利息之日起未付利息已逾一年以上 且經催告仍未償付者,保險公司得將利息滾入墊繳保險費再行計息","自動墊繳係以墊繳當時之保單價值準備金扣除借款本息後之餘額辦理","自動墊繳經約定後仍可再行變更","保單價值準備金不足墊繳一日之保險費時,自翌日起 契約效力停止 。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L070","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":71,"page":25,"answer":4,"stem":"要保人以保險單為質向保險人借款,借款到期應將本息償還保險公司,逾期未償之本息超過保單價值準備金時,保險契約?","options":["無效","立即失效","經書面通知到達後逾三十天仍未繳付時,保險契約之效力停止","立即停效"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L071","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":72,"page":25,"answer":3,"stem":"保險公司接到要保人申請保險單借款,應於","options":["十五日內","二個月內","一個月內","十日內 貸給可借之金額"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L072","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":73,"page":25,"answer":3,"stem":"有關人壽保險單示範條款復效通知之規定,何者有誤?","options":["通知須載明未於期限屆滿前申請復效者,契約效力自期限 屆滿之日翌日上午零時起終止","保險人以書面、\n電子郵件、簡訊或其他約定方式擇一通知","保險人於停效後至得 申請復效之期限屆滿前1個月,通知要保人復效權利","保險人依要保人最後留存之資料發出通知,\n視為已完成通知"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L073","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":74,"page":25,"answer":2,"stem":"關於復效之敘述何者正確?A要保人得在保單停效日起兩年之內申請復效;B停效期間屆滿,保險人有終止契約之權; C經保險公司同意並清償所積欠之保險費後,保單效力自當日零時起生效;D復效後保險費依停效時年齡之費率計算","options":["ABCD","AB","ABD","ACD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L074","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":75,"page":26,"answer":1,"stem":"申請復效時,要保人可以在保險契約停止效力6個月內清償欠繳保險費扣除停效期間的","options":["危險保險費","儲蓄保險費","附加保險費","累積保險費 後之餘額及保險契約約定之利息後,翌日上午零時起開始恢復其效力。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L075","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":76,"page":26,"answer":2,"stem":"保險契約變更為繳清保險後,契約之保險種類","options":["改變","不變","不一定","以上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L076","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":77,"page":26,"answer":3,"stem":"要保人於保單停止效力之日起6個月後申請復效,保險人得於要保人申請復效日起A\n日內要求提供可保證明,或於收到前項可保證明後B日內不為拒絕,視為同意復效。\n請問A、B應為","options":["A為10,B為30","A為5,B為10","A為5,B\n為15","A為10,B為15"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L077","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":78,"page":26,"answer":4,"stem":"要保人於保險契約停止效力6個月後申請復效時,應A提供申請書;B繳清欠繳保險費扣除停效期間的危險保險費; C提供被保人可保證明","options":["AC","AB","BC","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L078","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":79,"page":26,"answer":4,"stem":"某甲曾於五年前投保死亡保險200萬元,後該保險因未繳保費於去年一月停效,今年十月又辦理復效完畢,某甲於復效兩個月後即跳海自殺身故,保險人對本案應如何處理?","options":["不給付死亡保險金,但退還所繳保費","完全不給付","應照保險金額理賠","僅返還保單價值準備金"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L079","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":80,"page":26,"answer":1,"stem":"發生保險事故以後發覺被保險人投保年齡不實而致短繳保險費,且其錯誤非可歸責於保險公司者,受益人可得之金額為","options":["要保人不得要求補繳短繳保險費,僅按原繳保險費比例減少保險金額","原保險金額減掉應補繳之保費","已繳保費加計利息退還要保人","保險人無息退還所有已繳保費"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L080","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":81,"page":26,"answer":3,"stem":"依保險法規定,要保人故意不為複保險通知或意圖不當得利而為複保險時,其契約","options":["失效","失其效力","無效","停效"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L081","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":82,"page":26,"answer":2,"stem":"依保險法規定,關於未來事項之特約條款,於未屆履行期前危險已發生,或其履行為不可能,或在訂約地為不合法而未履行者,保險契約","options":["因之失效","不因之而失效","自始無效","以上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L082","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":83,"page":26,"answer":2,"stem":"有關團體保險之敘述,何者正確?","options":["契約涉訟時得排除小額訴訟管轄法院之適用","要保人於保單屆滿日的2週 前與保險人議定續保條件,續保的始期以原契約屆滿日的翌日零時為準","所謂團體係指具有5人以上且以購買保險而組織之團體","被保險人異動申請加保時,被保險人資格自異動發生日翌日零時起生效。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L083","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":84,"page":26,"answer":3,"stem":"A謀求員工福利;B為員工退休或退職提存準備金;C減輕雇主責任;D減免營利事業所得稅;上述何者是企業投保團體人壽保險之主要目的?","options":["ABC","ACD","ABCD","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L084","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":85,"page":26,"answer":4,"stem":"有關團體人壽保險,何者正確?","options":["要保人因所屬人員大批離職致參加團體保險人數不足時,保險人得終止保險契約 並按日數比例退還未滿期保費","因業務種類變更致危險顯著增加時,要保人應於知悉後兩週內通知保險人","保險 人接到危險增加之通知30日內,得根據危險增加的程度要求增加保費或終止契約","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L085","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":86,"page":27,"answer":4,"stem":"有關健康保險何者為是?A保險費不得以訴訟方式請求交付;B利害關係人不得代要保人交付保險費;C保險費到期未交付不適用寬限期間之規定;D由第三人訂立之契約,未經被保險人書面同意並約定保險金額者契約無效","options":["AC","CD","ABD","D"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L086","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":87,"page":27,"answer":3,"stem":"下列何者不是健康保險給付事由:A被保險人故意自殺;B被保險人住院健康檢查;\nC被保險人墮胎所致之死亡;D被保險人因生產住院","options":["AC","ABCD","A\nBC","D"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L087","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":88,"page":27,"answer":2,"stem":"下列何者是健康保險給付事由?","options":["被保險人因墮胎所致疾病","被保險人因生產住院","被保險人因墮胎所致死 亡","被保險人故意自殺"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L088","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":89,"page":27,"answer":2,"stem":"下列何者不屬於住院醫療保險所稱醫院?A健檢中心;B安養中心;C診所;D國術館","options":["ABD","ABCD","BD","AB"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L089","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":90,"page":27,"answer":4,"stem":"實支實付型住院醫療費用保險金之給付內容,不包含下列哪項費用?","options":["管灌飲食以外之膳食費","來往醫院之救護車費","超等住院之病房費差額","特別護士之護理費"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L090","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":91,"page":27,"answer":2,"stem":"下列有關實支實付型住院醫療費用保險之陳述何者正確?A具有損害填補的原則;B\n只要是住院醫療相關費用皆可給付;C對於全民健保核付的費用不給付;D對於保險對象自行負擔之一定項目費用給付","options":["AD","ACD","ABCD","A\nB"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L091","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":92,"page":27,"answer":3,"stem":"下列何者非屬實支實付醫療險給付範圍?","options":["超等住院之病房費差額","救護車","特別護士","管灌飲食以之膳食費"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L092","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":93,"page":27,"answer":3,"stem":"被保險人投保健康保險後,因疾病致成失能時,保險人","options":["酌給慰問金","退還所繳保費","應給付保險金","不給付保險金"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L093","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":94,"page":27,"answer":1,"stem":"有關住院醫療費用保險何者錯誤?","options":["如有保證續保條款時,保險人不得拒絕續保及不得以續保當時之費率規定重新 計算保費","被保險人於契約有效期間屆滿出院,\n因同一疾病出院後14日內於同一醫院再住院,保險人就再住院部分不給付保險金","保戶如前往非屬健保特約院所就醫,保險人於限額內得按實際支出費用不低於6\n5%給付","以 上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L094","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":95,"page":27,"answer":1,"stem":"住院醫療費用保險示範條款,住院係指A被保險人經醫師診斷其疾病必須入院 ;B被保險人經醫師診斷其傷害必須入院 ;C須正式辦理住院手續並確實在醫院接受診療;\nD可於契約條款明訂包含精神衛生法第35條之日間留院","options":["A BCD","ABC","ACD","AC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L095","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":96,"page":27,"answer":3,"stem":"債權人未經債務人書面承認而逕以債務人為被保險人訂立之年金保險契約","options":["停效","無效","有效","視情形 而定"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L096","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":97,"page":27,"answer":4,"stem":"有關年金的敘述,下列何者正確? A年金可分為社會型及投資型年金;B年金保險契約必須記載給付方法;C未滿15 歳之未成年者不能投保年金保險;D受益人不得為被保險人本人","options":["ABC","BC","AB","B"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L097","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":98,"page":28,"answer":3,"stem":"年金保險中,不論被保險人生存與否,保險公司保證給付金額的年金保險稱為","options":["遞延年金保險","即期年金保險","保證金額年金保險","保證期間年金保險。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L098","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":99,"page":28,"answer":2,"stem":"利率變動型年金保險甲型為固定年金金額,在年金給付開始日,保險公司以當時所累積之年金保單價值準備金,依據當時","options":["十年期公債殖利率","預定利率","宣告利率","定存利率 及年金生命表計算可以領取之年金金額"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L099","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":100,"page":28,"answer":2,"stem":"利率變動型年金保險乙型,其給付期間第2年度開始每年可領取之年金金額係以前 1\n年度可領取之年金金額乘以當年度","options":["變動係數而得之","調整係數而得之","風險係數而得之","浮動係數而得之"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L100","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":101,"page":28,"answer":2,"stem":"有關年金保險敍述,何者為是?A保險費不得以訴訟方式請求交付;B利害關係人得代要保人交付保險費;C保險費到期未交付不適用寬限期間之規定;D由第三人訂立之契約,未經被保險人書面同意並約定保險金額者契約無效","options":["BCD","ABC","ABD","AB"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L101","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":102,"page":28,"answer":4,"stem":"有關利率變動型年金之敘述何者為非?","options":["乙型於給付期間通常無紅利給付","若採分紅方式設計應明訂計算方式及給付方式","於累積期間不論甲型或乙型均無紅利給付","甲型於給付期間僅採不分紅方式設計"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L102","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":103,"page":28,"answer":2,"stem":"有關年金保險敍述,者為是?A得由本人或第三人訂立之;B未經被保險人書面同意並約定保險金額者契約無效;C利 害關係人得代要保人交付保險費;D保險人對於保險費得以訴訟請求交付","options":["BCD","AC","ABD","AB"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L103","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":104,"page":28,"answer":3,"stem":"下列何者正確A含保證給付的年金保險,受益人得申請貼現給付;B遞延年金保險在年金給付開始前如有保單借款,給付開始時應就當時年金保單價值準備金扣除保單借款本金計算年金金額;C保險人為避免以不實醫療證明詐領保險金, 得經要保人同意調閱被保人就醫資料;D住院醫療費用保險期間以一年為原則","options":["ABCD","A\nBC","AD","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L104","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":105,"page":28,"answer":4,"stem":"保險人就即期年金應負的保險責任自何時開始?","options":["保險人同意承保且送達保單","要保人交付保費","保險人同意承保","保險人同意承保且要保人繳付全部保費"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L105","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":106,"page":28,"answer":2,"stem":"有關傷害保險契約,下列敘述何者正確?","options":["僅得以自己為被保險人投保","以職業為危險估計的主要依據","一 律採「追溯生效」","契約效力自保單所載翌日零時起生效。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L106","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":107,"page":28,"answer":2,"stem":"傷害保險費率係按被保險人:A薪資;B性別;C職業;D工作環境;之不同作為主要的依據","options":["BCD","CD","ABC","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L107","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":108,"page":28,"answer":4,"stem":"傷害保險的被保險人從事下列何種活動,致成死亡或傷害時,除契約另有約定外,保險公司不負給付保險金之責?A滑翔翼;B汽機車競賽或表演;C跆拳道;D馬術","options":["AB","ABCD","BC","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L108","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":109,"page":29,"answer":4,"stem":"傷害保險被保險人如失蹤應如何處理?","options":["保險人先行給付保險金後發現被保險人生還,要保人或受益人應歸還保險 人已領之退還已繳保費或身故保險金或喪葬費用保險金","要保人或受益人能提出證明足認被保險人極可能因承保事故致死者,保險人應先行給付保險金","依戶籍資料所載失蹤日起滿一年仍未尋獲,保險人應先行給付保險金","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L109","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":110,"page":29,"answer":3,"stem":"有關傷害醫療保險金之敘述,何者為非?","options":["實支實付型之保險給付,保險公司僅就符合意外傷害事故,且於登記合格的醫院或診所治療之實際醫療費用,超過全民健康保險部分給付","保險公司基於審核保險金需要,得對被保險人身體予以檢驗,另得徵詢其他醫師專業意見,所生費用由保險公司負擔","日額型每次傷害給付日數不得超過180 日","一般以附約方式處理,分成實支實付與日額型2種"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L110","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":111,"page":29,"answer":4,"stem":"下列何者為是?A傷害保險之保險費不得以訴訟請求交付;B利害關係人不得代要保人交付保險費;C傷害保險之保險費到期未交付不適用寬限期間之規定;D由第三人訂立之傷害保險契約,未經被保險人書面同意並約保險金額者契約無效","options":["ABC\nD","AC","AD","D"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L111","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":"補充-03","page":29,"answer":4,"stem":"依保險法規定,傷害保險之保險費","options":["利害關係人不得代要保人交付","保險人不得以訴訟請求交付","到期未交付不適用寬限期間之規定","以上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L-補充-03","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":112,"page":29,"answer":4,"stem":"陳光華的父親曾於生前投保傷害保險貳百萬元,並以陳光華為受益人,但陳光華一直到父親因疾病死亡後二年,始知父親有購買此類保險,此時保險公司","options":["仍應如額給付","陳光華須證明確係不知其父投保事實才延遲申請,否則保險 公司仍得拒絕給付","僅給付保單價值準備金","以上皆非。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L112","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":113,"page":29,"answer":4,"stem":"傷害保險失能給付保險金,按失能程度原分為11級79項,經參考勞工保險及強制車險失能給付標準新增何項為第80項?","options":["鼻部缺損,致其機能永久遺存顯著障害","鼻未缺損,而鼻機能暫時喪失遺存顯著障礙","鼻部缺損, 致其機能暫時喪失","鼻未缺損,而鼻機能永久遺存顯著障害"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L113","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":114,"page":29,"answer":4,"stem":"失能保險金不論被保險人失能次數及程度如何,受益人得請領之總金額皆不得超過","options":["保單價值準備金","責任準備金","所繳保險費總額","保險金額"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L114","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":115,"page":29,"answer":4,"stem":"下列何者非屬於傷害保險的除外責任?","options":["要保人、被保險人的故意行為","被保險人飲酒後駕、騎車,其吐氣或血液所含酒精成份超過道路交通法令規定標準者","被保險人犯罪行為","以上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L115","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":116,"page":29,"answer":3,"stem":"傷害保險與人壽保險有哪些不同?A危險估計之依據;B契約生效日;C承保之危險事故;D保險期間長短","options":["AC","BCD","ABCD","ABC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L116","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":117,"page":29,"answer":3,"stem":"下列何者是旅行平安險與傷害險的不同:A保險期間可否因特殊事故延長;B承保時間計算之標準;C除外責任項目; D承保事故;","options":["CD","ACD","AC","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L117","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":118,"page":29,"answer":2,"stem":"旅行平安保險單示範條款有延長保險期間之規定,其要件不包括","options":["被保險人須為乘客","該交通工具因故延遲抵達為被保險人所能控制","該交通工具之預定抵達時刻在保險契約期間內","搭乘之交通工具須領有載客執照"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L118","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":119,"page":29,"answer":4,"stem":"投保旅行平安保險時,若僅有要保人知保險事故已發生者,保險公司","options":["依事故比例退還部分保險費","加計利息退還保險費","僅退還所收保險費","不退還所收保險費"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L119","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":120,"page":30,"answer":1,"stem":"下列何者為是? A人壽保險之保險費可以訴訟方法請求交付;B利害關係人得代要保人交付保險費;C受益人經指定後,要保人對其保險利益喪失處分權;D受益人得於部分條件下將其利益轉讓他人","options":["BD","BCD","ABCD","B"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L120","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":121,"page":30,"answer":1,"stem":"以下何者為人壽保險單示範條款載明之除外責任?","options":["要保人故意致被保險人於死","被保險人從事特技表演等競賽活動所致事故","被保險人因飲酒後駕車所致事故","被保險人心神喪失所致事故"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L121","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":122,"page":30,"answer":2,"stem":"有關傷害保險受益人申請失能保險金,下列何者錯誤?","options":["保險人得自付費用另徵詢其他醫師之醫學專業意見","受益人應檢具被保險人除戶戶籍謄本","保險人得經受益人同意調閱被保險人就醫相關資料","保險人基於審核保險金需要得對被保險人身體予以檢驗。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L122","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":123,"page":30,"answer":4,"stem":"下列何者非屬團體保險條款規定受益人請領身故保險金時應檢具之文件?","options":["被保險人死亡證明書及保險金申請書","受益人身分證明","被保險人之除戶戶籍謄本","保險金申請書、受益人之戶籍謄本及印鑑證明"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L123","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":124,"page":30,"answer":4,"stem":"金管會列舉保險業常見之低風險交易情境,如:投保 A微型保險;B具有保單價值準備金之保險商品;C團體年金保險;D客戶無高洗錢及資恐風險之表徵,年繳保費未逾三萬元。以上那些情境,保險公司得進行簡化審查及持續監控措施?","options":["ABC","AC","ABCD","ACD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L124","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":125,"page":30,"answer":4,"stem":"附保證期間之年金保險中,被保險人於保險契約年金保證期間內尚未領取之年金金額稱為","options":["生存年金金額","年金金額","年金保額","未支領年金餘額"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L125","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":126,"page":30,"answer":2,"stem":"傷害保險中被保險人因同一意外傷害事故致成失能等級表所列二項以上失能程度者,\n何者有誤?","options":["意外事故合併以前的失能可領取較嚴重項目失能保險金者,按較嚴重項目給付","保險人應給付失能程度較嚴重者,且最高以保險金額為限","若二項失能項目皆屬同一手但失能等級不同時,給付較嚴重項目失能保險金","若二項失能項目屬於同一手時,僅給付一項失能保險金"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L126","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":127,"page":30,"answer":2,"stem":"傷害保險因同一意外傷害事故,致成失能後身故時,","options":["身故保險金最高以保險金額為限,失能保險金沒有限制","失能及身故保險金的給付合計最高以保險金額為限","失能保險金最高以保險金額為限,身故保險金沒有限制","失能或身故保險金的給付分別最高以保險金額為限。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L127","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":128,"page":30,"answer":4,"stem":"有關長期照顧保險,下列何者錯誤?","options":["被保險人身故時保險金尚有未完全給付者,\n以被保險人法定繼承人為受益人","被保險人身故時契約效力即行終止","各項保險金受益人皆為被保險人,保險人不受理指定或變更","要保人於契約有效期間不得申請減少保險金額。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L128","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":129,"page":30,"answer":3,"stem":"主管機關訂定示範條款目的為 A確立保險商品在社會上的信譽;B減少條款文字或解釋上的分歧;C授權訂定條款的彈性提高市場競爭力;D使保險業販售同商品時有統一作業處理方式","options":["AC","ABC","ABD","BD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L129","chapter":"第二章 人身保險契約條款"},{"subject":"保險法規","number":130,"page":30,"answer":3,"stem":"有關個人綜合所得稅之課徵何者正確A就個人綜合所得總額計徵之;B有中華民國來源所得之個人,應就其中華民國來源之所得,課徵綜合所得稅;C非中華民國境內居住之個人一律免納所得稅","options":["ABC","AB","B","BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L130","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":131,"page":31,"answer":3,"stem":"何者正確? A凡向產險公司投保之保費皆不得列舉扣除;B現行長期照顧特別扣除額為每人每年12萬元;C團體投資型保險每人每月保費2千元以內免視為被保險人薪資所得;D團體保單經驗分紅退費之給付免納所得稅","options":["ABC D","AD","BD","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L131","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":132,"page":31,"answer":2,"stem":"共同居住之家人投保人壽保險,全年所繳保險費:阿公二萬元、父母共二萬四千元、\n未成年長子二萬五千元、未成年次 子一萬二千元;若全家合併申報綜合所得稅且採用列舉扣除法,則一年可扣除的保險費為","options":["十萬四千元","八萬元","十萬五千元","八萬一千元"],"explanation":"2 萬+2.4 萬+2.4 萬+1.2 萬=8 萬","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L132","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":133,"page":31,"answer":3,"stem":"某甲一家投保人壽保險,全年所繳保費:某甲及其配偶合計為二萬四千元、成年長子二萬五千元、未成年次子一萬二千 元:某甲於申報綜合所得稅時採用列舉扣除法,則一年可扣除的保險費為","options":["八萬元","十一萬七千元","六萬元","八萬四千元。"],"explanation":"2.4 萬+2.4 萬+1.2 萬=6 萬贈與稅納稅義務人為【贈與人】,每人每年免稅額為244 萬元,一年有2 次以上贈與應合併計算,超過免稅部分,自發生後【30】日內,向贈與人所在地之稅捐機關申報,應於收到納稅通知書2 個月繳清稅款,可申請延期2 個月。 \n以下不計入贈與總額:(1)配偶互相贈與之財產 (2)父母於子女嫁娶時所贈之財產在100 萬元以內遺產稅及贈與稅在30 萬元以上,可分18 期,每期間隔不超過2 個月。\n遺產稅可以現金、實物抵繳、分期繳納或部份現金繳納、部分實物一次抵繳。 \n若贈與人死亡、行蹤不明、或逾期未納稅且中華民國境內無財產,則以受贈人為納稅義務人","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L133","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":134,"page":31,"answer":4,"stem":"有關贈與稅,何者陳述錯誤?","options":["納稅義務人為贈與人","免稅額之計算係指一年之贈與","一年如有二次以上之 贈與,不得分別計算","免稅額為123萬元"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L134","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":135,"page":31,"answer":3,"stem":"下列何者正確?","options":["配偶相互贈與之財產應計入贈與總額","贈與稅之納稅義務人死亡時,贈與稅尚未核課者,無須繳納贈與稅","本國國民就其中華民國境外之財產為贈與,應課徵贈與稅","以上皆非。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L135","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":136,"page":31,"answer":1,"stem":"老王去年度共有3次贈與,贈與其子1棟房屋2000萬元,贈與其妻轎車200萬元,贈與其女出嫁禮金80萬元, 則老王今年度課稅贈與總額為","options":["2000萬","2200萬","2080萬","2280萬"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L136","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":137,"page":31,"answer":4,"stem":"要保人甲與被保險人乙之人壽保險,若變更甲為丙,何者正確?A有保單價值準備金且超過贈與免稅額,甲須申報贈與稅;B有保單價值準備金且超過贈與免稅額,丙須申報贈與稅;C丙非同時為受益人者,則受益人須將保險給付列入基本所得;D丙同時為受益人者,須將保險給付列入當年度基本所得額","options":["BC","AD","BD","AC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L137","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":138,"page":31,"answer":3,"stem":"贈與人在一年內贈與他人之財產總值超過贈與稅免稅額時,應於超過免稅額之贈與行為發生後","options":["二個月內","十 日內","三十日內","二十日內 ,向贈與人戶籍所在地之稅捐機關申報。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L138","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":139,"page":32,"answer":4,"stem":"按遺產及贈與稅法規定,約定被繼承人死亡時給付其所指定受益人之:A人壽保險之死亡保險金;B勞工保險之死亡保 險金;C軍公教保險之死亡保險金;D撫恤金;以上何者不計入遺產總額?","options":["ABCD","BD","D","A BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L139","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":140,"page":32,"answer":1,"stem":"A滿期保險金;B醫療保險金;C死亡保險金;D人壽保險單之紅利;上述何種保險給付在一定條件下免稅","options":["AB CD","ABC","BCD","ACD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L140","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":141,"page":32,"answer":3,"stem":"下列敘述何者錯誤?","options":["凡屬人身保險之保險給付,在一定條件下不論其項目名稱均得依法免納所得稅","軍公教保 險之保險給付免納所得稅","人壽保險之解約金屬人身保險之保險給付範圍","壽險滿期保險金在一定條件得享有免稅優惠"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L141","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":142,"page":32,"answer":4,"stem":"下列何者正確?A滿期保險給付所含之利息所得,受益人享有免納利息所得之稅法優惠;B勞工退休金請領勞退帳戶退休金時,屬退職所得須計入個人綜所稅總額;C醫療費用支出曾受保險給付,得再以醫療費扣除額申報;D死亡保險金指定法定繼承人,各該繼承人領取保險金後須繳納遺產稅","options":["ABC","ABD","BD","AB"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L142","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":144,"page":32,"answer":4,"stem":"有關贈與稅敘述,何者正確?","options":["贈與人逾繳納期限尚未繳納且在中華民國境內有財產可供執行者,以受贈人為納稅義務","贈與人行蹤不明者,仍以贈與人為納稅義務人","贈與稅未繳清前得先行分割遺產,交付遺贈或辦理移轉登記","贈與人死亡時贈與稅尚未核課者,以受贈人為納稅義務人"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L144","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":145,"page":32,"answer":3,"stem":"依現行規定遺產及贈與稅法規定,遺產稅稅率最高課稅級距為?","options":["10%","1\n5%","20%","30%"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L145","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":146,"page":32,"answer":2,"stem":"遺產稅及贈與稅納稅義務人,應於稽徵機關送達核定納稅通知書之日起","options":["三個月","二個月","一個月","半年 內,繳清應納稅款"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L146","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":147,"page":32,"answer":1,"stem":"依現行遺產及贈與稅法規定,遺產總額包括被繼承人死亡前幾年內贈與配偶及子女、\n父母、兄弟姊妹、祖父母等法定繼 承人及上述法定繼承人配偶的財產","options":["二年","六年","五年","一年"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L147","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":148,"page":32,"answer":1,"stem":"被繼承人死亡遺有財產者,納稅義務人應於被繼承人死亡之日起幾個月內,向戶籍所在地主管稽徵機關依遺產及贈與稅 法規定辦理遺產稅申報","options":["六個月","一個月","三個月","二個月"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L148","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":149,"page":32,"answer":1,"stem":"遺囑人不得違反侵害繼承人之何種規定範圍內,始得以遺囑自由處分遺產","options":["特留分","應繼分","保留分","遺贈分"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L149","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":150,"page":32,"answer":2,"stem":"有關民法各順位繼承人之特留分敘述,何者有誤?","options":["父母的特留分是應繼分的二分之一","兄弟姊妹的特留分是應繼分的二分之一","配偶的特留分是應繼分的二分之一","祖父母的特留分是應繼分的三分之一"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L150","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":151,"page":33,"answer":2,"stem":"某甲身故後留有死亡保險金1000萬元,因未指定身故受益人,若某甲沒有其他遺產,但立有遺囑將保險金全部歸配 偶所有,在僅有配偶和父母之情形下,則該保險金,某甲父親可領到","options":["0萬","125萬","250萬","25萬 元"],"explanation":"因立遺囑,故計算父親特留分,1000 萬*1/2=500 萬(應繼分) 父母各\n500/2=250 萬,250 萬*1/2=125 萬","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L151","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":152,"page":33,"answer":3,"stem":"甲僅遺有子女乙與丙,甲死後遺留財產500萬元,甲於遺囑中表示將其遺產60%\n全數捐給慈善機構,僅留40%由 乙、丙平均分配,則依民法規定乙可繼承多少金額","options":["250萬","500萬","125萬","100萬 元"],"explanation":"因立遺囑故計算特留分,乙丙應繼分為各500/2=2 165,"page":34,"answer":3,"stem":"張三(被繼承人)育有4子,其長子較張三早死,當張三死亡可由其孫A、B代位其父繼承對張三之應繼分。如張三遺留保險金1000萬元,則其孫各可代位繼承","options":["250萬","100萬","125萬","300萬"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L165","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":166,"page":34,"answer":4,"stem":"依現行遺產及贈與稅法第12-1條規定,被繼承人僅遺有配偶及成年子女1名,則該遺產之扣除額應為","options":["200 萬","440 萬","445 萬","609 萬 元"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L166","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":167,"page":34,"answer":3,"stem":"被保險人之法定繼承人可以拋棄繼承被保險人之債務,但應於知悉其得繼承之時起多久內以書面向法院表示?","options":["二個月","一個月","三個月","六個月"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L167","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":168,"page":34,"answer":2,"stem":"有關拋棄繼承何者錯誤?","options":["拋棄繼承無須開具遺產清冊但需書面呈報法院","屬單獨行為需經法院同意","繼承人中一人拋棄繼承,其應繼分歸屬於其他繼承人","遺屬在知悉得繼承之時起3個月內表示,且不得申請展延"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L168","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":169,"page":34,"answer":3,"stem":"甲生前投保20萬元之死亡保險未指定受益人,但另有債務25萬元,假設甲死後除了保險金外沒有其他財產,而僅有 一子乙,又乙未向法院表示拋棄繼承,則乙","options":["繼承保險金但無須償還任何債務","以保險金償還債務後仍餘債務5萬元須償還","僅就繼承之保險金償還債務即可","不繼承保險金亦無須繼承債務"],"explanation":"未表示拋棄繼承,則採限定繼承,以所繼承保險金償還債務即可","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L169","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":"補充-04","page":34,"answer":3,"stem":"老王投保20 萬元之死亡保險,受益人為小明,但另有債務25 萬元,假設老王除了保險金外沒有其他財產,而老王只有一子小明且向法院表示拋棄繼承,則小明","options":["須另償還債務\n5 萬元","須另償還債務25 萬","僅領取20 萬元保險金免負擔債務","不繼承保險金亦無須償還任何債務"],"explanation":"因有指定受益人,故死亡保險金不列入遺產,老王遺產為0,僅有25 萬負債","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L-補充-04","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":170,"page":34,"answer":4,"stem":"關於遺產稅款之繳納方式有A現金繳納;B實物抵繳;C分期繳納;D部分現金繳納,部分實物一次抵繳","options":["AB D","AC","BCD","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L170","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":171,"page":34,"answer":4,"stem":"有關繼承的敘述何者正確?","options":["繼父母與繼子女間為直系血親相互有繼承權","父死母再嫁者,子女對其母喪失繼承權","男子入贅妻家後喪失對父母之繼承權","非婚生子女經準正後對其生父有繼承權"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L171","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":172,"page":34,"answer":3,"stem":"依民法規定第一順位繼承人全部拋棄繼承,由其次親等人繼承者,稱為","options":["共同繼承","代位繼承","隔代繼承","概括繼承"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L172","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":173,"page":34,"answer":4,"stem":"某甲為自己及其父投保人壽保險,年繳保費各為兩萬四千元及一萬五千元,但其父未受其扶養,甲在申報綜合所得稅時 採用列舉扣除法,","options":["不得申報扣除","得扣除一萬五千元","得扣除三萬九千元","得扣除二萬四千元"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L173","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":174,"page":35,"answer":3,"stem":"若保險金在死亡保險契約上未指定身故受益人之受領順序及比例時,又被保險人僅列有子女和配偶,則該保險金應如何分配?","options":["配偶、子女各二分之一","配偶三分之二、子女三分之一","按人數平均分配","配偶獨領"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L174","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":175,"page":35,"answer":1,"stem":"有關拋棄繼承之敘述何者正確?","options":["拋棄繼承後,應以書面通知因其拋棄而應為繼承之人","拋棄繼承後,即不繼承財產但負擔債務","當繼承人不只一人,拋棄繼承即須共同為之","拋棄繼承為求程序完整,得以書面向法院申請延展期間。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L175","chapter":"第三章 人身保險與稅法"},{"subject":"保險法規","number":176,"page":35,"answer":1,"stem":"繼承人拋棄繼承時,下列敘述何者錯誤?","options":["經法院同意","須以書面呈報法院","以書面通知因其拋棄而應為繼 承之人","不繼承財產,亦不用負擔任何債務"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L176","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":177,"page":35,"answer":3,"stem":"對於特留分之敘述下列何者錯誤?","options":["子女的特留分為其應繼分的二分之一","祖父母的特留分為其應繼分的三分之一","父母的特留分為其應繼分的三分之一","兄弟姊妹的特留分為其應繼分的三分之一。"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L177","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":178,"page":35,"answer":4,"stem":"李嗣以其子李玖為被保險人購買人身保險,當李嗣死亡時李玖未辦理變更要保人且其他利害關係人也未代為續繳保險 費,若該保險單已累積有保單價值準備金,則該保單價值準備金應","options":["由李玖申請領回","視為保險給付,但列入所得","視為保險給付,不列入所得","列入李嗣之遺產總額,申報遺產稅"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":true,"source":"114年版公會考前精選","priority":true,"id":"G114L178","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":179,"page":35,"answer":2,"stem":"有關各項保險給付之受益人敘述何者錯誤?","options":["身故保險金如作為被保險人遺產,應依民法繼承順位分配","紅利給付之受益人皆為要保人","醫療給付之受益人以被保險人為限,且不得事後加以變更","滿期保險金受益人由要 保人指定,變更時亦由要保人申請"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L179","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":180,"page":35,"answer":3,"stem":"下列敘述何者有誤?","options":["配偶與兩名子女共同繼承時,配偶應繼分為遺產總額之1/\n3","遺產及贈與稅第12-1 條規定,成年子女的扣除額為每年56 萬元","納稅義務人為本人投保的人身保險費,得採標準扣除額之方式申報, 自綜合所得稅總額中扣除","要保人未指定身故受益人時,該筆死亡保險金轉作被保險人遺產"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L180","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":181,"page":35,"answer":2,"stem":"下列何者不是團體保險條款規定受益人請領失能保險金應檢具之文件?","options":["保險金申請書","被保險人印鑑證明書","失能診斷書","受益人身分證明"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L181","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":182,"page":35,"answer":4,"stem":"參加保險業務員資格測驗者之學歷至少應為何?","options":["大學以上學校畢業或同等學歷","國中以上學校畢業或同等學歷","國小畢業","高中以上學校畢業或同等學歷"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L182","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":183,"page":35,"answer":3,"stem":"參加人身保險業務員資格測驗,除年齡,學歷限制外,應具備何種身份報名? A台灣地區居留證;B外僑永久居留 證;C大陸地區配偶領有長期居留證;D港澳居民領有出入境證","options":["BCD","CD","ABC","BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L183","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":184,"page":35,"answer":1,"stem":"下列何者正確?A取得業務員資格即可招攬保險;B業務員之招攬行為僅應受所屬公司之獎懲辦法規範;C業務員違規情事若有犯罪嫌疑,應移送法辦;D業務員有違反保險業務員管理規則之情事,所屬公司應予以停止招攬登錄或撤銷登錄","options":["CD","ABCD","BD","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L184","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":185,"page":35,"answer":4,"stem":"業務員轉任其他保險公司時,依業務員管理規則規定,應","options":["先重新參加業務員資格測驗","由所屬公司辦理變更登錄","通過所屬公司辦理一定課程之在職教育訓練始得依規定重新登錄","由所屬公司辦理重新登錄"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L185","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":186,"page":35,"answer":1,"stem":"業務員因離職、轉任而異動時,所屬公司應向壽險公會申報","options":["註銷登錄","停止招攬登錄","變更登錄","撤銷登錄"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L186","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":187,"page":36,"answer":3,"stem":"保險公司對於業務員的管理,何者為非?","options":["業務員與公司間之勞務契約依民法及相關法令規定辦理","出勤行為應依業務員與保險公司之勞務契約規定辦理","業務員之所有行為皆應依保險業務員管理規則辦理","招攬行為之管理應依保險業務員管理規則辦理"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114L187","chapter":"第五章 保險業務員管理規則的認識"},{"subject":"保險法規","number":188,"page":36,"answer":4,"stem":"依保險法第八條之一規定,所謂保險業務員係指為下列之何者從事保險招攬之人? A\n保險業;B保險經紀人公司;C 保險代理人公司;D兼營保險經紀人或保險代理人業務之銀行","optio
