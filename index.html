要保人的住所不在中華民國境內時，其訴訟之管轄法院\n由雙方於契約中約定。","stem":"若保險契約涉及訴訟，要保人的住所不在中華民國境內時，其訴訟\n之管轄法院為","options":["要保人以前住所","保險公司所在地","台北地區","雙方契約約定地方法院為第一審管轄法院"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L249","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":249,"page":53,"answer":4,"explanation":"(4)兄弟姊妹的特留分為應繼分的三分之一。","stem":"有關民法各順位繼承人之特留分之敘述，何者錯誤？","options":["配偶的特留分是應繼分的二分之一","祖父母的特留分是應繼分的三分之一","父母的特留分是應繼分的二分之一","兄弟姊妹的特留分是應繼分的二分之一"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L250","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":250,"page":53,"answer":1,"explanation":"滿期保險金、醫療保險金、死亡保險金、人壽保險單之紅利皆為免\n稅。","stem":"A滿期保險金、B醫療保險金、C死亡保險金、D人壽保險單之紅利\n上述何種保險給付在一定條件下免稅？","options":["ABCD","ABC","BCD","ACD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L251","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":251,"page":53,"answer":4,"explanation":"(4)免稅額：贈與他人每年免稅額為 244 萬元。","stem":"有關贈與稅，何者陳述錯誤？","options":["納稅義務人為贈與人","免稅額之計算係指一年之贈與","一年如有二次以上之贈與，不得分別計算","免稅額為 123 萬元"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L252","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":252,"page":53,"answer":1,"explanation":"B錯誤，因 113 年公告遺產稅之免稅額為 1333 萬元。","stem":"下列何者為是？\nA遺產及贈與稅法第 17 條規定，被繼承人遺有父母者，父母每人得\n自遺產總額中扣除 100 萬元\nB現行公告遺產稅之免稅額為 1200 萬元\nC財政部於每年 12 月底應公告次年發生之繼承或贈與案件所應適用\n之各項金額","options":["AC","C","B","BC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L253","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":253,"page":53,"answer":1,"explanation":"直系血親卑親屬不包括乾子女。","stem":"直系血親卑親屬不包括？","options":["乾子女","養子女","孫子女","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L254","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":254,"page":54,"answer":4,"explanation":"(4)配偶之扣除額為 400 萬元。","stem":"依遺產及贈與稅法第 17 條規定，遺產稅扣除項目之敘述，何者有\n誤？","options":["父母每人可扣除 100 萬元","被繼承人之喪葬費用可扣除 100 萬元","被繼承人死亡前，依法應納之各項稅損、罰金及具有確實證明之\n未償債務可全額扣除","配偶之扣除額為 440 萬元"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L255","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":255,"page":54,"answer":2,"explanation":"依遺產及贈與稅法第 17 條規定，每個繼承人可扣除 40 萬元。\n未滿 18 歲的繼承人，每年額外加扣 40 萬元。\n16 歲距離 18 歲還有 2 年，因此額外加扣 80 萬元。\n總扣除額為 40 萬元 + 80 萬元 = 120 萬元。（113 年更新）","stem":"依遺產及贈與稅法第 17 條規定，16 歲之未成年子女之扣除額應為\n「」元。","options":["160 萬","120 萬","40 萬","250 萬"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L256","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":256,"page":54,"answer":4,"explanation":"配偶扣除額：553 萬\n直系血親卑親屬扣除額：56 萬\n總扣除額是 553 萬元加上 56 萬元，共 609 萬元。（113 年更新）","stem":"依遺產及贈與稅法第 12-1 條規定，被繼承人僅遺有配偶及成年子\n女 1 名，該遺產扣除額合計為「」萬元。","options":["450","440","500","609"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L257","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":257,"page":54,"answer":1,"explanation":"被繼承人死亡遺有財產者，納稅義務人應於被繼承人死亡之日起六\n個月內，向戶籍所在地主管稽徵機關依遺產及贈與稅法規定辦理遺\n產稅申報。","stem":"被繼承人死亡遺有財產者，納稅義務人應於被繼承人死亡之日起\n「」內，向戶籍所在地主管稽徵機關依遺產及贈與稅法規定辦理遺\n產稅申報。","options":["六個月","一個月","三個月","二個月"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L258","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":258,"page":54,"answer":1,"explanation":"凡經常居住中華民國境內之中華民國國民死亡時遺有財產者，就其\n在中華民國境內、境外全部遺產，依遺產及贈與稅法規定，課徵遺\n產稅。","stem":"依遺產及贈與稅法之規定，凡居住我國境內之我國國民遺有財產\n者，應","options":["就其在我國境內、外全部財產","我國境內部分財產須要，國外部分財產不須要","僅就其在我國境內之財產","以上皆非課遺產稅"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L259","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":259,"page":55,"answer":3,"explanation":"應繼分：500 萬元 ÷ 2 = 250 萬元（每人應繼分）\n特留分：應繼分的一半，250 萬元 ÷ 2 = 125 萬元（每人特留分）\n遺囑分配後，乙和丙各得 100 萬元，但這低於特留分，因此可以主\n張特留分，最終乙可繼承 125 萬元。","stem":"甲僅遺有子女乙與丙，甲死後遺留財產五百萬元，甲於遺囑中表示\n將其遺產 60% 全數捐給慈善機構，僅留 40% 由乙、丙平均分\n配，則依民法規定乙可繼承多少金額？","options":["100 萬元","250 萬元","125 萬元","500 萬元"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L260","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":260,"page":55,"answer":2,"explanation":"(2)納稅義務人為本人投保的人身保險費，得採列舉扣除額之方式申\n報，自綜合所得總額中扣除。（113 年更新）","stem":"下列的敘述何者有誤？","options":["遺產及贈與稅法第 12-1 條規定，成年子女的扣除額為每人新台\n幣 56 萬元","納稅義務人為本人投保的人身保險費，得採標準扣除額之方式申\n報，自綜合所得總額中扣除","配偶與兩名子女共同繼承時，配偶之應繼分為遺產總額之三分之\n一","要保人未指定身故受益人時，該筆之死亡保險金轉作被保險人遺\n產。"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L261","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":261,"page":55,"answer":4,"explanation":"依遺產及贈與稅法第 17 條規定，被繼承人遺有受其扶養之兄弟姊妹\n者， 每人得自遺產總額中扣除 40 萬元，免徵遺產稅。","stem":"依遺產及贈與稅法第 17 條規定，被繼承人遺有受其扶養之兄弟姊\n妹者，每人得自遺產總額中扣除「」元，免徵遺產稅。","options":["50 萬","100 萬","45 萬","40 萬"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L262","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":262,"page":55,"answer":3,"explanation":"(1)配偶相互贈與之財產，不須計入贈與總額\n(2)贈與稅之納稅義務人死亡時，贈與稅尚未核課者，須繳納贈與\n稅。","stem":"下列何者正確？","options":["配偶相互贈與之財產應計入贈與總額","贈與稅之納稅義務人死亡時，贈與稅尚未核課者，無須繳納贈與\n稅","本國國民就其中華民國境外之財產為贈與，應課徵贈與稅","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L263","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":263,"page":56,"answer":3,"explanation":"在繼承開始時有當然繼承人（配偶）得與第一順位繼承人同為繼承\n人，故父母無法分得遺產。","stem":"死亡保險金一千萬且未指定身故受益人，被保險人遺有配偶、子女\n兩名和父母，則被保險人之父親可分配到「」元。","options":["200 萬","500 萬","0 萬","125 萬"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L264","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":264,"page":56,"answer":1,"explanation":"張三之遺留保險金 1000 萬分給四個孩子（1人250萬），而長子早\n死，其子 A、B 可代位繼承長子分得之財產，各可得 125 萬元。","stem":"張三（被繼承人）育有 4 子，其長子較張三早死，當張三死亡可由\n其孫 A、B 代位其父繼承對張三之應繼分。如張三遺留保險金 1000\n萬元，則其孫各可代位繼承","options":["125 萬","250 萬","300 萬","100 萬"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L265","subject":"保險法規","chapter":"第三章 人身保險與稅法","number":265,"page":56,"answer":3,"explanation":"課稅遺產淨額 = 遺產總額 - 免稅額及 - 扣除額","stem":"下列何者係指被繼承人遺留的遺產總額減掉免稅額及扣除額後所剩\n的餘額為","options":["遺囑繼承額","特留分","課稅遺產淨額","應繼分"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L266","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":266,"page":57,"answer":2,"explanation":"(1)業務人員的離職金通常依公司規定計算，與業績無直接關聯。\n(3)金融服務業雖須依金消法規定訂定酬金制度，但無需提報股東大\n會。\n(4)保險契約成立後，酬金通常分期發放，視契約生效時間或其他條\n件而定，不會立即全數支付。","stem":"有關酬金制度,下列何者正確？","options":["業務人員離職，所領取之離職金會依照業績去計算","保險契約撤銷、無效、解除時，應按與業務人員簽訂之合約或其\n所適用之辦法規定追回已發放之酬金","金融服務業依據金消法規定訂定業務人員酬金制度並須提報股東\n大會","客戶保險契約成立後，保險公司應立即全數發放酬金給業務員"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L267","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":267,"page":57,"answer":2,"explanation":"金融教育宣傳不需事先核可即可進行，但若涉及推廣特定金融商品或\n服務，則需依規定辦理。","stem":"有關金融消費保護法，下列敘述何者錯誤？","options":["與金融消費者訂立的契約條款顯失公平時，該部分條款無效","金融教育宣傳時如要引薦個別金融商品或服務需事先取得核可","金融服務業對金融消費者之責任，不可預先約定限制或免除","契約條款若有疑義時以有利金融消費者做解釋"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L268","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":268,"page":57,"answer":2,"explanation":"保險業常見的低風險交易情境包括：\n1. 投保不具有保單價值準備金的商品，如短年期壽險、傷害保險、健\n康保險。\n2. 投保小額終老保險、微型保險、團體年金保險、團體醫療保險、\n團體定期壽險等團體保險商品。\n3. 客戶無高洗錢或資恐風險表徵，且年繳保費不超過 3 萬元或躉繳\n保費不超過 7.5 萬元。\n【說明】低洗錢風險的特性：沒保單價值、團體險、沒表徵且保費低\n（年繳 3 萬以下、躉繳 7 萬 5以下）\nC選項需更正為「團體年金」，因此答案為 ABD","stem":"「保險業防制洗錢及打擊資恐最佳實務指引」第四點列舉保險業常\n見之低風險交易情境，有哪些？\nA投保微型保險 B團體醫療保險 C年金 D客戶未有高洗錢集資恐\n風險之表徵，年繳費保費未逾一定金額三萬元","options":["ABCD","ABD","ABC","BCD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L269","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":269,"page":58,"answer":1,"explanation":"(2)僅未提供審閱期間之定型化契約無效\n(3)壽險商品應提供至少 3 日之審閱期間\n(4)應提供契約撤銷權","stem":"有關審閱期間規定之敘述何者為是？","options":["保戶得主動放棄審閱權","未提供審閱期間者契約一律無效","壽險商品之審閱期間不得低於 5 日","有提供審閱期間者無須提供契約撤銷權"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L270","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":270,"page":58,"answer":1,"explanation":"A、B 不可就該事件再行起訴或評議\nC 評議書經法院核可後有依法無效之原因，當事人得提起宣告評議無\n效或撤銷評議之訴","stem":"金融消費評議成立後且評議書經法院核可者，何者錯誤？\nA 當事人就該事件得再行起訴\nB 當事人就該事件得再申請評議\nC 評議書經法院核可後有依法無效之原因，當事人不得提起宣告評\n議無效或撤銷評議之訴\nD 評議書內容如有牴觸法令而未予核可者，法院應通知爭議處理機\n構及當事人","options":["ABC","AB","ABCD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L271","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":271,"page":58,"answer":2,"explanation":"(2)是由企業經營者單方面所預先擬具。","stem":"有關定型化契約敘述，何者有誤？","options":["消保法對其權利義務的履行訂有相當完整的規範","是由企業經營者與消費者雙方面所共同議定","條款如有疑義時，應為有利於消費者之解釋","消費者只有簽訂與否的權利"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L272","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":272,"page":58,"answer":4,"explanation":"金管會列舉保險業常見之低風險交易情境，如：客戶投保不具有保單\n價值準備金之保險商品、微型保險、小額終老保險、團體年金/定期/\n傷害/健康/醫療保險、客戶無高洗錢及資恐風險之表徵，年繳保 費\n未逾三萬元/躉繳未逾七萬五千元，強制汽車責任險、農業保險、小\n額財產保險，保險公司得進行簡化審查及持續監控措施。","stem":"金管會列舉保險業常見之低風險交易情境，如：投保「」，保險公\n司得進行簡化審查及持續監控措施。\nA微型保險 B具有保單價值準備金之保險商品 C團體年金保險\nD客戶無高洗錢及資恐風險之表徵，年繳保費未逾三萬元","options":["ABC","AC","ABCD","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L273","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":273,"page":59,"answer":4,"explanation":"(1)公司對商品銷售獎勵核給，在酬金與業績衡平原則下不應僅以業績\n目標達成做為計算基礎\n(2)公司不應於業務員一賣出商品就發給高額酬金，而應將業務員所\n涉稽核缺失、客戶紛爭、KYC等非財務指標納入考量\n(3)公司應該將該原則納入教育訓練課程每年至少3小時，業務員未完\n成該訓練應辦理撤銷登錄。","stem":"有關金融服務業公平待客原則，何者正確？","options":["公司對商品銷售獎勵核給，在酬金與業績衡平原則下應注意僅以\n業績目標達成做為計算基礎","公司應於業務員一賣出商品就發給高額酬金以符合酬金與業績衡\n平原則","公司應該將該原則納入教育訓練課程每年至少 2 小時，業務員未\n完成該訓練應辦理撤銷登錄","該原則共 9 大指標，並增訂第 10 項董事會重視情況"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L274","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":274,"page":59,"answer":2,"explanation":"(2)個人資料保護法立法目的是為了規範蒐集、處理及利用個人資\n料，以免人格權受侵害，並促進個人資料的合理利用。","stem":"金融業引進金融科技帶來產業創新，何者為非？","options":["金融科技帶來公司追求經營效率最大化應兼顧公平待客及消費者\n保護","個人資料保護法立法目的皆禁止個人資料蒐集或無限制保護個人\n資料","政府近年來為遵循洗錢防制及打擊資恐相關規定，要求金融業強\n化辨識客戶資金來源及最終受益人身分","科技帶來的便利會犧牲個資權益，這些犧牲須以法律方式明訂"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L275","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":275,"page":59,"answer":3,"explanation":"保險業蒐集之特種個資包含病歷、醫療、基因、性生活、健康檢查及\n犯罪前科之個人資料。","stem":"保險業核保理賠時需蒐集當事人之特種個資，除經當事人書面同意\n外，須符合法律明文規定使得為之，下列何者為保險業蒐集之特種\n個資？ A健康檢查、B病歷、C指紋、D職業","options":["ABD","BC","AB","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L276","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":276,"page":60,"answer":3,"explanation":"A 金融服務業對金融消費者之責任，不得預先約定限制或免除\nD 金融服務業與金融消費者訂立契約條款顯失公平者，該部分條款無\n效。","stem":"有關金融消費者保護法規定，何者有誤？\nA金融服務業對金融消費者之責任得預先約定限制\nB金融服務業對金融消費者之責任不得預先免除\nC違反預先限制之約定無效\nD金融服務業與金融消費者訂立契約條款顯失公平者契約無效","options":["BCD","A","AD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L277","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":277,"page":60,"answer":2,"explanation":"D 因投資型商品較複雜，不得由業務員代為決定客戶投資屬性。","stem":"為充分瞭解消費者屬性，金融服務業應\nA銷售前做消費者適合度調查\nB依不同商品建立差異化事前審查機制\nC考量消費者確實瞭解所交保費係用以購買保險商品\nD因投資型商品較複雜，得由業務員代為決定客戶投資屬性","options":["AC","ABC","ACD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L278","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":278,"page":60,"answer":2,"explanation":"(2)非公務機關蒐集個人資料僅須符合指定目的外，應有特定目的，\n並符合下列情形之一：\n1.法律明文規定\n2.與當事人有契約或類似契約之關係，且已採取適當之安全措施\n3.當事人自行公開或其他已合法公開之個人資料\n4.學術研究機構基於公共利益為統計或學術研究而有必要，且資料經\n過提供者處理後或經蒐集者依其揭露方式無從識別特定之當事人\n5.經當事人同意\n6.為增進公共利益所必 要\n7.個人資料取自於一般可得之來源。但當事人對該資料之禁止處理或\n利用，顯有更值得保護之重 大利益者，不在此限\n8.對當事人權益無侵害","stem":"有關個人資料保護法，何者為非？","options":["姓名、出生年月日、身分證字號、指紋及護照號碼等皆屬個人資\n料","非公務機關蒐集個人資料僅須符合指定目的即得為之","保險公司蒐集保戶資料係符合特定目的、與當事人有契約關係且\n已採取適當之安全措施及經當事人同意等要件","當事人可請求刪除、停止處理或利用該個人資料"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L279","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":279,"page":61,"answer":4,"explanation":"非公務機關在蒐集個人資料時，除須符合特定目的外，尚須具有題目\n所述情形之一，始得為之。","stem":"非公務機關在蒐集個人資料時，除了須符合特定目的外，尚須具有\n下列何種情形之一，始得為之","options":["當事人自行公開或其他已合法公開之個人資料","經當事人同意","與當事人有契約關係會類似契約關係","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L280","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":280,"page":61,"answer":2,"explanation":"(2)金融服務業已依評議成立內容完全履行者，免送請法院核可。","stem":"下列有關金融消費爭議處理之敘述何者錯誤？","options":["消費者在評議成立後，得於不變期間內申請爭議處理機構將評議\n書送法院核可","金融服務業即使已依評議內容履行，爭議處理機構仍應將評議書\n送法院核可","爭議處理機構將評議書及卷證送請該機構事務所所在地之管轄法\n院核可","評議書經法院核可後，與民事確定判決有同一效力"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L281","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":281,"page":61,"answer":4,"explanation":"企業經營者與消費者訂立之一般消費之定型化契約，應提供消費者\n30 日內的合理期間，以審閱全部條款。","stem":"依消保法規定，企業經營者與消費者訂立定型化契約前，應提供多\n久之合理期間以審閱全部條款？","options":["10 日內","7 日內","15 日內","30 日內"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L282","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":282,"page":61,"answer":4,"explanation":"政府、企業經營者及消費者均應致力充實消費資訊。","stem":"下列何者應致力充實消費資訊提供消費者運用，俾能採取正確合理\n之消費行為，以維護其安全與權益？","options":["政府","企業經營者","消費者","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L283","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":283,"page":61,"answer":3,"explanation":"消費者保護法第 12 條：定型化契約中之條款違反誠信原則，對消費\n者顯失公平者，無效。","stem":"依消保法規定，定型化契約條款內容違反誠信原則，對消費者顯失\n公平者，應為","options":["得撤銷","視為無記載","無效","有利於消費者解釋"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L284","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":284,"page":62,"answer":3,"explanation":"該中心主要業務包括：處理所有與金融消費有關之爭議案件，及辦\n理對金融服務業及金融消費者之教育宣導，使金融服務業與金融消\n費者均能充分了解正確之金融消費觀念及金融消費關係之權利與義\n務，以有效預防金融消費爭議發生。","stem":"以下何者為金融消費評議中心之任務？\nA處理所有與金融消費有關之民事爭議\nB辦理金融服務業及金融消費者之教育宣導\nC始金融服務業及消費者均能充分了解彼此權利義務\nD受理各種 型態之消費申訴","options":["ABCD","AD","ABC","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L285","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":285,"page":62,"answer":2,"explanation":"(2)留存確認客戶身分之程序資料，應自業務關係終止時起至少保存\n五年","stem":"有關金融機構確認客戶身分程序之敘述何者錯誤？","options":["應以風險為基礎","留存確認客戶身分之程序資料，應自業務開始時起至少保存五年","審查範圍擴及實質受益人","臨時交易者留存確認程序之資料，應自臨時性交易終止時起至少\n保存五年"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L286","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":286,"page":62,"answer":3,"explanation":"金融服務業提供之金融商品屬於複雜性高風險商品者，前開說明及\n接露除以非臨櫃之自動化通路交易或金融消費者不予同意情形外，\n應錄音或錄影。","stem":"基於保護金融消費者之目的，下列何種情況需要在銷售過程中以錄\n音或錄影的方式保留紀錄？","options":["銷售投資型保險商品予屆齡退休之客戶","銷售含解約金的商品予 60 歲以上之客戶","銷售複雜性高風險商品予 40 歲以上之客戶","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L287","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":287,"page":63,"answer":2,"explanation":"爭議處理機構送請法院核可前，金融服務業已依評議成立內容完全\n履行者，免送請核可。","stem":"下列有關金融消費爭議處理之敘述何者錯誤？","options":["消費者在評議成立後，得於不變期間內申請爭議處理機構將評議\n書送法院核可","金融服務業即使已依評議內容履行，爭議處理機構仍應將評議書\n送法院核可","評議書經法院核可後，與民事確定判決有同一效力","爭議處理機構應於受理申請之日起 5 日內，將評議書及卷證送請\n爭議處理機構事務所所在地之管轄地方法院核可"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L288","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":288,"page":63,"answer":1,"explanation":"參閱洗錢防制法適用之金融機構。","stem":"除人身保險公司外，哪些單位於推出具有保單價值準備金之新產品\n或提供與金錢有關之服務前須進行洗錢及資恐風險評估？\nA個人執業保險經紀人 B專業再保險公司 C保險代理人公司\nD財產保險公司","options":["ABCD","ABC","BD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L289","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":289,"page":63,"answer":4,"explanation":"同一疾病或傷害或因此引發之併發症，被保險人出院後14日內於同\n一醫院再次住院時，視為一次住院辦理。","stem":"依據住院醫療費用保險單示範條款規定，被保險人出院後幾日內於\n同一醫院再次住院時，視為一次住院辦理「」日。","options":["30","15","10","14"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L290","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":290,"page":63,"answer":1,"explanation":"傷害保險因同一意外傷害事故致成失能後身故的保險給付，失能及\n身故保險金的給付總金額合計最高以保險金額為限。","stem":"傷害保險因同一意外傷害事故致成失能後身故的保險給付","options":["失能及身故保險金的給付合計最高以保險金額為限","身故保險金最高以保險金額為限，失能保險金沒有限制","失能保險金最高以保險金額為限，身故保險金沒有限制","失能或身故保險金的給付分別最高以保險金額為限"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L291","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":291,"page":64,"answer":1,"explanation":"(1)金融服務業故意所致之損害，法院得依消費者請求依侵害情節酌\n定損害額三倍以下之懲罰性賠償","stem":"金融服務業違反金消法致消費者受有損害，何者錯誤？","options":["金融服務業故意所致之損害，法院得依消費者請求依侵害情節酌\n定損害額三倍以上之懲罰性賠償","消費者依金消法求償時，無須舉證金融機構的過失","金融服務業過失所致之損害，法院得酌定損害額一倍以下之懲罰\n性賠償","金融服務業如能舉證損害發生原因非因其未說明或說明不實所致\n者，免負賠償責任"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L292","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":292,"page":64,"answer":3,"explanation":"大額通貨交易之通報：金融機構或人員對於達新台幣 50 萬元以上\n（或等值外幣）之通貨交易（現金收復或換鈔交易），應向法務部\n調查局申報。","stem":"依洗錢防制法規定金融機構對於一定金額以上通貨交易，應確認客\n戶身分及留存客戶之交易紀錄，並向指定機構申報所稱一定金額，\n係指新台幣「」以上。","options":["二百萬","一百萬","五十萬","二百五十萬"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L293","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":293,"page":64,"answer":4,"explanation":"金融服務業從事相關銷售活動時應遵循之原則，其一為不得藉金融\n教育宣導，引薦個別金融商品或服務","stem":"下列何者有誤？","options":["金融服務業刊登廣告不得有虛偽或其他足致他人誤信","金融服務業對金融消費者所提示之資料或說明，應確保內容真實","金融服務業對金融消費者所負擔之義務不得低於廣告內容","金融服務業得藉由金融教育宣導方式，對消費者引薦個別金融商\n品或服務"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L294","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":294,"page":64,"answer":2,"explanation":"非金融機構或人員：銀樓業、地政士、不動產經紀業從事與不動產\n買賣交易有關行為，律師、公證人、會計師為客戶準備或進行特定\n交易時，信託及公司服務提供業、其他業務特性或交易型態易為洗\n錢犯罪利用之事業或從業人員。","stem":"下列何者為洗錢防制法適用之非金融事業或人員？\nA會計師、B地政士、C銀樓業、D不動產經紀業","options":["BCD","ABCD","CD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L295","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":295,"page":65,"answer":4,"explanation":"B客戶要求開立取消禁止背書轉讓支票，達特定金額且無法提出合理\n說明。","stem":"業務員於洗錢防治上應留意客戶異常行為並協助申報，何者屬於異\n常交易？\nA大額保費非要保人或其他利害關係人支付，且無法提出合理說明\nB客戶要求開立禁止背書轉讓支票，達特定金額且無法提出合理說\n明\nC躉繳大額保費後，短期內申請大額保單借款或終止契約，且無法\n提出合理說明\nD保戶刻意規避身份確認程序","options":["CD","ABCD","BCD","ACD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L296","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":296,"page":65,"answer":4,"explanation":"通訊交易：B便利商店的購物型錄 D電話行銷醫療險 E信箱中的購物\n傳單訪問交易：A騎樓下的信用卡推廣 C逐戶拜訪的羊奶推銷","stem":"A騎樓下的信用卡推廣 B便利商店的購物型錄\nC逐戶拜訪的羊奶推銷 D電話行銷醫療險\nE信箱中的購物傳單，請問上述行銷方式哪些為消保法中的訪問交\n易？","options":["BE","ACD","BD","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L297","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":297,"page":65,"answer":1,"explanation":"特種資料定義：有關病例、醫療、基因、性生活、健康檢查及犯罪\n前科之個人資料，不得蒐集、處理或利用。","stem":"蒐集準保戶的資料，不包括？","options":["過去的違法紀錄","嗜好","家屬姓名、年齡","職業、地位"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L298","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":298,"page":65,"answer":4,"explanation":"立法目的，主要是為保護消費者的權益。","stem":"下列何者應致力充實消費資訊提供消費者運用，俾能採取正確合理\n之消費行為，以維護其安全與權益？","options":["企業經營者","消費者","政府","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L299","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":299,"page":66,"answer":1,"explanation":"非公務機關蒐集個人資料之告知，有以下情況之一者，得免為前開\n告知：\n1.依法律規定得免為告知\n2.個人資料之蒐集係公務機關執行法定職務或非公務機關履行法定\n義務所必要\n3.告知將妨害公務機關執行法定義務。\n4.告知將妨害公共利益\n5.當事人明知應告知之內容\n6.個人資料之蒐集非基於營利之目的，且當事人顯無不利之影響","stem":"業務員因銷售保險商品逕向要保人所蒐集之資料，下列敘述何者正\n確？","options":["若依法律規定得免告知者，得免為告知","法律雖有規定但基於保護消費者，皆需為告知，不得免除","不需告知要保人使用目的","屬公務機關之資料蒐集"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L300","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":300,"page":66,"answer":3,"explanation":"非公務機關蒐集個人資料時，除須符合特定目的外尚須具下列情\n形：\n1.法律明文規定\n2.與當事人有契約關係且已採取適當安全措施\n3.當事人自行公開或其他已合法公開之個人資料\n4.學術研究機構基於公共利益為統計或學術研究而有必要，且資料\n提供者處理或蒐集者依其揭露方式無從識別特定當事人\n5.經當事人同意\n6.為增進公共利益所必要\n7.個人資料取自於一般可得來源。但當事人對該資料之禁止處理或利\n用，顯有更值得保護之重大利益者，不在此限\n8.對當事人權益無侵害","stem":"保戶填寫要保書聲明同意保險人依個資法取得相關資料，即符合非\n公務機關於蒐集個資時，除符合特定目的外，亦符合\nA法律明文規定\nB與當事人有契約關係且已採取適當安全措施\nC經當事人同意\nD為增進公共利益所必要","options":["AB","AD","ABCD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L301","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":301,"page":66,"answer":1,"explanation":"金融消費評議中心受理消費者申訴後，會先將案件移交受申訴之金\n融服務業處理，金融服務業應於收到申訴之日起 30 日內為適當之\n處理，並將處理結果回覆消費者。","stem":"金融消費評議中心受理消費者申訴後，會先將案件移交受申訴之金\n融服務業處理，金融服務業應於收到申訴之日起「」內為適當之處\n理，並將處理結果回覆消費者。","options":["30 日","60 日","10 日","15 日"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L302","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":302,"page":67,"answer":3,"explanation":"金融消費者保護法，訂定業務人員酬金制度：酬金制度須報董事會\n通過、佣金獎金不超過附加費用","stem":"保險業應切實確認保險商品之相關佣金、獎金及營業費用不應超過\n「」，而有費差損情事。","options":["責任準備金","所收總保費","附加費用","保單價值準備金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L303","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":303,"page":67,"answer":3,"explanation":"業務員行銷是訪問交易","stem":"人身保險的行銷通路中下列何者非屬於消費者保護法下的通訊交\n易？","options":["電話行銷","DM行銷","業務員行銷","電視行銷"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L304","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":304,"page":67,"answer":4,"explanation":"金融服務業公平待客原則之指標：訂約公平誠信原則、注意與忠實\n義務原則、廣告招攬真實原則、商品或服務適合度原則、告知與揭\n露原則、複雜性高風險商品原則、酬金與業績衡平原則、申訴保障\n原則、業務人員專業性原則。","stem":"何者屬於金融服務業公平待客原則之指標？\nA業務人員專業性原則 B廣告招攬真實原則 C申訴優先處理原則\nD商品或服務適合度原則 E酬金與業績衡平原則","options":["ABD","ABCDE","BCD","ABDE"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L305","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":305,"page":67,"answer":1,"explanation":"洗錢防制法金融機構包括：銀行、信用合作社、辦理儲金匯兌之郵\n政機構、票券金融公司、信用卡公司及信託業、證券商、證券投資\n信託事業、證券金融事業、證券投資顧問事業、證券集中保管事\n業、期貨商、保險公司、專業再保險公司及辦理簡易人壽保險業務\n之郵政機構、電子票證發行機構、電子支付機構、槓桿交易商、期\n貨信託事業、期貨經理事業，以及保險代理人公司、保險經紀人公\n司及個人執業之保險代理人、保險經紀人。","stem":"下列之金融機構何者適用洗錢防制法？\nA證券商、B保險公司、C信用卡公司、D郵政機構","options":["ABCD","AB","BD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L306","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":306,"page":67,"answer":2,"explanation":"主管機關要求金融服務業應把公平待客原則納入教育訓練課程，每\n年對於在職人員至少進行 3 小時的公平待客教育訓練。","stem":"主管機關為落實對於金融消費者保護的重視，要求金融服務業應把\n公平待客原則納入教育訓練課程，每年對於在職人員至少進行「」\n小時的公平待客教育訓練。","options":["10","3","12","5"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L307","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":307,"page":67,"answer":1,"explanation":"金融服務業包括：銀行業、證券業、期貨業、保險業、電子票證業\n及其他經主管機關公告之金融服務業，但不包括證交所、櫃買中\n心、集保事業、期交所及其他經主管機關公告之事業等。","stem":"依金消法規定，金融服務業包括：\nA期貨業、B保險業、C證券交易所、D證券集中保管事業","options":["AB","ABCD","BCD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L308","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":308,"page":68,"answer":3,"explanation":"定型化契約條款若牴觸個別磋商條款之約定者，其牴觸部分無效。","stem":"定型化契約條款若牴觸個別磋商條款之約定時，","options":["該定型化契約條款全部無效","該定型化契約條款全部有效","該定型化契約條款牴觸部分無效","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L309","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":309,"page":68,"answer":2,"explanation":"金融消費爭議定義：指金融消費者與金融服務業間因商品或服務所\n生之民事爭議，但不包括行政或刑事爭議的案件。","stem":"金消法規定之金融消費爭議係指辦理金融消費者與金融服務業間，\n因商品或服務所生之「」，屬於金融消費爭議的適用範圍。","options":["行政爭議","民事爭議","刑事爭議","以上皆可"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L310","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":310,"page":68,"answer":4,"explanation":"金融消費者指接受金融服務業提供金融商品或服務者。\n但不包括下列對象：專業投資機構、符合一定財力或專業能力之自\n然人或法人。","stem":"依據金消法規定，金融消費者係指接受金融服務業提供金融商品或\n服務，但不包含 A專業投資機構 B符合一定財力之自然人\nC一般消費者 D專業能力之自然人","options":["AD","ABCD","BCD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L311","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":311,"page":68,"answer":1,"explanation":"洗錢防制法適用於非金融機構或人員，包括銀樓業、地政士及不動\n產經紀業從事不動產交易的行為；律師、公證人、會計師在為客戶\n準備或進行特定交易時；信託及公司服務提供業在為客戶準備或進\n行特定交易時；以及其他容易被洗錢犯罪利用的事業或從業人員。","stem":"洗錢防制法適用之金融機構，下列何者為非？","options":["銀樓業","漁會信用部","證券投資顧問事業","全國農業金庫"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L312","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":312,"page":68,"answer":2,"explanation":"為保護金融消費者，金融服務業應訂定業務人員酬金制度並提報董\n（理）事會通過。","stem":"為保護金融消費者，金融服務業依據金消法規定訂定業務人員酬金\n制度並提報「」通過。","options":["股東大會","董（理）事會","主管機關","業務員代表大會"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L313","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":313,"page":68,"answer":4,"explanation":"不論金額多寡，只要符合洗錢表徵，應疑似洗錢或資恐交易之日 10\n個營業日內，向法務部調查局申報。","stem":"金融機構自發現疑似洗錢或資恐交易日起「」內，依申報格式簽報\n專責主管核定後立即申報。","options":["5 個營業日","一個月","15 個營業日","10 個營業日"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L314","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":314,"page":69,"answer":4,"explanation":"消費大眾權益之重大訊息發生時應以 2 日內以書面向主管機關報\n告，並主動公開說明。","stem":"保險業於有攸關消費大眾權益之重大訊息發生時，應於「」日內以\n書面向主管機關報告，並主動公開說明。","options":["5","7","10","2"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L315","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":315,"page":69,"answer":3,"explanation":"根據消保法 11 條：「定型化契約條款如有疑義，應為有利於消費者\n之解釋」","stem":"保險契約內容由保險公司決定，基於衡平原則，有何補救措施？","options":["要保人可解除契約","契約條款內容要保人可要求法院公證","契約條款有疑義時，應做有利被保險人解釋","契約條款有疑義時，應由保險人斟酌實際情況決定"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L316","subject":"保險法規","chapter":"第四章 保戶權益相關重要法律介紹","number":316,"page":69,"answer":3,"explanation":"保單價值準備金以簽單保險費之利率及危險發生率為基礎。","stem":"依保險法實施細則規定，人身保險業以計算保險契約簽單保險費之\n利率及危險發生率為基礎，並依主管機關規定方式計算之金額為？","options":["責任準備金","賠款準備金","保單價值準備金","解約金"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L317","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":317,"page":70,"answer":4,"explanation":"曾因違反保險業務員管理規則第 13 條或第 19 條被撤銷登錄者，須\n通過人身保險業務員資格測驗後，才能重新登錄。","stem":"有關人身保險業務員資格測驗之敘述何者錯誤？","options":["成年以上大陸地區配偶領有長期居留證且具有高中以上同等學歷\n者，得報名參加","曾受保險業務員管理規則第 13 條撤銷登錄者，可立即重新報名\n參加","曾受保險業務員管理規則第 19 條撤銷登錄者，可立即重新報名\n參加","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L318","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":318,"page":70,"answer":3,"explanation":"保險經紀人係基於被保險人之利益，代向保險公司洽訂保險契約或提\n供服務而向保險公司收取佣金之人","stem":"保險經紀人係基於「」之利益，代向保險公司洽訂保險契約或提供\n服務而收取佣金之人。","options":["承保的保險業","保險人及被保險人","被保險人","要保人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L319","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":319,"page":70,"answer":3,"explanation":"依據人身保險業務員教育訓練要點第2條：法令遵循課程由財團法人\n保險事業發展中心(以下簡稱保發中心)製作，以數位課程為主","stem":"業務員參加外部共同法令遵循 6 小時訓練課程，何者正確？","options":["凡業務員資格測驗合格者，不論登錄與否皆須遵守該規定","該課程嚴禁冒名上課及測驗，違反業務員及代上課者皆予以撤銷\n登錄","由保險事業發展中心製作數位課程供業務員線上學習","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L320","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":320,"page":70,"answer":2,"explanation":"依據人身保險業務員教育訓練通報暨換證作業規範第 7 條：\n人身保險業務員每五年，完成規定之教育訓練課程及時數，並檢附原\n登錄證向所屬公司申請換證。 故答案選擇(2)","stem":"業務員應於登錄後，檢附參加所屬公司教育訓練合格證明「」，向\n所屬公司辦理換發登錄證手續。","options":["每 4 年","每 5 年","每年","每 3 年"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L321","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":321,"page":71,"answer":3,"explanation":"依照保險業務員管理規則第 7 條：\n二、申請登錄之文件有虛偽之記載者。\n六、受破產之宣告，尚未復權者。\n八、依第十九條規定在受經營同類保險業務之保險業、保險代理人公\n司、保險經紀人公司或銀行停止招攬行為期限內者。\nC 產險非屬於同類保險業務。","stem":"何種情況不得登錄為壽險業務員？\nA申請登錄文件有虛偽記載\nB壽險受有停止招攬處分尚未期滿\nC產險受有停止招攬處分尚未期滿\nD受破產宣告尚未復權","options":["ACD","ABCD","ABD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L322","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":322,"page":71,"answer":2,"explanation":"再登錄：指\n1.業務員經註銷登錄後，轉任其他公司或離職再任職原所屬公司，重\n新辦理登錄者。\n2.受經營同類保險業務之停止招攬處分期間屆滿後，重新辦理登錄\n者。","stem":"業務員何時須先辦理再登錄始得招攬？\nA受處分公司依管理規則第 19 條第 1 項停止招攬處分期間屆滿後\nB受處分公司撤銷登錄後\nC從原公司辦理註銷登錄後轉任其他公司時\nD取得投資型測驗合格後欲招攬投資型保險商品時","options":["ABD","AC","ABC","ACD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L323","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":323,"page":71,"answer":2,"explanation":"想成為壽險業務員需登錄至一般壽險公司或保險代理人公司或保險經\n紀人公司或兼營保險經紀人或保險代理人業務之銀行。","stem":"想成為壽險業務員需登錄至\nA一般壽險公司 B保險代理人公司或保險經紀人公司\nC兼營保險經紀人或保險代理人業務之銀行 D壽險公會","options":["BCD","ABC","ABCD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L324","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":324,"page":71,"answer":2,"explanation":"產險經紀人公司之業務員，取得人身保險業務員資格後得無條件登錄\n於另一家壽險經紀人公司。","stem":"甲現為產險經紀人公司之業務員，取得人身保險業務員資格後","options":["需先辦理產險註銷登錄後使得登錄壽險","得無條件登錄於另一家壽險經紀人公司","得無條件登錄於另一家壽險公司或人身保險代理人公司","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L325","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":325,"page":72,"answer":1,"explanation":"業務員曾受保險業務員管理規則第 13 條撤銷登錄者，應於撤銷後重\n新參加業務員資格測驗合格。","stem":"業務員曾受保險業務員管理規則第 13 條撤銷登錄者，應於撤銷後","options":["重新參加業務員資格測驗合格","重新參加教育訓練","重新辦理登錄領取新的登錄證即可","選項 1 或 2 皆可使得登錄"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L326","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":326,"page":72,"answer":1,"explanation":"領有財產保險經紀人執業證照之保險經紀人，其業務員僅得再登錄於\n另一家非經營同類保險業務之保險經紀人公司。","stem":"領有財產保險經紀人執業證照之保險經紀人，其業務員","options":["僅得再登錄於另一家非經營同類保險業務之保險經紀人公司","完全不得再登錄於其他公司","僅得再登錄於另一家非經營同類保險業務之保險代理人公司","得再登錄於另一家財產保險公司"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L327","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":327,"page":72,"answer":4,"explanation":"傷害保險失能給付保險金，按失能程度原分為 11 級 79 項，經參考\n勞工保險及強制車險失能給付標準新增鼻未缺損，而鼻機能永久遺存\n顯著障害為 80 項。","stem":"傷害保險失能給付保險金，按失能程度原分為 11 級 79 項，經參考\n勞工保險及強制車險失能給付標準新增","options":["鼻部缺損，致其機能永久遺存顯著障害","鼻未缺損，而鼻機能暫時喪失遺存顯著障礙","鼻部缺損，致其機能暫時喪失","鼻未缺損，而鼻機能永久遺存顯著障害為 80 項"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L328","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":328,"page":72,"answer":1,"explanation":"業務員曾受第 19 條撤銷登錄處分者，應於撤銷期滿重新參加業務員\n資格測驗合格始得登錄。","stem":"業務員曾受第 19 條撤銷登錄處分者，應於撤銷期滿","options":["重新參加業務員資格測驗合格","重新參加教育訓練","重新辦理登錄領取新的登錄證即可","選項 1 或 2 皆可使得登錄"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L329","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":329,"page":73,"answer":2,"explanation":"(1)須成年且有高中職（同等）學歷\n(3)不得為受徒刑處分完畢或執行完畢、緩刑期滿或經赦免後未滿 3\n年者。","stem":"下列何者具備保險業務員之資格？","options":["小張今年 17 歲，高職尚未畢業，想參加壽險公會舉辦之人身保\n險業務員資格測驗","小陶向主管機關繳銷已領有之保險經紀人執業證書","老王今年 35 歲，之前因犯詐欺罪被判緩刑，去年 12 月已緩刑\n期滿","小張、老王和小陶皆具備保險業務員資格"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L330","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":330,"page":73,"answer":3,"explanation":"(3)該課程訓練每 3 年完成 6 小時，其中法規至少 2 小時","stem":"招攬投資型保險商品業務員自完成投資型保險商品變更登錄日起應\n為之行為，下列何者為非？","options":["業務員應參加所屬公司基金相關課程並通過課後測驗","測驗合格者須由所屬公司通報壽險公會備查","有關基金相關課程訓練時數每 3 年應完成 9 小時","其中法規訓練時數至少 2 小時"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L331","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":331,"page":73,"answer":4,"explanation":"凡保戶因不實之文宣、廣告而投保，嗣後產生疑義擬退保時，保險\n公司至少應加計利息退還所繳全部保險費。","stem":"主管機關規定凡保戶因不實之文宣、廣告而投保，之後產生疑義擬\n退保時，保險公司應","options":["以和解金退還","至少加計利息退還當年度保險費","至少退還所繳全部保險費","至少加計利息退還所繳全部保險費"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L332","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":332,"page":73,"answer":2,"explanation":"登錄制度之採行係為各所屬公司加強對業務員管理，以謀保險業健\n全發展，業務員須依規定辦理始得招攬。","stem":"「」係為各所屬公司加強對業務員管理，以謀保險業健全發展，業\n務員須依規定辦理始得招攬。","options":["教育訓練制度","登錄制度","審查制度","獎懲制度"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L333","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":333,"page":74,"answer":3,"explanation":"業務員對原處分公司復查結果有異議者，得於收到復查結果之起三\n個月內以書面具明理由向各有關公會之申訴委員會申請覆核，並以\n一次為限。","stem":"受停止招攬或撤銷登錄處分之業務員，對原處分公司之復查結果有\n異議，得於接獲受復查結果之日起三個月內以書面具名理由向何單\n位申請覆核？","options":["所屬公司","主管機關","各有關公會組成之申訴委員會","金融消費評議中心"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L334","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":334,"page":74,"answer":1,"explanation":"業務員經所屬公司同意，並取得相關資格後，保險業、保險代理人\n公司之業務員得登錄於另一家非經營同類保險業務之保險業或保險\n代理人公司。","stem":"保險經紀人公司之業務員，可同時登錄於另一家非經營同類保險業\n務之","options":["保險經紀人公司","保險公司","保險代理人公司","選項 1 或 3 皆可"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L335","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":335,"page":74,"answer":4,"explanation":"訓練年度之計算，以業務員初次辦理登錄日期為準。","stem":"依「人身保險業務員教育訓練通報暨換證作業規範」規定，業務員\n教育訓練年度計算係以「」日期為準。","options":["註銷登錄","停職登錄","再登錄","初次登錄"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L336","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":336,"page":74,"answer":3,"explanation":"(1)已通過投資型保險測驗合格且向公會辦理變更登錄，取得資格後\n始可招攬投資型保險商品\n(2)(4)保險業務員管理規則第 19 條：業務員為對要保人、被保險人\n或第三人以誇大不實之宣傳、廣告或其他不當方法招攬，予以三個\n月以上一年以下停止招攬、撤銷登錄。","stem":"何者為保險業務員應有之行為？","options":["已通過投資型保險測驗合格尚未完成變更登錄及招攬投資型保險\n商品","自製強調保費預定利率之招攬文宣","於招攬之要保書上親自簽名並記載登錄字號","提醒保戶商品即將停售之訊息"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L337","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":337,"page":74,"answer":3,"explanation":"參加業務員測驗資格須年滿 18 歲且領有永久或是長期居留證。","stem":"參加人身保險業務員資格測驗，除年齡及學歷限制外，應具有何種\n身分報名？ A台灣地區居留證 B外僑永久居留證\nC大陸地區配偶領有長期居留證 D港澳居民居留入出境證","options":["BCD","CD","ABC","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L338","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":338,"page":75,"answer":1,"explanation":"背信行為：刑法第 342 條「為他人處理事務，意圖為自己或第三人\n不法之利益，或損害本人之利益，而違背其任務之行為，致生損害\n於本人之財產或其他利益者...」詐欺行為：刑法第 339 條「意圖為\n自己或第三人不法之所有，以詐術使人將本人或第三人之物交付\n者...」","stem":"甲經醫生診斷已罹患肝癌，經乙業務員招攬投保防癌保險，投保時\n甲與乙共同隱瞞癌症之事實，甲於投保 1 年 6 個月後死亡，甲之家\n屬向保險公司申請理賠時始發現事實，其中業務員乙之行為觸犯\n了？ A侵占行為、B背信行為、C詐欺行為、D偽造文書行為","options":["僅構成 B、C","僅構成 A、D","僅構成 C、D","僅構成 A、B"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L339","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":339,"page":75,"answer":4,"explanation":"停止招攬：三個月以上一年以下。","stem":"業務員以不同保險契約作不當之比較，可以予多久停止招攬行為的\n懲處？","options":["一個月以上三個月以下","三個月以上六個月以下","三個月以上九個月以下","三個月以上一年以下"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L340","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":340,"page":75,"answer":2,"explanation":"業務員受停止招攬行為處分向原所屬公司繳銷登錄證者，是指停止\n招攬登錄。","stem":"業務員受停止招攬行為處分向原所屬公司繳銷登錄證者，是指","options":["變更登錄","停止招攬登錄","註銷登錄","撤銷登錄"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L341","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":341,"page":75,"answer":4,"explanation":"背信行為判斷方式為，在明知公司規定的前提下，做出違反公司規\n定的行為。","stem":"保險業務員於處理事務時，有可能因為一些特定的利益而違背其應\n盡之義務，而造成保險公司的損害，這時就可能觸犯了刑法上的","options":["偽造文書","詐欺","侵占行為","背信"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L342","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":342,"page":75,"answer":3,"explanation":"A 公司應辦理撤銷登錄\nD 業務員於懲處累積 2 年者將撤銷（懲處指停招），需重新通過資\n格測驗才能申請登錄。","stem":"業務員未完成教育訓練，所屬公司及業務員應如何辦理？\nA公司應辦理註銷登錄\nB公司應請其1年内補訓，如仍未完成者則辦理撤銷登錄\nC業務員經撤銷登錄後需重新通過資格測驗才能申請登錄\nD業務員於懲處滿1年後，需重新通過資格測驗才能申請登錄","options":["BD","AD","BC","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L343","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":343,"page":75,"answer":1,"explanation":"業務員因離職、轉任而異動時，所屬公司應向壽險公會申報註銷登\n錄。","stem":"業務員因離職、轉任而異動時，所屬公司應向壽險公會申報","options":["註銷登錄","停止招攬登錄","變更登錄","撤銷登錄"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L344","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":344,"page":76,"answer":1,"explanation":"壽險業務員招攬時須出示登錄證，該登錄證由各登錄單位製發。","stem":"壽險業務員招攬時須出示登錄證，該登錄證由哪個單位製發","options":["各登錄單位","壽險公會","登錄證即測驗合格證，由辦理測驗單位製發","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L345","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":345,"page":76,"answer":1,"explanation":"各所屬公司對於業務員予以停止招攬行為或撤銷登錄時，應通知業\n務員本人及通知各有關公會。","stem":"各所屬公司對於業務員予以停止招攬行為或撤銷登錄時，應\nA通知業務員本人 B通知主管機關 C通知各有關公會 D刊登公報","options":["AC","ABC","BC","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L346","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":346,"page":76,"answer":1,"explanation":"徒刑處分完畢、緩刑期滿或經赦免後未滿三年，組織犯罪五年，不\n得申請登錄為業務員。","stem":"申請登錄之業務員若曾受偽造文書、侵占、詐欺、背信等徒刑處分\n執行完畢或經赦免未滿「」者， 不得申請登錄為業務員。","options":["三年","二年","五年","一年"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L347","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":347,"page":76,"answer":2,"explanation":"D 受訓證明存放公司備查。","stem":"業務員招攬利率變動型年金保險前應完成哪些程序始得招攬？\nA參加公司至少 3 小時課程 B訓練完成後應測驗合格\nC合格成績報壽險公會備查 D合格成績存放公司備查","options":["AB","ABC","BCD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L348","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":348,"page":76,"answer":3,"explanation":"(3)需登錄中業務員才能報考外幣測驗","stem":"有關銷售外幣收付非投資型保險商品應具備之資格及訓練，何者錯\n誤？","options":["應參加匯率風險及外匯相關法規之教育訓練","銷售該商品之業務員須通過壽險公會舉辦之特別測驗並完成資格\n登錄","非登錄中業務員得報考該項特別測驗再完成資格登錄","訓練時數最少 5 小時"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L349","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":349,"page":77,"answer":3,"explanation":"保險業務員資格測驗者之學歷規範：18 歲且具有高中職以上學校畢\n業或同等學歷。","stem":"參加保險業務員資格測驗者之學歷至少為何？","options":["國小以上學校 畢業或同等學歷","國中以上學校畢業或同等學歷","高中以上學校畢業或同等學歷","大學以上學校畢業或同等學歷"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L350","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":350,"page":77,"answer":2,"explanation":"背信：為他人處理事務，因其違背任務行為，導致利益損害\n侵占：不法佔有他人之物","stem":"保戶委請業務員代為繳納保險費，當業務員拿到保險費後，因手頭\n不方便先拿去使用，2 天後再將保險費繳回保險公司，其行為已涉\n及 A偽造文書行為、B詐欺行為、C侵佔行為、D背信行為","options":["AB","CD","BC","BD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L351","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":351,"page":77,"answer":4,"explanation":"依保險法第八條之一規定，所謂保險業務員係指保險業、保險經紀\n人公司、保險代理人公司或兼營保險代理人或保險經紀人業務之銀\n行，從事保險招攬之人。","stem":"依保險法第八條之一規定，所謂保險業務員係指為下列之何者從事\n保險招攬之人？ A保險業 B保險經紀人公司 C保險代理人公司\nD兼營保險經紀人業務之銀行","options":["A","AB","ABC","ABCD"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L352","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":352,"page":77,"answer":1,"explanation":"A 須完成登錄程序\nB 須受到保險業務員管理規則/刑法/個資法等相關法令規範","stem":"下列何者正確？\nA取得業務員資格即可招攬保險\nB業務員之招攬行為僅應受所屬公司之獎懲辦法規範\nC業務員違規情事若有犯罪嫌疑，應移送法辦\nD業務員有違反管理規則之情事，所屬公司應予以停止招攬登錄或\n撤銷登錄","options":["CD","ABCD","BD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L353","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":353,"page":77,"answer":2,"explanation":"業務員於登錄後每年參加所屬公司辦理之教育訓練","stem":"業務員於登錄後應於「」完成規定之教育訓練課程及時數，並於期\n滿前辦妥換發登錄證手續。","options":["每 3 年","每年","每 5 年","每 4 年"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L354","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":354,"page":78,"answer":1,"explanation":"業務員消極資格：不得為登錄二家經營同類保險業務之保險業者。","stem":"壽險公司現職業務員「」申請保險經紀人執業證書。","options":["不可以","領有經紀人資格證書才可以","公司同意時才可以","符合登錄資格就可以"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L355","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":355,"page":78,"answer":2,"explanation":"業務員不參加所屬公司所舉辦之教育訓練者，所屬公司應為其辦理\n撤銷登錄。","stem":"業務員不參加所屬公司所舉辦之教育訓練者，所屬公司應為其辦理","options":["註銷登錄","撤銷登錄","警告登錄","停止招攬登錄"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L356","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":356,"page":78,"answer":3,"explanation":"業務員之行為，除應依保險業務員管理規則辦理，還應依業務員所\n屬公司簽訂之勞務契約，依民法及相關法令規定辦理。","stem":"保險公司對業務員的管理，下列何者為非？","options":["業務員與公司間之勞務契約依民法及相關法令規定","出勤行為應依業務員與保險公司之勞務契約規定","業務員之所有行為皆應依保險業務員管理規則","招攬行為之管理應依保險業務員管理規則辦理"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L357","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":357,"page":78,"answer":2,"explanation":"依「人身保險業務員教育訓練通報暨換證作業規範」第 5 條第 2\n項：領有第一年至第五年度登錄證之業務員因註銷或停止招攬等異\n動，再登錄間隔期間超過一年以上者，其教育訓練年度之計算，以\n再登錄日期為準重新計算。","stem":"依「人身保險業務員教育訓練通報暨換證作業規範」規定，業務員\n因註銷、停止招攬行為、撤銷等異動後，再辦理登錄，其間隔期間\n在「」以上者，其教育訓練年度應重新計算。","options":["三年","一年","二年","四年"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L358","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":358,"page":78,"answer":4,"explanation":"(1)不須重新參加資格測驗\n(2)由所屬公司辦理註銷登錄\n(3)可直接依規定重新登錄。","stem":"業務員轉任其他保險公司時，依業務員管理規則規定，應","options":["先重新參加業務員資格測驗","由所屬公司辦理變更登錄","通過所屬公司辦理一定課程之在職教育訓練始得依規定重新登錄","由所屬公司辦理重新登錄"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L359","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":359,"page":78,"answer":3,"explanation":"人身保險業務員自登錄後第 2 至第 5 年內，每年至少需參加 6 小時\n的教育訓練，必修課程包括匯率風險及外匯相關法規（至少 1 小\n時）。（113 年更新）","stem":"業務員登錄後第二至第五年之教育訓練課程依規定，每年至少應有\n「」小時之訓練。","options":["30","15","6","16"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L360","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":360,"page":79,"answer":4,"explanation":"業務員不服受停止招攬登錄、撤銷登錄處分，得於受處分之通知到\n達之日起一個月內，以書面具名理由向原處分公司提出申復。","stem":"業務員不服受停止招攬登錄、撤銷登錄處分，得於受處分之通知到\n達之日起「」內，向原處分公司提出申復。","options":["一年","三年","三個月","一個月"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L361","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":361,"page":79,"answer":4,"explanation":"D 應為撤銷登錄","stem":"業務員收取要保人所繳納之現金保險費後，而再以自己或他人之信\n用卡刷卡繳交之行為，下列何者正確？\nA屬挪用保費之情事\nB已符合侵佔罪的構成要件\nC所屬公司應依保險業務員管理規則第 19 條第 1 項規定予以懲處登\n錄\nD所屬公司應逕予註銷登錄","options":["ABCD","ABD","BC","ABC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L362","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":362,"page":79,"answer":3,"explanation":"(1)保險代理人須投保責任保險;保險經紀人須投保責任保險及保證保\n險，使得經營業務\n(2)兼有保險代理人、經紀人資格者，僅得擇一申領執業證照\n(4)銀行得經主管機關許可擇一兼營保險代理人或保險經紀人業務。","stem":"有關保險代理人、經紀人之敘述何者正確？","options":["保險代理人、經 紀人皆須投保責任保險及保證保險，始得經營業\n務","兼有保險代理人、經紀人資格者，均得申領執業證照","保險代理人公司、經紀人公司非加入商業同業公會不得營業","銀行經主管機關許可得同時兼營保險代理人及經紀人業務"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L363","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":363,"page":79,"answer":1,"explanation":"保險業、保險代理人公司、兼營保險代理人業務之銀行之業務員則\n可同時於另一家非經營同類保險業務之保險業或保險代理人業務之\n銀行登錄為產險及壽險業務員。","stem":"李小姐現為某產險公司之業務員，於取得人身保險業務員資格後","options":["得登錄於另一家壽險公司或人身保險代理人公司","僅得登錄於另一家壽險公司","得另登錄於另一家壽險公司及人身保險代理人公司","得登錄於另一家人身保險經紀人公司"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L364","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":364,"page":80,"answer":3,"explanation":"停止招攬的處分只限於同類型保險業務，因此小王在壽險部分違\n法，僅影響他在壽險公司的登錄，不會影響他在產險公司的登錄，\n答案應為 AC。","stem":"小王同時為甲壽險公司及乙產險公司之業務員，代收甲公司保戶繳\n交之保險費後，因先挪用繳交自家之水電費，就該行為陳述何者為\n是？\nA甲公司應辦理撤銷登錄\nB乙公司受甲公司通知後辦理註銷登錄\nC僅甲公司應辦理撤銷登錄，乙公司之登錄則不受限制\nD甲及乙公司皆應辦理撤銷登錄","options":["A","D","AC","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L365","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":365,"page":80,"answer":2,"explanation":"保險業務員於登錄有效期間內，受停止招攬行為處分期間累計達兩\n年，應予以撤銷其業務員登錄處分。","stem":"保險業務員於登錄有效期間內，受停止招攬行為處分期間累計達多\n久，應予以撤銷其業務員登錄處分？","options":["五年","二年","三年","一年"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L366","subject":"保險法規","chapter":"第五章 保險業務員管理規則的認識","number":366,"page":80,"answer":3,"explanation":"曾犯組織犯罪防制條例規定之罪，經有罪判刑確定，尚未執行完畢或\n執行完畢、緩刑期滿或赦免後尚未逾 5 年，不得申請登錄。","stem":"申請登錄業務員曾犯組織犯罪防制條例規定之罪，經有罪判刑確\n定，尚未執行完畢或執行完畢、緩刑期滿或赦免後尚未逾「」者，\n不得申請登錄。","options":["三年","二年","五年","一年"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L367","subject":"保險法規","chapter":"附錄","number":367,"page":81,"answer":4,"explanation":"以上皆為傷害保險被保險人失蹤之處理。","stem":"傷害保險被保險人如失蹤應如何處理？","options":["依戶籍資料所載失蹤日起滿一年仍未尋獲，保險人應先行給付保\n險金","要保人或受益人能提出證明足認被保險人極可能因承保事故致死\n者，保險人應先行給付保險金","保險人先行給付保險金後發現被保險人生還，要保人或受益人應\n歸還保險人已領之退還已繳保費或身故保險金或喪葬費用保險金","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L368","subject":"保險法規","chapter":"附錄","number":368,"page":81,"answer":1,"explanation":"住院醫療費用保險單示範條款，住院係指被保險人經醫師診斷其疾病\n或傷害必須入住醫院，且正式辦理住院手續並確實在醫院接受診療\n者，包含精神衛生法第 35 條之日間留院。","stem":"住院醫療費用保險單示範條款，住院係指\nA被保險人經醫師診斷其疾病必須入院\nB被保險人經醫師診斷其傷害必須入院\nC須正式辦理住院手續並確實在醫院接受診療\nD可於契約條款明訂包含精神衛生法第 35 條之日間留院","options":["ABCD","ABC","ACD","AC"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L369","subject":"保險法規","chapter":"附錄","number":369,"page":81,"answer":4,"explanation":"以上皆為團體人壽保險有關之敘述。","stem":"有關團體人壽保險，何者正確？","options":["要保人因所屬人員大批離職致參加保險人數不足時，保險人得終\n止保險契約並按日數比例退還未滿期保費","因業務種類變更致危險顯著增加時，要保人應於知悉後兩週內通\n知保險人","保險人接到危險增加之通知 30 日內，得根據危險增加的程度要\n求增加保費或終止契約","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L370","subject":"保險法規","chapter":"附錄","number":370,"page":82,"answer":2,"explanation":"保險法所定各種準備金，包括責任準備金、未滿期保費準備金、特別\n準備金、賠款準備金及其他經主管機關規定之準備金。","stem":"下列何者有誤？","options":["保險公證人係辦理保險標的查勘、鑑定及估價而予證明之人","保險法所定各種準備金包含責任準備金、未滿期保費準備金、賠\n款準備金及保單價值準備金","外國保險業係指依外國法律組織登記並經主管機關許可，在本國\n境內經營保險之機構","合夥人為被保險人，其中一人讓與保險利益於他人，契約不因之\n而失效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L371","subject":"保險法規","chapter":"附錄","number":371,"page":82,"answer":3,"explanation":"保險業務員管理規則係由主管機關依保險法第 177 條訂定，民國 81\n年 10 月 15 日發布「保險業務員管理規則」，並於民國 82 年 4 月\n15 日起實施。","stem":"保險業務員管理規則係由主管機關依保險法第 177 條訂定，並於民\n國「」起實施，自此保險業務員邁入一個新的里程碑。","options":["81 年 10 月 15 日","80 年 4 月 15 日","82 年 4 月 15 日","83 年 10 月 15 日"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L372","subject":"保險法規","chapter":"附錄","number":372,"page":82,"answer":4,"explanation":"團體保險條款規定受益人請領身故保險金時應檢具之文件有：被保險\n人死亡證明及除戶戶籍謄本、保險金申請書、受益人之身分證明。","stem":"下列何者非屬團體保險條款規定受益人請領身故保險金時應檢具之\n文件","options":["被保險人之除戶戶籍謄本","受益人之身分證明","被保險人死亡證明書及保險金申請書","保險金申請書、受益人之戶籍謄本及印鑑證明"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L373","subject":"保險法規","chapter":"附錄","number":373,"page":82,"answer":4,"explanation":"保險業依保險法第 141 條提存保證金，應按資本或基金實收總額\n15% 繳存於國庫。","stem":"保險業依保險法第 141 條提存保證金之敘述何者正確？","options":["應按資本或基金實收總額 20% 繳存於國庫","應按資本或基金實收總額 20% 繳存於安定基金","應按資本或基金實收總額 15% 繳存於安定基金","應按資本或基金實收總額 15% 繳存於國庫"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L374","subject":"保險法規","chapter":"附錄","number":374,"page":83,"answer":2,"explanation":"(1)團體傷害保險單示範條款中第 31 條：不得排除消費者保護法第\n47 條及民事訴訟法第 436 條之九小額訴訟管轄法院\n(3)「團體」是指具有五人以上且非以購買保險而組織之下列之一\n(4)第 9 條：要保人因所屬人員異動而申請加保時，應以書面通知本\n公司，自通知到達之翌日零時起開始生效，如通知起保日期在後，則\n自該起保日零時起生效。","stem":"有關團體保險之敘述，何者正確？","options":["契約涉訟時得排除小額訴訟管轄法院之適用","要保人於保單屆滿日的 2 週前與保險人議定續保條件，續保的始\n期以原契約屆滿日的翌日零時為準","所謂團體係指具有 5 人以上且以購買保險而組織之團體","被保險人異動申請加保時，被保險人資格自異動發生日翌日零時\n起生效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L375","subject":"保險法規","chapter":"附錄","number":375,"page":83,"answer":2,"explanation":"保險法第 146-2 條，保險業對不動產之投資，以所投資不動產即時\n利用並有收益者為限;其投資總額，除自用不動產外，不得超過其資\n金百分之三十。","stem":"保險業不動產之投資，以所投資不動產即時利用並有收益者為限;其\n投資總額除自用不動產外，不得超過其資金「」%。","options":["20","30","25","35"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L376","subject":"保險法規","chapter":"附錄","number":376,"page":83,"answer":1,"explanation":"複保險，除另有約定外，要保人應將他保險人之名稱及保險金額通知\n各保險人，要保人故意不為前條之通知或意圖不當得利而為複保險\n者，其契約無效。","stem":"保險法第 37 條，要保人故意不為複保險之通知或意圖不當得利而\n為複保險者，其契約","options":["無效","失效","停效","解約"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L377","subject":"保險法規","chapter":"附錄","number":377,"page":83,"answer":4,"explanation":"被保險人於契約有效期間內，因遭受意外傷害事故致其身體蒙受傷\n害，自傷害事故發生之日起 180 天內致成死亡/失能者，保險公司負\n保險責任。","stem":"在個人傷害保險契約中，被保險人於本契約有效期間內，因遭受意\n外傷害事故，致其身體蒙受傷害，自傷害事故發生之日起幾日以內\n致成死亡者，保險公司仍負保險責任","options":["360 日","30 日","90 日","180 日"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L378","subject":"保險法規","chapter":"附錄","number":378,"page":83,"answer":2,"explanation":"保險業辦理其他與保險有關業務，涉及外匯業務經營者，須經中央銀\n行許可。","stem":"保險業辦理其他與保險有關業務，涉及外匯業務經營者，須經","options":["金管會保險局","中央銀行","金管會銀行局","台灣銀行許可"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L379","subject":"保險法規","chapter":"附錄","number":379,"page":83,"answer":3,"explanation":"要保人對同一保險利益、同一保險事故與數保險公司分別訂立數個保\n險契約稱為複保險。","stem":"要保人對同一保險利益、同一保險事故與數保險公司分別訂立數個\n保險契約稱為","options":["再保險","合保","複保險","分保"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L380","subject":"保險法規","chapter":"附錄","number":380,"page":83,"answer":3,"explanation":"財產合作社 300 人，人身合作社 500 人","stem":"依保險法規定，人身保險合作社之預定社員人數不得低於「」人。","options":["800","1000","500","100"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L381","subject":"保險法規","chapter":"附錄","number":381,"page":84,"answer":1,"explanation":"接管期間，主管機關得限制：新業務承接、有效保單變更或終止、\n保單借款、解約金","stem":"保險業於受接管期間內，主管機關得限制\nA新業務之承接 B受理有效契約變更\nC受理有效契約終止 D受理要保人以保險契約為質之借款","options":["ABCD","A","ABD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L382","subject":"保險法規","chapter":"附錄","number":382,"page":84,"answer":3,"explanation":"依保險法第 141 條規定，保險業應按資本或基金實收總額之 15%，\n繳存保證金於國庫。","stem":"依保險法第 141 條規定，保險業應按資本或基金實收總額之多少比\n例，繳存保證金於國庫？","options":["5%","10%","15%","20%"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L383","subject":"保險法規","chapter":"附錄","number":383,"page":84,"answer":2,"explanation":"(2)要保人於保險事故發生前預先洽定信託契約","stem":"有關人身保險契約之保險金信託規定，何者有誤？","options":["保險業為該保險金信託之受託人","要保人須於訂立保險契約時，同時洽訂信託契約","僅要保人與被保險人為同一人之保險契約得洽訂信託契約","僅死亡保險金及失能保險金得洽定信託契約"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L384","subject":"保險法規","chapter":"附錄","number":384,"page":84,"answer":3,"explanation":"A 保險合作社簽訂之保險契約，以參加保單紅利者為限\nB 保險公司得簽訂參加保單紅利之保險契約","stem":"下列敘述何者正確？\nA保險合作社簽訂之保險契約，得為分紅或不分紅保單\nB保險公司簽訂之保險契約，以參加保單紅利者為限\nC保單紅利計算基礎及方法應於保險契約中明定\nD保險合作社簽訂之保險契約，以參加保單紅利者為限","options":["ABC","AC","CD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L385","subject":"保險法規","chapter":"附錄","number":385,"page":84,"answer":1,"explanation":"受益人申領失能保險金，應檢具下列文件：保險金申請書、受益人\n之身分證件、失能診斷書，但必要時本公司得要求提供意外傷害事\n故證明文件","stem":"下列何者不是團體保險條款規定被保險人請領失能保險金應檢具之\n文件？","options":["被保險人印鑑證明書","保險金申請書","受益人身分證明","失能診斷書"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L386","subject":"保險法規","chapter":"附錄","number":386,"page":84,"answer":3,"explanation":"金融債券、可轉讓定期存單、銀行承兌匯票、金融機構保證商業本\n票，其總額不得超過該保險業資金百分之三十五。","stem":"依保險法第 146 條之 1 規定保險業資金購得金融債券、可轉讓定期\n存單，其總額不得超過該保險業資金百分之","options":["三十","四十五","三十五","四十"],"source":"原精選題庫","priority":false,"caution":true},{"id":"L387","subject":"保險法規","chapter":"附錄","number":387,"page":85,"answer":1,"explanation":"要保人或被保險人由於工作場所，設備，業務種類或其他變更，致\n危險有顯著增加時要保人應於知悉後兩週內通知保險公司。","stem":"團體保險被保險人由於工作場所變更，致危險有顯著增加時，應於\n何時通知保險公司","options":["要保人應於知悉後兩週內","被保險人應於兩週內","要保人應於一個月內","要保人應於契約週年時"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L388","subject":"保險法規","chapter":"附錄","number":388,"page":85,"answer":4,"explanation":"保險業自有資本與風險資本比率不得低於 200%，其中資本嚴重不\n足，指資本適足率低於百分之五十或保險業淨值低於零。","stem":"保險業自有資本與風險資本比率不得低於200%，若保險業有資本\n嚴重不足，係指資本適足率低於「」或淨值低於零。","options":["100%","150%","10%","50%"],"source":"原精選題庫","priority":false,"caution":false},{"id":"L389","subject":"保險法規","chapter":"附錄","number":389,"page":85,"answer":4,"explanation":"保險業於完納一切稅捐後，分派盈餘時，應先提百分之二十為法定\n盈餘公積。","stem":"我國保險法規定，保險業於完納一切稅捐後，分派盈餘時，應先提\n存多少為法定盈餘公積？但法定盈餘公積已達其資本總額或基金總\n額時，不在此限。","options":["5%","10%","15%","20%"],"source":"原精選題庫","priority":false,"caution":true},{"id":"P001","subject":"保險實務","chapter":"第一章 風險管理與保險","number":1,"page":1,"answer":2,"explanation":"A 正確：風險管理的第二步是評估風險。\nD 正確：風險損失成本是發生機率乘以每次損失金額。\nB 錯誤：損失發生的頻率指的是風險發生的次數，不是損失金額。\nC 錯誤：損失幅度指的是每次損失的大小，不是發生的頻率。","stem":"有關風險的衡量，下列敘述何者正確?\nA風險管理的第二個步驟\nB損失發生的頻率指發生風險或意外事故的平均損失金額\nC損失發生的幅度指一定時間內，每一個風險單位發生風險的平均次\n數\nD風險損失的成本等於兩項機率分配的預期值乘積","options":["ABCD","AD","BC","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P002","subject":"保險實務","chapter":"第一章 風險管理與保險","number":2,"page":1,"answer":3,"explanation":"當「避免」和「預防」措施無法奏效，事故仍然發生時，應設法減輕\n損失程度，採取措施進行損失抑制。","stem":"關於風險管理之方法，下列敘述何者為錯誤?","options":["避免是一種簡單經濟又安全的風險管理方法","投保保險屬於風險移轉方法","高血壓患者注意飲食，食物少鹽、少油，屬預防方法","保險金額規劃不足，使得損失無法得到充分的補償，屬於風險自\n留"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P003","subject":"保險實務","chapter":"第一章 風險管理與保險","number":3,"page":2,"answer":1,"explanation":"損失頻率：指在一定時間內，每個風險單位發生特定事故的次數。\n損失幅度：指在特定時間內，每次事故造成的平均損失金額，也稱為\n損失額度。","stem":"風險頻率和幅度的定義？\nA 損失頻率：指的是在一定期間內，一危險單位發生一特定危險事\n故之次\nB 損失幅度：係指某一特定期間內，每一次損失事故之平均損失金\n額，也可稱之為損失額度\nC 損失頻率：係指某一特定期間內，每一次損失事故之平均損失金\n額，也可稱之為損失額度\nD 損失幅度：指的是在一定期間內，一危險單位發生一特定危險事\n故之次數","options":["AB","CD","ABCD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P004","subject":"保險實務","chapter":"第一章 風險管理與保險","number":4,"page":2,"answer":3,"explanation":"A 造成的結果具有不確定性\nC 損失金額不限於龐大且可以金錢衡量","stem":"下列何者是「風險」的要件？\nA造成怎樣的結果必須為確定性\nB必須有損失發生的可能\nC損失的金額必須為龐大且可以金錢衡量\nD何時發生具有不確定性","options":["ABCD","BCD","BD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P005","subject":"保險實務","chapter":"第一章 風險管理與保險","number":5,"page":2,"answer":2,"explanation":"A 風險的發生是不確定的\nC 風險的發生也有損失的可能","stem":"風險的發生與存在必須具備？\nA確定性 B有損失的可能 C有獲利的可能 D屬於將來性的","options":["ABCD","BD","ABD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P006","subject":"保險實務","chapter":"第一章 風險管理與保險","number":6,"page":2,"answer":4,"explanation":"(1)風險的本質包含無形損失\n(2)保險可保的損失是指因意外事故造成之損失\n(3)損失分有形損失與無形損失","stem":"下列有關損失的定義，何者正確？","options":["無形損失非包括在風險本質中","保險可保的損失係指非意外事故造成之損失","僅指有形損失","有形損失可以衡量"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P007","subject":"保險實務","chapter":"第一章 風險管理與保險","number":7,"page":3,"answer":2,"explanation":"事故發生時波及範圍大，較難控制的風險為基本風險。","stem":"事故發生時波及範圍大，影響整個大環境且較難以控制的風險為？","options":["常屬純粹風險","基本風險","特定風險","僅第 1、3 選項為是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P008","subject":"保險實務","chapter":"第一章 風險管理與保險","number":8,"page":3,"answer":2,"explanation":"投機風險可能導致損失，也可能產生獲利。","stem":"依損失的性質，下列何者是「投機風險」的意義？","options":["一定無法獲利的風險","可能會導致損失，也可能會產生獲利的風險","一定可以金錢衡量的風險","一定造成損失的風險"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P009","subject":"保險實務","chapter":"第一章 風險管理與保險","number":9,"page":3,"answer":3,"explanation":"首先根據生命表計算合理保險費，促使現代人壽保險制度建立的為英\n國衡平保險社。","stem":"首先根據生命表計算合理的保險費，促使現代人壽保險制度的建立\n始於何時？","options":["中世紀歐洲的基爾特組織","法國相互救濟會","英國衡平保險社","德國救濟金庫"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P010","subject":"保險實務","chapter":"第一章 風險管理與保險","number":10,"page":3,"answer":4,"explanation":"B 損失發生的頻率係指一定期間內，每一個風險單位發生風險的平\n均次數\nC 損失發生的幅度係指發生風險或意外事故的平均損失金額","stem":"有關風險的衡量的敘述，何者為是？\nA一個企業對員工做死亡風險衡量的目的，主要在預估一定期間內\n員工死亡風險發生所造成的損失金額\nB損失發生的頻率係指發生風險或意外事故的平均損失金額\nC損失發生的幅度係指一定期間內，每一個風險單位發生風險的平\n均次數\nD損失成本為損失頻率乘以損失幅度","options":["ABCD","BCD","A","AD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P011","subject":"保險實務","chapter":"第一章 風險管理與保險","number":11,"page":3,"answer":3,"explanation":"(3)高血壓的人不要吃太油膩的食物，屬事故發生中風險管理方法的\n抑制","stem":"有關風險管理的方法，何者為非？","options":["事故發生前最簡單、經濟且又安全的風險管理方法是避免","事故發生前先購買保險、做好風險控管，屬風險管理方法的移轉","高血壓的人不要吃太油膩的食物，屬事故發生前風險管理方法的\n預防","有購買保險但投保的保險金額不足造成自己保留了必須承擔的風\n險，屬風險管理方法的自留"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P012","subject":"保險實務","chapter":"第一章 風險管理與保險","number":12,"page":4,"answer":4,"explanation":"風險的衡量，主要是在預估一定期間（如 1 年）內風險發生所造成\n的損失金額\nB 特別嚴重的風險：指損失頻率分配與損失幅度分配皆很高的風險\nC 不重要的風險：指損失頻率分配與損失幅度分配皆很低的風險","stem":"下列何者正確?\nA計算風險損失成本屬風險管理步驟之風險確認\nB特別嚴重的風險僅指損失幅度分配非常高的風險\nC不重要的風險僅指損失發生頻率非常小的風險\nD風險損失成本指損失發生頻率及幅度二項預期值乘積","options":["ABCD","BCD","AD","D"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P013","subject":"保險實務","chapter":"第一章 風險管理與保險","number":13,"page":4,"answer":4,"explanation":"特定風險：指波及範圍小（只影響個人）、較易控制的風險。\n基本風險：指波及範圍大、較難控制的風險。","stem":"下列何者非屬特定風險之特性？","options":["不含投機風險","僅影響特定之人","處理方式以保險為主","通常與經濟、政治、社會、及天然災害有關"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P014","subject":"保險實務","chapter":"第一章 風險管理與保險","number":14,"page":4,"answer":3,"explanation":"B 風險依損失是否可衡量區分為客觀風險與主觀風險\nC 保險可保的純粹風險可分為\n1.人身上的風險 2.財產上的風險 3.責任上的風險","stem":"下列何者正確？\nA主觀風險可能經過一定期間觀察與統計而成為客觀風險\nB風險依損失是否可衡量區分為投機風險與純粹風險\nC保險可保的純粹風險僅人身上的風險及財產上的風險兩種\nD特定風險在性質上常屬於純粹風險","options":["ACD","ABCD","AD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P015","subject":"保險實務","chapter":"第一章 風險管理與保險","number":15,"page":4,"answer":4,"explanation":"風險自留：由經濟單位所保留必須承擔的風險皆是。","stem":"下列何者為「風險自留」的原因？\nA明知有風險存在而疏忽不予處理\nB自己承擔比其他處理方式更划算\nC無適當處理方式\nD 自己有能力足以承擔損失","options":["ABC","BCD","BC","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P016","subject":"保險實務","chapter":"第一章 風險管理與保險","number":16,"page":5,"answer":1,"explanation":"損失的幅度與頻率分為：特別嚴重風險、重要的風險、不重要風險\n頻率高 + 幅度高屬於特別嚴重風險\n頻率高 + 幅度低屬於重要風險\n頻率低 + 幅度高屬於重要風險\n頻率低 + 幅度低屬於不重要的風險","stem":"下列何者正確？","options":["損失幅度分配低的風險可能屬於不重要的風險或重要的風險","損失幅度分配低的風險可能屬於特別嚴重的風險或不重要的風險","損失頻率分配高的風險可能屬於不重要的風險或重要的風險","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P017","subject":"保險實務","chapter":"第一章 風險管理與保險","number":17,"page":5,"answer":3,"explanation":"A 客觀風險\nB 0.326%損失頻率\nC 100萬為損失幅度","stem":"某團體員工年平均死亡率為 0.326%，若死亡事故發生時，雇主預\n期需支付每一位員工一百萬元的撫恤金，何者正確？\nA雇主預測損失成本係應用主觀風險的觀念\nB0.326%即損失幅度的預期值\nC一百萬元即損失頻率的預期值\nD每位員工損失成本為 3260 元","options":["BCD","BC","D","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P018","subject":"保險實務","chapter":"第一章 風險管理與保險","number":18,"page":5,"answer":1,"explanation":"因個人的不小心、冷漠、缺乏注意力，而增加風險發生的機會，稱\n之為心理風險（無形風險）。","stem":"阿華將其最近購買的一棟房子投保財產保險後，就疏忽房子之維護\n與管理，這種風險因素係屬於？","options":["心理風險","實質風險","有形風險","道德風險"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P019","subject":"保險實務","chapter":"第一章 風險管理與保險","number":19,"page":5,"answer":2,"explanation":"風險的分類，依損失的性質可區分為純粹風險與投機風險。","stem":"風險的分類，依性質可區分為？","options":["靜態風險與動態風險","純粹風險與投機風險","基本風險與特定風險","客觀風險與主觀風險"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P020","subject":"保險實務","chapter":"第一章 風險管理與保險","number":20,"page":5,"answer":3,"explanation":"題目考的是保險的儲蓄功能，故選項只能選擇 A 與 B，C 復效係保\n障的持續擁有。\nD 身故保險金保障 家庭經濟生活並未保障個人經濟生活。","stem":"廣義的風險管理，除彌補經濟損失外，尚包含儲蓄投資以備未來所\n需，此部份之需求就可以利用年金保險、長期壽險等具有下列哪些\n功能，使個人及家庭的經濟生活更能獲得保障？\nA儲蓄性質保單 B保單借款 C保單復效 D身故保險金","options":["BC","AD","AB","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P021","subject":"保險實務","chapter":"第一章 風險管理與保險","number":21,"page":6,"answer":1,"explanation":"B 老年退休費用會增加，因可能需失能或疾病導致需增添無障礙設\n施，故退休費用會增加。","stem":"人身風險事故發生時可能導致？\nA遺族生活費用增加 B老年退休費用減少\nC醫療費用增加 D收入減少","options":["ACD","ABCD","ABC","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P022","subject":"保險實務","chapter":"第一章 風險管理與保險","number":22,"page":6,"answer":1,"explanation":"(1)保險是集合大多數人的力量來分散風險消化損失的社會互助經濟\n保障制度，它是根據公平合理的制度給予他所需要的補償。","stem":"下列敘述何者不正確？","options":["就全體投保者而言，人壽保險保險費與保險給付間為交換價值不\n相等的契約","人壽保險之保險費計算，須受政府之嚴格管制監督","同一種保單對不同的購買者可能收取不同的保險費","人壽保險之保險費決定係在實際成本發生之前，採預估方式"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P023","subject":"保險實務","chapter":"第一章 風險管理與保險","number":23,"page":6,"answer":4,"explanation":"(4)購買年金型保險則屬於儲蓄投資以備未來所需之風險管理方式。","stem":"有關因應新型冠狀病毒傳染之風險管理方法，下列何者錯誤？","options":["不到人群匯集的夜市或觀光景點係採用「避免」","勤洗手、戴口罩並遵守社交安全距離的規定係採用「預防」","察覺有發燒、咳嗽等症狀時前往指定醫療院所進行篩檢並自主健\n康管理係採用「抑制」","購買年金型保險商品係採用「移轉」"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P024","subject":"保險實務","chapter":"第一章 風險管理與保險","number":24,"page":6,"answer":1,"explanation":"道德風險因素：指凡促使被保險人意圖不當得利而故意使損失發生\n之條件即為道德風險因素。\nA 屬於無形風險\nB 描述為心理風險\nD 描述為心理風險","stem":"道德風險因素之敘述何者正確？\nA屬於有形風險因素\nB指因個人不小心、冷漠導致增加風險事故發生的機會\nC如為領取保險金而縱火的行為\nD如疏忽維護已投保財產保險之保險標的","options":["C","AC","BD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P025","subject":"保險實務","chapter":"第一章 風險管理與保險","number":25,"page":7,"answer":4,"explanation":"純粹風險係指只有損失機會，而無獲利機會。\n保險所處理的風險，主要是純粹風險。","stem":"下列敘述，何者不正確？","options":["投機風險係指事件發生的結果可能會產生獲利","保險的目的，在於補償因偶然事件的發生所導致經濟上的損失","保險所處理的風險，主要是純粹風險","純粹風險係指事件的結果不一定只有損失機會"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P026","subject":"保險實務","chapter":"第一章 風險管理與保險","number":26,"page":7,"answer":3,"explanation":"風險可分為特別嚴重、重要、不重要三種。\n特別嚴重風險：損失頻率和損失幅度皆很高。\n重要風險：損失頻率高但損失幅度小，或損失頻率低但損失幅度\n大。\n不重要風險：損失頻率和損失幅度都很小。","stem":"風險衡量結果屬於重要的風險，則代表","options":["損失頻率分配及幅度分配皆很小","損失頻率分配及幅度分配皆很高","損失頻率分配很高及幅度分配很小","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P027","subject":"保險實務","chapter":"第一章 風險管理與保險","number":27,"page":7,"answer":3,"explanation":"天然災害/自然風險事故(如地震、海嘯)的風險類別為客觀、純粹、\n靜態、基本風險。","stem":"天然災害如地震不屬於下列何種風險分類？","options":["純粹風險","靜態風險","特定風險","客觀風險"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P028","subject":"保險實務","chapter":"第一章 風險管理與保險","number":28,"page":7,"answer":4,"explanation":"基本風險：波及範圍大，較難控制，性質上純粹風險與投機風險兼\n而有之。\n特定風險：波及範圍小（只影響個人），常屬於純粹風險。","stem":"依風險發生的範圍與影響來看，兼有純粹風險與投機風險雙重性質\n的風險類別是","options":["特定風險","靜態風險","動態風險","基本風險"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P029","subject":"保險實務","chapter":"第一章 風險管理與保險","number":29,"page":7,"answer":4,"explanation":"事故發生時波及範圍小，較易控制的風險為特定風險，性質上常屬\n於純粹風險。","stem":"事故發生時波及範圍小，只會影響個人而不會影響整個大環境且較\n容易控制的風險為？","options":["基本風險","特定風險","常屬純粹風險","僅第 2 及第 3 選項為是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P030","subject":"保險實務","chapter":"第一章 風險管理與保險","number":30,"page":7,"answer":2,"explanation":"客觀風險的定義係指實際損失經驗與預期損失經驗的可能變量，此\n種風險通常不受人為之故意行為因素影響。","stem":"一種風險不受人為之故意行為因素影響，可以觀察也可以衡量，認\n定上不會因人而有不同結果之風險稱為？","options":["主觀風險","客觀風險","投機風險","純粹風險"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P031","subject":"保險實務","chapter":"第一章 風險管理與保險","number":31,"page":8,"answer":3,"explanation":"(1)滿期保險金也不用課徵所得稅\n(2)繳納的保費可以依法從他的所得額中扣除\n(4)遺產及贈與稅法也規定，約定之被保險人死亡時，給付其所指定\n受益人之人壽保險金額，不計入遺產總額課稅","stem":"投保人身保險之個人可獲哪些稅法上優惠？","options":["在一定金額內之滿期保險金不用課徵遺產稅","憑保險費收據可免繳勞保保險費","保險費在一定金額內可自其綜合所得額中扣除","即使未指定受益人，死亡保險金亦不納入遺產稅計算"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P032","subject":"保險實務","chapter":"第二章 人身保險的意義與功能","number":32,"page":9,"answer":3,"explanation":"國民生命表是由內政部以全國國民或地區居民為對象，依人口普查\n之統計基礎作成。","stem":"由內政部以全國國民或地區居民為對象，依人口普查之統計基礎作\n成","options":["部分居民生命表","壽險業經驗生命表","國民生命表","簡易生命表"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P033","subject":"保險實務","chapter":"第二章 人身保險的意義與功能","number":33,"page":9,"answer":2,"explanation":"因有經濟上的保障。因此確定了信用和償債能力","stem":"一個投保人壽保險的人，不論在任何意外事故發生時都有經濟上的\n保障，這也就是人身保險功能中的","options":["後顧無憂，晚景可恃","保證信用，有利投資","安定就業，穩定發展","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P034","subject":"保險實務","chapter":"第二章 人身保險的意義與功能","number":34,"page":9,"answer":2,"explanation":"保險是風險轉移，而非避免風險。","stem":"有關保險之敘述何者正確？","options":["是一種透過多數人合作以避免風險的經濟保障制度","投保人壽保險的人可以確定她的信用和償還能力","是一種風險避免的方法","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P035","subject":"保險實務","chapter":"第二章 人身保險的意義與功能","number":35,"page":9,"answer":1,"explanation":"人身保險對國家有以下功能形成資本、以增國富/穩定經濟，安定政\n治透過再保、拓展外交/健全經營、整合金融。","stem":"人身保險對國家有哪些功能？\nA透過再保、拓展外交 B互助共濟、社會安寧\nC健全經營、整合金融 D形成資本、以增國富","options":["ACD","ABCD","BCD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P036","subject":"保險實務","chapter":"第二章 人身保險的意義與功能","number":36,"page":10,"answer":2,"explanation":"人身保險對個人的功能：\n後故無憂，晚景可恃、安定就業，穩定發展\n保證信用，有利投資、享受優惠、稅捐減免、保險理財，一舉兩得\nD 是對社會的功能","stem":"人身保險對個人的功能有那些？\nA安定就業、穩定發展 B享受優惠、稅捐減免\nC保險理財，一舉兩得 D鼓勵儲蓄，平均財富","options":["BCD","ABC","ACD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P037","subject":"保險實務","chapter":"第二章 人身保險的意義與功能","number":37,"page":10,"answer":4,"explanation":"結合證券投資的壽險商品(投資型商品)，利用盈虧自負、彈性繳費的\n特性，可以有效對抗通膨，讓資金運用更彈性，並降低壽險公司的\n經營風險，且達到金融市場整合的功能。","stem":"投資型保險商品的設計，可以\nA有效對抗通貨膨脹\nB使得個人資金運用及退休計畫更具彈性\nC降低壽險公司經營風險\nD達到金融市場整合功能","options":["AB","ABD","BD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P038","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":38,"page":11,"answer":3,"explanation":"我國壽險業最新奉准採用作為責任準備金臺灣壽險業第六回經驗生命\n表。","stem":"我國壽險業最新奉准採用作為責任準備金提存標準為？","options":["臺灣壽險業第四回經驗生命表","臺灣壽險業第五回經驗生命表死亡率百分之九十","臺灣壽險業第六回經驗生命表","臺灣壽險業第五回經驗生命表"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P039","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":39,"page":11,"answer":2,"explanation":"家庭模式改變，夫妻皆有所得的家庭持續增加，婦女在家庭經濟上掌\n握更多權力，婦女壽險市場逐漸受到重視。","stem":"家庭模式改變，夫妻皆有所得的家庭持續增加，婦女在家庭經濟上\n掌握更多權力，婦女壽險市場","options":["躍居主導地位","逐漸受到重視","無多大改變","日漸式微"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P040","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":40,"page":11,"answer":3,"explanation":"壽險公司將商品細分化，以滿足消費者特殊的需要設計。","stem":"目前有許多的保險商品是為滿足消費者特殊的需要設計，在消費者\n的需求上不僅要求足夠的死亡保障，而且必須依年齡、性別、職業\n等設計的不同的保險商品，壽險公司所需採行的措施是將商品","options":["平均化","統一化","細分化","獨立化"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P041","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":41,"page":11,"answer":4,"explanation":"由於現代化帶來的公害及一些成年人特有的疾病如癌症、心臟病、腦\n血管疾病等，導致死亡率上升，因此應增加死亡保障和家庭健康保\n障。","stem":"由於科學發達帶來的現代化亦使危險環繞於人們四周，造成公害及\n一些成年人特有的疾病如癌症、心臟病、腦血管疾病等死亡率上\n升，導致何種保障需要增加？\nA死亡保障、B退休保障、C家庭健康保障、D意外保障","options":["ACD","ABCD","ABC","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P042","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":42,"page":11,"answer":3,"explanation":"為給客戶最大的方便及最高的利益，壽險業在經營上應該特別重視加\n強人身保險知識宣導、業務員教育訓練、提高經營效率，降低成本。","stem":"為給客戶最大的方便及最高的利益，壽險業在經營上應該特別重視\nA加強人身保險知識宣導 B業務員教育訓練\nC提高經營效率，降低成本 D提高佣金比例，以安定業務員之生活","options":["ABCD","BCD","ABC","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P043","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":43,"page":12,"answer":4,"explanation":"目前國內保險市場經營壽險業務之組織均為股份有限公司。","stem":"目前國內保險市場經營壽險業務之組織","options":["除股份有限公司外，亦有相互合作社之組織型態","目前國內保險市場經營壽險業務之組織","有股份有限公司或合作社兩種織型態","均為股份有限公司"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P044","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":44,"page":12,"answer":1,"explanation":"保險業利用金融科技與大數據分析來用行動裝置締結保險契約，簡化\n投保、 透過數據分析細分客戶，創造差異化商品、設計外溢效果的\n商品，提升保戶健康、理賠連線醫院及第三方驗證，迅速理賠減少保\n險詐欺。","stem":"保險業如何運用金融科技及大數據技術？\nA用行動裝置締結保險契約，簡化投保\nB透過數據分析細分客戶，創造差異化商品\nC設計外溢效果的商品，提升保戶健康\nD理賠連線醫院及第三方驗證，迅速理賠減少保險詐欺","options":["ABCD","BCD","ABC","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P045","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":45,"page":12,"answer":4,"explanation":"業務部：掌理承保、理賠、保費、分保、契約調查及分支機構有關業\n務事項。","stem":"壽險業總公司下的業務部，通常掌理哪些事項？\nA契約調查 B財務管理 C人員監督管理 D承保理賠","options":["ABCD","C","ABD","AD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P046","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":46,"page":12,"answer":4,"explanation":"保障型及高齡化保險商品的認定標準共有四大類，包括即期年金保\n險、進入年金給付期間且約定採分期給付的遞延年金保險、小額終老\n保險、無保單價值準備金之人身保險、其他具保單價值準備金之非\n投資型人壽保險（不含萬能人壽保險）與投保年齡在 55 歲以下之投\n資型人壽保險（乙型）。","stem":"A小額終老保險\nB無保單價值準備金之人身保險\nC進入年金給付期間且約定採分期給付的遞延年金保險\nD即期年金保險\n符合主管機關對於保障型及高齡化保險商品之定義。","options":["ACD","ABD","AD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P047","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":47,"page":13,"answer":1,"explanation":"C 透過數據分析協助保險公司細分消費客群導向更精準的業務模式\nD 結合科技可設計外溢效果之保險商品，藉以改變被保險人的生活作\n息。","stem":"有關金融科技創新及大數據應用何者正確？\nA科技業者透過法律許可方式進行沙盒實驗不會受到既有法律追訴\nB為落實業務員親晤保戶取得其親簽要保文件，可透過保戶證件掃\n描搭配生物辨識判別其真實身分\nC透過數據分析協助保險公司統一將消費客群導向一致性業務模式\nD結合科技可設計外溢效果之保險商品，藉以改變要保人的生活作\n息","options":["AB","CD","ABCD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P048","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":48,"page":13,"answer":3,"explanation":"(3)壽險市場已具備專業人員生存要件，行銷技術將 施以系統化的教\n育訓練以提高行銷效果。","stem":"壽險公司為改善經營技術、培養專業人以適應市場發展趨向，有關\n公司努力發展之重點何者為非？","options":["經客戶同意透過業務員以行動裝置輸入客戶投保資料，以電子文\n件替代紙本要保書及相關文件與保險公司締結契約","運用區塊鏈技術簡化理賠調查，快速支付理賠以服務客戶","壽險市場已具備專業人員生存要件，行銷技術將施以個別化的教\n育訓練以提高行銷效果","設計更符合客戶需要商品，加強創新及多樣化商品設計"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P049","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":49,"page":13,"answer":4,"explanation":"目前人身保險業所簽發的保單可供紙本保單及電子保單。","stem":"目前人身保險業所簽發的保單為","options":["僅提供紙本保單","可利用網路投保來簽發電子保單","不限紙本保單","僅選項 2、3 為真"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P050","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":50,"page":13,"answer":4,"explanation":"A 增加保額 → ✅ 收入或責任增加時，可主動建議\nB 墊繳保費 → ❌ 自動機制，非建議項\nC 質押借款 → ❌ 保戶自行啟動，非主動建議\nD 加購附加險 → ✅ 風險增加時可主動建議","stem":"人壽保險既是長期契約，隨歲月的遽增，保戶生活環境難免變遷，\n我們應掌握保戶生活情形，即時建議\nA增加保額、B墊繳保險費、C質押借款、D加購附加險","options":["ABD","ABCD","BC","AD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P051","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":51,"page":14,"answer":2,"explanation":"A 主管機關修正新形態商品認定標準，就部分保險商品改採「備\n查」而非「核准」以縮短新商品審核流程","stem":"何者有助於商品創新？\nA主管機關修正新形態商品認定標準，就部分保險商品改採核准制\n以縮短新商品審核流程\nB運用數據解析人口老化及消費習慣改變以細分客群\nC運用區塊鏈技術共享資料建立標準流程\nD改進經營技術","options":["ABCD","BCD","ABC","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P052","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":52,"page":14,"answer":4,"explanation":"A 應為：設計符合客戶需求的商品\nD 保險事業的經營著重於業務員訓練、保戶服務、科技的應用以提\n升經營效率等等，未特別提到加強組織功能，故不選。","stem":"保險業為適應市場發展的趨向，今後努力的重點有\nA設計不符需求的商品\nB培養專業人員\nC透過金融科技創新簡化保單作業流程提升客戶體驗\nD加強組織的功能","options":["BCD","ABC","ACD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P053","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":53,"page":14,"answer":2,"explanation":"A 主管機關應為金融監督管理委員會","stem":"有關金融科技發展與創新實驗條例，何者正確？\nA主管機關為科技部\nB創新實驗係指經主管機關核准或特許的金融商務實驗\nC運用金融科技可以提升客戶體驗滿足需求\nD創新實驗包含科技創新或經營模式創新","options":["ABC","BCD","ABCD","CD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P054","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":54,"page":14,"answer":2,"explanation":"數據分析即金融科技技術的提升，使業務模式更加簡化，並更精確\n分析客戶所需。","stem":"透過數據分析即金融科技技術的提升，可以協助保險業","options":["業務模式更複雜","創造差異化提升競爭力","概括消費群","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P055","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":55,"page":15,"answer":2,"explanation":"壽險業利用金融科技的目的在於提升客戶體驗，使得保險業與客戶\n間互動更為緊密。","stem":"下列何者錯誤？","options":["業務員行銷時應先強調保障型商品之重要性","壽險業利用金融科技的目的係為完全取代人的服務以利提升經營\n效率","壽險業應動態配置資產以因應低利率環境","壽險業應加強增員及業務員教育訓練，防止業務員發生休勤現象"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P056","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":56,"page":15,"answer":4,"explanation":"全選","stem":"長年期看護保險未來將成為老年人口的重要需求，其可能的原因包\n含下列何者？\nA人類壽命普遍延長 B家庭制度的改變\nC社會福利的不足 D對通貨膨脹的恐懼","options":["ABC","ABD","AC","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P057","subject":"保險實務","chapter":"第三章 我國人身保險事業的基本認識","number":57,"page":15,"answer":2,"explanation":"現行保險業因金融創新發展及大數據技術之應用下，可透過區塊鍊\n結合智能合約，精簡保單作業流程，以及開發保險經營自動化系\n統，從定價、核保、到理賠等都能自動化，並建立標準化且錯誤率\n極小的服務流程。","stem":"保險業可以運用大數據技術，透過哪些方式建立標準化之服務流程\nA區塊鏈結合智能合約 B開發保險經營自動化系統\nC精簡保單作業流程 D監理沙盒實驗","options":["AB","ABC","ABCD","CD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P058","subject":"保險實務","chapter":"第四章 人身保險的構造","number":58,"page":16,"answer":1,"explanation":"根據民國 88 年起簽發的人壽保險單，繳費期滿後的解約金計算方式\n如下：\n1. 躉繳保險單（一次性繳清保費）：解約金 = 保單價值準備金\n2. 分期繳費保險單：\n- 繳費期間內：\nA. 若繳費年期（n）\u003c 10 年：\n- 解約金 = 保單價值準備金 × (0.85 + 0.15 × t / n)\nB. 若繳費年期（n）≥ 10 年：\ni. 當繳費時間（t）\u003c 10 年：\n- 解約金 = 保單價值準備金 × (0.85 + 0.15 × t / 10)\nii. 當繳費時間（t）≥ 10 年：\n- 解約金 = 保單價值準備金\n- 繳費期滿後：\n- 解約金 = 保單價值準備金","stem":"關於繳費期滿後解約金的敘述，何者正確？\nA躉繳解約金等於保單價值準備金\nB分期繳費解約金等於保單價值準備金\nC躉繳解約金小於保單價值準備金\nD分期繳費解約金小於保單價值準備金","options":["AB","CD","A","C"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P059","subject":"保險實務","chapter":"第四章 人身保險的構造","number":59,"page":16,"answer":1,"explanation":"請參考上一題解析","stem":"自民國 88 年起簽發之人壽保險單，有關解約金，下列何者敘述正\n確？\nA躉繳之解約金等於保單價值準備金\nB分期付款期滿期約金等於保單價值準備金\nC躉繳解約金小於保單價值準備金\nD分期付款期滿解約金小於保單價值準備金","options":["AB","CD","AD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P060","subject":"保險實務","chapter":"第四章 人身保險的構造","number":60,"page":16,"answer":2,"explanation":"人身保險構成的原則為：互相扶助的觀念、公平的危險分擔、收支相\n等原則。\nD 損失填補：雖然這是保險的一個重要功能，但它更偏向於財產保險\n的特點，而非人身保險的基本原則。","stem":"人身保險的原則包括哪些？\nA互相扶助的觀念 B公平的危險分擔\nC收支相等的原則 D損失填補","options":["ABD","ABC","ACD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P061","subject":"保險實務","chapter":"第四章 人身保險的構造","number":61,"page":17,"answer":1,"explanation":"近年由於利率不斷下降，人壽保險業各險計算保險費所依據之利率，\n自民國 89 年 11 月 1 日起主管機關指示考量險種特性、過去資金運\n用績效、未來投資規劃、社會經濟發展趨勢，可由壽險公司自行訂\n定。","stem":"近年由於利率不斷下降，人壽保險業各險計算保險費所依據之利\n率，自民國 89 年 11 月 1 日起主管機關指示考量下列哪些因素可由\n壽險公司自行訂定？\nA險種特性 B過去資金運用績效\nC未來投資規劃 D社會經濟發展趨勢","options":["ABCD","ACD","BCD","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P062","subject":"保險實務","chapter":"第四章 人身保險的構造","number":62,"page":17,"answer":1,"explanation":"責任準備金就是將純保險費扣除已經過的危險保費後的資金提存保\n管，分別按照保險種類計算，記載於特設的帳簿。","stem":"「」就是將純保險費扣除已經過的危險保費後的資金提存保管，分\n別按照保險種類計算，記載於特設的帳簿。","options":["責任準備金","解約金","保單價值準備金","保單紅利"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P063","subject":"保險實務","chapter":"第四章 人身保險的構造","number":63,"page":17,"answer":3,"explanation":"保險法所稱之各種準備金包括賠款準備金、未滿期保費準備金、特別\n準備金。","stem":"保險法所稱之各種準備金包括：A賠款準備金 B差額準備金\nC未滿期保費準備金 D特別準備金","options":["ABC","ABD","ACD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P064","subject":"保險實務","chapter":"第四章 人身保險的構造","number":64,"page":17,"answer":3,"explanation":"要保人選擇以儲存生息之方式給付紅利之後，當被保險人死亡時，保\n險人所給付之保險金額較原保險金額一樣。","stem":"如要保人選擇以儲存生息之方式給付紅利之後，當被保險人死亡\n時，保險人所給付之保險金額較原保險金額為","options":["高","不一定","一樣","低"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P065","subject":"保險實務","chapter":"第四章 人身保險的構造","number":65,"page":17,"answer":2,"explanation":"利率變動型年金於累積期間，保險公司依據要保人支付之保險費，減\n去附加費用後依宣告利率計算年金保單價值準備。","stem":"利率變動型年金於累積期間，保險公司依據要保人支付之保險費，\n減去何種費用後依宣告利率計算年金保單價值準備","options":["總保費","附加費用","純保費","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P066","subject":"保險實務","chapter":"第四章 人身保險的構造","number":66,"page":17,"answer":4,"explanation":"乙型給付期的重要因素：預定死亡率、預定利率、宣告利率。\n宣告利率為第二年的調整係數帶入的。","stem":"利率變動型年金乙型於給付期間，保戶可領取之年金金額與下列何\n者無關？","options":["預定死亡率","宣告利率","預定利率","預定附加費用率"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P067","subject":"保險實務","chapter":"第四章 人身保險的構造","number":67,"page":17,"answer":1,"explanation":"利率變動型年金保險之預定利率，不得高於年金開始給付日的當月宣\n告利率，且不得為負數。","stem":"利率變動型年金保險之預定利率，不得高於下列那個期間的當月宣\n告利率，且不得為負數？","options":["年金開始給付日","契約起始日","繳費完成日","全部皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P068","subject":"保險實務","chapter":"第四章 人身保險的構造","number":68,"page":18,"answer":2,"explanation":"利率變動型年金之宣告利率不得超過宣告前中央銀行公布之最近一個\n月 10 年中央政府公債次級市場殖利率，且不得為負數。","stem":"利率變動型年金之宣告利率不得超過宣告前中央銀行公布之最近一\n個月「」中央政府公債次級市場殖利率，且不得為負數。","options":["1 年","10 年","2 年期","5 年"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P069","subject":"保險實務","chapter":"第四章 人身保險的構造","number":69,"page":18,"answer":3,"explanation":"保險法施行細則第 11 條規定：「本法所稱保單價值準備金，指人身\n保險業以計算保險契約簽單保險費之利率及危險發生率為基礎，並依\n主管機關規定方式計算之準備金。」","stem":"依保險法實施細則規定，人身保險業以計算保險契約簽單保險費之\n利率及危險發生率為基礎，並依主管機關規定方式計算之金額為？","options":["責任準備金","賠款準備金","保單價值準備金","解約金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P070","subject":"保險實務","chapter":"第四章 人身保險的構造","number":70,"page":18,"answer":2,"explanation":"民國 92 年起銷售之人壽保險單計算保險費基礎得自行決定。","stem":"人身保險業自 92 年元月起銷售之人壽保險單，計算保險費率之生命\n表為？","options":["臺灣壽險業第四回經驗生命表","得自行決定","臺灣壽險業第三回經驗生命表","臺灣壽險業第三回經驗生命表死亡率百分之九十"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P071","subject":"保險實務","chapter":"第四章 人身保險的構造","number":71,"page":18,"answer":2,"explanation":"C 躉繳保單之解約金等於保單價值準備金\nD 分期繳費保單繳費期滿後之解約金等於保單價值準備金","stem":"有關解約金敘述何者正確？\nA躉繳保單之解約金等於保單價值準備金\nB分期繳費保單繳費期滿後之解約金等於保單價值準備金\nC躉繳保單之解約金小於保單價值準備金\nD分期繳費保單繳費期滿後之解約金小於保單價值準備金","options":["BC","AB","AD","CD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P072","subject":"保險實務","chapter":"第四章 人身保險的構造","number":72,"page":18,"answer":1,"explanation":"D 死亡率會因性別、職業、健康狀況、體格有所影響，並非絕對人\n數。","stem":"依生命表顯示 30 歲女性死亡率是千分之三，若有一千名 30 歲女性\n各投保 2 千萬一年期的死亡保險，則：\nA每位女性保費是由投保人比例負擔為每人 6 萬\nB每人應收保費係依據收支相等原則來計算\nC保險入應支出的死亡保險金額總計為 6 千萬\nD一年間死亡人數為 6 人","options":["ABC","BC","BD","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P073","subject":"保險實務","chapter":"第四章 人身保險的構造","number":73,"page":19,"answer":3,"explanation":"以往傳統型壽險保單屬強制分紅，若僅出現死差益，即使有利差損也\n必須分紅。","stem":"以往傳統型壽險保單皆屬強制分紅，主要是根據利差、死差做為分\n紅金額之計算基礎，在此基礎下其強制分紅之標準為何？","options":["只要出現利差損或死差損就必須分紅","同時出現利差益及死差益才分紅","僅出現死差益，即使有利差損也必須分紅","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P074","subject":"保險實務","chapter":"第四章 人身保險的構造","number":74,"page":19,"answer":3,"explanation":"保險公司對於責任準備金之提存方式往往採取較穩健的作法，就是規\n定提存較多的責任準備金，例如採用比保單價值準備金較低之預定利\n率或較高之預定死亡率來計提。","stem":"保險公司對於責任準備金之提存方式往往採取較穩健的作法，採比\n保單價值準備金 A較低之預定利率 B較高之預定利率\nC較低之預定死亡率 D較高之預定死亡率","options":["BC","BD","AD","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P075","subject":"保險實務","chapter":"第四章 人身保險的構造","number":75,"page":19,"answer":3,"explanation":"民國 78 年 6 月奉准採用作為責任準備金提存標準的是台灣壽險業\n第三回經驗生命表。","stem":"首度將台灣壽險業經驗生命表區分為男、女性，並於民國 78 年 6\n月奉准採用作為責任準備金提存標準的是台灣壽險業","options":["第四回經驗生命表","第五回經驗生命表","第三回經驗生命表","第二回經驗生命表"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P076","subject":"保險實務","chapter":"第四章 人身保險的構造","number":76,"page":19,"answer":4,"explanation":"利率變動型人壽保險其最低責任準備金之提存由主管機關另定之","stem":"依現行保險業各種責任準備金提存辦法規定，保險期間超過一年之\n人壽保險契約中，有關利率變動型人壽保險其最低責任準備金之提\n存採","options":["20 年滿期生死合險修正制","25 年滿期生死合險修正制","20 年繳費終身保險修正制","由主管機關另定之"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P077","subject":"保險實務","chapter":"第四章 人身保險的構造","number":77,"page":20,"answer":4,"explanation":"保戶投保壽險已付足一年以上保費或繳費累積達有保單價值準備金\n時，因故中止解約時應償付解約金。","stem":"保戶投保壽險付足多久以上保費或繳費累積達有保單價值準備金\n時，因故中止解約時應償付解約金？","options":["半年","二年","僅限躉繳方式","一年"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P078","subject":"保險實務","chapter":"第四章 人身保險的構造","number":78,"page":20,"answer":1,"explanation":"如遇復效者，至少應依當年度經過期間比例給付紅利。","stem":"有關分紅保單分紅方式與發放年度皆應於保單條款充分揭露，以下\n敘述何者錯誤？","options":["如遇復效者，當年度經過期間是否分配紅利由保險公司自訂","第一次保單紅利發放保單年度，得由保險公司依商品特性訂定","如遇失效或解約者，各保單年度是否分配紅利由保險公司自訂","如遇被保險人身故，當年度是否分配紅利得由保險公司自行決定"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P079","subject":"保險實務","chapter":"第四章 人身保險的構造","number":79,"page":20,"answer":1,"explanation":"用來作為計算將來要支付死亡保險金的保險費基礎是預定死亡率。","stem":"用來作為計算將來要支付死亡保險金的保險費基礎是？","options":["預定死亡率","預定利率","預定營業費用","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P080","subject":"保險實務","chapter":"第四章 人身保險的構造","number":80,"page":20,"answer":2,"explanation":"預定死亡率及預定附費用率與保險費成正比預定利率與保險費成反\n比","stem":"有關定期保險敘述何者正確？\nA 其他因素不變，保險費與死亡率高低成正比\nB 其他因素不變，保險費與利率高低成正比\nC 其他因素不變，保險費與費用率高低成正比\nD 其他因素不變，保險費與利率高低成反比","options":["ABC","ACD","BC","AD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P081","subject":"保險實務","chapter":"第四章 人身保險的構造","number":81,"page":20,"answer":3,"explanation":"依收支相等原則，全體保戶保費總額 = 全體受益人的保險金額保險\n金總額 = 1,000萬 * (1,000人 * 0.004) = 4,000萬\n保戶每人保險費 = 4,000萬 / 1,000人 = 4萬","stem":"1 千名 45 歲的男人各投保 1 千萬元的死亡保險（保險期間 1\n年），生命表顯示 45 歲男人的死亡率是千分之 4，則每人的保險\n費是？","options":["5 千元","5 萬元","4 萬元","4 千元"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P082","subject":"保險實務","chapter":"第四章 人身保險的構造","number":82,"page":21,"answer":4,"explanation":"(1)88 年 1 月 1 日起所訂之人壽保險\n(2)健康保險\n(3)87 年 12 月 31 日前所訂之人壽保險","stem":"民國 95 年 1 月 1 日起訂立超過一年之人壽保險契約，其純保險費\n較 20 年繳費終身保險為大者，最低準備金提存應採","options":["25 年繳費終身保險修正制","1 年定期修正制","20 年滿期生死合險修正制","20 年繳費終身保險修正制"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P083","subject":"保險實務","chapter":"第四章 人身保險的構造","number":83,"page":21,"answer":2,"explanation":"C 不是友愛社，為衡平保險社\nD 採用 10 萬人為統計對象","stem":"有關生命表敘述何者正確？\nA又稱為死亡率表\nB係利用大數法則統計計算保險費\nC友愛社是最早根據生命表合理計算保險費的組織\nD通常採用1百萬人為統計對象","options":["ACD","AB","ABCD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P084","subject":"保險實務","chapter":"第四章 人身保險的構造","number":84,"page":21,"answer":2,"explanation":"利率變動型年金計算責任準備金之預定危險發生率，自民國 101 年\n7 月 1 日起以台灣壽險業第二回年金生命表為基礎，由各公司自行\n訂定。","stem":"利率變動型年金計算責任準備金之預定危險發生率，自民國 101 年\n7 月 1 日起以下列何者死亡率為計算基礎","options":["臺灣壽險業第二回年金生命表之 90%","臺灣壽險業第二回年金生命表之 100%","臺灣壽險業第一回年金生命表之 100%","臺灣壽險業第一回年金生命表之 90%"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P085","subject":"保險實務","chapter":"第四章 人身保險的構造","number":85,"page":21,"answer":3,"explanation":"B 生命表係利用大數法則統計出來的，就某團體的死亡率，加以統\n計列成表。\n收支平等原則是指：全體保戶繳入的保費總額 = 公司支付給全體受\n益人的保險金總額。","stem":"有關人壽保險生命表之敘述何者正確？\nA生命表又稱為死亡率表\nB生命表係利用收支平等原則統計出來的\nC生命表作為人壽保險計算純保費的根據\nD最早依據生命表科學計算保險費的機構是英國倫敦的衡平保險社","options":["ABCD","BCD","ACD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P086","subject":"保險實務","chapter":"第四章 人身保險的構造","number":86,"page":22,"answer":3,"explanation":"傳統型年金保險費率計算可使用之預定附加費用率標準：躉繳：費\n用率\u003c總保費 5%\n繳費期間未滿 10 年：費用率\u003c總保費 8.5% 繳費期間未滿 15 年：\n費用率\u003c總保費 9.5%\n繳費期間滿 15 年：費用率\u003c總保費 11%","stem":"有關傳統型年金保險費率計算可使用之預定附加費用率標準，何者\n正確？","options":["繳費期間未滿十年者，費用率不得超過總保費之 10%","躉繳者，費用率不得超過總保費之 3%","繳費期間滿十五年者，費用率不得超過總保費之 11%","繳費期間未滿十五年者，費用率不得超過總保費之 15%"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P087","subject":"保險實務","chapter":"第四章 人身保險的構造","number":87,"page":22,"answer":1,"explanation":"人身保險構成的三原則:相互扶助的觀念、公平的危險分擔、收支相\n等原則。\n損害填補原只適用實支實付健康險，指的是被保險人因事故發生的\n損失，所獲得的賠償，恰好恢復至事故發生前。","stem":"為了促進人身保險制度能夠健全營運，就必須顧及下列哪幾項要素?\nA相互扶助的觀念 B公平的危險分擔\nC收支相等原則 D損失填補原則","options":["ABC","AC","BC","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P088","subject":"保險實務","chapter":"第四章 人身保險的構造","number":88,"page":22,"answer":4,"explanation":"人壽保險業經驗生命表，係以壽險業計算責任準備金、壽險業釐訂\n保險費率、壽險業評價業務營運績效為準繩。","stem":"有關人壽保險業經驗生命表，係為下列何者之準繩\nA壽險業計算責任準備金 B壽險業釐訂保險費率\nC壽險業評價業務營運績效","options":["AB","B","A","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P089","subject":"保險實務","chapter":"第四章 人身保險的構造","number":89,"page":22,"answer":3,"explanation":"(3)責任準備金與投資風險無關。","stem":"有關保險費所累積的「責任準備金」之敘述何者錯誤?","options":["透過專家的經營運作，獲利往往較一般利息優厚","對保戶而言既是儲蓄又是投資","保戶必須承擔投資風險，沒有確保一定利潤","保險公司可用來投資運用孳息"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P090","subject":"保險實務","chapter":"第四章 人身保險的構造","number":90,"page":22,"answer":4,"explanation":"(4)變更成展期定期保險後，得由各保險公司依實際狀況決定分紅或\n不分紅保單。","stem":"有關分紅保險契約之敘述何者錯誤?","options":["契約條文應明訂分紅方式及紅利決算基準日","以紅利購買增額繳清保險的部分，保險公司得依實際狀況決定分\n紅與否","變更為減額繳清保險後應維持其分紅保單之特性","變更為展期定期保險後應維持其分紅保單之特性"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P091","subject":"保險實務","chapter":"第四章 人身保險的構造","number":91,"page":23,"answer":4,"explanation":"自民國 94 年 1 月 1 日起至 101 年 6 月 30 日銷售之傳統年金保險\n計算保險費之預定危險發生率，是以年金生命表為基礎，由各公司\n自行決定。","stem":"自民國 94 年 1 月 1 日起至 101 年 6 月 30 日銷售之傳統年金保險\n計算保險費之預定危險發生率，採用之年金生命表以死亡率多少為\n基礎?","options":["80%~100%","90%","100%~120%","由各公司依主管機關規定自行訂定"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P092","subject":"保險實務","chapter":"第四章 人身保險的構造","number":92,"page":23,"answer":1,"explanation":"死亡率計算公式為：年度內之死亡人數/年初之生存人數。","stem":"死亡率之計算基礎為？ A年初之死亡人數 B年度內之死亡人數\nC年初之生存人數 D年末之生存人數","options":["BC","BD","AC","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P093","subject":"保險實務","chapter":"第四章 人身保險的構造","number":93,"page":23,"answer":3,"explanation":"提前解約，會對保險公司造成逆選擇、資金運用不利及費用無法攤\n回等不良影響，保險公司通常會酌收費用作為補償。\n(3)解約對於保險人將產生額外成本","stem":"要保人解約對於保險人的影響，何者錯誤?","options":["造成逆選擇的不良影響","保險人通常會再酌收費用作為補償","解約對於保險人費用分擔未產
