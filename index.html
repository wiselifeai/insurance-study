生任何影響","造成資金運用不利的不良影響"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P094","subject":"保險實務","chapter":"第四章 人身保險的構造","number":94,"page":23,"answer":2,"explanation":"責任準備金的計算與提存，會因保險公司決算日及各種保險契約的\n保險期間、繳費期間、契約生效日、繳費方法各不相同。","stem":"責任準備金的計算與提存牽涉複雜的精算技術與法令規定，會因保\n險契約之「」，而有差別。\nA保險期間、B繳費方式、C契約生效日、D繳費期間","options":["ABD","ABCD","BD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P095","subject":"保險實務","chapter":"第四章 人身保險的構造","number":95,"page":23,"answer":4,"explanation":"目前壽險業責任準備金的提存是以「臺灣壽險業第五回經驗生命\n表」之死亡率 100%為基礎。","stem":"目前壽險業責任準備金的提存是以「臺灣壽險業第五回經驗生命\n表」之死亡率的若干百分比為基礎?","options":["80%","110%","90%","100%"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P096","subject":"保險實務","chapter":"第四章 人身保險的構造","number":96,"page":23,"answer":3,"explanation":"經驗生命表編製的目的：應為壽險業釐訂保險費、計算責任準備金\n和評價業務營運績效。","stem":"經驗生命表編製的目的為？\nA確定被保險人的死亡機率 B提存責任準備金的基礎\nC使壽險業者能公平、合理地釐訂費率 D計算解約金的基礎","options":["ABC","BD","BC","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P097","subject":"保險實務","chapter":"第四章 人身保險的構造","number":97,"page":24,"answer":3,"explanation":"92 年 1 月 1 日起銷售的人壽保險單，保險公司得自行決定使用第三\n回或第四回的生命表計算保險費率。","stem":"人身保險業自 92 年元月起銷售之人壽保險單，計算保險費率之生\n命表為？","options":["臺灣壽險業第三回經驗生命表死亡率百分之九十","以調降保險費率至 90% 計之","得自行決定","臺灣壽險業第三回經驗生命表"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P098","subject":"保險實務","chapter":"第四章 人身保險的構造","number":98,"page":24,"answer":3,"explanation":"(1)兩者間相加為 1\n(2)年金生命表是依據預定危險發生率訂定\n(4)相加為 1","stem":"下列敘述何者為是？","options":["生存機率與死亡機率間無任何關係","因同一時點某人的生存機率等於1減死亡機率，所以年金生命表\n可以依據目前壽險業界所採的經驗表去推算","在同一時點下，某人之死亡與生存是互斥的","在同一時點下，某人之生存機率與死亡機率之合會小於1"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P099","subject":"保險實務","chapter":"第四章 人身保險的構造","number":99,"page":24,"answer":1,"explanation":"為了促進人身保險制度能健全營運，必須兼顧三大原則：\n相互扶助的觀念、公平的危險分擔、收支相等原則。","stem":"決定壽險商品價格時，須兼顧哪些原則？\nA相互扶助的觀念 B公平的危險分擔 C收支相等原則\nD利潤最大化原則","options":["ABC","BCD","ACD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P100","subject":"保險實務","chapter":"第四章 人身保險的構造","number":100,"page":24,"answer":2,"explanation":"民國 92 年 12 月 31 日以前保單紅利來源 = 利差紅利 + 死差紅利","stem":"依主管機關核定，自民國 81 保單年度起，每一保單年度終了應分\n配當年度保單紅利係指下列哪幾項之和？\nA利差紅利、B費差紅利、C死差紅利","options":["ABC","AC","BC","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P101","subject":"保險實務","chapter":"第四章 人身保險的構造","number":101,"page":24,"answer":1,"explanation":"保單紅利利源三因素：利差益、死差益、費差益。","stem":"分紅保單是保險公司每年經營與投資所產生的「」，下列哪些項目\n分紅回饋給保戶？ A利差益、B死差損、C費差益、D死差益","options":["ACD","ABCD","AB","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P102","subject":"保險實務","chapter":"第四章 人身保險的構造","number":102,"page":25,"answer":3,"explanation":"民國 92 年起壽險業銷售之分紅保單，保單分紅依據為該險經營損\n益。","stem":"自民國 92 年起壽險業銷售之分紅保單，保單分紅的依據","options":["死差益","利差紅利","該險經營損益","費差益"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P103","subject":"保險實務","chapter":"第五章 人身保險的種類","number":103,"page":26,"answer":4,"explanation":"國民年金提供「老年年金」、「生育給付」、「身心障礙年金」、\n「遺屬年金」及「喪葬給付」五大保障","stem":"國民年金沒有哪些給付？\nA 喪葬費用、B 遺屬年金、C 眷屬喪葬津貼、D 失業給付","options":["AB","AC","DB","CD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P104","subject":"保險實務","chapter":"第五章 人身保險的種類","number":104,"page":26,"answer":2,"explanation":"微型保險承保對象的資格認定文件包括：\nA 中低收入戶證明 B 身心障礙手冊、\nC 漁船船員手冊 D 原住民戶籍證明\nE 離島居民戶籍（僅作為居住證明），不符合微型保險資格認定","stem":"下列何者為微型保險承保對象資格認定文件？\nA中低收入戶 B身心障礙手冊\nC漁船船員手冊 D原住民戶籍 E離島居民戶籍","options":["ABCDE","ABCD","ABC","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P105","subject":"保險實務","chapter":"第五章 人身保險的種類","number":105,"page":26,"answer":1,"explanation":"屬於微型保險經濟弱勢族群的資格包括：\nA 農民健康保險條例下投保農民保險的被保險人\nB 社會救助法中低收入戶或低收入戶的家庭成員\nC 身心障礙權益保障法定義的身心障礙者\nD 老人福利法中領取低收入老人生活津貼的老人","stem":"下列何者為微型保險之弱勢或特殊族群？\nA 農民健康保險法條例投保農民保險之被保險人\nB 社會救助法低收入戶或中低收入戶之家庭成員\nC 身心障礙權益保障法定義之身心障礙者\nD 老人福利法領取低收入老人生活津貼之老人","options":["ABCD","ABC","ABD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P106","subject":"保險實務","chapter":"第五章 人身保險的種類","number":106,"page":26,"answer":2,"explanation":"失能、醫療、年金保險的主要目的是照顧被保險人，因此受益人必定\n是被保險人本人。","stem":"受益人不能指定變更為非被保險人的保險項目是那些？\nA失能保險、B醫療保險、C終身保險、D年金保險","options":["ABC","ABD","C","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P107","subject":"保險實務","chapter":"第五章 人身保險的種類","number":107,"page":26,"answer":4,"explanation":"國民年金的主要對象為年滿 25 歲至未滿 65 歲、在國內設有戶籍，\n且未參加勞保、農保、公教保或軍保的國民。","stem":"下列何者符合國民年金納保條件？\nA年齡 20 歲 ~ 65 歲 B有勞保的人\nC在國內設有戶籍 D無參加勞保、農保、公教保、軍保","options":["ABCD","BCD","ACD","CD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P108","subject":"保險實務","chapter":"第五章 人身保險的種類","number":108,"page":26,"answer":3,"explanation":"傷害保險和人身保險均為定額給付，因此失能保險金無論失能次數或\n程度，均不得超過保單上載明的保險金額。","stem":"有關傷害保險之失能保險金給付金額不得超過保單所載之","options":["保單價值準備金","解約金","保險金額","責任準備金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P109","subject":"保險實務","chapter":"第五章 人身保險的種類","number":109,"page":27,"answer":2,"explanation":"連生共存年金金受領人為多數人，各該受領人皆生存時，保險人依約\n給付年金如有其中一人死亡，保險人即不再給付年金。","stem":"年金受領人為多數人，各該受領人皆生存時，保險人依約給付年金\n如有其中一人死亡， 保險人即不再給付年金，稱之？","options":["連生遺族年金","連生共存年金","最後生存者年金","定期生存年金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P110","subject":"保險實務","chapter":"第五章 人身保險的種類","number":110,"page":27,"answer":4,"explanation":"自 109 年 7 月 1 日起訂定宣告利率應考量區隔資產帳戶固定收益債\n券利息收益率、不得低於保證利率、應考量實際資產配置及投資準則\n訂定宣告利率。","stem":"自 109 年 7 月 1 日起訂定宣告利率應注意那些事項？","options":["應考量區隔資產帳戶固定收益債券利息收益率","不得低於保證利率","應考量實際資產配置及投資準則訂定宣告利率","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P111","subject":"保險實務","chapter":"第五章 人身保險的種類","number":111,"page":27,"answer":3,"explanation":"生存保險定義為被保險人於保險期間內仍生存時，保險公司依契約所\n約定金額給付保險金，被保險人於保險期間內死亡，保險公司不負賠\n償責任。","stem":"「生存保險」如被保險人在保險期間內死亡時，保險公司","options":["依保險金額賠償","退還保費","不負賠償責任","退還保單價值準備金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P112","subject":"保險實務","chapter":"第五章 人身保險的種類","number":112,"page":27,"answer":4,"explanation":"為使醫療保險商品之疾病項目及定義有遵循一致標準，減少理賠爭\n議，並維持商品開發設計之彈性，壽險公會所報「嚴重特定傷病疾病\n項目及定義」及「癌症保險」之「癌症定義」經金管會核定，將傷\n病定義明確化、標準化。","stem":"有關重大疾病保險之敘述何者錯誤？","options":["販售型態可直接附加在主契約或單獨之附加特約","保戶一旦罹患重大疾病可領取一筆保險金作為醫療之補助","目前市場多針對 7 種重大疾病提供保障","為維持商品開發設計之彈性，傷病定義無須明確化或標準化"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P113","subject":"保險實務","chapter":"第五章 人身保險的種類","number":113,"page":27,"answer":2,"explanation":"108 年新增鼻末缺損、但鼻機能永久顯著障害者，屬第 11 級失能會\n理賠 5%，該給付標準自 109 年 1 月 1 日起增為第 80 項。","stem":"關於傷害失能 11 級 79 項新增第 80 項，以下敘述何者正確？","options":["鼻未缺損，而鼻機能暫時遺存顯著障害者","鼻未缺損，而鼻機能永久遺存顯著障害者","鼻有缺損，而鼻機能暫時遺存顯著障害者","鼻有缺損，而鼻機能永久遺存顯著障害者"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P114","subject":"保險實務","chapter":"第五章 人身保險的種類","number":114,"page":28,"answer":1,"explanation":"健康保險的定義為因疾病或傷害導致經濟損失，給付保險金。","stem":"所謂健康保險是指為彌補因「」，造成人們失去工作能力或就醫，\n而導致經濟上的損失所設計出來的保險。\nA傷害、B疾病、C酗酒、D健康檢查","options":["AB","BD","AC","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P115","subject":"保險實務","chapter":"第五章 人身保險的種類","number":115,"page":28,"answer":1,"explanation":"長期照顧保險的免責期間不得高於 6 個月。","stem":"現行之長期照顧保險商品之示範條款中未明訂免責期間，惟保險公\n司得依市場需求，於契約條款中增訂不得高於「」之免責期間。","options":["6 個月","3 個月","5 個月","2 個月"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P116","subject":"保險實務","chapter":"第五章 人身保險的種類","number":116,"page":28,"answer":1,"explanation":"投資型商品的種類：變額壽險、變額萬能壽險、變額年金。","stem":"下列何者非投資型保險商品之種類？","options":["萬能年金","變額萬能壽險","變額壽險","變額年金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P117","subject":"保險實務","chapter":"第五章 人身保險的種類","number":117,"page":28,"answer":1,"explanation":"投資型商品費用改變之通知由保險公司訂明，並至少應於 3 個月前\n通知要保人。","stem":"投資型保險商品的相關費用，費用改變之通知期限由保險公司訂\n明，並至少應於幾個月前通知要保人？","options":["3 個月","1 個月","4 個月","2 個月"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P118","subject":"保險實務","chapter":"第五章 人身保險的種類","number":118,"page":28,"answer":2,"explanation":"團體保險之特性：以團體為主，只有一張保單、需規定最低參加人\n數、保險金額非由個人決定、保費以實際損失經驗為考量。","stem":"下列何者非團體保險與個人保險主要的差異？","options":["以團體為基礎","保險金額由個人自由選擇","須規定最低參加人數及比例","保費以實際損失經驗為考量"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P119","subject":"保險實務","chapter":"第五章 人身保險的種類","number":119,"page":29,"answer":1,"explanation":"微型保單失能保險金及傷害醫療保險金受益人為被保險人本人，保險\n業不得受理其指定或變更。","stem":"為避免投保微型保單所產生的道德危險，有關該險之風險控管機制\n何者為非？","options":["失能保險金得指定及變更受益人","保險業者須對承擔之風險妥善處理或適當安排再保險","身故保險金受益人之指定及變更以被保人之家屬或其法定繼承人\n為限","個別被保險人投保微型保險超過累計投保金額限制時，保險業者\n得自行決定處理方式"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P120","subject":"保險實務","chapter":"第五章 人身保險的種類","number":120,"page":29,"answer":1,"explanation":"A 兩者皆為政策性保險","stem":"下列何者為小額終老保險與微型保險之差異？\nA前者為一般商業保險，後者為政策性保險\nB前者僅能投保四次，後者得於累計投保金額限制內多次投保\nC前者高齡投保時繳費期限越短保費越高，後者為彈性繳費方式\nD前者投保對象有年齡限制，後者 投保對象有收入、職業或身分別\n限制","options":["BCD","BC","ABCD","AD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P121","subject":"保險實務","chapter":"第五章 人身保險的種類","number":121,"page":29,"answer":2,"explanation":"C 主管機關為衛生福利部\nD 保險人為衛生福利部中央健康保險署","stem":"有關全民健康保險敘述何者正確？\nA保險事故包含疾病、傷害、生育\nB以強制投保為原則\nC主管機關為中央健康保健署\nD保險人為衛生福利部","options":["ABCD","AB","ABD","B"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P122","subject":"保險實務","chapter":"第五章 人身保險的種類","number":122,"page":30,"answer":3,"explanation":"仰賴人口為 0 - 14 歲及 65 歲以上人口合計","stem":"依國家發展委員會人口推估報告書之說明，何者有誤？","options":["我國已邁入高齡社會","我國將進入超高齡社會","仰賴人口係指 0 至 14 歲的人口","青壯年人口係指 15 歲至 64 歲的人口"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P123","subject":"保險實務","chapter":"第五章 人身保險的種類","number":123,"page":30,"answer":2,"explanation":"(1)不得高於 6 個月\n(3)要有 3 項障礙者以上","stem":"長期照顧保險之被保險人經專科醫師診斷後判定符合長期照顧狀態\n者給予保險給付，而長期照顧狀態係指被保險人符合？","options":["持續 6 個月以上失智且依臨床失智量表評估達中度以上者","依巴氏量表判定 3 個月內有移位、如廁及沐浴等3項障礙者","依臨床專業評量表診斷判定 5 個月內有進食及移位等2項障礙者","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P124","subject":"保險實務","chapter":"第五章 人身保險的種類","number":124,"page":30,"answer":3,"explanation":"「臺灣地區傷害保險個人職業分類表」將職業危險程度分成六類。","stem":"「臺灣地區傷害保險個人職業分類表」將職業危險程度分成「」，\n對從事特別危險職業者另歸入未承保類。","options":["七類","四類","六類","五類"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P125","subject":"保險實務","chapter":"第五章 人身保險的種類","number":125,"page":30,"answer":3,"explanation":"(3)利率變動型年金身故保障為保單價值準備金金額，利率固定型年\n金身故保障為退還已繳保費或解 約金或保單價值準備金。","stem":"利率變動型年金與利率固定型年金保險商品之敘述，何者為非？","options":["利率變動型年金及利率固定型年金保費繳納皆可躉繳、非躉繳，\n惟利率固定型年金非躉繳為定期定額","利率變動型年金附加費用由公司自行訂定，利率固定型年金附加\n費用依繳費期間介於 5% - 11%","利率變動型年金身故保障為解約金，利率固定型年金身故保障為\n保單價值準備金","利率變動型年金採固定或變動金額年金給付，利率固定型年金採\n固定金額年金給付"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P126","subject":"保險實務","chapter":"第五章 人身保險的種類","number":126,"page":31,"answer":3,"explanation":"利率固定型年金保險商品的繳費方式有躉繳及非躉繳（定期定額）","stem":"利率固定型年金保險商品的繳費方式有\nA躉繳、B非躉繳(定期定額) 、C非躉繳（不定期不定額）","options":["BC","ABC","AB","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P127","subject":"保險實務","chapter":"第五章 人身保險的種類","number":127,"page":31,"answer":2,"explanation":"94 年 1 月 1 日至 101 年 6 月 30 日之預定危險發生率之責任準備金\n年金生命表死亡率之 90%為基礎。","stem":"民國 94 年 1 月至 101 年 6 月底止販售之利率變動型年金計算責任\n準備金之預定危險發生率，係以年金生命表死亡率之「」為基礎。","options":["100%","90%","100%~120%","自行訂定"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P128","subject":"保險實務","chapter":"第五章 人身保險的種類","number":128,"page":31,"answer":1,"explanation":"A 為 1.25 倍\nC 個人傷害保險重大事故特別準備金提存率為 1%","stem":"有關傷害保險何者正確？\nA職業類別第 2 類之保險費率是第 1 類別的 1.5 倍\nB個人傷害保險意外失能發生率為意外死亡發生率之 40%\nC個人傷害保險重大事故特別準備金提存率為 2%\nD被保險人失能程度屬第 2 級失能者，保險公司按失能保險金額之\n90% 給付保險金","options":["BD","ACD","BCD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P129","subject":"保險實務","chapter":"第五章 人身保險的種類","number":129,"page":31,"answer":4,"explanation":"(4)保險費計算考量個體差異，保費更公平合理，且能引導保戶規避\n風險，降低整體社會成本。","stem":"有關外溢效果保險的特色，何者錯誤？","options":["保險公司為掌握保戶生活習慣及取得相關醫療數據，需精進大數\n據分析","商品設計有實物給付型及非實物給付型 2 種","保險公司須強化資訊安全之風險控管，以免保戶個資外洩","保險費計算係採總體考量，保費更公平合理，且能引導保戶規避\n風險，降低整體社會成本"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P130","subject":"保險實務","chapter":"第五章 人身保險的種類","number":130,"page":32,"answer":3,"explanation":"(3)當銷售予 65 歳以上保戶時應當錄音或錄影，或以電子設備留存相\n關作業軌跡，由適當單位或主管人員覆審，確認客戶投保適當性後使\n得承保。","stem":"業務員行銷投資型保險商品時，何者為非？","options":["應主動出示投資型保險商品業務員資格測驗合格證及人身保險業\n務員登錄證","不得勸誘保戶以保單借款或貸款方式購買","當銷售予 65 歳以上保戶未能取得其同意者，免除銷售過程之錄\n音或錄影","應交付保戶保險商品說明書並詳細解說"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P131","subject":"保險實務","chapter":"第五章 人身保險的種類","number":131,"page":32,"answer":3,"explanation":"A 醫療費用之給付以實支實付為限。","stem":"有關旅行平安保險何者正確？\nA醫療費用之給付包含日額型及實支實付型\nB發生意外傷害醫療時，給付最高以保險金額 1/10 為限\nC屬於國際性保險，承保對象以實際從事旅遊的國內、國外旅客為\n限\nD保險期間原則上最長以 180 天為限，旅客如有需要經保險公司同\n意可延長","options":["BC","ABD","BCD","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P132","subject":"保險實務","chapter":"第五章 人身保險的種類","number":132,"page":32,"answer":2,"explanation":"利率變動型年金於年金給付期間，預定利率不得高於年金給付開始日\n當月的宣告利率，且不得為負數。","stem":"利率變動型年金於年金給付期間，預定利率不得高於何時之當月的\n宣告利率？","options":["契約到期日","給付開始日","保費繳完日","契約生效日"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P133","subject":"保險實務","chapter":"第五章 人身保險的種類","number":133,"page":32,"answer":3,"explanation":"長期照顧保險保險人為中央健康保險署。","stem":"有關政府推動的長期照顧保險，何者錯誤？","options":["屬於一種福利政策且為基本保障，可考慮加保一般商業長期照顧\n保險商品","由政府、雇主及民眾共同負責保險費","屬於強制性社會保險，保險人為衛生福利部","目前提供的服務皆屬實物給付"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P134","subject":"保險實務","chapter":"第五章 人身保險的種類","number":134,"page":33,"answer":3,"explanation":"以上皆為微型保險所指之經濟弱勢或特定身分者。","stem":"以下何者為微型保險所指之經濟弱勢或特定身分者？\nA依農民健康保險條例投保農民健康保險之被保險人\nB符合社會救助法規定低收入戶或中低收入戶之家庭成員\nC符合身心障礙者權益保障法定義之身心障礙者\nD符合老人福利法規定領取中低收入老人生活津貼之老人","options":["ABC","ABD","ABCD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P135","subject":"保險實務","chapter":"第五章 人身保險的種類","number":135,"page":33,"answer":2,"explanation":"團體保險之保險金額決定基礎為薪資等級、職位、年資、團體定額。","stem":"下列何者非團體保險之保險金額決定基礎？","options":["職位年資","員工的工作性質","薪資等級","團體定額"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P136","subject":"保險實務","chapter":"第五章 人身保險的種類","number":136,"page":33,"answer":4,"explanation":"「高級中等以下學校學生及教保服務機構幼兒團體 保險條例」第 13\n條第 3 項：學生及幼兒參加本保險，於保險契約訂立時，已在疾病\n中者，保險人對是項疾病，負給付保險金之責任。但高級中等學校\n進修部及國民補習學校學生，保險人不負給付保險金額之責任。","stem":"有關學生團體保險之敘述，何者為非？","options":["目前保險費由教育部邀集具獨立性的相關代表組成審議會逐年審\n議","學生團體保險之身故保險金受益人為被保險人之法定繼承人，醫\n療保險金之受益人為投保之學生","設置學生團 體保險專戶專款專用，盈虧責任由政府負責","幼兒參加本保險，於保險契約訂立時已在疾病中，保險人對該項\n疾病不負給付保險金責任"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P137","subject":"保險實務","chapter":"第五章 人身保險的種類","number":137,"page":33,"answer":3,"explanation":"(1)繳費期間滿十五年者，費用率不得超過總保費之 11%\n(2)繳費期間未滿十五年者，費用率不得超過總保費之 9.5%\n(4)繳費期間未滿十年者，費用率不得超過總保費之 8.5%","stem":"有關傳統型年金保險費率計算可使用之預定附加費用率標準，何者\n正確？","options":["繳費期間滿十五年者，費用率不得超過總保費之 15%","繳費期間未滿十五年者，費用率不得超過總保費之 15%","躉繳者，費用率不得超過總保費之 5%","繳費期間未滿十年者，費用率不得超過總保費之 10%"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P138","subject":"保險實務","chapter":"第五章 人身保險的種類","number":138,"page":34,"answer":1,"explanation":"D 結構型商品非全權委託","stem":"下列何者屬於投資型保險商品規範，由保險人接受要保人以保險契\n約委任全權決定運用之投資標的之運用範圍？\nA公債、國庫券 B台灣存託憑證 C外國有價證券 D結構型商品","options":["ABC","BCD","ABD","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P139","subject":"保險實務","chapter":"第五章 人身保險的種類","number":139,"page":34,"answer":3,"explanation":"投資型保險商品的相關費用如下\n一、前置費用：如保費費用 二、保單相關費用：如保單管理費、保\n險成本 三、投資相關費用：如投資標的申購手續費、贖回及轉換費\n用 四、後置費用：如解約費用、部分提領費用 五、其他費用","stem":"投資型保險商品的相關費用有\nA解約費用、B保費費用、C申購手續費、D贖回及轉換費用","options":["CD","BCD","ABCD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P140","subject":"保險實務","chapter":"第五章 人身保險的種類","number":140,"page":34,"answer":4,"explanation":"由第三人訂立之年金保險契約，未經被保險人書面承諾，並約定保險\n金額，其保險契約有效。","stem":"由第三人訂立之年金保險契約，未經被保險人書面承諾，並約定保\n險金額，其保險契約","options":["效力未定","無效","得撤銷","有效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P141","subject":"保險實務","chapter":"第五章 人身保險的種類","number":141,"page":34,"answer":4,"explanation":"(1)保險公司承保傷害保險時，不需檢查被保險人的身體，以被保險人\n的職業類別為準\n(2)定期保險通常以 1 年、6 年、10 年、15 年或 20 年為期，亦有以\n要保人到達一定年齡為約定期限\n(3)舉例：賽車駕駛員或鷹架安裝工人的危險性，都比每天坐辦公室\n的公務員高很多","stem":"下列敘述何者正確?","options":["保險公司承保傷害保險時，需檢查被保險人的身體","定期保險通常以 1 年、5 年、10 年為期，亦有以要保人到達終身\n年齡為約定期限","外勤業務員的危險性與每天坐辦公室的行政人員危險性差不多","最後生存者年金之受領人有 2 人以上，只要其中 1 人仍生存，保\n險人就繼續依原定金額給付年金至最後1位受領人死亡為止"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P142","subject":"保險實務","chapter":"第五章 人身保險的種類","number":142,"page":34,"answer":4,"explanation":"(1)被保險人經專科醫師診斷辦定該障礙為終身無法治癒者，不受限\n於免責期間的約定\n(2)認知功能障礙常運用簡易智能測驗(MMSE)進行評估-108 年 11\n月 金管會取消\n(3)被保險人依臨床失智量表(CDR)評估達中度程度以上者\n(4)被保險人經專科醫師診斷判定達5個月以上仍為持續失智狀態-不\n得高於 6 個月","stem":"現行長期照顧保險有關認知功能障礙之認定，何者正確?","options":["被保險人經專科醫師診斷判定該障礙為終身無法治癒者，仍受限\n於免責期間的約定","認知功能障礙常運用簡易 智能測驗（MMSE）進行評估","被保險人依臨床失智量表（CDR）評估達嚴重程度以上者","被保險人經專科醫師診斷判定達 5 個月以上仍為持續失智狀態"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P143","subject":"保險實務","chapter":"第五章 人身保險的種類","number":143,"page":35,"answer":1,"explanation":"身故保險金受益人之指定及變更，以被保險人家屬或其法定繼承人\n為限。","stem":"為避免投保微型保險所產生的道德危險，有關該險之風險控管機制\n何者為非？","options":["身故保險金受益人僅以被保險人家屬為限","保險業者須對承擔之風險妥善處理或適當安排再保險","失能保險金受益人不得受理指定或變更","個別被保險人投保微型保險超過累計投保金額限制時，保險業者\n得自行決定處理方式"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P144","subject":"保險實務","chapter":"第五章 人身保險的種類","number":144,"page":35,"answer":3,"explanation":"勞工保險之普通事故保險費之被保險人負擔 20%、雇主負擔\n70%、政府負擔 10%","stem":"勞工保險之普通事故保險費，被保險人應負擔之比率為","options":["0%","30%","20%","10%"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P145","subject":"保險實務","chapter":"第五章 人身保險的種類","number":145,"page":35,"answer":2,"explanation":"學生團體保險給付項目:失能及身故保險金、燒燙傷及須重建手術保\n險金、集體中毒保險金、生活補助金、住院醫療保險金、傷害門診\n保險金","stem":"目前學生團體保險之保險給付項目有\nA失能及身故保險金 B燒燙傷及須重建手術保險金\nC集體中毒保險金 D生活補助金","options":["BCD","ABCD","ACD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P146","subject":"保險實務","chapter":"第五章 人身保險的種類","number":146,"page":35,"answer":2,"explanation":"人身保險包含:人壽保險、傷害保險、健康保險、年金保險","stem":"依保險法第 13 條規定，人身保險包含\nA傷害保險 B投資型保險 C健康保險 D年金保險","options":["BD","ACD","CD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P147","subject":"保險實務","chapter":"第五章 人身保險的種類","number":147,"page":35,"answer":3,"explanation":"(1)就業結構的變化及高齡化導致就業人口經濟負擔增加\n(2)高齡化人口所佔比例逐漸增加，勞動參與率下降導致經濟成長率\n下降","stem":"台灣地區人口年齡結構因醫藥科學發達，死亡率降低而使得平均壽\n命延長，近幾年來更因結婚率降低與生育率降低，高齡化人口所佔\n比例逐漸增加，請問：當生育率降低與高齡化人口增加會帶來什麼\n樣的影響？","options":["就業人口經濟負擔減輕","經濟成長率上升","延後退休","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P148","subject":"保險實務","chapter":"第五章 人身保險的種類","number":148,"page":36,"answer":2,"explanation":"年金保險定義：對個人在特定期間或生存期間繼續提供定期性給付\n金額的制度或契約;因此對老年生活費能彌補社會福利的不足","stem":"高齡化社會的來臨是目前社會人口發展的趨勢，購買","options":["傷害保險","年金保險","定期保險","人壽保險解決此項嚴重的社會問題"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P149","subject":"保險實務","chapter":"第五章 人身保險的種類","number":149,"page":36,"answer":2,"explanation":"由勞動部按被保險人之月投保薪資 1% 至 2% 擬定，目前為 1%","stem":"就業保險之保險費率，目前為被保險人月投保薪資之","options":["5%","1%","3%","4%"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P150","subject":"保險實務","chapter":"第五章 人身保險的種類","number":150,"page":36,"answer":4,"explanation":"一般終身年金只要被保險人死亡，保險人即無給付義務;若是確定年\n金且被保險人死亡後尚有未領金額，保險人仍應繼續給付年金金額\n予應得之人","stem":"年金保險中如被保險人身故，仍有未支領之年金餘額時， 該餘額","options":["其半數應作為被保險人之遺產","應作為被保險人之遺產","應作為要保人之遺產","不得作為被保險人之遺產"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P151","subject":"保險實務","chapter":"第五章 人身保險的種類","number":151,"page":36,"answer":2,"explanation":"B 不退還保費\nC 滿期金來源為自身所繳保費及其孳息、保險期間死亡被保險人所\n繳之保險費","stem":"有關生存保險之敘述，下列何者為是？\nA僅在被保險人於保險期滿後仍生存時給付保險金\nB被保險人在保險期間內死亡，保險公司無給付保險金的責任，但\n退還所繳保費\nC滿期保險金之來源，部分來自保險公司資本\nD保險公司為準備被保險人保險期滿生存時給付保險金，需有責任\n準備金的提存","options":["ABCD","AD","ABD","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P152","subject":"保險實務","chapter":"第五章 人身保險的種類","number":152,"page":36,"answer":2,"explanation":"(2)正確為投保對象為年滿 25 歲，未滿 65 歲於國內設有戶籍。","stem":"有關國民年金制度敘述何者有誤？","options":["提供老年年金、生育給付、身心障礙年金、遺屬年金及喪葬給付\n等保障","投保對象為年滿 20 歲以上未滿 65 歲於國內設有戶籍的國民","被保險人死亡時按其月投保金額一次發給 5 個月喪葬給付","投保對象須為沒有參加軍保、公教保、勞保及農保的國民"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P153","subject":"保險實務","chapter":"第五章 人身保險的種類","number":153,"page":37,"answer":2,"explanation":"郵政簡易壽險保險費的繳納方式分為月繳、季繳、半年繳、年繳及\n躉繳五種，分別依保險契約約定，按保險費率表計算，由要保人按\n期交付，或按躉繳費率一次交付。","stem":"有關郵政簡易人壽保險，下列何者錯誤?","options":["商品類別有生存保險、死亡保險及生死合險，並得以附約經營健\n康保險及傷害保險","保險費的繳納方式分為月繳、季繳、半年繳及年繳四種","適用簡易人壽保險法規定","被保險人限中華民國國民且投保時免健康檢查"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P154","subject":"保險實務","chapter":"第五章 人身保險的種類","number":154,"page":37,"answer":4,"explanation":"個人傷害保險短期費率一個月期為年繳保費的 15%","stem":"個人傷害保險短期費率一個月期為年繳保費","options":["百分之十二","百分之二十","十二分之一","百分之十五"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P155","subject":"保險實務","chapter":"第五章 人身保險的種類","number":155,"page":37,"answer":3,"explanation":"A 題目為年金保險，與人壽保險單示範條款無關。","stem":"現行年金保險主要型態來自於\nA人壽保險單示範條款\nB利率變動型年金保險單示範條款\nC個人即期年金保險單示範條款\nD個人遞延年金保險單示範條款","options":["ABCD","ABD","BCD","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P156","subject":"保險實務","chapter":"第五章 人身保險的種類","number":156,"page":37,"answer":2,"explanation":"(2)變額萬能壽險指彈性繳納保險費，保單現金價值有高低起伏但可\n能降低至零，因為投資型保險商品盈虧自負。","stem":"有關投資型保險商品敘述何者錯誤？","options":["專設帳簿的資產於保險公司破產時，得不受保險公司之債權人扣\n押","變額萬能壽險指彈性繳納保險費，保單現金價值有高低起伏但不\n可能降低至零","變額壽險指固定繳費，但保險金額隨著投資績效而變動","變額年金保險指保險費及年金額度都會變動"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P157","subject":"保險實務","chapter":"第五章 人身保險的種類","number":157,"page":38,"answer":1,"explanation":"老年生活費的準備應該以「在工作期間自作準備」及「個人自我累\n積養老年金」故選\nA長年期的健康保險、B長期照顧保險、C年金保險，以防因退休或\n疾病，致沒有收入的窘境。","stem":"台灣地區目前正面臨老年問題發生，所以下列哪些商品成為老年人\n口的重要需求？\nA長年期的健康保險、B長期照顧保險、C年金保險、D定期壽險","options":["ABC","BC","AB","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P158","subject":"保險實務","chapter":"第五章 人身保險的種類","number":158,"page":38,"answer":3,"explanation":"附加費用是指保險公司經營的成本。\n經營壽險的成本較高。（可能會有抽樣體檢）壽險年金保險的預定\n附加費用率與相同繳費期間之一般壽險的附加費用率較低。","stem":"年金保險的預定附加費用率與相同繳費期間之養老保險的附加費用\n率比較會","options":["相同","較高","較低","不一定"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P159","subject":"保險實務","chapter":"第五章 人身保險的種類","number":159,"page":38,"answer":3,"explanation":"投資型保險商品非全權委託的投資標的不包含可轉讓定期存單。","stem":"投資型保險商品非全權委託的投資標的可包含\nA證券投資信託基金受益憑證\nB共同信託基金受益證券\nC各國中央政府發行之公債、國庫券\nD可轉讓定期存單","options":["ABD","ABCD","ABC","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P160","subject":"保險實務","chapter":"第五章 人身保險的種類","number":160,"page":38,"answer":2,"explanation":"(2)當保費資金來源為貸款、解約或保單借款之客戶，應另指派非銷\n售通路人員，於銷售商品商品且同意承保前辦理電話訪問，並應保\n留錄音紀錄以供查核。","stem":"有關投資型保險商品銷售之規範，下列何者錯誤？","options":["招攬人員於銷售投資型保險商品2個月前曾協助同一保戶辦理貸\n款者，該員不得支領推介貸款報酬","當保費資金來源為貸款，原招攬人員應於承保前對客戶進行電訪\n並保留錄音 紀錄以供查核","招攬人員須另具備投資型保險商品測驗合格且完整變更登錄者","保險業應訂定客戶紛爭處理程序納入內部控制作業之處理程序，\n辦理內部稽核及自行查核"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P161","subject":"保險實務","chapter":"第五章 人身保險的種類","number":161,"page":39,"answer":2,"explanation":"利變型年金：\n累積期間的重要因素：附加費用、宣告利率（甲/乙型一樣）\n給付期間的重要因素：甲型-預定死亡率、預定利率，乙型-預定死\n亡率、預定利率、宣告利率\n死亡率考題上可能替換成：年金生命表、年紀、性別","stem":"利率變動型年金在累積期間，保險公司依據要保人交付之保險費，\n減去附加費用後，依何種利率計算年金保單價值準備金","options":["預定利率","宣告利率","定存利率","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P162","subject":"保險實務","chapter":"第五章 人身保險的種類","number":162,"page":39,"answer":3,"explanation":"保險業結合科技設計外溢效果的保險商品，可以為客戶達到下列效\n果：改變被保險人生活作息、提升民眾健康、透過穿戴裝置了解個\n人健康狀況、輔助保險決策。","stem":"保險業結合科技設計外溢效果的保險商品，可以為客戶達到下列哪\n些效果？\nA改變被保險人生活作息 B提升民眾健康\nC透過穿戴裝置了解個人健康狀況 D輔助保險決策","options":["BC","ACD","ABCD","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P163","subject":"保險實務","chapter":"第五章 人身保險的種類","number":163,"page":39,"answer":4,"explanation":"乙型給付期的重要因素：預定死亡率、預定利率、宣告利率。\n宣告利率為第二年的調整係數帶入的，考題問第一次，所以答案為\n預定利率、預定死亡率。\n死亡率在考題上可能為年金生命表、年紀、性別","stem":"利率變動型年金乙型在年金給付開始第一次，以當時何者換算年金\n金額","options":["年齡","年金生命表","預定利率","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P164","subject":"保險實務","chapter":"第五章 人身保險的種類","number":164,"page":39,"answer":3,"explanation":"(3)仰賴人口：0-14 歲以及 65 歲以上人口","stem":"依國家發展委員會人口推估報告書之說明，下列何者有誤？","options":["我國自民國 107 年起邁入高齡社會","預估於民國 115 年將進入超高齡社會","仰賴人口係指 0 至 14 歲的人口","青壯年人口係指 15 歲至 64 歲的人口"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P165","subject":"保險實務","chapter":"第五章 人身保險的種類","number":165,"page":40,"answer":3,"explanation":"經濟弱勢者以收入標準、職業、身分別為界定方式，除左列選項以\n外尚包含：原住民、漁民、農保被保險人、社會福利慈善團體服務\n對象、身心障礙者","stem":"何者符合微型保險經濟弱勢條件？\nA無配偶且全年度綜合 所得在 35 萬元以下者\nB夫妻兩人全年綜合所得在 70 萬元以下家庭之家庭成員\nC特殊境遇家庭包含弱勢單親家庭之家庭成員\nD屬於內政部工作所得補助方案實施對象家庭之家庭成員","options":["ACD","AB","ABCD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P166","subject":"保險實務","chapter":"第五章 人身保險的種類","number":166,"page":40,"answer":1,"explanation":"甲型：預定利率與精算公式最小值\n乙型：依當時預定利率為準","stem":"利率變動型年金甲型在給付期間之責任準備金係以年金金額之預定\n利率與依『新契約責任準備金利率採自動調整精算公式』計算之利\n率","options":["最小值","平均值","最大值","以上皆可計算"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P167","subject":"保險實務","chapter":"第五章 人身保險的種類","number":167,"page":40,"answer":3,"explanation":"所謂長期照顧狀態係指被保險人經專科醫師診斷符合下列二項情形\n之一者，\n1.生理功能障礙：指被保險人經專科醫師依巴氏量表診斷判定不得高\n於 6 個月 以上，其進食、移位、如廁、沐浴、平地行動及更衣等六\n項日常生活自理能力持續存有 3 項以上障礙。\n2.認知功能障礙：指被保險人經專科醫師依巴氏量表診斷判定不得\n高於 6 個月以上，仍維持續失智狀態，並有時間、場所及人物三項\n分辨障礙之 2 項分辨障礙","stem":"長期照顧保險之被保險人經專科醫師診斷後依診斷書判定符合長期\n照顧狀態者，給予保險給付，所謂長期照顧狀態係指被保險人經專\n科醫師診斷符合下列哪些情形者","options":["持續 6 個月以上失智並有分辨上障礙且依臨床失智量表評估中\n等以上","依臨床專業評量表診斷判定 5 個月內有進食及移 位障礙","依巴氏量表判定 3 個月內有移位、如廁及沐浴等 3 項障礙","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P168","subject":"保險實務","chapter":"第五章 人身保險的種類","number":168,"page":40,"answer":3,"explanation":"A 自主健康管理方式與保險結合\nC 若保戶身體檢康檢查或利用穿戴裝置達到一定的標準，\nB 保單便啟動未來保費減費機制、或領到健康促進獎勵金、或提供\n健康服務諮詢等方式回饋給保戶\nD 目前設計有實物給付型及非實物給付型 2 種。","stem":"外溢效果的保險，在人身保險現行商品之設計有哪些方式\nA保戶自主健康管理\nB保險公司提供抵減保險費\nC保戶依保險公司要求使用穿戴型裝置即可領得健康促進獎勵金\nD目前僅有實物給付型商品","options":["BC","ABC","AB","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P169","subject":"保險實務","chapter":"第五章 人身保險的種類","number":169,"page":41,"answer":2,"explanation":"(2)主管機關在中央為教育部，在直轄市為直轄市政府，在縣（市）\n為縣（市）政府。","stem":"有關學生團體保險之敘述何者錯誤?","options":["辦理本保險如有不足，由專戶填補，保險人不負盈虧之責","主管機關為金融監督管理委員會","被保險人為學生，身故保險金受益人為被保險人之法定繼承人","保險期間每次一年且與學年之起 訖日一致為原則"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P170","subject":"保險實務","chapter":"第五章 人身保險的種類","number":170,"page":41,"answer":2,"explanation":"所謂團體一年定期壽險之「平均保險費率」是按訂定本契約或續保\n時，依要保人的危險程度及每一被保險人的性別、年齡、保險金額\n所算出的保險費總和除以全體被保險人保險金額總和計算。\n『被保險團體』的危險程度→應改為『要保人』答案為 2","stem":"所謂團體一年定期壽險之「平均保險費率」是依「」所計算出的保\n險費總和除以全體被保險員工保險金額總和計算。\nA被保險團體的危險程度 B每一被保險員工的年齡\nC每一被保險員工的保險金額 D每一被保險員工的性別","options":["ABD","BCD","ABCD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P171","subject":"保險實務","chapter":"第五章 人身保險的種類","number":171,"page":41,"answer":1,"explanation":"團體保險的種類:團體壽險、團體傷害保險、團體健康保險、團隊年\n金保險。","stem":"團體保險已漸為一般公司行號、企業團體所利用;目前壽險公司所推\n出之團體保險不包括哪一種？","options":["團體責任保險","團體傷害保險","團體健康保險","團體人壽保險"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P172","subject":"保險實務","chapter":"第五章 人身保險的種類","number":172,"page":41,"answer":2,"explanation":"依據「保險業辦理微型保險業務應注意事項」規定，微型保險附加\n費用率上限 為總保費之 15%。","stem":"依據「保險業辦理微型保險業務應注意事項」規定，微型保險附加\n費用率上限為","options":["純保費之 10%","總保費之 15%","純保費之 15%","總保費之 10%"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P173","subject":"保險實務","chapter":"第五章 人身保險的種類","number":173,"page":41,"answer":4,"explanation":"(4)連生共存年金為年金受領人有 2 人以上，各該人皆生存時，保險\n人依約給付年金。","stem":"有關年金保險之敘述何者錯誤？","options":["社會年金保險的種類依保險事故別分為年老、失能及遺屬三種年\n金","年金給付以被保險人生存為條件者即具有保險功能","年金給付不以個人或被保險人的生存為條件者，稱為確定年金","連生共存年金中多名年金受領人，若僅其中 1 人生存，保險人仍\n應依約給付年金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P174","subject":"保險實務","chapter":"第五章 人身保險的種類","number":174,"page":42,"answer":1,"explanation":"保險公司應慎選招攬人，事先完成必要之在職訓練，且不得於招攬\n時即承諾消費者可適用優體費率。也不得與其他同業之優體壽險費\n率、核保項目、標準進行不當比較。\n(4)無須另行辦理登錄。","stem":"下列何者為招攬人員銷售優體壽險商品應有之行為？","options":["完成優體壽險商品之在職教育訓練始進行銷售","於招攬時即承諾消費者可適用優體費率","與其他同業之優體壽險費率、核保項目、標準進行不當比較","通過優體壽險商品測驗且完成登錄者始進行銷售"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P175","subject":"保險實務","chapter":"第五章 人身保險的種類","number":175,"page":42,"answer":1,"explanation":"利變年金責任準備金於累積期間，以年金保單價值準備金全額提\n存。","stem":"利率變動型年金之責任準備金於累計期間，是以何者為基礎提存","options":["保單價值準備金全額","所繳保費總和","純保費總和","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P176","subject":"保險實務","chapter":"第五章 人身保險的種類","number":176,"page":42,"answer":2,"explanation":"(2)應是雇主每月依「勞工退休條例」負擔勞工退休金提繳率不得低\n於勞工每月工資 6%。\n且勞工得在其每月工資 6%範圍內，自願另行提繳退休金。","stem":"有關勞工退休金採新制者何者有誤？","options":["勞工退休請領時須併入個人綜合所得申報","每月提撥率得由勞工自由決定","勞工自願提繳的部分得自當年度個人綜合所得總額中全數扣除","勞工按月提繳退休金，可選擇儲存於勞保局設立之勞工退休金個\n人專戶"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P177","subject":"保險實務","chapter":"第五章 人身保險的種類","number":177,"page":42,"answer":3,"explanation":"事故加劇，故以提高保障機能為主，因此需增加死亡保障。\n死亡保險分為定期保險及終身保險。","stem":"工業化的結果，各種意外事故劇增，促使人民重視保障，各公司在\n保險商品設計上亦以提高保障機能為主，其商品種類以","options":["生死合險","儲蓄保險","定期保險及終身保險","生存保險業務成長迅速"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P178","subject":"保險實務","chapter":"第五章 人身保險的種類","number":178,"page":42,"answer":4,"explanation":"年金保險生存年金為保險人承諾在被保險人生存期間定期支付約定\n金額的一種契約，故年金保險不得有除外責任","stem":"年金保險契約之生存年金部分","options":["得有除外責任","不得有除外責任期間，但得有除外責任原因","不得有除外責任原因，但得有除外責任期間","不得有除外責任"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P179","subject":"保險實務","chapter":"第五章 人身保險的種類","number":179,"page":43,"answer":3,"explanation":"(1)(4)人身保險四種類型:人壽、傷害、健康、年金\n(2)人壽保險中包括生存保險、死亡保險及生死合險","stem":"以下何者為是？","options":["人身保險四種類型中包含責任保險","人壽保險中包括生存保險、死亡保險及健康保險","將保險區分財產保險及人身保險兩類，是依據我國保險法第十三\n條規定","人身保險包括責任保險及人壽保險"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P180","subject":"保險實務","chapter":"第五章 人身保險的種類","number":180,"page":43,"answer":3,"explanation":"94 年以前以年金生命表死亡率之 100%-120%為基礎","stem":"年金給付開始日為民國94年以前之利率變動型年金保險，下列何者\n可能被引用作為計算保險費之基礎？","options":["年金生命表死亡率之 90%","年金生命表死亡率之 130%","年金生命表死亡率之 110%","年金生命表死亡率之 70%"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P181","subject":"保險實務","chapter":"第五章 人身保險的種類","number":181,"page":43,"answer":1,"explanation":"利率變動型年金甲型於給付期間，是以預定死亡率、預定利率來換\n算定額年金","stem":"利率變動型年金甲型於給付期間，保戶可領取之年金金額與下列何\n者有關：\nA預定死亡率、B預定附加費用率、C預定利率、D宣告利率","options":["AC","AB","AD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P182","subject":"保險實務","chapter":"第五章 人身保險的種類","number":182,"page":43,"answer":2,"explanation":"團體保險是以每位員工對每單位保險金額應繳的保險費，通常係以\n平均保險費率乘以保險金額總額來計算。","stem":"團體保險內每位員工對每單位保險金額應繳的保險費通常係以何種\n費率乘以保險金額總額計算？","options":["分級保險費率","平均保險費率","平衡保險費率","團體保險費率"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P183","subject":"保險實務","chapter":"第五章 人身保險的種類","number":183,"page":44,"answer":3,"explanation":"(3)宣告利率不得為負數","stem":"利率變動型年金保險費率相關規範中，下列何者為不可採行者？","options":["預定利率不得高於年金給付開始日當月之宣告利率","宣告利率不得超過宣告前中央銀行公布之最近一個月 10 年期中\n央政府公債次級市場殖利率","宣告利率下限無規定，且得為負值","預定附加費用率由公司自行訂定，並明訂於契約條款中"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P184","subject":"保險實務","chapter":"第五章 人身保險的種類","number":184,"page":44,"answer":2,"explanation":"(2)登錄證期限五年，故每五年需換證，因此該選項不正確","stem":"有關人身保險業務員登錄之敘述何者錯誤？","options":["未依規定期限完成換證之業務員，所屬公司應停止其招攬行為","登錄證分為第 1 年至第 5 年度之登錄證與第 6 年度起登錄證二\n種","業務員自初次登錄日起每滿 5 年須完成教育訓練並辦理換證","未依規定期限完成換證之業務員，其登錄資格及測驗合格證號將\n被取消"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P185","subject":"保險實務","chapter":"第五章 人身保險的種類","number":185,"page":44,"answer":2,"explanation":"(1)每一被保險人投保實支實付醫療保險（含日額或實支實付給付擇\n一之商品）張數上限為 3 張，不分是否為同一保險人\n(3)不包括：學生團體保險、團體保險、 旅平險、微型保險","stem":"有關實支實付醫療保險控管何者正確？","options":["每一被保險人向同一保險人投保實支實付保險張數上限為 3 張","整體保險業於醫療保險及傷害醫療保險投保 1 張銜接原給付限額\n具自負額商品，該張可不列入張數計算","適用於由要保單位負擔保費之旅平險、微型保險所含之實支實付\n型傷害醫療保險","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P186","subject":"保險實務","chapter":"第五章 人身保險的種類","number":186,"page":44,"answer":4,"explanation":"利率變動型年金甲型:年金給付開始時，以當時之預定死亡率（年\n齡、性別、年金生命表）、及預定利率換算定額年金。","stem":"利率變動型年金甲型在年金給付開始時，以當時之「」換算定額年\n金。","options":["預定利率","年金生命表","年齡","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P187","subject":"保險實務","chapter":"第五章 人身保險的種類","number":187,"page":45,"answer":2,"explanation":"經專科醫師診斷判定生理或認知功能障礙為終身無法治癒者，不受\n多少個月之限制。","stem":"下列敘述何者錯誤？","options":["長期照顧保險給付可分為一筆或分期給予固定金額二種","被保險人經專科醫師診斷判定認知功能障礙為終身無法治癒者，\n仍須符合契約條款約定之期間限制才可符合認知功能障礙","若契約條款明定免責期間，被保險人的生理功能障礙或認知功能\n障礙狀態須超過免責期，保險公司才會給付長期照顧保險金","外溢效果的保險可以達到事前預防風險的效益"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P188","subject":"保險實務","chapter":"第五章 人身保險的種類","number":188,"page":45,"answer":3,"explanation":"我國壽險業目前將傷害保險失能程度分為 11 級 80 項。","stem":"我國壽險業目前將傷害保險失能程度分為？","options":["6 級 28 項","11 級 79 項","11 級 80 項","12 級 80 項"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P189","subject":"保險實務","chapter":"第五章 人身保險的種類","number":189,"page":45,"answer":4,"explanation":"C 未滿 15 歲之未成年人得投保年金保險\nD 年金受益人於被保險人生存期間為被保險本人","stem":"有關年金保險敘述何者正確？\nA可分為社會性年金保險及商業性年金保險\nB年金保險契約必須記載給付方法\nC未滿 15 歲之未成年人不得投保年金保險\nD受益人不得為被保險人本人","options":["BC","ABCD","A","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P190","subject":"保險實務","chapter":"第五章 人身保險的種類","number":190,"page":45,"answer":3,"explanation":"結構型商品為非全委。","stem":"下列何者屬投資型保險商品規範，由保險人接受要保人以保險契約\n委任全權決定運用之投資標的之運用範圍\nA公債、國庫券 B台灣存託憑證 C外國有價證券 D結構型商品","options":["BCD","AC","ABC","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P191","subject":"保險實務","chapter":"第五章 人身保險的種類","number":191,"page":45,"answer":3,"explanation":"利率變動型年金躉繳者附加費用率由公司自行訂定","stem":"利率變動型年金躉繳者附加費用率不得超過總保費之","options":["5%","8.5%","由公司自行訂定","10%"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P192","subject":"保險實務","chapter":"第五章 人身保險的種類","number":192,"page":46,"answer":3,"explanation":"不參加商品說明會不為撤銷登錄事項。","stem":"保險業務員如有下列何種情事，所屬公司得處以停止招攬或撤銷登\n錄之處分？\nA對要保人、被保險人或第三人以誇大不實之宣傳、廣告或其他不\n當之方法為招攬者\nB以誇大不實之方式就不同保險契約內容作不當之比較\nC以不當之方法慫恿要保人終止有效契約而投保新契約致使要保人\n受損害者\nD不參加商品說明會、專業課程訓練或參加該訓練成績不合格者","options":["BD","ABCD","ABC","AC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P193","subject":"保險實務","chapter":"第五章 人身保險的種類","number":193,"page":46,"answer":1,"explanation":"正確答案是 (1)\nA 附約預定附加費用率不得超過總保費之 15%","stem":"有關小額終老保險何者正確？\nA主約、附約的預定附加費用率皆不得超過總保費之 10%\nB保險費約為其他終身壽險的七成左右\nC主約、附約個別被保險人之投保年齡加計繳費期間之數值最高皆\n不超過 90\nD主約、附約皆不得有增額或加倍給付之設計，並以承保單一保險\n事故為限","options":["BCD","ABC","ABCD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P194","subject":"保險實務","chapter":"第五章 人身保險的種類","number":194,"page":46,"answer":1,"explanation":"利率變動型年金保險費的計算基礎為預定危險發生率、宣告利率、\n預定利率、預定附加費用率。","stem":"利率變動型年金保險費的計算基礎包括\nA預定危險發生率 B預定附加費用率 C宣告利率 D通貨膨脹率","options":["ABC","AB","ABD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P195","subject":"保險實務","chapter":"第五章 人身保險的種類","number":195,"page":47,"answer":4,"explanation":"累積期：甲、乙均無紅利\n給付期：甲型可採分紅與不分紅，乙型無紅利","stem":"有關利率變動型年金之敘述何者為非？","options":["乙型於給付期間通常無紅利給付","若採分紅方式設計應明訂計算方式及給付方式","於累積期間不論甲型或乙型，均無紅利給付","甲型於給付期間僅採不分紅方式設計"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P196","subject":"保險實務","chapter":"第五章 人身保險的種類","number":196,"page":47,"answer":1,"explanation":"累積期間：依宣告利率累積保價金\n給付期間：甲型固定，乙型依照調整係數","stem":"利率變動型年金保險乙型，其給付期間第二年度開始可領取之年金\n金額係以前一年度可領取之年金金額乘以當年度","options":["調整係數","浮動係數","風險係數","變動係數而得之"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P197","subject":"保險實務","chapter":"第五章 人身保險的種類","number":197,"page":47,"answer":4,"explanation":"年金保險以被保險人生存為給付條件，故年金生命表的死亡率越\n高，其保險費越低。","stem":"年金生命表的死亡率越高，其保險費","options":["不一定","沒有影響","越高","越低"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P198","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":198,"page":48,"answer":1,"explanation":"第一次保險費相當額送金單內容應包含：要/被保險人地址、姓名、\n保險種類、繳費方式、保險金額、保險費。","stem":"下列那些是預收第一次保險費相當額送金單記載事項？\nA保險種類、B繳費方法、C保單預定利率、D要保人、被保險人姓\n名與地址","options":["ABD","BCD","ABC","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P199","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":199,"page":48,"answer":2,"explanation":"保險公司授權業務員之招攬範圍：說明填寫要保書注意事項、轉送要\n保文件及保險單、解釋保險商品內容及保險單條款。","stem":"下列何項為保險公司授權業務員之招攬範圍？\nA說明填寫要保書注意事項 B轉送要保文件及保險單\nC收取續期保險費 D解釋保險商品內容及保險單條款","options":["AB","ABD","ABC","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P200","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":200,"page":48,"answer":3,"explanation":"C 業務員應注意要保人與被保險人及被保險人與受益人之關係。","stem":"業務員應充分了解要保人及被保險人並據實向公司提出報告，何者\n為業務員應評估內容？\nA要保人及被保險人之投保目的及需求\nB客戶承擔風險之能力及財務狀況\nC身故受益人與要保人關係是否為配偶、直系親屬或指定法定繼承\n人\nD要保人及被保險人是否投保其他商業保險","options":["ABC","BD","ABD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P201","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":201,"page":48,"answer":2,"explanation":"僅有商品「條款樣本、人壽保險投保人須知」應提供給保戶","stem":"哪些是保戶申請要保前應該提供給保戶之資料？\nA條款樣本 B人壽保險投保人須知 C保單紅利試算表\nD保險商品和定存利率比較表","options":["ABCD","AB","BCD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P202","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":202,"page":48,"answer":4,"explanation":"壽險公司承保新契約時，契約選擇的程序可以分為三個階段\n(一)業務員的選擇 (二)公司體檢醫師的選擇 (三)核保人員的選擇","stem":"下列何者非壽險公司承保新契約時契約選擇之程序？","options":["業務員的選擇","核保人員的選擇","公司體檢醫師的選擇","生存調查人員的選擇"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P203","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":203,"page":49,"answer":4,"explanation":"有權代收保費之人代收之保費為現金或開立支票之發票人非為要保\n人、被保險人及受益人，應於次月底前以當月開立送金單、預收保費\n證明或收據比率之 1% 或不低於 500 件抽樣選取要保人聯繫","stem":"保戶以現金繳納保險費或開立支票之發票人非為要保人、被保險人\n及受益人，保險公司","options":["應於次月底前全數聯繫要保人","不須做任何處理","僅現金繳納應於次月底前全數聯繫要保人，通知其繳費情況","應於次月底前依比率選取要保人抽樣聯繫"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P204","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":204,"page":49,"answer":2,"explanation":"若以支票繳納相當於第一次保費全部或一部分金額時，如保險公司不\n同意承保，或該支票退票或未兌現時，則保險契約不發生效力。","stem":"以支票繳納相當於第一次保費全部或一部分金額時，若該支票退票\n則保險契約","options":["有效，但保險公司得催繳保險費","不發生效力","效力終止","停效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P205","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":205,"page":49,"answer":2,"explanation":"以上皆為契約危險選擇應考量的項目。","stem":"契約危險選擇應考量之項目？\nA被保險人的收入 B要保人的投保動機\nC被保險人職業 D被保險人的既往症、現症、家族遺傳病史","options":["BCD","ABCD","CD","BD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P206","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":206,"page":49,"answer":1,"explanation":"保險業授權所屬保險業務員、保險代理人或其所屬保險業務員代收保\n險費。","stem":"保險業授權代收保險費之人包括\nA保險公司授權之所屬業務員\nB保險經紀人或其所屬保險業務員\nC保險公司未登錄之收費員\nD保險代理人或其所屬保險業務員","options":["AD","ABC","ABCD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P207","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":207,"page":49,"answer":4,"explanation":"要保人在繳付相當於第一次保險費的金額時，保險契約要等到保險公\n司同意承保時才成立，但是契約成立後，效力溯自繳費日開始起算。","stem":"要保人在繳付相當於第一次保險費的金額時，保險契約","options":["即時成立","等到保險公司同意承保時才成立","於契約成立後，效力溯自繳費日開始起算","僅第 2 及第 3 選項為是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P208","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":208,"page":50,"answer":1,"explanation":"(1)保險業授權所屬保險業務員、保險代理人或其所屬保險業務員代收\n保險費。","stem":"依保險業授權代收保險費應注意事項之規定，何者為非？","options":["保險業授權所屬保險業務員、保險經紀人及保險代理人或其所屬\n保險業務員代收保險費","有權代收保險費之人未將所領之逾期送金單繳回者，保險業不得\n再發給新單","有權代收保險費之人代收以現金繳納保險費，單張保單當期以新\n臺幣 5 萬元為上限","以上皆非"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P209","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":209,"page":50,"answer":2,"explanation":"權代收保險費之人：保險業授權所屬保險業務員、保險代理人或其所\n屬保險業務員，無保險業授權保險經紀人","stem":"有關保險業授權代收保險費之相關規定，何者為非？","options":["保戶以支票繳納第一次保險費發生支票退票或未兌現時，保險契\n約不發生效力","保險業授權保險經紀人代收保險費，應要求保險經紀人訂定控管\n機制並納入保險經紀合約","保險業應規定代收保險費之繳回期限，如以業務員本人或他人開\n立的非即期支票繳納則屬挪用保費情形","業務員填寫送金單時發生塗改，不論塗改處為何，該送金單一律\n無效"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P210","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":210,"page":50,"answer":2,"explanation":"業務員在契約選擇上應注意之事項：\n1.身體上的危險：被保險人的既往症、現症、家族遺傳病史\n2.環境上的危險：被保險人職業\n3.道德上的危險：被保險人的收入、要保人的投保動機","stem":"契約危險選擇應考量之項目？\nA被保險人的收入 B要保人的投保動機\nC被保險人職業 D被保險人的既往症、現症、家族遺傳病史","options":["CD","ABCD","BD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P211","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":211,"page":51,"answer":2,"explanation":"(2)應據實地把現在的健康狀況、既往症寫出來。","stem":"下列何者錯誤？","options":["投保金額不同則體檢項目不同","業務員必要時可協助被保險人隱瞞既往症以利核保","體檢時業務員應避免做出妨礙體檢之行動","業務員必須親自會晤被保險人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P212","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":212,"page":51,"answer":4,"explanation":"有違常理的情形，要對真實的情況膫解並探究其原因，以免有投機\n取巧的情事發生。","stem":"為避免有人藉保險謀取不法利益，業務員招攬時應留意\nA保單中死亡受益人指定是否為被保險人血親之外第三人\nB要保人、被保險人無收入而投保高額保險金\nC要保人透露近期有向多家保險公司購買保險商品\nD被保險人近期有多筆小額理賠","options":["ABC","BCD","ACD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P213","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":213,"page":51,"answer":2,"explanation":"A 保障標的是被保險人，不須核保受益人體況\nC 應了解要保人對被保險人是否具有保險利益\nD 不需檢視要保人是否有家族遺傳疾病","stem":"下列何者係壽險業務員招攬時應注意事項？\nA受益人是否被拒保\nB投保金額是否過高至有道德風險之虞\nC受益人對被保險人是否有保險利益\nD要保人是否有家族遺傳疾病","options":["BC","B","ABCD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P214","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":214,"page":52,"answer":2,"explanation":"A 未成年人已婚者，為有行為能力之人\nC 如要保人或被保險人不能親自填寫，得由其家屬代寫，但要註明\n經過，填寫完成，仍應由要保人及被保險人親自簽章。","stem":"下列何者正確？\nA要保人如尚未成年，皆須經過法定代理人簽章同意契約始生效\nB被保險人之職業須確實填寫\nC要保人或被保險人不能親自填寫者，保險契約得由業務員代為填\n寫再由保戶親自簽名\nD保險契約保戶親自簽名處如為保戶親自按摺印，其意思表示及效\n力與親簽一樣","options":["ABD","BD","BC","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P215","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":215,"page":52,"answer":1,"explanation":"契約選擇程序，身體上的危險包含：被保險人所患之既往症、現症\n及家族遺傳疾病，所以選項\n(1)正確\n(2)環境上的危險，重點在被保險人，不是家族\n(3)應該是要注意家人是否為受益人","stem":"要保人以自己為被保險人投保人壽保險，業務員對其家族應注意","options":["是否有人患有遺傳性疾病","是否有人從事危險職業","家人是否已投保","以上皆應注意"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P216","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":216,"page":52,"answer":3,"explanation":"保險公司核保的參考依據有醫師的體檢報告書、調查員的調查報\n告、保戶填寫的要保文件、業務員報告書。","stem":"下列何者是保險公司核保的參考依據？\nA醫師的體檢報告書 B調查員的調查報告\nC保戶填寫的要保文件 D業務員報告書","options":["BCD","ABD","ABCD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P217","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":217,"page":52,"answer":1,"explanation":"D 要保人與被保人非同一人，不是體檢必要條件","stem":"當「」，業務員應洽經驗較豐富公司之專任醫師或特約醫師擔任體\n檢工作。\nA被保險人投保的保險金額相當高\nB被保險人過去有 未能承保的紀錄\nC被保險人過去有增加其他條件仍不能承保的紀錄\nD要保人與被保險人非同一人","options":["ABC","ACD","BCD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P218","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":218,"page":53,"answer":4,"explanation":"壽險業務員招攬必須會見本人做登記，有關「要保人」與「被保險\n人」之簽名應由其本人親簽，以避免日後引起糾紛。","stem":"壽險業務員招攬必須「」以上何者正確？\nA親自會晤受益人 B親自會晤被保險人\nC取得由要、被保人親簽之文件 D於要保書上親自簽名","options":["ABCD","ABC","CD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P219","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":219,"page":53,"answer":1,"explanation":"壽險業授權代收保險費之人包括保險業務員、保險代理人或其所屬\n保險業務員。","stem":"壽險業授權代收保險費之人包括\nA保險公司授權之所屬業務員 B保險經紀人或其所屬保險業務員\nC保險公司未登錄之收費員 D保險代理人或其所屬保險業務員","options":["AD","ABC","ABCD","ABD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P220","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":220,"page":53,"answer":4,"explanation":"(4)要保書中保戶住所或居所地址不得為業務員之住所或居所。","stem":"有關業務員協助保戶填寫要保書之敘述，何者有誤？","options":["業務員應事先提供人壽保險投保人須知供保戶閱讀","保戶於要保書上所填基本資料應與戶籍上登記資料相同","業務員報告書須先會見保戶本人，再由業務員親自填寫","要保書中保戶住所或居所地址得先暫填業務員之住所或居所"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P221","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":221,"page":53,"answer":4,"explanation":"(4)保戶繳費後收到的送金單係為已遺失或毀損者，仍應對該保戶付\n法律責任。","stem":"依保險業授權代收保險費應注意事項之規定，下列敘述何者為非？","options":["保險業對於以支票繳納保費者，應限制發票人不得為有權代收保\n險費之人","送金單上不得增列警語增加保戶責任","保險業應限制代收保險費人領取送金單之份數","保戶繳費後收到的送金單係為已遺失或毀損者，保險業不得付法\n律責任"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P222","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":222,"page":53,"answer":1,"explanation":"全選","stem":"何者是防止道德風險之重要資料，應慎重處理\nA被保險人體格檢查書 B被保險人告知書\nC被保險人之生存調查單 D業務員填寫的招攬報告書","options":["ABCD","AD","ABC","AB"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P223","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":223,"page":54,"answer":1,"explanation":"有權代收保險費之人收取以現金或支票方式繳納保險費時，應同時\n交付保戶送金單、預收保費證明或收據","stem":"保險業授權代收保險費之人收取以下列何種方式繳納保險費時，應\n同時交付保戶送金單、預收保費證明或收據？\nA現金、B信用卡授權書、C支票、D劃撥匯款單","options":["AC","ABCD","AB","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P224","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":224,"page":54,"answer":3,"explanation":"保險業授權代收保險費之人:保險代理人或其所屬業務員、保險公司\n授權之所屬業務員。","stem":"下列何者非保險業授權代收保險費之人","options":["保險代理人","保險代理人所屬業務員","保險經紀人所屬業務員","保險公司授權之所屬業務員"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P225","subject":"保險實務","chapter":"第六章 投保實務與契約的選擇","number":225,"page":54,"answer":3,"explanation":"業務員接受客戶投保時，必須親自會晤被保險人。","stem":"業務員接受客戶投保時，必須","options":["親自會晤受益人","親自會晤保險人","親自會晤被保險人","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P226","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":226,"page":55,"answer":4,"explanation":"保險存摺的功能包括簡易查詢保單資料、提供實名認證功能以申請理\n賠，以及登入多家保險公司網站查詢保單內容。（114 年更新）","stem":"保險存摺的功能，下列何者是錯的？","options":["簡易查詢保單資料","有實名認證功能，可以申請保險理賠","可以登錄各家保險公司官方網站查詢詳細的保單","可以幫忙算出保障有哪些缺口"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P227","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":227,"page":55,"answer":3,"explanation":"(1)可能出現領到的總金額低於轉換前的壽險保單\n(2)轉換後預定利率變「低」，保費成本相對提「高」\n(4)需要要保人及被保人親自簽章確認","stem":"下列關於保單活化何者正確？","options":["不會出現領到的總金額低於轉換前的壽險保單","轉換後保單預定率變高，保費成本相對較高","部分保單透過解約並扣除稅額後可能比保單轉化更划算","只需要要保人親自簽章確認即可"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P228","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":228,"page":55,"answer":4,"explanation":"保單活化不一定對客戶更有利，因為轉換保單後，預定利率可能降\n低，導致保費增加，部分情況下，解約並扣除稅額後，可能比轉換保\n單更划算。","stem":"保單活化敘述何者錯誤？","options":["用原保單的保單價值準備金來計算轉換後的醫療、長照或年金給\n付","它益型保單轉換自益型保單","原保單累積達一定保單價值準備金，轉換支付新險種的保單保費","保單活化對客戶更為有利"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P229","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":229,"page":55,"answer":1,"explanation":"保險商業同業公會推出保險存摺，讓保戶查詢保單更方便。\n（114 年更新）","stem":"保險商業同業公會推出什麼服務，可以方便保戶查詢保單呢?","options":["保險存摺","保全理賠聯盟鏈","電子保單存證","保險理賠醫起通"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P230","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":230,"page":55,"answer":3,"explanation":"人壽保險行銷過程：接近→問題→解決→決心→滿意。","stem":"人壽保險行銷過程依序為？\nA解決、B問題、C決心、D滿意、Ｅ接近","options":["EBADC","BAECD","ＥBACD","BEACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P231","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":231,"page":56,"answer":3,"explanation":"應急預備金應包含：醫療預備金、喪亡處理預備金、借款償還金、臨\n時預備金。","stem":"一般家庭的應急預備金不包括？","options":["喪亡處理預備金","醫療預備金","子女教育金","借款償還金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P232","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":232,"page":56,"answer":4,"explanation":"保單活化轉換生效後，除下列情形，保險公司應提供回復原契約之權\n利：\n(1)轉換後保險契約已開始給付保險金或已有申請理賠紀錄\n(2)原保險契約之保險事故已發生始主張撤銷該次轉換\n(3)自轉換生效日起三年後始主張撤銷該次轉換","stem":"保單活化轉換生效後，請問下列何者情況下，不得申請保單轉換回\n復？","options":["轉換後保險契約已開始給付保險金或已有申請理賠紀錄","原保險契約之保險事故已發生始主張撤銷該次轉換","自轉換生效日起三年後始主張撤銷該次轉換","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P233","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":233,"page":56,"answer":2,"explanation":"B 如產生差額需補繳保費或由保險公司退還差額\nC 保單轉換後保單預定利率變低，保費成本相對較高，部分保單透過\n解約並扣除稅額後可能比保單轉換更划算，且轉換後的醫療險、年金\n險或長照險所提供的保障，會因為保戶的生存時間長短，或保單理賠\n給付的方式不同，可能出現領到的總金額低於轉換前的壽險保單，所\n以並不是百利無一害。","stem":"有關保單活化之敘述何者正確？\nA舊保單需投保時間夠長已累積有保單價值準備金\nB若舊保單之保單價值準備金不足轉換支付新契約保費時，則無法\n轉換\nC保單活化制度對保戶百利無一害\nD屬於功能性轉換，將他益型保單轉化成自益型保單","options":["ACD","AD","ABD","ABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P234","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":234,"page":56,"answer":1,"explanation":"C 應考量轉換新保單之預定利率較舊保單低，保費成本相對較高。","stem":"有關保單轉換前進行變更適合度評估，何者正確？\nA確認的對象除了要保人還包括被保險人\nB目的係透過保險配置使保單活化更能符合現況需求\nC應考量轉換新保單之預定利率較舊保單高，保費成本相對較高\nD舊保單透過解約並扣除稅額後可能比保單轉換更划算","options":["ABD","BD","AB","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P235","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":235,"page":57,"answer":4,"explanation":"以上皆為保單轉換生效後，保險公司不應提供回復契約之情事。","stem":"保單轉換生效後發生何種情事，保險公司不應提供回復契約之權\n利？","options":["保險公司無不實引導轉換，且舊保單之保險事故已發生始主張撤\n銷該次轉換","轉換後新保單已開始給付保險金或已有申請理賠紀錄","保險公司無不實引導轉換，且轉換生效日起 3 年後始主張撤銷該\n次轉換","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P236","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":236,"page":57,"answer":3,"explanation":"保險規劃書最少應具備保險名稱及特色、契約內容以及給付範圍及金\n額。","stem":"保險規劃書是向顧客說明保險公司提供的保障內容，用來解決顧客\n家庭經濟問題最有效的方式，該規劃書最少應具備\nA契約內容、B保險名稱及特色、C退佣比例、D給付範圍及金額","options":["BD","AB","ABD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P237","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":237,"page":57,"answer":1,"explanation":"(1)保戶可考量實際需求僅作部分轉換，轉換後除部分情形外，保險公\n司應提供回復契約之權利。","stem":"有關保單活化之敘述，何者錯誤？","options":["保戶可考量實際需求僅作部分轉換，但轉換後則無法再轉回舊保\n單","保單活化目的使保戶重新檢視自身保單所需，以提升退休生活的\n保障","利用舊保單之保單價值準備金轉換投保醫療險、長照險或年金保\n險","保戶限向同一壽險公司之舊保單身故保險金轉換成新契約之生前\n養老金"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P238","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":238,"page":58,"answer":4,"explanation":"編製生活規劃書的目的在幫助客戶預定目標，估列將來需要的各種費\n用。","stem":"編製生活規劃書的目的在幫助客戶","options":["準備子女所需要的預備金","了解父母所需要的費用","趁早準備配偶所需要的費用","預定目標，估列將來需要的各種費用"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P239","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":239,"page":58,"answer":3,"explanation":"人身保險業初年度保費收入之行銷通路來源占率：\n銀行保險 55.13% > 壽險公司 38.48% > 保險經紀人/代理人 6.39%\n> 其他通路 0.17%（截至 107 年 12 月）","stem":"人身保險業初年度保費收入之行銷通路來源占率由大至小順序為","options":["壽險公司、保險經紀人/代理人、銀行保險、其他通路","銀行保險、壽險公司、其他通路、保險經紀人/代理人","銀行保險、壽險公司、保險經紀人/代理人、其他通路","壽險公司、銀行保險、保險經紀人/代理人、其他通路"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P240","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":240,"page":58,"answer":2,"explanation":"人身保險行銷過程順序：接近→發現問題→提出解決對策→成交","stem":"人身保險行銷過程順序為？ A成交 B發現問題 C解決對策 D接近","options":["BDCA","DBCA","DBAC","DABC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P241","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":241,"page":58,"answer":3,"explanation":"五項經濟準備是不可或缺的：遺族生活資金、晚年生活資金、購屋\n資金、子女教育及結婚資金、應急的預備金","stem":"一般而言，哪些經濟準備是任何一個家庭不可或缺的？\nA購買住宅的費用 B子女受教育、結婚費用\nC應急需要的預備金 D遺族生活資金","options":["ABD","BCD","ABCD","CD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P242","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":242,"page":59,"answer":1,"explanation":"(2)取得相關資格後，保險業、保險代理人公司之業務員得登錄於另\n一家非經營同類保險業務之保險業或保險代理人公司;保險經紀人公\n司之業務員得登錄於另一家非經營同類保險業務之保險經紀人公\n司。\n(3)同時擁有人身保險及財產保險業務員資格，得登錄於另一家非經\n營同類保險業務。\n(4)保險從業人員通過壽險公會舉辦之人身保險業務員資格測驗，由\n所屬公司為其辦理登錄，並領得登錄證後，即為該公司從事業務招\n攬人員。","stem":"下列敘述何者正確？","options":["業務員應專為其所屬公司從事保險招攬","業務員已登錄於人壽保險公司，因另取得產險資格後，得登錄於\n財產保險經紀人公司招攬財產保險商品","業務員即使同時擁有人身保險及財產保險業務員資格，仍僅得擇\n一登錄","保險從業人員通過壽險公會舉辦之人身保險業務員資格測驗即可\n開始招攬"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P243","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":243,"page":59,"answer":2,"explanation":"間接通路：係指業務來源全由保險代理人或兼營保險代理人業務之\n銀行所招攬者，或經紀人，或兼營保險經紀人業務之銀行代替客戶\n洽訂之契約","stem":"下列敘述何者錯誤？","options":["業務來源全由公司專職員工招攬者，稱為直接通路","業務來源僅全由保險代理人或兼營保險代理人業務之銀行所招攬\n者，稱為間接通路","兼採直接、間接通路者稱為混合通路制度","目前保險業務行銷方式可分為直接、間接與混合通路等3種"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P244","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":244,"page":59,"answer":1,"explanation":"晚年生活資金：夫婦兩人的養老金（以丈夫退休時的平均餘命計\n算）、妻子寡居期間的生活資金（以丈夫死亡時妻子的平均餘命計\n算）、晚年的生活資金。","stem":"計算夫婦兩人的養老資金時，夫婦二人共同生活的養老期間，係以\n何種方式計算？","options":["以退休時，丈夫的平均餘命計算","以退休時，妻子的平均餘命計算","以妻子死亡時，丈夫的平均餘命計算","以丈夫死亡時，妻子的平均餘命計算"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P245","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":245,"page":59,"answer":4,"explanation":"業務員售後服務的開端是從遞交客戶保單開始。","stem":"業務員售後服務的開端是從「」開始。","options":["客戶繳納初期保險費","保險公司完成核保","業務員拿到保險單","業務員遞交客戶保單"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P246","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":246,"page":60,"answer":2,"explanation":"保險公司會做契約對身體、環境、道德做選擇，因此體況不佳者不\n予承保。","stem":"何者符合準保戶的選擇標準？ A身體不健康的人\nB付得起保險費的人 C便於拜訪的人 D保險保障規劃少的人","options":["BD","BCD","ABD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P247","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":247,"page":60,"answer":2,"explanation":"A 評估保障需求是否足夠係依據保險的保障額度約為年收入之 10 倍\nB 評估保費負擔能力係依據保費支出不超過年收入的十分之一為原\n則\nC 保險是透過互助合作來分散風險，所以業務員準保戶的選擇為身\n體健康的人。","stem":"下列何者正確？\nA評估保障需求是否足夠係依據保費支出不超過年收入的十分之一\n為原則\nB評估保費負擔能力係依據保險的保障額度約為年收入之 10 倍\nC保險是透過互助合作來分散風險，所以業務員準保戶的選擇為身\n體不健康的人\nD因保險行銷需透過面談及詳細說明，所以業務員準保戶的選擇應\n為便於拜訪的人","options":["ABD","D","ABCD","CD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P248","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":248,"page":60,"answer":3,"explanation":"C 電話行銷過程應該經過要保人同意全程錄音並備份存檔。","stem":"電話行銷人員行銷保險\nA應說明行銷目的及確認要保人身分\nB應告知行銷人員姓名、登錄字號及所屬公司名稱\nC依個人資料保護法，電話行銷過程不得錄音並備份存檔\nD電話行銷人員若違反辦理電話行銷業務應注意事項，所屬公司應\n依規定予以懲處","options":["ABCD","AB","ABD","BD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P249","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":249,"page":60,"answer":4,"explanation":"完整的人身保險行銷過程為：準備、自我介紹→蒐集資料、發現問\n題→提示解決的對策→成交、售後服務。","stem":"完整的人身保險行銷過程，應包含「」其行銷順序應為？\nA蒐集資料、發現問題 B準備、自我介紹 C提示解決的對策\nD成交、售後服務","options":["ABCD","BCAD","ACBD","BACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P250","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":250,"page":61,"answer":4,"explanation":"由於壽命的不斷延長，替客戶安排保險時，應考慮的保障項目應有\n生活規劃的項目：遺族的生活資金、晚年的生活資金、購屋資金、\n子女教育及結婚資金、 應急的預備金","stem":"由於壽命的不斷延長，替客戶安排保險時，應考慮的保障項目為？\nA醫療費用 B配偶的安葬費用 C遺族的生活費用 D老年的生活費用","options":["ABCD","ABD","ABC","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P251","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":251,"page":61,"answer":4,"explanation":"其保存期限不得低於保險契約期滿或通知要保人不同意承保後 5\n年。","stem":"保險業經營電話行銷業務時，在行銷過程應經要保人同意全程錄音\n並備份存檔列管，其保存期限不得低於保險契約期滿或通知要保人\n不同意承保後幾年？","options":["永久保存","2 年","3 年","5 年"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P252","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":252,"page":61,"answer":4,"explanation":"生活規劃書就是利用生命週期表，將家庭未來的經濟需要考慮在\n內，並配合其時間，做有計畫的準備，可讓客戶了解必要準備的資\n金，並提供適當的具體準備方式。","stem":"編製生活規劃書的目的在幫助客戶","options":["準備子女所需要的預備金","了解父母所需要的費用","趁早準備配偶所需要的費用","如何利用人壽保險來準備他所需要的各種費用"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P253","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":253,"page":61,"answer":1,"explanation":"仲介行銷通路：保險業務員、經紀人/代理人、銀行賣保險","stem":"人身保險業透過仲介行銷通路販售保險商品，現行仲介行銷通路有\nA銀行、B保險業務員、C保險經紀人、D保險公證人","options":["ABC","BC","AC","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P254","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":254,"page":61,"answer":3,"explanation":"D 仍經核保評估後始可生效。","stem":"開拓企業團體的集體投保，可\nA節省說明時間 B由薪津中代為扣除保險費 C提高繼續率\nD不必經過核保手續的好處，上列何者為正確？","options":["BCD","ABCD","ABC","ACD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P255","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":255,"page":61,"answer":4,"explanation":"保險代理人及保險經紀人應經主管機關許可，\n(2)繳存保證金並投保相關保險，領有執業證照後，始得執行經營或\n執行業務。\n(1)(3)不得經營非經主管機關核准之保險業務或國外保險業務。","stem":"保險代理人及保險經紀人之規定下列何者正確？","options":["得從事未經主管機關核准之外國保險業經營或介紹保險商品","未繳交保證金或投保責任保險得執行業務","得為未經主管機關核准之保險業經營或介紹保險商品","應有固定業務處所，並設立獨立帳簿記載業務收支"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P256","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":256,"page":62,"answer":3,"explanation":"直接通路：賣方主動-郵寄、電話行銷、職域或關係企業行銷、架設\n網路平台買方主動-語音電話、網路、櫃台行銷、電視\n行銷","stem":"壽險行銷通路若分為仲介行銷及直接行銷，下列何者係屬直接行銷\n通路？\nA郵寄行銷 B電話行銷 C職域或關係企業行銷 D架設網路平台行銷","options":["AB","ABD","ABCD","BC"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P257","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":257,"page":62,"answer":3,"explanation":"D 臨時預備金一般為現在每個月的生活費用的 3 個基數","stem":"以下敘述何者正確？\nA家庭生活資金計算係以老么大學畢業的期間作為必要期間計算\nB購屋資金計算係考量一旦家庭斷絕經濟來源後如何繼續繳付剩餘\n房屋借款\nC借款償還金係以每月償還額乘上償還期間計算償還總額\nD臨時預備金一般為現在每個月的生活費用的 6 個基數","options":["BCD","ABD","ABC","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P258","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":258,"page":62,"answer":3,"explanation":"保險經紀人：基於被保險人之利益，代向保險人洽訂保險契約，而\n向承保之保險業收取佣金之人。(可以是個人、合夥公司或法人)","stem":"保險經紀人係基於「」之利益，代向保險公司洽訂保險契約或提供\n服務而收取佣金之人。","options":["保險人及被保險人","要保人","被保險人","承保的保險業"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P259","subject":"保險實務","chapter":"第七章 壽險行銷活動","number":259,"page":62,"answer":4,"explanation":"保險經紀人係基於被保險人之利益，代向保險公司洽定保險契約或\n提供服務而收取佣金之人。","stem":"保險經紀人係基於「」之利益，代向保險公司洽定保險契約或提供\n服務而收取佣金之人。","options":["保險人及被保險人","要保人","承保的保險業","被保險人"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P260","subject":"保險實務","chapter":"附錄","number":260,"page":63,"answer":2,"explanation":"A 比率依年齡級距分為七組\nB 死亡給付對保價金之最低比率随高齡遞減","stem":"人壽保險商品死亡給付對保單價值準備金之最低比率規範何者正確?\nA比率依年齡級距分為六組\nB死亡給付對保價金之最低比率随高齡遞增\nC保險業需於契約條款明訂不符合最低比率時之保費繳交限制\nD招攬時要妥為解說","options":["ABD","CD","BCD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P261","subject":"保險實務","chapter":"附錄","number":261,"page":63,"answer":2,"explanation":"投保長期壽險，在解約時若是契約已經有解約金，則保險公司將於\n接獲解約通知後，一個月內償付解約金，而意外傷害保險、健康保\n險或 1 年期定期壽險部分，保險公司接獲解約通知後，會從當期已\n繳保險費中扣除已過期的保險費，將未滿期的保險費退還。","stem":"下列哪些保險中途解約時，其已交付未到期之保費應返還？","options":["終身壽險、傷害保險、年金保險、團體健康保險","一年定期壽險、健康保險、傷害保險","養老保險、一年定期壽險、傷害保險、健康保險","以上皆是"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P262","subject":"保險實務","chapter":"附錄","number":262,"page":63,"answer":3,"explanation":"保險公司在招攬及核保作業控管的自律規範中，第 21 條要求各會員\n應將實支實付型醫療保險（包括傷害醫療）理賠的控管措施納入公\n司的核保處理制度和程序中，並確實執行以下措施：\n1.每位被保險人投保實支實付型醫療保險（包括日額或實支實付給付\n可擇一的商品）的張數上限為三張，此上限分別應對應醫療保險和\n傷害醫療保險。\n2.若保戶已經投保一張實支實付型醫療（傷害醫療）商品，再另行\n向同一保險公司投保一張銜接原給付限額之具自負額商品的情況，\n該自負額商品不列入張數計算。整體而言，保險公司在醫療保險和\n傷害醫療保險中，不計入上述張數計算的自負額商品，每項商品以\n一張為限。\n因此，正確的答案應為 (3)","stem":"實支實付醫療保險副本理賠之控管措施，不適用於何種保險?\nA傷害保險 B微型保險 C旅行平安保險 D學生團體保險","options":["ABC","BD","BCD","ABCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P263","subject":"保險實務","chapter":"附錄","number":263,"page":64,"answer":4,"explanation":"財團法人保險事業發展中心、主管機關認可之保險相關單位、壽險\n公會皆可負責辦理投資型保險相關專業課程測驗。","stem":"依保險業務員管理規則規定，投資型保險相關專業課程測驗得辦理\n單位為","options":["財團法人保險事業發展中心","主管機關認可之保險相關單位","壽險公會","以上皆可負責辦理"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P264","subject":"保險實務","chapter":"附錄","number":264,"page":64,"answer":3,"explanation":"年金保險中如被保險人身故，仍有未支領之年金餘額時，該餘額應\n給付給身故受益人或其他應得之人。","stem":"年金保險中如被保險人身故，仍有未支領之年金餘額時，該餘額","options":["其半數應作為被保險人之遺產","應作為被保險人之遺產","應給付給其他應得之人","應作為要保人之遺產"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P265","subject":"保險實務","chapter":"附錄","number":265,"page":64,"answer":1,"explanation":"B 年金保險未經被保險人書面承認並約定保險金額者有效\nD 保險人對於保險費不得以訴訟請求交付","stem":"年金保險契約敘述何者為是？\nA得由本人或第三人訂立之\nB未經被保險人書面承認並約定保險金額者無效\nC利害關係人均得代要保人交付保險費\nD保險人對於保險費得以訴訟請求交付","options":["AC","ABC","ACD","BCD"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P266","subject":"保險實務","chapter":"附錄","number":266,"page":64,"answer":4,"explanation":"保險金計算方式：20 萬 × 1.03 × 1.03 = 212,180","stem":"某甲投保每年複利增值 3% 之二十年期養老保險，保額 20 萬元，\n某甲在投保後第二年死亡，則其可獲得的死亡保險金為","options":["206,000","20 萬","218,545","212,180 元"],"source":"原精選題庫","priority":false,"caution":false},{"id":"P267","subject":"保險實務","chapter":"附錄","number":267,"page":64,"answer":4,"explanation":"根據團體一年定期人壽保險單示範條款規定，受益人申領「失能保\n險金」時，應檢具下列文件：失能診斷書、保險金申請書、受益人\n身份證明。","stem":"下列何者不是團體保險條款規定被保險人請領失能保險金應檢具之\n文件？","options":["受益人身份證明","失能診斷書","保險金申請書","被保險人印鑑證明書"],"source":"原精選題庫","priority":false,"caution":false},{"subject":"保險實務","number":1,"page":1,"answer":2,"stem":"一種風險不受人為之故意行為因素影響,可以觀察也可以衡量,確定不會因人而有不同結果之風險稱為","options":["主觀風險","客觀風險","投機風險","純粹風險"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P001","chapter":"第一章 風險管理與保險"},{"subject":"保險實務","number":2,"page":1,"answer":1,"stem":"風險的分類,依損失的性質可區分為","options":["純粹風險及投機風險","客觀風險及主觀風險","基本風險與特定風險","靜態風險與動態風險"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P002","chapter":"第一章 風險管理與保險"},{"subject":"保險實務","number":3,"page":1,"answer":3,"stem":"下列何者正確?A主觀風險可能經過一定期間觀察與統計而成為客觀風險;B風險依損失是否可衡量區分為投機風險與純粹風險;C保險可保的純粹風險僅人身上的風險及財產上的風險二種;D特定風險在性質上常屬於純粹風險","options":["A CD","ABC","AD","BCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P003","chapter":"第一章 風險管理與保險"},{"subject":"保險實務","number":"補充-01","page":1,"answer":3,"stem":"下列敘述,何者錯誤?","options":["投機風險係指事件發生的結果可能會產生獲利","保險的目的,在於補償因偶然事件的發生所導致經濟上的損失","純粹風險係指事件的結果不一定只有損失機會","保險所處理的風險,主要是純粹風險"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P-補充-01","chapter":"第一章 風險管理與保險"},{"subject":"保險實務","number":4,"page":1,"answer":3,"stem":"天然災害如地震不屬於下列何種風險分類","options":["純粹風險","靜態風險","特定風險","客觀風險"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P004","chapter":"第一章 風險管理與保險"},{"subject":"保險實務","number":5,"page":1,"answer":2,"stem":"兼有純粹風險與投機風險雙重性質的風險類別是(\n別是","options":["靜態風險","基本風險","特定風險","動態風險"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P005","chapter":"第一章 風險管理與保險"},{"subject":"保險實務","number":6,"page":1,"answer":4,"stem":"下列何者為「風險自留」的原因:A明知有風險存在而疏忽不予處理;B自己承擔比其他處理方式更划算;C無適當處理方式;D自己有能力足以承擔損失","options":["A\nBC","BCD","BC","ABCD"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P006","chapter":"第一章 風險管理與保險"},{"subject":"保險實務","number":7,"page":1,"answer":3,"stem":"下列有關保險之陳述,何者正確:","options":["是一種透過多數人合作以避免風險的經濟保障制度","為風險避免方法之一種","投保人壽保險的人可以確定他的信用和償還能力","以上皆是"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P007","chapter":"第一章 風險管理與保險"},{"subject":"保險實務","number":8,"page":2,"answer":1,"stem":"下列何者正確?","options":["損失幅度分配低可能屬於不重要的風險或重要的風險","損失幅度分配低可能屬於特別嚴重的風險或不重要的風險","損失頻率分配高可能屬於不重要的風險或重要的風險","以上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P008","chapter":"第一章 風險管理與保險"},{"subject":"保險實務","number":"補充-02","page":2,"answer":1,"stem":"風險衡量結果屬於重要的風險,則代表","options":["損失頻率分配很高及幅度分配很小","損失頻率分配及幅度分配皆很高","損失頻率分配及幅度分配皆很小","以上皆非"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」可協助理解；答案依原版題庫保留。","caution":false,"source":"114年版公會考前精選","priority":true,"id":"G114P-補充-02","chapter":"第一章 風險管理與保險"},{"subject":"保險實務","number":9,"page":2,"answer":2,"stem":"某團體員工年平均死亡率為0.326%,若死亡事故發生時,雇主預期須支付每位員工\n100 萬元的撫卹金,下列何者正確?A雇主預測損失成本係應用主觀風險的觀念;\nB 0.326%即損失幅度的預期值;C 100 萬即損失頻率的預期值;D每位員工損失成本為3260 元","options":["ABCD","D","BCD","BC"],"explanation":"原 PDF 此題未附逐題解析。下方「觀念提示」
